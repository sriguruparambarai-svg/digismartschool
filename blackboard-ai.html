<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackboard AI — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --maroon: #6B1A1A;
  --gold: #C9962A;
  --sandal: #E8C99A;
  --board-dark: #1a2e1a;
  --board-mid: #1f3a1f;
  --chalk: #f0ede8;
  --chalk-dim: #c8c4be;
  --chalk-yellow: #f5e87a;
  --chalk-blue: #a8d8f0;
  --chalk-red: #f4a0a0;
  --chalk-green: #a8e6a8;
  --dust: rgba(240,237,232,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0f0f0f;
  font-family: 'Nunito', sans-serif;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== WELCOME SCREEN ===== */
#welcome-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1000 0%, #0a0a0a 70%);
  padding: 2rem;
  transition: opacity 0.8s ease;
}

#welcome-screen h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  color: var(--gold);
  text-align: center;
  margin-bottom: 0.5rem;
  text-shadow: 0 0 40px rgba(201,150,42,0.4);
}

#welcome-screen p.sub {
  color: var(--sandal);
  font-size: 1.1rem;
  margin-bottom: 2.5rem;
  opacity: 0.8;
  text-align: center;
}

.config-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(201,150,42,0.2);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 580px;
  backdrop-filter: blur(10px);
}

.config-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

.config-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.config-group label {
  font-size: 0.8rem;
  color: var(--sandal);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.config-group select,
.config-group input,
.config-group textarea {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(201,150,42,0.3);
  border-radius: 8px;
  color: #fff;
  padding: 0.6rem 0.8rem;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

.config-group select:focus,
.config-group input:focus,
.config-group textarea:focus {
  border-color: var(--gold);
}

.config-group textarea {
  min-height: 80px;
  resize: vertical;
}

.config-group textarea::placeholder,
.config-group input::placeholder {
  color: rgba(255,255,255,0.3);
}

.lesson-input-full {
  margin-bottom: 1rem;
}

.btn-start {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(135deg, var(--maroon), #8B2A2A);
  border: 2px solid var(--gold);
  border-radius: 12px;
  color: var(--gold);
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}

.btn-start:hover {
  background: linear-gradient(135deg, #8B2A2A, var(--maroon));
  box-shadow: 0 0 30px rgba(201,150,42,0.3);
  transform: translateY(-1px);
}

/* ===== CLASSROOM SCREEN ===== */
#classroom {
  display: none;
  min-height: 100vh;
  flex-direction: column;
  background: #1a1008;
}

/* Header bar */
.class-header {
  background: linear-gradient(90deg, var(--maroon) 0%, #3a1010 100%);
  border-bottom: 2px solid var(--gold);
  padding: 0.6rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.class-info {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.class-badge {
  background: var(--gold);
  color: var(--maroon);
  padding: 0.3rem 0.8rem;
  border-radius: 6px;
  font-weight: 700;
  font-size: 0.85rem;
}

.class-title {
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--sandal);
}

.class-controls {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.ctrl-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  padding: 0.4rem 0.9rem;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.ctrl-btn:hover { background: rgba(255,255,255,0.2); }
.ctrl-btn.active { background: var(--gold); color: var(--maroon); border-color: var(--gold); }

/* Speed selector */
.speed-select {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fff;
  padding: 0.4rem 0.6rem;
  font-size: 0.82rem;
  font-family: 'Nunito', sans-serif;
}

/* Main blackboard area */
.classroom-body {
  display: flex;
  flex: 1;
  gap: 0;
}

/* Sidebar */
.lesson-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: rgba(0,0,0,0.5);
  border-right: 1px solid rgba(201,150,42,0.15);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  overflow-y: auto;
}

.sidebar-title {
  font-size: 0.75rem;
  color: var(--sandal);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  margin-bottom: 0.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid rgba(201,150,42,0.2);
}

.step-item {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.6rem 0.7rem;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  border: 1px solid transparent;
}

.step-item:hover { background: rgba(255,255,255,0.05); }
.step-item.active { background: rgba(201,150,42,0.15); border-color: rgba(201,150,42,0.3); }
.step-item.done { opacity: 0.5; }

.step-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(201,150,42,0.4);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  margin-top: 1px;
  transition: all 0.3s;
}

.step-item.active .step-dot { background: var(--gold); border-color: var(--gold); color: var(--maroon); }
.step-item.done .step-dot { background: rgba(201,150,42,0.3); border-color: var(--gold); }

.step-text {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.7);
  line-height: 1.4;
}

.step-item.active .step-text { color: var(--sandal); font-weight: 600; }

/* Blackboard */
.board-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: #15200f;
  position: relative;
}

.blackboard {
  width: 100%;
  max-width: 860px;
  min-height: 480px;
  background: radial-gradient(ellipse at 30% 40%, #1e3d1e 0%, var(--board-dark) 60%, #111e11 100%);
  border: 8px solid #3a2a12;
  border-radius: 4px;
  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.5),
    0 0 0 2px #1a1a0a,
    0 8px 40px rgba(0,0,0,0.8),
    4px 4px 0 #2a1a04;
  position: relative;
  padding: 2.5rem 2.5rem 2rem;
  overflow: hidden;
  min-height: 420px;
}

/* Chalk dust texture */
.blackboard::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 80%, rgba(240,237,232,0.015) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(240,237,232,0.01) 0%, transparent 50%),
    radial-gradient(circle at 60% 60%, rgba(240,237,232,0.008) 0%, transparent 40%);
  pointer-events: none;
}

/* Chalk tray */
.chalk-tray {
  position: absolute;
  bottom: -14px;
  left: 5%;
  width: 90%;
  height: 12px;
  background: linear-gradient(180deg, #4a3012, #3a2208);
  border-radius: 0 0 4px 4px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.5);
}

/* Board content area */
#board-content {
  position: relative;
  z-index: 1;
  min-height: 360px;
}

/* Writing zones */
.board-heading {
  font-family: 'Caveat', cursive;
  color: var(--chalk-yellow);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 700;
  text-align: center;
  margin-bottom: 1.2rem;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.3), 0 0 20px rgba(245,232,122,0.2);
  line-height: 1.2;
}

.board-subheading {
  font-family: 'Caveat', cursive;
  color: var(--chalk-yellow);
  font-size: clamp(1.3rem, 3vw, 1.8rem);
  font-weight: 600;
  margin: 0.8rem 0 0.5rem;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
  border-bottom: 1px dashed rgba(245,232,122,0.3);
  padding-bottom: 0.3rem;
}

.board-text {
  font-family: 'Caveat', cursive;
  color: var(--chalk);
  font-size: clamp(1.15rem, 2.5vw, 1.55rem);
  line-height: 1.7;
  margin: 0.5rem 0;
  text-shadow: 0.5px 0.5px 0 rgba(0,0,0,0.4);
}

.board-highlight {
  display: inline;
  background: rgba(245,232,122,0.15);
  border-radius: 4px;
  padding: 0.1rem 0.4rem;
  color: var(--chalk-yellow);
  font-weight: 700;
}

.board-keyterm {
  color: var(--chalk-blue);
  font-weight: 700;
}

.board-formula {
  font-family: 'Caveat', cursive;
  color: var(--chalk-green);
  font-size: 1.4rem;
  background: rgba(168,230,168,0.08);
  border: 1px dashed rgba(168,230,168,0.3);
  border-radius: 8px;
  padding: 0.6rem 1.2rem;
  margin: 0.8rem 0;
  display: inline-block;
  text-align: center;
  text-shadow: 0 0 10px rgba(168,230,168,0.2);
}

.board-list {
  list-style: none;
  margin: 0.5rem 0 0.5rem 1.5rem;
}

.board-list li {
  font-family: 'Caveat', cursive;
  color: var(--chalk);
  font-size: clamp(1.05rem, 2.2vw, 1.4rem);
  line-height: 1.7;
  position: relative;
  padding-left: 1.2rem;
}

.board-list li::before {
  content: '→';
  position: absolute;
  left: -0.2rem;
  color: var(--chalk-yellow);
}

/* Diagram canvas */
#diagram-canvas {
  display: none;
  width: 100%;
  margin: 1rem 0;
}

/* Status bar */
.status-bar {
  background: rgba(0,0,0,0.6);
  border-top: 1px solid rgba(201,150,42,0.15);
  padding: 0.6rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.82rem;
  color: rgba(255,255,255,0.5);
  flex-shrink: 0;
}

.status-speech {
  font-family: 'Caveat', cursive;
  font-size: 1rem;
  color: var(--sandal);
  font-style: italic;
  flex: 1;
  text-align: center;
  padding: 0 1rem;
}

.progress-dots {
  display: flex;
  gap: 6px;
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.3s;
}

.progress-dot.active { background: var(--gold); box-shadow: 0 0 6px rgba(201,150,42,0.5); }
.progress-dot.done { background: rgba(201,150,42,0.4); }

/* Loading state */
#loading-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(26,20,8,0.85);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  z-index: 10;
  border-radius: 0;
}

.chalk-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(201,150,42,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-family: 'Caveat', cursive;
  color: var(--sandal);
  font-size: 1.3rem;
}

/* Typewriter cursor */
.cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--chalk);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.8s step-end infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Next/Prev button area */
.nav-area {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px dashed rgba(240,237,232,0.1);
}

.nav-btn {
  background: transparent;
  border: 1px solid rgba(240,237,232,0.3);
  color: var(--chalk);
  font-family: 'Caveat', cursive;
  font-size: 1.1rem;
  padding: 0.5rem 1.5rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-btn:hover { border-color: var(--gold); color: var(--gold); }
.nav-btn.primary { background: var(--gold); color: var(--maroon); border-color: var(--gold); font-weight: 700; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Diagram SVG styles */
.diagram-container {
  margin: 1rem 0;
  position: relative;
}

/* Fade-in animation for board elements */
.board-element {
  animation: fadeWrite 0.4s ease forwards;
}

@keyframes fadeWrite {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Teacher voice bubble */
.voice-bubble {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(107,26,26,0.9);
  border: 1px solid var(--gold);
  border-radius: 12px 12px 12px 4px;
  padding: 0.5rem 0.9rem;
  font-family: 'Caveat', cursive;
  font-size: 1rem;
  color: var(--sandal);
  white-space: nowrap;
  display: none;
  z-index: 5;
}

/* Mode tabs */
.mode-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.2rem;
}

.mode-tab {
  padding: 0.4rem 1rem;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid rgba(201,150,42,0.3);
  color: rgba(255,255,255,0.5);
  background: transparent;
  font-family: 'Nunito', sans-serif;
  transition: all 0.2s;
}

.mode-tab.active {
  background: var(--gold);
  color: var(--maroon);
  border-color: var(--gold);
}

/* Tamil support */
.board-text.tamil {
  font-size: clamp(1.1rem, 2.3vw, 1.45rem);
}

/* Scroll for long lessons */
.board-scroll {
  max-height: 380px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(201,150,42,0.3) transparent;
}

/* Map container */
.map-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(26,46,26,0.97);
  z-index: 5;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 2rem;
}

.map-overlay.visible { display: flex; }

/* Step type badge */
.step-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  margin-left: 0.4rem;
  vertical-align: middle;
}

.badge-heading { background: rgba(245,232,122,0.2); color: var(--chalk-yellow); }
.badge-explain { background: rgba(240,237,232,0.1); color: var(--chalk-dim); }
.badge-diagram { background: rgba(168,230,168,0.2); color: var(--chalk-green); }
.badge-list { background: rgba(168,216,240,0.2); color: var(--chalk-blue); }
.badge-highlight { background: rgba(244,160,160,0.2); color: var(--chalk-red); }

/* Underline animation */
@keyframes underline-draw {
  from { width: 0; }
  to { width: 100%; }
}

.chalk-underline {
  display: block;
  height: 2px;
  background: var(--chalk-yellow);
  margin-top: 2px;
  animation: underline-draw 0.5s ease forwards;
  opacity: 0.5;
  border-radius: 2px;
}

/* Voice toggle */
#voice-toggle.active {
  background: rgba(168,230,168,0.2);
  border-color: var(--chalk-green);
  color: var(--chalk-green);
}

/* Back button */
.back-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  color: rgba(255,255,255,0.5);
  padding: 0.3rem 0.7rem;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  transition: all 0.2s;
}

.back-btn:hover { border-color: var(--gold); color: var(--gold); }

</style>
</head>
<body>

<!-- ===== WELCOME SCREEN ===== -->
<div id="welcome-screen">
  <h1>🖋️ Blackboard AI</h1>
  <p class="sub" id="welcome-sub">DigiSmartSchool</p>

  <div class="config-card">
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="selectMode('standard')">📚 Standard</button>
      <button class="mode-tab" onclick="selectMode('tamil')">🌟 Tamil Medium</button>
      <button class="mode-tab" onclick="selectMode('bilingual')">🌐 Bilingual</button>
    </div>

    <div class="config-row">
      <div class="config-group">
        <label>Class</label>
        <select id="sel-class">
          <option>Pre KG</option>
          <option>LKG</option>
          <option>UKG</option>
          <option>Class 1</option>
          <option>Class 2</option>
          <option>Class 3</option>
          <option>Class 4</option>
          <option>Class 5</option>
          <option>Class 6</option>
          <option value="Class 7" selected>Class 7</option>
          <option>Class 8</option>
        </select>
      </div>
      <div class="config-group">
        <label>Subject</label>
        <select id="sel-subject">
          <option>Mathematics</option>
          <option>Science</option>
          <option value="Social Science" selected>Social Science</option>
          <option>English</option>
          <option>Tamil</option>
          <option>Environmental Studies</option>
          <option>General Knowledge</option>
        </select>
      </div>
    </div>

    <div class="config-group lesson-input-full">
      <label>Lesson / Topic Name</label>
      <input type="text" id="inp-lesson" placeholder="e.g. Our Environment, Photosynthesis, Fractions..." value="Our Environment">
    </div>

    <div class="config-group lesson-input-full">
      <label>Anthropic API Key</label>
      <input type="password" id="inp-apikey" placeholder="sk-ant-...">
    </div>

    <button class="btn-start" onclick="startLesson()">
      ✏️ Start Teaching on Blackboard
    </button>


  </div>
</div>

<!-- ===== CLASSROOM SCREEN ===== -->
<div id="classroom">
  <!-- Header -->
  <div class="class-header">
    <div class="class-info">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <span class="class-badge" id="hdr-class">Class 7</span>
      <span class="class-title" id="hdr-title">Social Science — Our Environment</span>
    </div>
    <div class="class-controls">
      <button class="ctrl-btn" id="play-pause-btn" onclick="togglePause()">⏸ Pause</button>
      <button class="ctrl-btn" onclick="prevStep()">⏮ Back</button>
      <button class="ctrl-btn" onclick="nextStep()">⏭ Next</button>
      <button class="ctrl-btn" id="voice-toggle" onclick="toggleVoice()">🔊 Voice</button>
      <select class="speed-select" id="speed-sel" onchange="changeSpeed(this.value)">
        <option value="0.5">🐢 Slow</option>
        <option value="1" selected>Normal</option>
        <option value="1.5">⚡ Fast</option>
        <option value="2">🚀 Quick</option>
      </select>
    </div>
  </div>

  <!-- Body -->
  <div class="classroom-body">
    <!-- Sidebar -->
    <div class="lesson-sidebar">
      <div class="sidebar-title">Lesson Steps</div>
      <div id="steps-list"></div>
    </div>

    <!-- Board -->
    <div class="board-wrap">
      <div class="blackboard" id="main-board">
        <div id="loading-overlay">
          <div class="chalk-spinner"></div>
          <div class="loading-text" id="loading-msg">Preparing lesson...</div>
        </div>

        <div id="board-content" class="board-scroll">
          <!-- Content written here dynamically -->
        </div>

        <div class="chalk-tray"></div>
      </div>

      <!-- Navigation -->
      <div class="nav-area">
        <button class="nav-btn" id="btn-prev" onclick="prevStep()">← Previous</button>
        <button class="nav-btn primary" id="btn-next" onclick="nextStep()">Next Concept →</button>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="progress-dots" id="progress-dots"></div>
    <div class="status-speech" id="status-speech">Ready to teach...</div>
    <div id="step-counter" style="min-width:80px;text-align:right">Step 0 / 0</div>
  </div>
</div>

<script>
// ===== STATE =====
let lessonSteps = [];
let currentStep = 0;
let isPaused = false;
let voiceOn = true;
let writeSpeed = 1;
let teachingMode = 'standard';
let langCode = 'en';
let isAnimating = false;
let currentSpeech = null;
let animTimeout = null;

// ===== MODE SELECT =====
function selectMode(m) {
  teachingMode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (m === 'tamil') { langCode = 'ta'; }
  else if (m === 'standard') { langCode = 'en'; }
  else { langCode = 'bilingual'; }
}

// ===== START LESSON =====
async function startLesson() {
  const cls = document.getElementById('sel-class').value;
  const subject = document.getElementById('sel-subject').value;
  const lesson = document.getElementById('inp-lesson').value.trim();
  const apiKey = document.getElementById('inp-apikey').value.trim();

  if (!lesson) { alert('Please enter a lesson or topic name.'); return; }
  if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }

  // Transition
  document.getElementById('welcome-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('welcome-screen').style.display = 'none';
    const cl = document.getElementById('classroom');
    cl.style.display = 'flex';
    cl.style.flexDirection = 'column';

    document.getElementById('hdr-class').textContent = cls;
    document.getElementById('hdr-title').textContent = `${subject} — ${lesson}`;
  }, 700);

  // Show loading
  setTimeout(async () => {
    showLoading('Asking Claude to prepare your lesson...');
    try {
      lessonSteps = await generateLessonSteps(apiKey, cls, subject, lesson);
      hideLoading();
      buildSidebar();
      buildProgressDots();
      renderStep(0);
    } catch(e) {
      hideLoading();
      showError(e.message);
    }
  }, 900);
}

// ===== GENERATE LESSON WITH CLAUDE =====
async function generateLessonSteps(apiKey, cls, subject, lesson) {
  const langInstruction = teachingMode === 'tamil'
    ? 'Respond in Tamil language only. Use simple Tamil words for school students.'
    : teachingMode === 'bilingual'
    ? 'Write each "write" field in both English and Tamil (Tamil in parentheses). Speech in English.'
    : 'Respond in simple English suitable for Indian school students.';

  const prompt = `You are a school teacher in Tamil Nadu, India, teaching ${subject} to ${cls} students (CBSE curriculum).
The lesson is: "${lesson}"

${langInstruction}

Convert this lesson into 8–12 step-by-step teaching actions for a blackboard teaching session.

IMPORTANT: Output ONLY valid JSON. No extra text, no markdown, no code blocks.

Return a JSON array with objects in this exact format:
[
  {
    "type": "heading",
    "speech": "Good morning students! Today we will learn about Environment.",
    "write": "Our Environment",
    "color": "yellow"
  },
  {
    "type": "explain",
    "speech": "Environment means everything that surrounds us.",
    "write": "Environment = Everything around us",
    "color": "white"
  },
  {
    "type": "subheading",
    "speech": "Now let us look at the components.",
    "write": "Components of Environment",
    "color": "yellow"
  },
  {
    "type": "list",
    "speech": "Environment has three main parts — air, water, and land.",
    "write": ["Air (வான்)", "Water (நீர்)", "Land (நிலம்)"],
    "color": "blue"
  },
  {
    "type": "formula",
    "speech": "Remember this formula for environment.",
    "write": "Environment = Biotic + Abiotic",
    "color": "green"
  },
  {
    "type": "highlight",
    "speech": "This is very important to remember.",
    "write": "Key fact: Environment supports all life on Earth",
    "color": "red"
  },
  {
    "type": "diagram",
    "speech": "Let me draw a diagram to show this.",
    "write": "Diagram: Components of Environment",
    "diagram": "circle_labels",
    "labels": ["Air", "Water", "Land", "Soil"],
    "color": "green"
  }
]

Rules:
- type must be one of: heading, subheading, explain, list, formula, highlight, diagram
- For "list" type, "write" should be an array of 3-5 strings
- For "diagram" type, "diagram" should be one of: circle_labels, boxes, tree, water_cycle, food_chain
- Keep speech simple and student-friendly
- One concept per step
- color must be: yellow, white, blue, green, or red
- Make it feel like a real classroom lesson
- Add relatable Indian examples where possible`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || 'API request failed');
  }

  const data = await response.json();
  const text = data.content[0].text.trim();
  
  // Parse JSON safely
  const jsonStr = text.replace(/```json|```/g, '').trim();
  return JSON.parse(jsonStr);
}

// ===== BUILD UI =====
function buildSidebar() {
  const list = document.getElementById('steps-list');
  list.innerHTML = '';
  lessonSteps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step-item';
    div.id = `step-nav-${i}`;
    div.onclick = () => jumpToStep(i);

    const typeLabel = {
      heading: '📌', subheading: '📋', explain: '✏️',
      list: '📝', formula: '🔢', highlight: '⭐', diagram: '🖼️'
    }[step.type] || '•';

    const preview = Array.isArray(step.write) ? step.write[0] : step.write;

    div.innerHTML = `
      <div class="step-dot">${typeLabel}</div>
      <div class="step-text">${preview.substring(0, 40)}${preview.length > 40 ? '...' : ''}</div>
    `;
    list.appendChild(div);
  });
}

function buildProgressDots() {
  const dots = document.getElementById('progress-dots');
  dots.innerHTML = '';
  lessonSteps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot';
    d.id = `dot-${i}`;
    dots.appendChild(d);
  });
}

// ===== RENDER STEP =====
function renderStep(idx) {
  if (idx < 0 || idx >= lessonSteps.length) return;

  currentStep = idx;
  const step = lessonSteps[idx];

  // Update sidebar
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
  });

  // Update dots
  document.querySelectorAll('.progress-dot').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
  });

  // Update counter
  document.getElementById('step-counter').textContent = `Step ${idx + 1} / ${lessonSteps.length}`;

  // Update speech status
  document.getElementById('status-speech').textContent = `"${step.speech}"`;

  // Update nav buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').textContent = idx === lessonSteps.length - 1 ? '✅ Lesson Complete' : 'Next Concept →';

  // Render board content
  renderBoardContent(step);

  // Speak
  if (voiceOn) speak(step.speech);
}

function renderBoardContent(step) {
  const board = document.getElementById('board-content');
  board.innerHTML = '';

  const colorMap = {
    yellow: 'var(--chalk-yellow)',
    white: 'var(--chalk)',
    blue: 'var(--chalk-blue)',
    green: 'var(--chalk-green)',
    red: 'var(--chalk-red)'
  };

  const color = colorMap[step.color] || 'var(--chalk)';

  switch(step.type) {
    case 'heading': {
      const h = document.createElement('div');
      h.className = 'board-heading board-element';
      h.style.color = color;
      h.innerHTML = typewriterHTML(step.write, 60);
      board.appendChild(h);
      const ul = document.createElement('span');
      ul.className = 'chalk-underline';
      board.appendChild(ul);
      break;
    }
    case 'subheading': {
      const h = document.createElement('div');
      h.className = 'board-subheading board-element';
      h.style.color = color;
      h.textContent = step.write;
      board.appendChild(h);
      break;
    }
    case 'explain': {
      const p = document.createElement('div');
      p.className = 'board-text board-element';
      p.style.color = color;
      p.innerHTML = highlightKeyTerms(step.write);
      board.appendChild(p);
      break;
    }
    case 'list': {
      const lbl = document.createElement('div');
      lbl.className = 'board-text board-element';
      lbl.style.color = 'var(--chalk-dim)';
      lbl.style.marginBottom = '0.4rem';
      lbl.textContent = 'Key Points:';
      board.appendChild(lbl);

      const ul = document.createElement('ul');
      ul.className = 'board-list board-element';
      const items = Array.isArray(step.write) ? step.write : [step.write];
      items.forEach((item, i) => {
        const li = document.createElement('li');
        li.style.color = color;
        li.style.animationDelay = `${i * 0.15}s`;
        li.textContent = item;
        ul.appendChild(li);
      });
      board.appendChild(ul);
      break;
    }
    case 'formula': {
      const lbl = document.createElement('div');
      lbl.className = 'board-text board-element';
      lbl.style.color = 'var(--chalk-dim)';
      lbl.textContent = 'Remember this:';
      board.appendChild(lbl);

      const f = document.createElement('div');
      f.className = 'board-formula board-element';
      f.style.color = color;
      f.textContent = step.write;
      board.appendChild(f);

      // Also write what teacher says
      const exp = document.createElement('div');
      exp.className = 'board-text board-element';
      exp.style.color = 'var(--chalk-dim)';
      exp.style.fontSize = '1rem';
      exp.style.marginTop = '0.8rem';
      exp.textContent = step.speech;
      board.appendChild(exp);
      break;
    }
    case 'highlight': {
      const p = document.createElement('div');
      p.className = 'board-text board-element';
      p.style.padding = '0.8rem 1.2rem';
      p.style.border = `1px solid ${color}`;
      p.style.borderRadius = '8px';
      p.style.background = `${color}15`;
      p.style.color = color;
      p.style.fontSize = '1.3rem';
      p.style.fontWeight = '600';
      p.innerHTML = '⭐ ' + step.write;
      board.appendChild(p);
      break;
    }
    case 'diagram': {
      const title = document.createElement('div');
      title.className = 'board-text board-element';
      title.style.color = 'var(--chalk-dim)';
      title.style.marginBottom = '0.5rem';
      title.textContent = step.write;
      board.appendChild(title);

      const canvas = document.createElement('div');
      canvas.className = 'diagram-container board-element';
      canvas.innerHTML = buildDiagram(step);
      board.appendChild(canvas);
      break;
    }
  }

  // Typewriter effect for main content
  animateWrite();
}

function highlightKeyTerms(text) {
  // Auto-highlight words after = sign or :
  return text
    .replace(/=\s*(.+)/g, '= <span class="board-highlight">$1</span>')
    .replace(/:\s*([A-Z][a-z]+(?:\s+[a-z]+)*)/g, ': <span class="board-keyterm">$1</span>');
}

function typewriterHTML(text, speed) {
  return `<span id="tw-target"></span><span class="cursor"></span>`;
  // Will be animated
}

function animateWrite() {
  const target = document.getElementById('tw-target');
  if (!target) return;

  const parent = target.parentElement;
  const fullText = parent.dataset.text || parent.innerText.replace(/\|$/, '');
  
  // For headings, do typewriter
  const headings = document.querySelectorAll('.board-heading');
  headings.forEach(h => {
    const textContent = h.dataset.fulltext || h.innerText;
    if (!h.dataset.animated) {
      h.dataset.animated = '1';
      const orig = h.innerHTML;
      // Simple: just show it with animation already set
    }
  });
}

// ===== DIAGRAM BUILDER =====
function buildDiagram(step) {
  const labels = step.labels || ['Item 1', 'Item 2', 'Item 3'];
  const dtype = step.diagram || 'circle_labels';

  if (dtype === 'circle_labels') {
    return buildCircleDiagram(labels, step.write);
  } else if (dtype === 'boxes') {
    return buildBoxesDiagram(labels, step.write);
  } else if (dtype === 'tree') {
    return buildTreeDiagram(labels, step.write);
  } else if (dtype === 'water_cycle') {
    return buildWaterCycleDiagram();
  } else if (dtype === 'food_chain') {
    return buildFoodChainDiagram(labels);
  }
  return buildCircleDiagram(labels, step.write);
}

function buildCircleDiagram(labels, title) {
  const n = labels.length;
  const cx = 260, cy = 130, r = 80, lr = 50;
  let paths = '';
  let texts = '';
  const colors = ['#f5e87a','#a8d8f0','#a8e6a8','#f4a0a0','#d4a0f0'];

  labels.forEach((lbl, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    const c = colors[i % colors.length];

    paths += `<circle cx="${x}" cy="${y}" r="${lr}" fill="${c}22" stroke="${c}" stroke-width="1.5"/>`;
    paths += `<line x1="${cx}" y1="${cy}" x2="${x - lr * 0.5 * Math.cos(angle)}" y2="${y - lr * 0.5 * Math.sin(angle)}" stroke="${c}" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>`;
    texts += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${c}" font-family="Caveat, cursive" font-size="14" font-weight="600">${lbl}</text>`;
  });

  return `<svg width="100%" viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="32" fill="rgba(240,237,232,0.1)" stroke="var(--chalk)" stroke-width="1.5"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="var(--chalk)" font-family="Caveat, cursive" font-size="12">${title.split(' ')[0]}</text>
    ${paths}${texts}
  </svg>`;
}

function buildBoxesDiagram(labels, title) {
  const colors = ['#f5e87a','#a8d8f0','#a8e6a8','#f4a0a0','#d4a0f0'];
  const bw = 100, bh = 50, gap = 20;
  const total = labels.length * bw + (labels.length - 1) * gap;
  const sx = (520 - total) / 2;

  let boxes = '';
  labels.forEach((lbl, i) => {
    const x = sx + i * (bw + gap);
    const c = colors[i % colors.length];
    boxes += `<rect x="${x}" y="80" width="${bw}" height="${bh}" rx="8" fill="${c}22" stroke="${c}" stroke-width="1.5"/>`;
    boxes += `<text x="${x + bw/2}" y="105" text-anchor="middle" dominant-baseline="central" fill="${c}" font-family="Caveat, cursive" font-size="13" font-weight="600">${lbl}</text>`;
    if (i < labels.length - 1) {
      boxes += `<text x="${x + bw + gap/2}" y="105" text-anchor="middle" dominant-baseline="central" fill="var(--chalk-dim)" font-size="18">→</text>`;
    }
  });

  return `<svg width="100%" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
    <text x="260" y="40" text-anchor="middle" fill="var(--chalk-dim)" font-family="Caveat, cursive" font-size="14">${title}</text>
    ${boxes}
  </svg>`;
}

function buildTreeDiagram(labels, title) {
  const colors = ['#f5e87a','#a8d8f0','#a8e6a8','#f4a0a0','#d4a0f0'];
  const n = labels.length;
  const spacing = 520 / (n + 1);

  let items = `<rect x="185" y="30" width="150" height="44" rx="8" fill="rgba(245,232,122,0.15)" stroke="var(--chalk-yellow)" stroke-width="1.5"/>`;
  items += `<text x="260" y="52" text-anchor="middle" dominant-baseline="central" fill="var(--chalk-yellow)" font-family="Caveat, cursive" font-size="14" font-weight="700">${title.substring(0, 16)}</text>`;

  labels.forEach((lbl, i) => {
    const x = spacing * (i + 1);
    const c = colors[i % colors.length];
    items += `<line x1="260" y1="74" x2="${x}" y2="130" stroke="${c}" stroke-width="1" stroke-dasharray="5 3" opacity="0.6"/>`;
    items += `<rect x="${x - 55}" y="130" width="110" height="40" rx="6" fill="${c}22" stroke="${c}" stroke-width="1.5"/>`;
    items += `<text x="${x}" y="150" text-anchor="middle" dominant-baseline="central" fill="${c}" font-family="Caveat, cursive" font-size="13">${lbl}</text>`;
  });

  return `<svg width="100%" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">${items}</svg>`;
}

function buildWaterCycleDiagram() {
  return `<svg width="100%" viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg">
    <text x="80" y="180" fill="#a8d8f0" font-family="Caveat, cursive" font-size="13">🌊 Ocean</text>
    <path d="M100 160 Q130 100 200 80" fill="none" stroke="#a8d8f0" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="170" y="60" fill="#f0ede8" font-family="Caveat, cursive" font-size="12">Evaporation ↑</text>
    <ellipse cx="280" cy="50" rx="80" ry="30" fill="rgba(168,216,240,0.2)" stroke="#a8d8f0" stroke-width="1.5"/>
    <text x="280" y="54" text-anchor="middle" fill="#a8d8f0" font-family="Caveat, cursive" font-size="13">☁️ Clouds</text>
    <path d="M340 80 Q380 120 380 160" fill="none" stroke="#a8d8f0" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="390" y="130" fill="#a8e6a8" font-family="Caveat, cursive" font-size="12">🌧 Rain</text>
    <path d="M380 165 Q320 200 200 200 Q150 200 100 175" fill="none" stroke="#a8d8f0" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="240" y="218" text-anchor="middle" fill="#a8d8f0" font-family="Caveat, cursive" font-size="11" opacity="0.7">Runoff → back to ocean</text>
  </svg>`;
}

function buildFoodChainDiagram(labels) {
  const colors = ['#a8e6a8','#f5e87a','#f4a0a0','#d4a0f0'];
  const items = labels.length > 0 ? labels : ['Plants', 'Herbivores', 'Carnivores'];
  const spacing = 520 / (items.length + 1);

  let chain = '';
  items.forEach((item, i) => {
    const x = spacing * (i + 1);
    const c = colors[i % colors.length];
    chain += `<circle cx="${x}" cy="100" r="42" fill="${c}22" stroke="${c}" stroke-width="2"/>`;
    chain += `<text x="${x}" y="100" text-anchor="middle" dominant-baseline="central" fill="${c}" font-family="Caveat, cursive" font-size="13" font-weight="600">${item}</text>`;
    if (i < items.length - 1) {
      chain += `<text x="${x + spacing/2}" y="100" text-anchor="middle" dominant-baseline="central" fill="var(--chalk-yellow)" font-size="22">→</text>`;
    }
  });

  return `<svg width="100%" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
    <text x="260" y="30" text-anchor="middle" fill="var(--chalk-dim)" font-family="Caveat, cursive" font-size="13">Food Chain</text>
    ${chain}
  </svg>`;
}

// ===== VOICE =====
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  if (currentSpeech) {
    window.speechSynthesis.cancel();
  }
  currentSpeech = new SpeechSynthesisUtterance(text);
  currentSpeech.lang = teachingMode === 'tamil' ? 'ta-IN' : 'en-IN';
  currentSpeech.rate = parseFloat(document.getElementById('speed-sel').value);
  currentSpeech.pitch = 1.05;
  window.speechSynthesis.speak(currentSpeech);
}

function toggleVoice() {
  voiceOn = !voiceOn;
  const btn = document.getElementById('voice-toggle');
  btn.classList.toggle('active', voiceOn);
  btn.textContent = voiceOn ? '🔊 Voice' : '🔇 Muted';
  if (!voiceOn && currentSpeech) window.speechSynthesis.cancel();
}

// ===== NAVIGATION =====
function nextStep() {
  if (currentStep < lessonSteps.length - 1) {
    renderStep(currentStep + 1);
  } else {
    showLessonComplete();
  }
}

function prevStep() {
  if (currentStep > 0) {
    renderStep(currentStep - 1);
  }
}

function jumpToStep(idx) {
  renderStep(idx);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('play-pause-btn');
  btn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
  if (isPaused && currentSpeech) window.speechSynthesis.pause();
  else window.speechSynthesis.resume();
}

function changeSpeed(v) {
  writeSpeed = parseFloat(v);
  if (currentSpeech) {
    currentSpeech.rate = writeSpeed;
  }
}

// ===== LESSON COMPLETE =====
function showLessonComplete() {
  if (currentSpeech) window.speechSynthesis.cancel();
  const board = document.getElementById('board-content');
  board.innerHTML = `
    <div style="text-align:center;padding:2rem">
      <div style="font-family:Caveat,cursive;font-size:3rem;color:var(--chalk-yellow);margin-bottom:1rem">🎉 Lesson Complete!</div>
      <div style="font-family:Caveat,cursive;font-size:1.5rem;color:var(--chalk);margin-bottom:2rem">Well done, students! Today we learned about this lesson.</div>
      <div style="font-family:Caveat,cursive;font-size:1.2rem;color:var(--chalk-dim)">You covered ${lessonSteps.length} concepts today.</div>
      <div style="margin-top:2rem">
        <button onclick="goBack()" style="background:var(--gold);color:var(--maroon);border:none;border-radius:10px;padding:0.8rem 2rem;font-family:Caveat,cursive;font-size:1.3rem;font-weight:700;cursor:pointer">← Start Another Lesson</button>
      </div>
    </div>
  `;
  speak('Excellent! You have completed the lesson. Well done students!');
}

// ===== LOADING =====
function showLoading(msg) {
  const ol = document.getElementById('loading-overlay');
  ol.style.display = 'flex';
  document.getElementById('loading-msg').textContent = msg;
}

function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}

function showError(msg) {
  const board = document.getElementById('board-content');
  board.innerHTML = `
    <div style="color:var(--chalk-red);font-family:Caveat,cursive;font-size:1.4rem;padding:2rem;text-align:center">
      ⚠️ Error: ${msg}<br><br>
      <div style="font-size:1rem;color:var(--chalk-dim)">Please check your API key and try again.</div>
    </div>
  `;
}

// ===== GO BACK =====
function goBack() {
  if (currentSpeech) window.speechSynthesis.cancel();
  document.getElementById('classroom').style.display = 'none';
  document.getElementById('welcome-screen').style.display = 'flex';
  document.getElementById('welcome-screen').style.opacity = '1';
  lessonSteps = [];
  currentStep = 0;
}

// Init voice button state
document.getElementById('voice-toggle').classList.add('active');

// Show school name from login session if available
(function() {
  const schoolName =
    (typeof window !== 'undefined' && window.SCHOOL_NAME) ||
    localStorage.getItem('dss_school_name') ||
    sessionStorage.getItem('dss_school_name') ||
    null;
  if (schoolName) {
