<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Mode — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── RESET & ROOT ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --maroon:      #6B1A1A;
  --maroon-mid:  #8B2A2A;
  --maroon-lt:   #a83a3a;
  --gold:        #C9962A;
  --gold-dark:   #a07820;
  --gold-light:  #F5E27A;
  --sandal:      #E8C99A;
  --sandal-lt:   #f5e6ce;
  --sandal-dark: #c8a070;
  --bg:          #f9f4ec;
  --card-bg:     #ffffff;
  --text:        #2a1008;
  --text-mid:    #5a3018;
  --dim:         rgba(42,16,8,0.5);
  --border:      rgba(107,26,26,0.18);
  --shadow:      0 4px 24px rgba(107,26,26,0.10);
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.sm-header {
  height: 52px;
  background: linear-gradient(90deg, var(--maroon), var(--maroon-mid));
  border-bottom: 2px solid var(--gold-dark);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 1.2rem; flex-shrink: 0; gap: 10px;
}
.sm-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sm-back-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 7px; color: var(--sandal);
  font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 700;
  padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.sm-back-btn:hover { background: rgba(255,255,255,0.22); }
.sm-lesson-title {
  font-family: 'Kalam', cursive; font-size: 1.05rem; color: var(--gold-light);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sm-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sm-ctrl-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 7px; color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 0.78rem; font-weight: 700; padding: 5px 12px;
  cursor: pointer; transition: all 0.18s; white-space: nowrap;
}
.sm-ctrl-btn:hover { background: rgba(255,255,255,0.22); }
.sm-ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.sm-ctrl-btn.primary { background: var(--gold); color: var(--maroon); border-color: var(--gold-dark); font-weight: 800; }
.sm-ctrl-btn.primary:hover { background: var(--gold-light); }

/* ── UPLOAD BAR ── */
.sm-upload-bar {
  background: var(--sandal-lt);
  border-bottom: 1px solid var(--border);
  padding: 7px 1.2rem;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap;
}
.sm-upload-label { font-size: 0.78rem; font-weight: 700; color: var(--maroon); white-space: nowrap; }
.sm-upload-input {
  font-size: 0.75rem; color: var(--text-mid);
  background: #fff; border: 1px dashed var(--sandal-dark);
  border-radius: 6px; padding: 3px 8px; cursor: pointer;
}
.sm-upload-status { font-size: 0.73rem; color: var(--gold-dark); }

/* ── MAIN AREA ── */
.sm-body { flex: 1; display: flex; overflow: hidden; position: relative; }

/* ── THUMBNAIL RAIL ── */
.sm-rail {
  width: 138px; flex-shrink: 0;
  background: #fff;
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 8px 6px;
  display: flex; flex-direction: column; gap: 5px;
  scrollbar-width: thin; scrollbar-color: rgba(107,26,26,0.15) transparent;
}
.sm-thumb {
  border-radius: 6px; padding: 7px 8px;
  font-size: 0.67rem; font-weight: 700; cursor: pointer;
  border: 1.5px solid transparent; line-height: 1.35;
  color: var(--text-mid); transition: all 0.18s;
  background: var(--sandal-lt);
}
.sm-thumb:hover { border-color: var(--gold); color: var(--maroon); }
.sm-thumb.active { border-color: var(--maroon); background: var(--maroon); color: var(--gold-light); }
.sm-thumb.done { border-color: var(--sandal-dark); opacity: 0.65; }
.sm-thumb-num { font-size: 0.6rem; color: var(--gold-dark); margin-bottom: 2px; }

/* ── SLIDE VIEWPORT ── */
.sm-viewport {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 1.2rem; overflow: hidden;
  background: linear-gradient(160deg, #f5ede0 0%, #f9f4ec 60%, #f0e8d8 100%);
  position: relative;
}

/* ── SLIDE CARD ── */
.sm-slide {
  /* Fixed 16:9 rectangle — always fits the viewport, never grows */
  width: 100%; max-width: 960px;
  height: calc(100vh - 52px - 38px - 3px - 52px - 28px);
  max-height: 540px;
  border-radius: 14px;
  padding: 1.4rem 1.8rem 1.2rem;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 8px 40px rgba(107,26,26,0.12), 0 2px 8px rgba(107,26,26,0.07);
  animation: slideEnter 0.32s cubic-bezier(.34,1.2,.64,1);
  background: #ffffff;
}
@keyframes slideEnter {
  from { opacity:0; transform:translateY(10px) scale(0.988); }
  to   { opacity:1; transform:translateY(0)    scale(1);     }
}

/* Slide type left accent bar */
.sm-slide::after {
  content: ''; position: absolute; top: 0; left: 0;
  width: 5px; height: 100%; border-radius: 18px 0 0 18px;
}
.type-title::after    { background: linear-gradient(180deg, var(--gold), var(--maroon)); }
.type-concept::after  { background: var(--maroon); }
.type-key_points::after { background: var(--gold); }
.type-table::after    { background: var(--sandal-dark); }
.type-timeline::after { background: var(--maroon-mid); }
.type-formula::after  { background: var(--gold-dark); }
.type-diagram::after  { background: var(--maroon); }
.type-example::after  { background: var(--maroon-mid); }
.type-summary::after  { background: linear-gradient(180deg, var(--maroon), var(--gold)); }
.type-list::after     { background: var(--sandal-dark); }

/* Corner decoration */
.sm-slide::before {
  content: ''; position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  pointer-events: none; opacity: 0.07;
}
.type-title::before    { background: radial-gradient(circle, var(--gold), transparent); }
.type-concept::before  { background: radial-gradient(circle, var(--maroon), transparent); }
.type-key_points::before { background: radial-gradient(circle, var(--gold), transparent); }
.type-table::before    { background: radial-gradient(circle, var(--sandal-dark), transparent); }
.type-timeline::before { background: radial-gradient(circle, var(--maroon-mid), transparent); }
.type-formula::before  { background: radial-gradient(circle, var(--gold-dark), transparent); }
.type-diagram::before  { background: radial-gradient(circle, var(--maroon), transparent); }
.type-example::before  { background: radial-gradient(circle, var(--maroon-mid), transparent); }
.type-summary::before  { background: radial-gradient(circle, var(--gold), transparent); }
.type-list::before     { background: radial-gradient(circle, var(--sandal-dark), transparent); }

/* Type-specific card bg tint */
.sm-slide.type-title    { border: 1.5px solid rgba(201,150,42,0.3);   background: linear-gradient(135deg, #fff 70%, #fdf3e0 100%); }
.sm-slide.type-concept  { border: 1.5px solid rgba(107,26,26,0.15);   }
.sm-slide.type-key_points { border: 1.5px solid rgba(201,150,42,0.25); background: linear-gradient(135deg, #fff 70%, #fffae8 100%); }
.sm-slide.type-table    { border: 1.5px solid rgba(200,160,112,0.25); }
.sm-slide.type-timeline { border: 1.5px solid rgba(107,26,26,0.18);   background: linear-gradient(135deg, #fff 70%, #fdf0e8 100%); }
.sm-slide.type-formula  { border: 1.5px solid rgba(160,120,32,0.25);  background: linear-gradient(135deg, #fff 70%, #fffce8 100%); }
.sm-slide.type-diagram  { border: 1.5px solid rgba(107,26,26,0.15);   }
.sm-slide.type-example  { border: 1.5px solid rgba(107,26,26,0.15);   }
.sm-slide.type-summary  { border: 1.5px solid rgba(201,150,42,0.3);   background: linear-gradient(135deg, #fff 70%, #fdf3e0 100%); }
.sm-slide.type-list     { border: 1.5px solid rgba(200,160,112,0.2);  }

/* ── SLIDE META ── */
.sm-slide-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.5rem; padding-left: 0.6rem;
}
.sm-type-badge {
  font-size: 0.6rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.5px; padding: 3px 10px; border-radius: 20px;
}
.type-title    .sm-type-badge { background: rgba(201,150,42,0.15); color: var(--gold-dark); border: 1px solid rgba(201,150,42,0.25); }
.type-concept  .sm-type-badge { background: rgba(107,26,26,0.08);  color: var(--maroon);   border: 1px solid rgba(107,26,26,0.18); }
.type-key_points .sm-type-badge { background: rgba(201,150,42,0.12); color: var(--gold-dark); border: 1px solid rgba(201,150,42,0.22); }
.type-table    .sm-type-badge { background: rgba(200,160,112,0.12); color: var(--sandal-dark); border: 1px solid rgba(200,160,112,0.25); }
.type-timeline .sm-type-badge { background: rgba(107,26,26,0.10);  color: var(--maroon-mid); border: 1px solid rgba(107,26,26,0.2); }
.type-formula  .sm-type-badge { background: rgba(160,120,32,0.10); color: var(--gold-dark);  border: 1px solid rgba(160,120,32,0.22); }
.type-diagram  .sm-type-badge { background: rgba(107,26,26,0.08);  color: var(--maroon);    border: 1px solid rgba(107,26,26,0.18); }
.type-example  .sm-type-badge { background: rgba(107,26,26,0.08);  color: var(--maroon-mid); border: 1px solid rgba(107,26,26,0.18); }
.type-summary  .sm-type-badge { background: rgba(201,150,42,0.15); color: var(--gold-dark); border: 1px solid rgba(201,150,42,0.25); }
.type-list     .sm-type-badge { background: rgba(200,160,112,0.10); color: var(--sandal-dark); border: 1px solid rgba(200,160,112,0.2); }

.sm-slide-num { font-size: 0.7rem; color: var(--dim); font-weight: 700; }

/* ── SLIDE TITLE ── */
.sm-slide-title {
  font-family: 'Kalam', cursive;
  font-size: clamp(1.1rem, 2.4vw, 1.6rem);
  font-weight: 700; line-height: 1.2; margin-bottom: 0.7rem;
  padding-bottom: 0.45rem; padding-left: 0.6rem;
  border-bottom: 2px solid rgba(107,26,26,0.10);
}
.type-title .sm-slide-title    { color: var(--maroon); border-bottom-color: rgba(201,150,42,0.3); }
.type-concept .sm-slide-title  { color: var(--maroon); }
.type-key_points .sm-slide-title { color: var(--gold-dark); }
.type-table .sm-slide-title    { color: var(--maroon); }
.type-timeline .sm-slide-title { color: var(--maroon-mid); }
.type-formula .sm-slide-title  { color: var(--gold-dark); }
.type-diagram .sm-slide-title  { color: var(--maroon); }
.type-example .sm-slide-title  { color: var(--maroon-mid); }
.type-summary .sm-slide-title  { color: var(--maroon); border-bottom-color: rgba(201,150,42,0.3); }
.type-list .sm-slide-title     { color: var(--maroon); }

/* ── SLIDE BODY — 60/40 LAYOUT ── */
.sm-slide-body {
  display: flex; gap: 1.4rem; align-items: stretch;
  flex: 1; min-height: 0; overflow: hidden;
}

/* LEFT COLUMN — 60% — diagram / image */
.sm-left-col {
  width: 56%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--sandal-lt);
  border-radius: 10px;
  border: 1.5px solid rgba(107,26,26,0.10);
  overflow: hidden;
}
.sm-left-col svg  { width: 100%; height: 100%; max-height: 420px; object-fit: contain; }
.sm-left-col img  { width: 100%; height: 100%; object-fit: contain; }

/* Image prompt placeholder */
.sm-img-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 1.5rem; text-align: center; width: 100%;
}
.sm-img-prompt-icon { font-size: 3.5rem; opacity: 0.25; }
.sm-img-prompt-text {
  font-size: 0.82rem; color: var(--text-mid); line-height: 1.55;
  font-style: italic; max-width: 240px; opacity: 0.7;
}

/* RIGHT COLUMN — 40% — text */
.sm-right-col {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(107,26,26,0.15) transparent;
}
.sm-slide-content { display: flex; flex-direction: column; gap: 0.5rem; }

/* Highlight box */
.sm-highlight-box {
  background: linear-gradient(135deg, rgba(201,150,42,0.12), rgba(201,150,42,0.06));
  border: 1.5px solid rgba(201,150,42,0.3);
  border-radius: 8px; padding: 0.6rem 0.9rem;
  font-size: 0.88rem; font-weight: 700; color: var(--maroon);
  line-height: 1.55; margin-bottom: 0.5rem;
}
.sm-hl-star { color: var(--gold-dark); margin-right: 4px; }

/* ── BULLET POINTS ── */
.sm-points { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.sm-point {
  font-size: clamp(0.88rem, 1.7vw, 1.05rem); line-height: 1.7;
  padding: 0.5rem 0.9rem 0.5rem 1rem;
  border-radius: 0 8px 8px 0;
  border-left: 3px solid rgba(107,26,26,0.2);
  background: rgba(107,26,26,0.03);
  color: var(--text);
  opacity: 0; transform: translateX(-6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.sm-point.visible { opacity: 1; transform: translateX(0); }
.sm-point.key {
  border-left-color: var(--gold-dark);
  background: rgba(201,150,42,0.07);
  color: var(--maroon); font-weight: 700;
}
.sm-point.key::before { content: '★ '; color: var(--gold-dark); }
.sm-point.formula {
  border-left-color: var(--gold-dark);
  background: rgba(201,150,42,0.06);
  color: var(--gold-dark); font-size: 1.05rem;
  font-family: 'Kalam', cursive; text-align: center;
}
.sm-point.formula::before { content: '∴ '; }
.sm-point.important {
  border-left-color: var(--maroon);
  background: rgba(107,26,26,0.07);
  color: var(--maroon); font-weight: 700;
}
.sm-point::before { content: '→ '; color: var(--sandal-dark); }

/* ── CONTENT TEXT ── */
.sm-content-text {
  font-size: clamp(0.82rem, 1.5vw, 0.98rem); line-height: 1.75;
  color: var(--text-mid); padding: 0.5rem 0.7rem;
  background: rgba(107,26,26,0.03);
  border-radius: 8px; margin-bottom: 0.4rem;
  border-left: 3px solid rgba(107,26,26,0.12);
}

/* ── TABLE ── */
.sm-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid rgba(107,26,26,0.15); box-shadow: var(--shadow); }
.sm-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 360px; }
.sm-table th {
  background: var(--maroon); color: var(--sandal);
  font-weight: 800; padding: 0.65rem 0.9rem;
  border-bottom: 2px solid var(--gold-dark);
  text-align: left; white-space: nowrap;
}
.sm-table td {
  padding: 0.55rem 0.9rem; border-bottom: 1px solid rgba(107,26,26,0.07);
  color: var(--text);
}
.sm-table tr:last-child td { border-bottom: none; }
.sm-table tr:nth-child(even) td { background: rgba(232,201,154,0.15); }
.sm-table tr:hover td { background: rgba(201,150,42,0.08); }

/* ── TIMELINE ── */
.sm-timeline { display: flex; flex-direction: column; gap: 0; }
.sm-tl-item { display: flex; gap: 1rem; align-items: flex-start; padding-bottom: 1rem; position: relative; }
.sm-tl-item:not(:last-child)::before {
  content: ''; position: absolute; left: 14px; top: 28px;
  width: 2px; bottom: 0; background: rgba(107,26,26,0.15);
}
.sm-tl-dot {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--maroon); border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.68rem; font-weight: 800; color: var(--gold-light); z-index: 1;
  box-shadow: 0 2px 6px rgba(107,26,26,0.25);
}
.sm-tl-year { font-size: 0.78rem; font-weight: 800; color: var(--gold-dark); margin-bottom: 2px; }
.sm-tl-text { font-size: 0.9rem; color: var(--text); line-height: 1.5; }

/* ── CALLOUT BOXES ── */
.sm-callout {
  border-radius: 10px; padding: 0.9rem 1.1rem; margin: 0.3rem 0;
  font-size: 0.9rem; line-height: 1.6;
}
.sm-callout.note { background: rgba(232,201,154,0.2); border-left: 4px solid var(--gold); color: var(--text); }
.sm-callout.tip  { background: rgba(201,150,42,0.08); border-left: 4px solid var(--gold-dark); color: var(--maroon); }
.sm-callout.warn { background: rgba(107,26,26,0.07);  border-left: 4px solid var(--maroon); color: var(--maroon); }
.sm-callout.fact { background: rgba(232,201,154,0.18); border-left: 4px solid var(--maroon); color: var(--text); }
.sm-callout-icon { font-size: 1rem; margin-right: 6px; }

/* ── FORMULA BOX ── */
.sm-formula-box {
  background: linear-gradient(135deg, rgba(107,26,26,0.06), rgba(201,150,42,0.06));
  border: 2px solid var(--gold);
  border-radius: 12px; padding: 1.1rem 1.4rem; text-align: center;
  font-family: 'Kalam', cursive; font-size: 1.6rem; color: var(--maroon);
  letter-spacing: 0.4px; margin: 0.4rem 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}

/* ── BAR CHART ── */
.sm-bar-chart { display: flex; flex-direction: column; gap: 0.55rem; }
.sm-bar-row { display: flex; align-items: center; gap: 0.7rem; }
.sm-bar-label { font-size: 0.8rem; width: 110px; text-align: right; color: var(--text-mid); flex-shrink: 0; font-weight: 600; }
.sm-bar-track { flex: 1; height: 24px; background: rgba(107,26,26,0.06); border-radius: 5px; overflow: hidden; border: 1px solid rgba(107,26,26,0.1); }
.sm-bar-fill {
  height: 100%; border-radius: 4px; width: 0%;
  transition: width 0.8s cubic-bezier(.34,1.2,.64,1);
  display: flex; align-items: center; padding-left: 10px;
  font-size: 0.72rem; font-weight: 800;
}
.sm-bar-fill.c0 { background: linear-gradient(90deg, var(--maroon), var(--maroon-mid)); color: var(--sandal); }
.sm-bar-fill.c1 { background: linear-gradient(90deg, var(--gold), var(--gold-dark));    color: #1a0800; }
.sm-bar-fill.c2 { background: linear-gradient(90deg, var(--sandal-dark), #b08050);      color: #1a0800; }
.sm-bar-fill.c3 { background: linear-gradient(90deg, var(--maroon-mid), var(--maroon)); color: var(--gold-light); }
.sm-bar-fill.c4 { background: linear-gradient(90deg, var(--gold-dark), var(--gold));    color: var(--maroon); }

/* ── DIAGRAM SLOT ── */
.sm-diagram-slot { margin-top: 0.5rem; max-height: 250px; overflow: hidden; border-radius: 10px; }
.sm-diagram-slot svg { width: 100%; max-height: 250px; }

/* ── IMAGE SLOT ── */
.sm-image-slot {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: var(--sandal-lt); border-radius: 10px; overflow: hidden;
}
.sm-image-slot img { width: 100%; height: 100%; object-fit: contain; }

/* ── SCENE CARD — illustrated left panel when no PDF/SVG ── */
.sm-scene-card {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 1.5rem; gap: 1rem; text-align: center;
  border-radius: 10px;
}
.scene-story   { background: linear-gradient(145deg, #fdf3e0, #f9e8cc); }
.scene-history { background: linear-gradient(145deg, #f0ece0, #e8dfc8); }
.scene-science { background: linear-gradient(145deg, #e8f5e0, #d8f0d0); }
.scene-maths   { background: linear-gradient(145deg, #e8f0f8, #d8e8f5); }
.scene-default { background: linear-gradient(145deg, #fdf3e0, #f5e8d0); }
.sm-scene-emoji {
  font-size: 4.5rem; line-height: 1;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.10));
}
.sm-scene-desc {
  font-family: 'Kalam', cursive;
  font-size: clamp(0.82rem, 1.5vw, 1rem);
  color: var(--maroon); line-height: 1.7;
  max-width: 92%; font-weight: 600;
}
.sm-scene-label {
  font-size: 0.68rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--gold-dark); padding: 3px 10px;
  background: rgba(107,26,26,0.07); border-radius: 20px;
}

/* ── PROGRESS BAR ── */
.sm-progress-wrap { height: 3px; background: rgba(107,26,26,0.1); flex-shrink: 0; }
.sm-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--maroon), var(--gold));
  transition: width 0.4s ease;
}

/* ── FOOTER NAV ── */
.sm-footer {
  height: 52px; background: #fff;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.2rem; gap: 1rem; flex-shrink: 0;
  box-shadow: 0 -2px 8px rgba(107,26,26,0.06);
}
.sm-footer-dots {
  display: flex; gap: 5px; align-items: center;
  flex-wrap: wrap; justify-content: center; max-width: 360px;
}
.sm-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(107,26,26,0.15); cursor: pointer; transition: all 0.2s;
}
.sm-dot.active { background: var(--maroon); transform: scale(1.35); box-shadow: 0 0 5px rgba(107,26,26,0.35); }
.sm-dot.done   { background: var(--sandal-dark); }

/* ── LOADING ── */
.sm-loader {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1.2rem; padding: 4rem; text-align: center;
}
.sm-spinner {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid rgba(107,26,26,0.12);
  border-top-color: var(--maroon);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sm-loader-title { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--maroon); }
.sm-loader-msg   { font-size: 0.85rem; color: var(--dim); }

/* ── KEY HINT ── */
.sm-key-hint { font-size: 0.65rem; color: var(--dim); text-align: center; padding: 2px; }
</style>
</head>

  <div class="sm-header-left">

<!-- PDF UPLOAD BAR -->
<div class="sm-upload-bar">
  <span class="sm-upload-label">📖 To show your textbook images:</span>
  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--maroon);color:var(--sandal);padding:5px 14px;border-radius:8px;font-size:0.78rem;font-weight:700;border:1px solid var(--gold-dark);">

</div>

<!-- BODY -->

  <!-- Viewport -->
  <div class="sm-viewport" id="sm-viewport">
    <!-- Loading state -->
    <div class="sm-loader" id="sm-loader">
      <div class="sm-spinner"></div>
      <div class="sm-loader-title">Building Slides...</div>
      <div class="sm-loader-msg" id="sm-loader-msg">Reading your lesson</div>

  <div class="sm-footer-dots" id="sm-dots"></div>

    <span class="sm-key-hint">← → arrow keys to navigate · Space to play</span>
    <span id="sm-counter" style="font-size:0.78rem;color:var(--dim);font-weight:700;"></span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// SLIDE MODE ENGINE — Standalone
// Reads lesson data from sessionStorage, generates Gamma-style slides
// ═══════════════════════════════════════════════════════════

const API_URL = '/api/ai';

let slides        = [];
let currentSlide  = 0;
let isPlaying     = false;
let currentUtt    = null;
let pdfImages     = [];   // base64 images extracted from PDF
let pdfBase64     = null;
let lessonData    = {};

const LOAD_MSGS = [
  'Reading your lesson carefully...',
  'Structuring content into slides...',
  'Creating tables and timelines...',
  'Adding diagrams and callouts...',
  'Almost ready...'
];

// ── Diagram library ──
const DIAGRAM_PATHS = {
  heart:'/assets/diagrams/heart.svg', plant_cell:'/assets/diagrams/plant.svg',
  water_cycle:'/assets/diagrams/water_cycle.svg', food_chain:'/assets/diagrams/food_chain.svg',
  photosynthesis:'/assets/diagrams/photosynthesis.svg', solar_system:'/assets/diagrams/solar_system.svg',
  atom_structure:'/assets/diagrams/atom_structure.svg', human_digestive:'/assets/diagrams/human_digestive.svg',
  human_respiratory:'/assets/diagrams/human_respiratory.svg', human_nervous:'/assets/diagrams/human_nervous.svg',
  human_skeletal:'/assets/diagrams/human_skeletal.svg', human_eye:'/assets/diagrams/human_eye.svg',
  human_circulatory:'/assets/diagrams/human_circulatory.svg', cell_division:'/assets/diagrams/cell_division.svg',
  dna_structure:'/assets/diagrams/dna_structure.svg', layers_earth:'/assets/diagrams/layers_earth.svg',
  magnet_field:'/assets/diagrams/magnet_field.svg', electric_circuit:'/assets/diagrams/electric_circuit.svg',
  states_of_matter:'/assets/diagrams/states_of_matter.svg', fraction_visual:'/assets/diagrams/fraction_visual.svg',
  pythagoras:'/assets/diagrams/pythagoras.svg', plant_anatomy:'/assets/diagrams/plant_anatomy.svg'
};

const SVG_CACHE = {};

// ── Init: read lesson data from sessionStorage ──
window.addEventListener('DOMContentLoaded', async () => {
  const raw = sessionStorage.getItem('sm_lesson');
  if (!raw) { showError('No lesson found. Please go back and activate a lesson first.'); return; }
  lessonData = JSON.parse(raw);
  document.getElementById('sm-lesson-title').textContent =
    `${lessonData.subject || ''} — ${lessonData.chapter || lessonData.lesson || ''}`;
  startLoadingMessages();
  try {
    slides = await generateSlides(lessonData);
    stopLoadingMessages();
    buildRail();
    buildDots();
    renderSlide(0);
    document.getElementById('sm-play-btn').disabled = false;
    document.getElementById('sm-prev-btn').disabled = false;
    document.getElementById('sm-next-btn').disabled = false;
  } catch(e) {
    showError('Could not generate slides: ' + e.message);
  }
});

// ── Generate slides via Claude API ──
async function generateSlides(data) {
  const { cls, subject, chapter, lesson, lessonText, lang } = data;
  const topic = chapter || lesson || subject || 'General Topic';
  const text  = (lessonText || lesson || '').substring(0, 1400);
  const langInstr = lang === 'tamil' ? 'Write in Tamil only.'
    : lang === 'both' ? 'English with Tamil in brackets.'
    : 'Simple English for Indian school students.';

  const systemPrompt =
`You are a school teacher making classroom slides. ${langInstr}
Rules: No summarizing. No questions. No exercises. Preserve textbook wording.
If no text given, generate lesson content from topic.
Return ONLY a JSON array. No markdown. No extra text.`;

  // Keep user prompt as short as possible to leave tokens for output
  const userPrompt =
`CLASS: ${cls}, SUBJECT: ${subject}, TOPIC: "${topic}"

TEXT:
${text || 'Generate complete lesson content for this topic.'}

Make 5 slides. Each paragraph = 1 slide. No Q&A slides.

Return this exact JSON (5 items):
[{"n":1,"title":"...","para":"full paragraph text","bullets":["point1","point2"],"highlight":"key sentence","scene":"describe exact visual scene for this slide","diagram":"heart OR water_cycle OR food_chain OR solar_system OR atom_structure OR none","emoji":"📖"}]

Rules:
- "para": full original paragraph, max 50 words
- "bullets": exactly 2 short bullets  
- "highlight": 1 key sentence max 12 words
- "scene": vivid description of what should be illustrated
- "diagram": only if science/maths diagram needed, else "none"`;

  const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 4000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userPrompt }]
    })
  });
  if (!response.ok) throw new Error('API error ' + response.status);
  const d = await response.json();
  if (!d || !Array.isArray(d.content) || !d.content[0] || !d.content[0].text){
    const why = (d && (d.message || (d.error && (d.error.message || d.error)))) || 'empty AI response';
    throw new Error(typeof why === 'string' ? why.substring(0,180) : 'empty AI response');
  }
  const raw = d.content[0].text.replace(/```json|```/g, '').trim();

  // Try full parse first
  try {
    const result = JSON.parse(raw);
    if (Array.isArray(result)) return normaliseSlides(result);
    throw new Error('not array');
  } catch(e) {
    // SALVAGE: reply may have been cut off mid-slide. Walk back through
    // closing braces and keep every COMPLETE slide instead of failing.
    let cut = raw.length;
    for (let tries = 0; tries < 10; tries++){
      cut = raw.lastIndexOf('}', cut - 1);
      if (cut <= 0) break;
      const candidate = raw.substring(0, cut + 1).replace(/,\s*$/, '') + ']';
      try {
        const partial = JSON.parse(candidate);
        if (Array.isArray(partial) && partial.length > 0) return normaliseSlides(partial);
      } catch(e2) {}
    }
    throw new Error('the AI reply was incomplete \u2014 please try again.');
  }
}

// Normalise flat {n,title,para,bullets,highlight,scene,diagram} → render-compatible shape
function normaliseSlides(arr) {
  return arr.map(s => ({
    slide_number: s.n || s.slide_number || 1,
    title:   s.title   || '',
    type:    s.type    || 'concept',
    emoji:   s.emoji   || '📖',
    diagram: s.diagram !== 'none' ? s.diagram : null,
    // New nested shape for renderSlide
    image:   { description: s.scene || s.image_prompt || s.title, diagram_key: s.diagram || 'none' },
    content: { paragraph: s.para || s.paragraph || '', bullets: s.bullets || s.points || [], highlight: s.highlight || '' },
    // Keep flat keys too for backwards compat
    paragraph: s.para || s.paragraph || '',
    points:    s.bullets || s.points || [],
    highlight: s.highlight || '',
  }));
}

// ── Build thumbnail rail ──
function buildRail() {
  const rail = document.getElementById('sm-rail');
  rail.innerHTML = '';
  slides.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'sm-thumb' + (i === 0 ? ' active' : '');
    d.innerHTML = `<div class="sm-thumb-num">${i+1}</div>${(s.emoji||'')+'  '+(s.title||'').substring(0,32)}`;
    d.onclick = () => { speechSynthesis.cancel(); speechId++; renderSlide(i); };
    rail.appendChild(d);
  });
}

// ── Build footer dots ──
function buildDots() {
  const bar = document.getElementById('sm-dots');
  bar.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'sm-dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { speechSynthesis.cancel(); speechId++; renderSlide(i); };
    bar.appendChild(d);
  });
}

// ── Render slide ──
async function renderSlide(idx) {
  if (idx < 0 || idx >= slides.length) return;
  currentSlide = idx;
  const s = slides[idx];

  // Update progress
  document.getElementById('sm-prog').style.width = ((idx+1)/slides.length*100) + '%';
  document.getElementById('sm-counter').textContent = `${idx+1} / ${slides.length}`;

  // Update rail + dots
  document.querySelectorAll('.sm-thumb').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
  });
  document.querySelectorAll('.sm-dot').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
  });

  // Nav buttons
  document.getElementById('sm-prev-btn').disabled = idx === 0;
  document.getElementById('sm-next-btn').textContent = idx === slides.length - 1 ? '✅ Done' : 'Next ⏭';

  // Build slide HTML
  const wrap = document.getElementById('sm-slide-wrap');
  wrap.innerHTML = '';
  wrap.style.display = 'block';
  document.getElementById('sm-loader').style.display = 'none';

  const card = document.createElement('div');
  card.className = `sm-slide type-${s.type || 'concept'}`;

  // ── HEADER: badge + slide number ──
  const meta = document.createElement('div');
  meta.className = 'sm-slide-meta';
  meta.innerHTML = `<span class="sm-type-badge">${(s.type||'concept').replace(/_/g,' ').toUpperCase()}</span>
    <span class="sm-slide-num">${idx+1} / ${slides.length}</span>`;
  card.appendChild(meta);

  // ── TITLE ──
  const titleEl = document.createElement('div');
  titleEl.className = 'sm-slide-title';
  titleEl.textContent = (s.emoji || '') + ' ' + (s.title || '');
  card.appendChild(titleEl);

  // ── 60/40 BODY ──
  const body = document.createElement('div');
  body.className = 'sm-slide-body';
  card.appendChild(body);

  // LEFT: image/diagram (60%)
  const leftCol = document.createElement('div');
  leftCol.className = 'sm-left-col';
  body.appendChild(leftCol);

  // RIGHT: content (40%)
  const rightCol = document.createElement('div');
  rightCol.className = 'sm-right-col';
  body.appendChild(rightCol);

  // ── FILL LEFT COLUMN ──
  // Pull image data from new JSON shape: s.image.description / s.image.diagram_key
  const imgObj     = s.image     || {};
  const contentObj = s.content   || {};
  const diagKey    = (imgObj.diagram_key && imgObj.diagram_key !== 'none' && imgObj.diagram_key !== 'null')
                     ? imgObj.diagram_key : null;
  const sceneDesc  = imgObj.description || s.image_prompt || (s.title || '');

  if (pdfImages.length > 0) {
    // PDF page always wins
    const img = document.createElement('img');
    img.src = pdfImages[idx % pdfImages.length];
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
    leftCol.appendChild(img);

  } else if (diagKey && DIAGRAM_PATHS[diagKey]) {
    // SVG diagram for science/maths
    loadSVGIntoSlot(diagKey, leftCol);

  } else {
    // Illustrated scene card — styled visual with scene description
    const sceneCard = document.createElement('div');
    sceneCard.className = 'sm-scene-card';
    // Pick a contextual background colour based on subject/type
    const subj = (lessonData.subject || '').toLowerCase();
    const sceneBg = subj.includes('science') || subj.includes('bio') ? 'scene-science'
      : subj.includes('history') || subj.includes('social') ? 'scene-history'
      : subj.includes('math') ? 'scene-maths'
      : subj.includes('tamil') || subj.includes('english') ? 'scene-story'
      : 'scene-default';
    sceneCard.classList.add(sceneBg);
    sceneCard.innerHTML =
      `<div class="sm-scene-emoji">${s.emoji || '📖'}</div>
       <div class="sm-scene-desc">${sceneDesc}</div>
       <div class="sm-scene-label">${s.title || ''}</div>`;
    leftCol.appendChild(sceneCard);
  }

  // ── FILL RIGHT COLUMN ──
  // Support both old shape (s.paragraph/s.points/s.highlight)
  // and new shape (s.content.paragraph/s.content.bullets/s.content.highlight)
  const para      = contentObj.paragraph || s.paragraph || s.content_text || '';
  const bullets   = contentObj.bullets   || s.points    || [];
  const highlight = contentObj.highlight || s.highlight || '';

  const content = document.createElement('div');
  content.className = 'sm-slide-content';
  rightCol.appendChild(content);

  // Paragraph
  if (para) {
    const pt = document.createElement('div');
    pt.className = 'sm-content-text';
    pt.textContent = para;
    content.appendChild(pt);
  }

  // Highlight
  if (highlight) {
    const hl = document.createElement('div');
    hl.className = 'sm-highlight-box';
    hl.innerHTML = `<span class="sm-hl-star">★</span> ${highlight}`;
    content.appendChild(hl);
  }

  // Type-specific content
  if (s.type === 'table' && s.table) {
    const wrap2 = document.createElement('div');
    wrap2.className = 'sm-table-wrap';
    const tbl = document.createElement('table');
    tbl.className = 'sm-table';
    if (s.table.headers) {
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      s.table.headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; tr.appendChild(th); });
      thead.appendChild(tr); tbl.appendChild(thead);
    }
    if (s.table.rows) {
      const tbody = document.createElement('tbody');
      s.table.rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => { const td = document.createElement('td'); td.textContent = cell; tr.appendChild(td); });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
    }
    wrap2.appendChild(tbl); content.appendChild(wrap2);

  } else if (s.type === 'timeline' && s.timeline) {
    const tl = document.createElement('div');
    tl.className = 'sm-timeline';
    s.timeline.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'sm-tl-item';
      row.innerHTML = `<div class="sm-tl-dot">${i+1}</div>
        <div><div class="sm-tl-year">${item.year||item.date||''}</div>
        <div class="sm-tl-text">${item.event||item.text||''}</div></div>`;
      tl.appendChild(row);
    });
    content.appendChild(tl);

  } else if (s.type === 'formula') {
    if (s.formula) {
      const fb = document.createElement('div');
      fb.className = 'sm-formula-box'; fb.textContent = s.formula;
      content.appendChild(fb);
    }
    if (s.points) appendPoints(content, s.points);

  } else if (s.type === 'callout') {
    const cb = document.createElement('div');
    cb.className = `sm-callout ${s.callout_type || 'note'}`;
    cb.innerHTML = `<span class="sm-callout-icon">${getCalloutIcon(s.callout_type)}</span>${s.callout_text||''}`;
    content.appendChild(cb);
    if (s.points) appendPoints(content, s.points);

  } else if (s.type === 'barchart' && s.bars) {
    const bc = document.createElement('div');
    bc.className = 'sm-bar-chart';
    const max = Math.max(...s.bars.map(b => b.value || 0)) || 100;
    s.bars.forEach((bar, bi) => {
      const row = document.createElement('div');
      row.className = 'sm-bar-row';
      row.innerHTML = `<div class="sm-bar-label">${bar.label}</div>
        <div class="sm-bar-track"><div class="sm-bar-fill c${bi%5}" data-pct="${(bar.value/max*100).toFixed(0)}">${bar.display||bar.value}</div></div>`;
      bc.appendChild(row);
    });
    content.appendChild(bc);
    setTimeout(() => { bc.querySelectorAll('.sm-bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; }); }, 120);

  } else {
    const pts = bullets.length ? bullets : (s.points || []);
    if (pts.length) appendPoints(content, pts);
  }

  wrap.appendChild(card);

  // Stagger points reveal
  setTimeout(() => {
    card.querySelectorAll('.sm-point').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 60 + i * 80);
    });
  }, 80);

  // Voice if playing
  if (isPlaying) smSpeakCurrent();
}

function appendPoints(container, points) {
  const ul = document.createElement('ul');
  ul.className = 'sm-points';
  points.forEach(pt => {
    const li = document.createElement('li');
    li.className = 'sm-point' + classifyPoint(pt);
    li.textContent = pt;
    ul.appendChild(li);
  });
  container.appendChild(ul);
}

function classifyPoint(text) {
  if (/important|remember|key|always|never|must|note/i.test(text)) return ' key';
  if (/^[A-Za-z₀-₉\s]+[=+\-×÷^]/.test(text) || /formula/i.test(text)) return ' formula';
  if (/warning|danger|caution/i.test(text)) return ' important';
  return '';
}

function getCalloutIcon(type) {
  return { fact:'💡', tip:'✅', warn:'⚠️', note:'📌' }[type] || '📌';
}

function buildVisualColumn(s, idx) {
  // Priority 1: PDF image (base64 extracted page)
  if (pdfImages.length > 0) {
    const imgData = pdfImages[idx % pdfImages.length];
    if (imgData) {
      const slot = document.createElement('div');
      slot.className = 'sm-image-slot';
      const img = document.createElement('img');
      img.src = imgData;
      slot.appendChild(img);
      return slot;
    }
  }

  // Priority 2: diagram from this slide's own diagram field
  const diagKey = s.diagram || autoPickDiagram(idx);
  if (diagKey && DIAGRAM_PATHS[diagKey]) {
    const slot = document.createElement('div');
    slot.className = 'sm-image-slot';
    slot.style.cssText = 'width:210px;min-height:140px;padding:8px;background:#fff8f0;border:1.5px solid rgba(107,26,26,0.12);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
    loadSVGIntoSlot(diagKey, slot);
    return slot;
  }
  return null;
}

// Auto-pick a diagram based on lesson topic keywords
function autoPickDiagram(slideIdx) {
  const topic = (lessonData.chapter || lessonData.lesson || lessonData.subject || '').toLowerCase();
  const text  = (lessonData.lessonText || '').toLowerCase();
  const combined = topic + ' ' + text.substring(0, 300);

  const keyMap = [
    { keys:['heart','cardiac','blood pump','circulat'],        diagram:'heart' },
    { keys:['plant cell','cell wall','chloroplast','vacuole'], diagram:'plant_cell' },
    { keys:['photosynthesis','chlorophyll','sunlight plant'],  diagram:'photosynthesis' },
    { keys:['water cycle','evaporation','precipitation','condensation'], diagram:'water_cycle' },
    { keys:['food chain','herbivore','carnivore','producer'],  diagram:'food_chain' },
    { keys:['solar system','planet','orbit','sun moon'],       diagram:'solar_system' },
    { keys:['atom','electron','proton','neutron','nucleus'],   diagram:'atom_structure' },
    { keys:['digest','stomach','intestine','oesophagus'],      diagram:'human_digestive' },
    { keys:['lung','respirat','bronch','trachea','breath'],    diagram:'human_respiratory' },
    { keys:['nervous','neuron','brain','spinal','nerve'],      diagram:'human_nervous' },
    { keys:['skeleton','bone','skull','femur','skeletal'],     diagram:'human_skeletal' },
    { keys:['eye','cornea','retina','lens','vision'],          diagram:'human_eye' },
    { keys:['heart','circulat','artery','vein','blood'],       diagram:'human_circulatory' },
    { keys:['mitosis','cell division','chromosome'],           diagram:'cell_division' },
    { keys:['dna','gene','heredit','genetics'],                diagram:'dna_structure' },
    { keys:['earth layer','mantle','crust','core'],            diagram:'layers_earth' },
    { keys:['magnet','magnetic field','north pole','south pole'], diagram:'magnet_field' },
    { keys:['electric','circuit','current','voltage','resistor'], diagram:'electric_circuit' },
    { keys:['solid','liquid','gas','matter','state'],          diagram:'states_of_matter' },
    { keys:['fraction','numerator','denominator','half'],      diagram:'fraction_visual' },
    { keys:['pythagoras','hypotenuse','right angle','triangle'], diagram:'pythagoras' },
    { keys:['plant','root','stem','leaf','flower'],            diagram:'plant_anatomy' },
  ];

  for (const entry of keyMap) {
    if (entry.keys.some(k => combined.includes(k))) {
      return entry.diagram;
    }
  }

  // Rotate through a few relevant diagrams if no match
  const fallbacks = ['water_cycle','solar_system','states_of_matter','food_chain','atom_structure'];
  return fallbacks[slideIdx % fallbacks.length];
}

// ── Load SVG into a container element ──
async function loadSVGIntoSlot(key, container) {
  const path = DIAGRAM_PATHS[key];
  if (!path) return;
  if (SVG_CACHE[path]) {
    container.appendChild(SVG_CACHE[path].cloneNode(true));
    animateSVGQuick(container.querySelector('svg'));
    return;
  }
  try {
    const res = await fetch(path);
    if (!res.ok) return;
    const text = await res.text();
    const div = document.createElement('div');
    div.innerHTML = text;
    const svg = div.firstElementChild;
    if (!svg) return;
    SVG_CACHE[path] = svg;
    svg.setAttribute('width', '100%');
    svg.removeAttribute('height');
    svg.style.maxHeight = '250px';
    container.appendChild(svg.cloneNode(true));
    animateSVGQuick(container.querySelector('svg'));
  } catch(e) {}
}

function animateSVGQuick(svg) {
  if (!svg) return;
  const paths = svg.querySelectorAll('path, circle, ellipse, rect, line');
  const texts = svg.querySelectorAll('text');
  texts.forEach(t => { t.style.opacity = '0'; t.style.transition = 'opacity 0.5s ease 1s'; });
  paths.forEach((p, i) => {
    const hasS = p.getAttribute('stroke') && p.getAttribute('stroke') !== 'none';
    if (!hasS) return;
    let len = 200; try { len = p.getTotalLength(); } catch(e) {}
    const dur = Math.min(120 + len * 0.6, 900);
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = `stroke-dashoffset ${dur}ms linear ${i * 30}ms`;
    void p.getBoundingClientRect();
    p.style.strokeDashoffset = '0';
  });
  setTimeout(() => texts.forEach(t => t.style.opacity = '1'), 1100);
}

// ── Navigation ──
function smNext() {
  speechSynthesis.cancel();
  speechId++;  // invalidate any pending onend
  if (currentSlide < slides.length - 1) renderSlide(currentSlide + 1);
  else { isPlaying = false; updatePlayBtns(); }
}
function smPrev() {
  speechSynthesis.cancel();
  speechId++;  // invalidate any pending onend
  if (currentSlide > 0) renderSlide(currentSlide - 1);
}

// ── Voice ──
function smPlay() {
  if (!slides.length) return;
  isPlaying = true; updatePlayBtns();
  smSpeakCurrent();
}
function smPause() {
  isPlaying = false; updatePlayBtns();
  speechSynthesis.cancel();
}

let speechId = 0;  // incremented each call; stale onend callbacks check this and abort

function smSpeakCurrent() {
  const s = slides[currentSlide];
  if (!s) return;

  // Cancel any in-progress speech FIRST, then increment ID
  // so the old onend fires with a stale ID and does nothing
  speechSynthesis.cancel();
  const myId = ++speechId;

  const contentObj = s.content || {};
  const para      = contentObj.paragraph || s.paragraph || '';
  const bullets   = contentObj.bullets   || s.points    || [];
  const highlight = contentObj.highlight || s.highlight || '';

  let parts = [];
  if (s.title)   parts.push(s.title);
  if (para)      parts.push(para);
  if (highlight) parts.push(highlight);
  parts = parts.concat(bullets);
  if (s.formula)               parts.push(s.formula);
  if (s.callout_text)          parts.push(s.callout_text);
  if (contentObj.callout_text) parts.push(contentObj.callout_text);
  if (s.timeline) s.timeline.forEach(t => parts.push(`${t.year||''}: ${t.event||t.text||''}`));
  if (s.table && s.table.rows) s.table.rows.forEach(r => parts.push(r.join(', ')));

  const lang = lessonData.lang || 'english';
  const txt  = parts.filter(Boolean).join('. ')
    .replace(/[^\u0000-\u007E\u0900-\u097F\u0B80-\u0BFF .,!?]/g, '');
  const spd  = lang === 'tamil' ? 0.82 : 0.90;

  const utt = new SpeechSynthesisUtterance(txt);
  utt.lang  = lang === 'tamil' ? 'ta-IN' : 'en-IN';
  utt.rate  = spd;

  if (lang === 'tamil') {
    const voices = speechSynthesis.getVoices();
    const taVoice = voices.find(v => v.lang && v.lang.startsWith('ta'));
    if (taVoice) utt.voice = taVoice;
  }

  currentUtt = utt;

  utt.onend = () => {
    // If speechId changed, user navigated — do NOT advance
    if (speechId !== myId) return;
    if (!isPlaying) return;
    if (currentSlide < slides.length - 1) {
      setTimeout(() => renderSlide(currentSlide + 1), 400);
    } else {
      isPlaying = false; updatePlayBtns();
    }
  };

  utt.onerror = () => {
    // Same guard — stale errors must not advance slides
    if (speechId !== myId) return;
    if (isPlaying && currentSlide < slides.length - 1) {
      setTimeout(() => renderSlide(currentSlide + 1), 400);
    }
  };

  speechSynthesis.speak(utt);
}

function updatePlayBtns() {
  const play  = document.getElementById('sm-play-btn');
  const pause = document.getElementById('sm-pause-btn');
  if (isPlaying) { play.style.display = 'none'; pause.style.display = ''; }
  else           { play.style.display = '';      pause.style.display = 'none'; }
}

// ── PDF Handler — extract one page per slide using PDF.js ──
async function handlePDF(event) {
  const file = event.target.files[0];
  if (!file) return;
  await extractPDFImages(file);
}

async function extractPDFImages(file) {
  const status = document.getElementById('sm-pdf-status');
  status.textContent = '⏳ Loading PDF pages...';
  pdfImages = [];

  try {
    if (!window.pdfjsLib) {
      status.textContent = '⏳ Loading PDF reader...';
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // Extract as many pages as we have slides (or all pages if fewer)
    const targetPages = Math.max(slides.length || 8, pdf.numPages);
    const maxPages = Math.min(pdf.numPages, 20);

    status.textContent = `⏳ Extracting ${maxPages} pages from your book...`;

    for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      pdfImages.push(canvas.toDataURL('image/jpeg', 0.82));
    }

    status.textContent = `✅ ${pdfImages.length} book pages ready — slides now show your textbook images`;

    // Re-render current slide immediately
    if (slides.length > 0) renderSlide(currentSlide);

  } catch(e) {
    status.textContent = '⚠️ Could not read PDF: ' + e.message;
    console.error('PDF error:', e);
  }
}

// ── Loading messages ──
let loadMsgI = 0, loadMsgT = null;
function startLoadingMessages() {
  loadMsgT = setInterval(() => {
    document.getElementById('sm-loader-msg').textContent = LOAD_MSGS[loadMsgI++ % LOAD_MSGS.length];
  }, 800);
}
function stopLoadingMessages() {
  if (loadMsgT) { clearInterval(loadMsgT); loadMsgT = null; }
}

function showError(msg) {
  document.getElementById('sm-loader').innerHTML =
    `<div style="color:#f4a0a0;font-size:1rem;text-align:center;max-width:420px;line-height:1.6;">
      ⚠️ ${msg}<br><br>
      <button onclick="goBack()" style="padding:8px 20px;background:var(--gold);border:none;border-radius:8px;cursor:pointer;font-weight:700;color:#0e0a04;">← Go Back</button>
    </div>`;
}

function goBack() {
  speechSynthesis.cancel();
  // Works whether opened as new tab (window.opener) or same tab (history)
  if (window.opener && !window.opener.closed) {
    window.close();
  } else if (document.referrer) {
    window.location.href = document.referrer;
  } else {
    window.location.href = '/learnbot.html';
  }
}

// ── Keyboard navigation ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') smNext();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   smPrev();
  if (e.key === ' ') { e.preventDefault(); isPlaying ? smPause() : smPlay(); }
  if (e.key === 'Escape') goBack();
});
</script>
