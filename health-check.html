<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Check — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6B1A1A;--gold:#C9A84C;--gold-light:#FFD86A;--sandal:#E8C99A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#120a08,#241008 60%,#120a08);color:#f5efe2;font-family:'Nunito',sans-serif;min-height:100vh;padding:34px 18px 60px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-family:'Cinzel',serif;color:var(--gold-light);font-size:1.6rem;letter-spacing:1px;margin-bottom:6px;}
.sub{color:var(--sandal);font-size:0.88rem;line-height:1.6;margin-bottom:20px;}
.runbtn{background:linear-gradient(135deg,var(--gold),#a8863a);color:#2a1505;border:none;padding:12px 26px;border-radius:12px;font-family:'Cinzel',serif;font-weight:700;font-size:0.95rem;cursor:pointer;margin-bottom:24px;box-shadow:0 8px 24px rgba(201,168,76,0.3);}
.runbtn:disabled{opacity:0.5;cursor:wait;}
.row{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,rgba(107,26,26,0.35),rgba(30,12,8,0.6));border:1.5px solid rgba(201,168,76,0.4);border-radius:13px;padding:13px 16px;margin-bottom:10px;}
.row .st{font-size:1.2rem;width:28px;text-align:center;flex:0 0 auto;}
.row .nm{flex:1;min-width:0;font-weight:700;font-size:0.9rem;color:var(--sandal);}
.row .nm small{display:block;font-weight:400;font-size:0.68rem;color:rgba(232,201,154,0.6);margin-top:2px;}
.row .ms{font-size:0.72rem;color:rgba(232,201,154,0.7);white-space:nowrap;}
.row.ok{border-color:rgba(90,200,120,0.55);}
.row.bad{border-color:rgba(230,110,110,0.6);}
.row .note{font-size:0.68rem;color:#ffb0a5;max-width:280px;text-align:right;line-height:1.35;}
#summary{margin-top:20px;padding:14px 18px;border-radius:13px;font-weight:800;font-size:0.95rem;display:none;text-align:center;}
#summary.allok{display:block;background:rgba(60,150,80,0.2);border:1.5px solid rgba(90,200,120,0.6);color:#a5eab8;}
#summary.hasbad{display:block;background:rgba(180,60,60,0.18);border:1.5px solid rgba(230,110,110,0.6);color:#ffc4b8;}
.back{display:inline-block;margin-bottom:18px;background:rgba(201,168,76,0.12);border:1.5px solid rgba(201,168,76,0.45);color:var(--sandal);padding:8px 16px;border-radius:10px;font-weight:700;font-size:0.8rem;cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="learnbot.html">&larr; Back to TeachBot</a>
  <h1>&#129657; System Health Check</h1>
  <div class="sub">One click tests every AI brain, voice and critical file this product depends on. Run this <b>before every demo and every school day</b>. Green ticks everywhere = safe to walk into the classroom.</div>
  <button class="runbtn" id="run" onclick="runAll()">&#9654; Run All Checks</button>
  <div id="rows"></div>
  <div id="summary"></div>
</div>

<script>
/* Each check: tiny real request, judged by shape of the reply.
   Costs are negligible (few tokens / cached audio). */
var CHECKS = [
  {
    name: 'AI Brain', detail: '/api/ai \u2014 powers every lesson plan, Tamil text, doubt solving',
    run: async function(){
      var r = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ system:'Reply with exactly: OK', messages:[{role:'user',content:'Say OK'}], max_tokens: 10 }) });
      var d = await r.json();
      var t = (d && Array.isArray(d.content)) ? d.content.map(function(b){return b.text||'';}).join('') : '';
      if (t.trim().length > 0) return { ok:true };
      return { ok:false, note: (d && (d.message || (d.error && (d.error.message || d.error)))) || 'no text returned' };
    }
  },
  {
    name: 'Class Voice (Monika)', detail: '/api/voice-class \u2014 narration in every classroom',
    run: async function(){
      var r = await fetch('/api/voice-class', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text:'Health check.', cls:'Class 8' }) });
      var d = await r.json();
      if (d && d.audio_b64) return { ok:true };
      return { ok:false, note: (d && d.error) || 'no audio returned' };
    }
  },
  {
    name: 'Tamil Voice (Sarah)', detail: '/api/explain-tamil \u2014 the \u0BA4\u0BAE\u0BBF\u0BB4\u0BCD button everywhere',
    run: async function(){
      var r = await fetch('/api/explain-tamil', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text:'\u0BB5\u0BA3\u0B95\u0BCD\u0B95\u0BAE\u0BCD', cache_key:'healthcheck_ta_v1' }) });
      var d = await r.json();
      if (d && (d.audio_url || d.audio_b64)) return { ok:true };
      return { ok:false, note: (d && d.error) || 'no audio returned' };
    }
  },
  {
    name: 'Photo Finder', detail: '/api/social-images \u2014 verified pictures for Social & Science',
    run: async function(){
      var r = await fetch('/api/social-images', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ query:'Qutub Minar Delhi', context:'health check' }) });
      var d = await r.json();
      if (d && Array.isArray(d.images)) return { ok:true, extra: d.images.length + ' image(s)' };
      return { ok:false, note: 'unexpected reply' };
    }
  },
  {
    name: '3D Model Finder', detail: '/api/science-models \u2014 skeleton, skull, heart models',
    run: async function(){
      var r = await fetch('/api/science-models', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ organ:'skull', query:'human skull anatomy', label:'Human Skull' }) });
      var d = await r.json();
      if (d && ('uid' in d)) return { ok: !!d.uid, note: d.uid ? '' : 'reachable, but no model chosen' };
      return { ok:false, note:'unexpected reply' };
    }
  },
  {
    name: 'Prepared-Plan Store', detail: '/api/lesson-plan \u2014 the Prepare Class memory',
    run: async function(){
      var r = await fetch('/api/lesson-plan?key=aaaaaaaaaaaaaaaaaaaa');
      var d = await r.json();
      if (d && ('steps' in d)) return { ok:true };
      return { ok:false, note:'unexpected reply' };
    }
  },
  {
    name: 'India Map File', detail: 'assets/maps/india_states.svg \u2014 Blackboard AI map button',
    run: async function(){
      var r = await fetch('/assets/maps/india_states.svg', { method:'HEAD' });
      if (r.ok) return { ok:true };
      return { ok:false, note:'file missing (' + r.status + ')' };
    }
  },
  {
    name: 'Teacher Figure', detail: 'assets/teacher.png \u2014 the classroom teacher image',
    run: async function(){
      var r = await fetch('/assets/teacher.png', { method:'HEAD' });
      if (r.ok) return { ok:true };
      return { ok:false, note:'file missing (' + r.status + ')' };
    }
  }
];

function buildRows(){
  var wrap = document.getElementById('rows');
  wrap.innerHTML = '';
  CHECKS.forEach(function(cItem, i){
    var d = document.createElement('div');
    d.className = 'row';
    d.id = 'row-' + i;
    d.innerHTML = '<div class="st">\u25CB</div>' +
      '<div class="nm">' + cItem.name + '<small>' + cItem.detail + '</small></div>' +
      '<div class="note"></div><div class="ms"></div>';
    wrap.appendChild(d);
  });
}

async function runAll(){
  var btn = document.getElementById('run');
  btn.disabled = true;
  document.getElementById('summary').className = '';
  buildRows();
  var bad = 0;
  for (var i = 0; i < CHECKS.length; i++){
    var row = document.getElementById('row-' + i);
    row.querySelector('.st').textContent = '\u23F3';
    var t0 = Date.now();
    var res;
    try{ res = await CHECKS[i].run(); }
    catch(e){ res = { ok:false, note: e.message }; }
    var ms = Date.now() - t0;
    row.querySelector('.ms').textContent = ms + ' ms';
    if (res.ok){
      row.classList.add('ok');
      row.querySelector('.st').textContent = '\u2705';
      if (res.extra) row.querySelector('.note').style.color = 'rgba(165,234,184,0.8)',
                     row.querySelector('.note').textContent = res.extra;
      if (res.note) row.querySelector('.note').textContent = res.note;
    } else {
      bad++;
      row.classList.add('bad');
      row.querySelector('.st').textContent = '\u274C';
      row.querySelector('.note').textContent = (res.note || 'failed').toString().substring(0, 140);
    }
  }
  var s = document.getElementById('summary');
  if (bad === 0){
    s.className = 'allok';
    s.textContent = '\u2705 All systems healthy \u2014 safe to teach and safe to demo.';
  } else {
    s.className = 'hasbad';
    s.textContent = '\u274C ' + bad + ' check(s) failed \u2014 fix before the demo. Screenshot this page and send it to your developer.';
  }
  btn.disabled = false;
}
document.addEventListener('DOMContentLoaded', buildRows);
</script>
</body>
</html>
