<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Concept Class — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Noto+Sans+Tamil:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --gold:#C9962A; --sandal:#E8C99A;
  --board-dark:#163016; --board-mid:#1b3d1b;
  --chalk:#f2efe9; --chalk-dim:#c8c4be;
  --chalk-yellow:#f5e87a; --chalk-blue:#a8d8f0;
  --chalk-red:#f4a0a0; --chalk-green:#a8e6a8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0c08;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;}
.hidden{display:none !important;}

/* ═══ SETUP ═══ */
#setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1200 0%,#080808 70%);padding:2rem 1rem;}
#setup h1{font-family:'Caveat',cursive;font-size:clamp(2.2rem,6vw,3.6rem);color:var(--gold);
  text-align:center;text-shadow:0 0 40px rgba(201,150,42,.4);}
#setup p.sub{color:var(--sandal);opacity:.85;margin:.4rem 0 1.6rem;text-align:center;}
.setup-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(201,150,42,.3);
  border-radius:18px;padding:1.5rem;width:100%;max-width:720px;}
.fld{margin-bottom:1.1rem;}
.fld label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sandal);margin-bottom:.45rem;}
.fld select{width:100%;padding:.8rem .9rem;border-radius:10px;background:#161a12;color:#fff;
  border:1.5px solid rgba(201,150,42,.35);font-family:'Nunito',sans-serif;font-size:1rem;}
.chip-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.chip{flex:1;min-width:110px;padding:.8rem .6rem;border-radius:12px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,.03);border:2px solid rgba(201,150,42,.3);color:var(--sandal);
  font-weight:700;transition:.18s;font-size:.95rem;}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--maroon);border-color:var(--gold);color:#fff;}
.start-btn{width:100%;margin-top:.4rem;padding:1rem;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#6B1A1A,#8f2626);color:#fff;font-size:1.15rem;font-weight:700;
  font-family:'Nunito',sans-serif;letter-spacing:.03em;}
.start-btn:hover{filter:brightness(1.12);}
.start-btn:disabled{opacity:.45;cursor:not-allowed;}

/* Chapter list */
#chap-box{max-height:320px;overflow-y:auto;border:1.5px solid rgba(201,150,42,.28);
  border-radius:12px;padding:.5rem;background:rgba(0,0,0,.22);}
.chap{padding:.65rem .8rem;border-radius:9px;cursor:pointer;margin-bottom:.35rem;
  border:1.6px solid transparent;display:flex;gap:.7rem;align-items:flex-start;transition:.15s;}
.chap:hover{background:rgba(255,255,255,.05);}
.chap.on{background:var(--maroon);border-color:var(--gold);}
.chap-num{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--chalk-yellow);
  min-width:30px;line-height:1.1;}
.chap-t{font-size:.95rem;color:var(--chalk);line-height:1.35;}
.chap-sub{font-size:.75rem;color:var(--sandal);opacity:.75;margin-top:.15rem;}
.chap-rich{display:inline-block;margin-left:.4rem;padding:1px 8px;border-radius:20px;
  font-size:.67rem;font-weight:700;background:rgba(201,150,42,.28);
  color:var(--chalk-yellow);border:1px solid rgba(201,150,42,.5);vertical-align:middle;}
.theme-hd{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--gold);
  padding:.5rem .6rem .2rem;border-bottom:1px dashed rgba(201,150,42,.3);margin-bottom:.4rem;}
.muted{color:var(--sandal);opacity:.7;font-size:.9rem;padding:.9rem;text-align:center;}

/* ═══ CLASSROOM ═══ */
#room{display:none;flex-direction:column;}
#room.show{display:flex;height:100vh;overflow:hidden;}
.topbar{background:linear-gradient(90deg,#4d1212,#6B1A1A);padding:.7rem 1.1rem;
  display:flex;align-items:center;gap:.8rem;border-bottom:2px solid rgba(201,150,42,.4);}
.topbar h2{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--sandal);white-space:nowrap;}
.topbar .grow{flex:1;}
.topbar .meta{font-size:.85rem;color:rgba(232,201,154,.8);}
.tb-btn{padding:.5rem .9rem;border-radius:10px;cursor:pointer;font-weight:700;font-size:.9rem;
  background:rgba(0,0,0,.25);border:1.5px solid rgba(232,201,154,.45);color:var(--sandal);}
.tb-btn:hover{background:rgba(0,0,0,.45);}

.main{flex:1;min-height:0;display:flex;gap:14px;padding:14px;align-items:stretch;}
.stage-wrap{flex:1.35;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--board-dark),var(--board-mid));
  border:3px solid #3b2a12;border-radius:16px;overflow:hidden;position:relative;padding:20px;}
#big{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;}
#big .b-title{font-family:'Caveat',cursive;font-size:clamp(1.8rem,3.4vw,2.9rem);
  color:var(--chalk-yellow);margin-bottom:1rem;line-height:1.15;}
#big .b-line{font-family:'Kalam',cursive;font-size:clamp(1.05rem,1.7vw,1.35rem);
  color:var(--chalk);margin-bottom:.7rem;line-height:1.55;
  opacity:0;transform:translateY(8px);animation:noteIn .45s ease forwards;}
#big .b-line.k-key{color:var(--chalk-green);}
#big .b-line.k-ask{color:var(--chalk-blue);}
#big .b-line.k-num{font-family:'Caveat',cursive;font-size:clamp(1.6rem,2.8vw,2.3rem);
  color:var(--chalk-yellow);}
@keyframes noteIn{to{opacity:1;transform:none;}}

/* Notes panel */
.notes{flex:1;min-width:270px;max-width:420px;min-height:0;background:rgba(0,0,0,.28);
  border:2.5px solid #3b2a12;border-radius:16px;padding:14px;display:flex;flex-direction:column;}
.notes h3{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--chalk-yellow);
  border-bottom:1.5px dashed rgba(232,201,154,.3);padding-bottom:.4rem;margin-bottom:.7rem;}
#note-list{flex:1;min-height:0;overflow-y:auto;}
.note-item{font-family:'Kalam',cursive;font-size:1.05rem;color:var(--chalk);
  margin-bottom:.7rem;opacity:0;transform:translateY(8px);animation:noteIn .45s ease forwards;
  line-height:1.5;}
.note-item.k-title{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--chalk-yellow);}
.note-item.k-key{color:var(--chalk-green);}

/* Controls */
.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
  padding:.75rem 1.1rem;border-top:2px solid rgba(201,150,42,.35);background:rgba(0,0,0,.35);}
.c-btn{padding:.65rem 1.15rem;border-radius:11px;cursor:pointer;font-weight:700;font-size:.98rem;
  background:rgba(255,255,255,.06);border:1.6px solid rgba(232,201,154,.4);color:var(--sandal);
  font-family:'Nunito',sans-serif;}
.c-btn:hover{background:rgba(255,255,255,.14);}
.c-btn.primary{background:linear-gradient(135deg,#6B1A1A,#8f2626);color:#fff;border-color:var(--gold);}
.step-count{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--sandal);margin:0 .3rem;}

/* Loading */
#loading{position:fixed;inset:0;background:rgba(6,8,5,.93);z-index:90;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:2rem;}
#loading.show{display:flex;}
.spin{width:54px;height:54px;border:5px solid rgba(201,150,42,.25);
  border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#loading-msg{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--sandal);text-align:center;}
#loading-sub{font-size:.9rem;color:var(--sandal);opacity:.7;text-align:center;max-width:420px;}

@media(max-width:900px){
  .main{flex-direction:column;padding:10px;gap:10px;}
  .notes{max-width:none;min-width:0;max-height:34vh;}
  .stage-wrap{padding:14px;}
  .topbar h2{font-size:1.25rem;}
}

/* ═══ PRINT MATHS ON THE CONCEPT BOARD (added) ═══ */
.mr-line{ display:inline-block; line-height:1.35; color:inherit; }
.mr-line .katex{ color:inherit; font-size:1.05em; }
.mr-line .katex .frac-line{ border-bottom-width:.055em; min-height:.055em; }
.b-line .mr-line{ font-size:1em; }

/* ═══ LAYOUT A — picture beside words, note strip below, lighter board (added) ═══ */
:root{ --board-dark:#2b5a3b; --board-mid:#346a46; }
body{ background:#3a2419; }
.main{ flex-direction:column; }
#big{ justify-content:flex-start; }
#big > :first-child{ margin-top:auto; }
#big > :last-child{ margin-bottom:auto; }
#big .b-row{ display:flex; gap:26px; align-items:center; }
#big .b-pic{ flex:1.25; min-width:0; }
#big .b-txt{ flex:1; min-width:0; }
#big .b-pic svg{ max-height:56vh !important; }
#big .b-txt .b-title{ font-size:clamp(1.6rem,2.6vw,2.4rem); }
.notes{ flex:0 0 auto; max-width:none; min-width:0; max-height:84px;
  flex-direction:row; align-items:center; gap:16px; padding:10px 18px; background:rgba(0,0,0,.22); }
.notes h3{ border-bottom:none; margin:0; padding:0; white-space:nowrap; font-size:1.3rem; }
#note-list{ max-height:62px; }
.note-item{ margin-bottom:.35rem; }
/* Your Turn: one picture card per step (added) */
body.in-act .notes{ display:none; }
#big .act-mat{ font-family:'Kalam',cursive; font-size:clamp(1rem,1.5vw,1.2rem); color:var(--chalk-yellow); }
#big .act-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin:6px 0 16px; }
#big .act-card{ background:rgba(0,0,0,.18); border:1.5px solid rgba(232,201,154,.35); border-radius:12px; overflow:hidden; }
#big .act-pic{ aspect-ratio:4/3; background:rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center;
  font-family:'Kalam',cursive; color:var(--chalk-dim); font-size:.9rem; text-align:center; padding:6px; }
#big .act-pic{ position:relative; }
.rp-btn{ position:absolute; top:8px; right:8px; z-index:5; background:rgba(58,36,25,.9); color:#f3e3c3;
  border:1px solid #c9a84c; border-radius:8px; padding:5px 10px; font:600 .8rem 'Nunito',sans-serif; cursor:pointer; }
.add-pic-btn{ margin-top:18px; align-self:flex-start; background:rgba(58,36,25,.9); color:#f3e3c3;
  border:1.5px dashed #c9a84c; border-radius:10px; padding:9px 16px; font:700 .9rem 'Nunito',sans-serif; cursor:pointer; }
.add-pic-btn:disabled{ opacity:.7; cursor:wait; }
#big .b-pic .added-wrap{ position:relative; max-width:640px; margin:8px auto; border-radius:10px; overflow:hidden; }
#big .b-pic .added-wrap img{ display:block; width:100%; height:auto; max-height:58vh; object-fit:contain; }
.show-ans-btn{ margin-top:16px; align-self:flex-start; background:rgba(58,36,25,.9); color:#f5e87a;
  border:1.5px solid #c9a84c; border-radius:10px; padding:9px 16px; font:700 .95rem 'Nunito',sans-serif; cursor:pointer; }
.rp-btn:disabled{ opacity:.7; cursor:wait; }
#big .act-pic img{ width:100%; height:100%; object-fit:cover; display:block; }
#big .act-txt{ padding:10px 12px 12px; font-family:'Kalam',cursive; font-size:clamp(.98rem,1.3vw,1.12rem);
  color:var(--chalk); line-height:1.45; }
#big .act-num{ display:inline-block; min-width:26px; height:26px; line-height:26px; text-align:center; border-radius:50%;
  background:var(--gold); color:#3a2419; font-weight:700; font-family:'Nunito',sans-serif; margin-right:6px; font-size:.9rem; }
@media(max-width:900px){
  #big .b-row{ flex-direction:column; align-items:stretch; }
  .notes{ max-height:none; flex-direction:column; align-items:flex-start; }
}
</style>

<body>

<!-- ═══════════ SETUP ═══════════ -->
<div id="setup">
  <h1>Maths Concept Class</h1>
  <p class="sub">Teaches the idea, straight from the syllabus — no book upload needed</p>

  <div class="setup-card">
    <div class="fld">
      <label>Class</label>
      <select id="sel-class">
        <option value="">Select Class</option>
        <option>Class 1</option><option>Class 2</option><option>Class 3</option>
        <option>Class 4</option><option>Class 5</option><option>Class 6</option>
        <option>Class 7</option><option>Class 8</option><option>Class 9</option>
        <option>Class 10</option>
      </select>
    </div>

    <div class="fld">
      <label id="chap-label">Chapter</label>
      <div id="chap-box"><div class="muted">Select a class to see its chapters.</div></div>
    </div>

    <div class="fld">
      <label>Teaching language</label>
      <div class="chip-row" id="lang-row">
        <div class="chip on" data-lang="english">English</div>
        <div class="chip" data-lang="tamil">தமிழ்</div>
        <div class="chip" data-lang="both">EN + TA</div>
      </div>
    </div>

    <button class="start-btn" id="btn-start" disabled>Start Class</button>
  </div>
</div>

<!-- ═══════════ CLASSROOM ═══════════ -->
<div id="room">
  <div class="topbar">
    <h2>Maths Concept Class</h2>
    <span class="meta" id="hdr-meta"></span>
    <span class="grow"></span>
    <span class="tb-btn" id="btn-back">← Back</span>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div id="big"></div>
    </div>
    <div class="notes">
      <h3>On the board</h3>
      <div id="note-list"></div>
    </div>
  </div>

  <div class="controls">
    <button class="c-btn" id="btn-prev">◀ Prev</button>
    <button class="c-btn primary" id="btn-play">❚❚ Pause</button>
    <button class="c-btn" id="btn-next">Next ▶</button>
    <button class="c-btn" id="btn-replay">↻ Replay</button>
    <span class="step-count" id="step-count">Step 1 / 1</span>
    <span class="grow" style="flex:1"></span>
    <button class="c-btn" id="btn-voice">🔊 Voice</button>
    <button class="c-btn" id="btn-lang">EN</button>
    <button class="c-btn" id="btn-activity" style="display:none;">✋ Your Turn</button>
    <button class="c-btn" id="btn-practice" style="display:none;">🎯 Practice</button>
    <button class="c-btn" id="btn-new">New</button>
  </div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div id="loading-msg">Getting the class ready…</div>
  <div id="loading-sub"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Maths Concept Class — syllabus driven (NCERT Classes 1-10)

   Teaches the IDEA from the syllabus topic. It never reads the
   school's uploaded book, so the same lesson is valid for every
   school on the same board and can be generated once and shared.

   Lessons are cached server-side through /api/concept-cache, so the
   first teacher to open a chapter pays for it and everyone after
   that — every classroom, every school — reads it free.

   Chapters that already have a hand-built interactive lesson are
   handed over to maths-concept.html instead of being AI-generated.
   ════════════════════════════════════════════════════════════════ */

var LESSON_VER = 'v7';          // v7 = stays on its own chapter; hands-on matched to the chapter; no trig examples elsewhere

var CLS = '', LANG = 'english';
var CHAPTER = null;             // the selected row from syllabus_chapters
var CHAPTERS = [];
var STEPS = [], IDX = 0, PLAYING = false, VOICE_ON = true, SEQ = 0;

function $(id){ return document.getElementById(id); }

/* ── Chapters that already have a better hand-built lesson ──
   Key: class number + '|' + chapter number. Value: the topic name
   understood by maths-concept.html. Add to this list as more
   hand-built lessons are made. Everything not listed is AI-taught. */
var RICH_MAP = {
  '1|2':  'plane',    // What is Long? What is Round? (Shapes)
  '1|4':  'numbers',  // Making 10 (Numbers 10 to 20)
  '1|9':  'patterns', // Utsav (Patterns)
  '2|1':  'groups',   // A Day at the Beach (Counting in Groups)
  '2|2':  'shapes',   // Shapes Around Us (3D Shapes)
  '2|4':  'plane',    // Shadow Story (Togalu) (2D Shapes)
  '2|5':  'plane'     // Playing with Lines
};
function classNum(cls){ var m = String(cls||'').match(/(\d+)/); return m ? m[1] : ''; }
function richTopicFor(cls, chNum){
  return RICH_MAP[classNum(cls) + '|' + String(chNum||'')] || null;
}

/* ════════ SYLLABUS ════════ */
async function loadChapters(cls){
  var box = $('chap-box');
  box.innerHTML = '<div class="muted">Loading chapters…</div>';
  CHAPTER = null; CHAPTERS = []; $('btn-start').disabled = true;

  var d = null;
  try {
    var r = await fetch('/api/syllabus', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'chapters', board:'NCERT', cls: cls, subject:'Maths' })
    });
    d = await r.json();
  } catch(e){}

  if(!d || !d.ok || !d.chapters || !d.chapters.length){
    box.innerHTML = '<div class="muted">No chapters found for this class yet.</div>';
    return;
  }

  CHAPTERS = d.chapters;
  var html = '', lastGroup = null;
  CHAPTERS.forEach(function(c, i){
    var group = c.part || c.theme_or_group || null;
    if(group && group !== lastGroup){
      html += '<div class="theme-hd">' + esc(group) + '</div>';
      lastGroup = group;
    }
    var rich = richTopicFor(cls, c.chapter_number);
    html += '<div class="chap" data-i="' + i + '">'
          +   '<div class="chap-num">' + esc(c.chapter_number || '·') + '</div>'
          +   '<div><div class="chap-t">' + esc(c.chapter_title)
          +     (rich ? '<span class="chap-rich">interactive</span>' : '')
          +   '</div>'
          +   (c.book_name ? '<div class="chap-sub">' + esc(c.book_name) + '</div>' : '')
          +   '</div></div>';
  });
  box.innerHTML = html;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ════════ HAND-BUILT HANDOFF ════════ */
function handOffToRich(topic){
  var payload = {
    cls: CLS,
    chapter: CHAPTER ? CHAPTER.chapter_title : '',
    lessonText: '',
    lang: LANG,
    forceTopic: topic
  };
  try { sessionStorage.setItem('mcx_autostart', JSON.stringify(payload)); } catch(e){}
  try { sessionStorage.setItem('mcx_returnUrl', window.location.href); } catch(e){}
  window.location.href = 'maths-concept.html';
}

/* ════════ BOOK TEXT ════════
   If this chapter's NCERT book has been uploaded in Super Admin, the lesson
   is taught from the book's own words and examples. If not, the lesson is
   built from the chapter name exactly as before — nothing breaks either way. */
var CH_TEXT = '';
var CH_MATCH = '';   // which library chapter the text came from

async function loadChapterText(){
  CH_TEXT = '';
  try {
    var r = await fetch('/api/syllabus', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'chapter_text', board:'NCERT', cls: CLS, subject:'Maths',
        chapter_number: CHAPTER ? CHAPTER.chapter_number : '',
        chapter_title:  CHAPTER ? CHAPTER.chapter_title  : ''
      })
    });
    var d = await r.json();
    if(d && d.found && d.text){ CH_TEXT = String(d.text); CH_MATCH = String(d.matched_title || ''); }
  } catch(e){}
  return CH_TEXT;
}

/* ════════ LESSON BUILDING ════════ */
function cacheTopicKey(){
  // Stable across schools and wording: class + chapter number + title.
  return 'ch' + String(CHAPTER.chapter_number || '') + '__'
       + String(CHAPTER.chapter_title || '').toLowerCase().replace(/\s+/g,'-');
}

// A lesson taught from the book is a different lesson from one taught from
// the chapter name, so each is saved separately.
function lessonVer(){
  if(!CH_TEXT) return LESSON_VER;
  var tag = CH_MATCH.toLowerCase().replace(/[^a-z0-9]+/g,'').substring(0,14);
  return LESSON_VER + '-b-' + tag;
}

async function getSavedLesson(){
  try {
    var r = await fetch('/api/concept-cache', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'get', board:'NCERT', cls: CLS, subject:'Maths',
        topic: cacheTopicKey(), lang: LANG, ver: lessonVer()
      })
    });
    var d = await r.json();
    if(d && d.found && d.map && d.map.steps && d.map.steps.length) return d.map.steps;
  } catch(e){}
  return null;
}

function saveLesson(steps){
  try {
    fetch('/api/concept-cache', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'save', board:'NCERT', cls: CLS, subject:'Maths',
        topic: cacheTopicKey(), lang: LANG, ver: lessonVer(),
        narration: { steps: steps }
      })
    }).catch(function(){});
  } catch(e){}
}

function langInstruction(){
  if(LANG === 'tamil'){
    return 'Write say_ta in Tamil script, BUT keep every maths and textbook word in English '
         + 'letters exactly as printed in the book (number, fraction, angle, triangle, square, '
         + 'multiply, divide, area, perimeter). Never write those words in Tamil script. '
         + 'Also fill say_en with the plain English version.';
  }
  if(LANG === 'both'){
    return 'Fill BOTH say_en (simple Indian classroom English) and say_ta (Tamil script, but '
         + 'keeping every maths and textbook word in English letters exactly as printed).';
  }
  return 'Write say_en in simple Indian classroom English. Leave say_ta as an empty string.';
}

async function buildLesson(){

      system: 'You return ONLY a valid JSON array. No markdown fences, no preamble, no text after the array.',
      messages: [{ role:'user', content: prompt }],
      max_tokens: 10000
    })
  });
  var d = await r.json();
  if(d && (d.type === 'error' || d.error)){
    throw new Error(typeof d.error === 'string' ? d.error : (d.message || 'AI error'));

  if(Array.isArray(d.content)) txt = d.content.map(function(x){ return x.text || ''; }).join('');

/* ════════ VOICE ════════ */
var mcAudio = null, mcSeq = 0;
function stopAudio(){ if(mcAudio){ try{ mcAudio.pause(); }catch(e){} mcAudio = null; } }

function speakBrowser(text, lang){
  return new Promise(function(res){
    if(!VOICE_ON || !('speechSynthesis' in window)) return res();
    try { window.speechSynthesis.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (lang === 'tamil') ? 'ta-IN' : 'en-IN';
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = function(){ res(); };
    u.onerror = function(){ res(); };
    window.speechSynthesis.speak(u);
    setTimeout(res, Math.min(22000, 1600 + text.length * 62));
  });
}

function speakAsync(text, lang){
  if(!VOICE_ON || !text || !String(text).trim()) return Promise.resolve();
  var my = ++mcSeq;
  try { window.speechSynthesis.cancel(); } catch(e){}
  stopAudio();
  return fetch('/api/voice-class', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: String(text), cls: CLS })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(my !== mcSeq || !VOICE_ON) return;
    if(d && d.audio_b64){
      return new Promise(function(res){
        stopAudio();
        mcAudio = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
        mcAudio.onended = function(){ mcAudio = null; res(); };
        mcAudio.onerror = function(){ res(); };
        mcAudio.play().catch(function(){ speakBrowser(text, lang).then(res); });
      });
    }
    return speakBrowser(text, lang);
  }).catch(function(){ return speakBrowser(text, lang); });
}

async function speakStep(step){
  if(LANG === 'both'){
    if(step.say_en) await speakAsync(step.say_en, 'english');
    if(step.say_ta) await speakAsync(step.say_ta, 'tamil');
  } else if(LANG === 'tamil'){
    await speakAsync(step.say_ta || step.say_en, 'tamil');
  } else {
    await speakAsync(step.say_en, 'english');
  }
}

function kindClass(kind){
  return kind === 'key' ? 'k-key'
       : kind === 'ask' ? 'k-ask'
       : kind === 'number' ? 'k-num' : '';
}

function addNote(cls, text, animate){
  if(!text) return;
  var d = document.createElement('div');
  d.className = 'note-item ' + (cls || '');
  if(animate === false) d.style.animation = 'none';
  d.textContent = text;
  $('note-list').appendChild(d);
}

/* Rebuild the board notes for steps 0..upto.
   Rebuilding rather than appending means Prev, Next and Replay always
   leave exactly one copy of each line — a teacher moves back and forth
   constantly, and duplicated notes look broken on a projector. */
function rebuildNotes(upto){
  var nl = $('note-list');
  nl.innerHTML = '';
  addNote('k-title', CHAPTER.chapter_title, false);
  for(var k = 0; k <= upto && k < STEPS.length; k++){
    var st = STEPS[k];
    if(st.note) addNote(st.kind === 'key' ? 'k-key' : '', st.note, (k === upto));
  }
  nl.scrollTop = nl.scrollHeight;
}

// ═══════════════════════════════════════════
// PRINT MATHS RENDERER  (added — nothing above is changed)
// Converts the plain-text maths we already generate into properly drawn
// maths: stacked fractions, square roots that stretch, real exponents.
// The AI still writes plain text ("40/2"), so every other part of this
// file — speech, rough work, matrices, figures — is untouched, and
// lessons already sitting in the cache render correctly straight away.
// If KaTeX is unavailable or a line cannot be parsed, we silently fall
// back to the original chalk writer.
// ═══════════════════════════════════════════
var MR_SUP = { '\u00b2':'2','\u00b3':'3','\u00b9':'1','\u2070':'0','\u2074':'4',
               '\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9' };

var MR_SYM = [
  ['\u00d7','\\times '], ['\u00f7','\\div '], ['\u2212','-'],
  ['\u03c0','\\pi '], ['\u00b0','^{\\circ}'],
  ['\u2264','\\leq '], ['\u2265','\\geq '], ['\u2260','\\neq '],
  ['\u2248','\\approx '], ['\u2261','\\equiv '], ['\u00b1','\\pm '],
  ['\u2234','\\therefore '], ['\u2235','\\because '],
  ['\u21d2','\\Rightarrow '], ['\u2192','\\to '], ['\u21d4','\\Leftrightarrow '],
  ['\u2220','\\angle '], ['\u2225','\\parallel '], ['\u22a5','\\perp '],
  ['\u0394','\\triangle '], ['\u03b8','\\theta '], ['\u03b1','\\alpha '],
  ['\u03b2','\\beta '], ['\u03b3','\\gamma '], ['\u03bb','\\lambda '],
  ['\u03bc','\\mu '], ['\u03c3','\\sigma '], ['\u03a3','\\Sigma '],
  ['\u221e','\\infty '], ['\u2032',"'"]
];

var MR_OPTS = { throwOnError: true, displayMode: false, strict: false,
                trust: function(ctx){ return ctx.command === '\\htmlClass'; } };

var MR_FUNCS = 'sin|cos|tan|cot|sec|cosec|csc|sinh|cosh|tanh|log|ln|lim|max|min|gcd|lcm';

// Superscript characters (x²) become real exponents.
function mrNormSup(s){
  return s.replace(/[\u00b2\u00b3\u00b9\u2070\u2074-\u2079]+/g, function(run){
    var out = '';
    for(var i = 0; i < run.length; i++) out += (MR_SUP[run.charAt(i)] || '');
    return out ? ('^{' + out + '}') : '';
  });
}

// Walk backwards from a slash to find the whole numerator.
// Absorbs bracket groups, exponent groups and identifier characters,
// and stops at + - = space etc. so "x + 1/x" gives 1, not "x + 1".
function mrLeft(s, i){
  var j = i - 1, absorbed = false, d, k;
  while(j >= 0 && s.charAt(j) === ' ') j--;
  var end = j + 1;
  while(j >= 0){
    var c = s.charAt(j);
    if(c === ')'){
      d = 1; j--;
      while(j >= 0 && d > 0){ k = s.charAt(j); if(k === ')') d++; else if(k === '(') d--; j--; }
      absorbed = true; continue;
    }
    if(c === '}'){
      d = 1; j--;
      while(j >= 0 && d > 0){ k = s.charAt(j); if(k === '}') d++; else if(k === '{') d--; j--; }
      if(j >= 0 && s.charAt(j) === '^') j--;
      absorbed = true; continue;
    }
    if(/[A-Za-z0-9._]/.test(c)){ j--; absorbed = true; continue; }
    break;
  }
  return absorbed ? { start: j + 1, end: end } : null;
}

// Walk forwards from a slash to find the whole denominator.
function mrRight(s, i){
  var j = i + 1, absorbed = false, d, k;
  while(j < s.length && s.charAt(j) === ' ') j++;
  var start = j;
  while(j < s.length){
    var c = s.charAt(j);
    if(c === '('){
      d = 1; j++;
      while(j < s.length && d > 0){ k = s.charAt(j); if(k === '(') d++; else if(k === ')') d--; j++; }
      absorbed = true; continue;
    }
    if(c === '^' && s.charAt(j + 1) === '{'){
      j += 2; d = 1;
      while(j < s.length && d > 0){ k = s.charAt(j); if(k === '{') d++; else if(k === '}') d--; j++; }
      absorbed = true; continue;
    }
    if(/[A-Za-z0-9._]/.test(c)){ j++; absorbed = true; continue; }
    break;
  }
  return absorbed ? { start: start, end: j } : null;
}

// Strip one layer of outer brackets: "(x+1)" -> "x+1"
function mrUnwrap(t){
  t = t.trim();
  if(t.length > 1 && t.charAt(0) === '(' && t.charAt(t.length - 1) === ')'){
    var d = 0;
    for(var i = 0; i < t.length; i++){
      if(t.charAt(i) === '(') d++;
      else if(t.charAt(i) === ')'){ d--; if(d === 0 && i < t.length - 1) return t; }
    }
    return t.substring(1, t.length - 1);
  }
  return t;
}

// Every a/b becomes a stacked fraction, innermost handled by repetition.
function mrFractions(s){
  var guard = 0, from = 0;
  while(guard++ < 24){
    var i = s.indexOf('/', from);
    if(i < 0) break;
    var L = mrLeft(s, i), R = mrRight(s, i);
    // A slash we cannot turn into a fraction is left exactly as it is and
    // skipped over. Rewriting it here used to leave a slash behind, which the
    // next pass found again and wrapped once more, 24 times deep.
    if(!L || !R){ from = i + 1; continue; }
    var num = mrUnwrap(s.substring(L.start, L.end));
    var den = mrUnwrap(s.substring(R.start, R.end));
    s = s.substring(0, L.start) + '\\frac{' + num + '}{' + den + '}' + s.substring(R.end);
  }
  return s;
}

// Square roots: √16, √(x+1), √x
function mrRoots(s){
  var guard = 0;
  while(guard++ < 12){
    var i = s.indexOf('\u221a');
    if(i < 0) break;
    var R = mrRight(s, i);
    if(!R){ s = s.substring(0, i) + '\\surd ' + s.substring(i + 1); continue; }
    var body = mrUnwrap(s.substring(R.start, R.end));
    s = s.substring(0, i) + '\\sqrt{' + body + '}' + s.substring(R.end);
  }
  return s;
}

// Main converter. Plain classroom maths in, LaTeX out.
// slots (optional) = [{slot:'0', text:'(x\u00b2+1)'}] — every occurrence of
// each piece is wrapped in a class so the marker layer can measure it.
function mathToLatex(src, slots){
  var s = String(src == null ? '' : src);
  if(!s.trim()) return '';
  var plain = mrConvert(s);
  if(slots && slots.length){
    var tagged = mrTagged(s, slots);
    // Tagging splits the line at the target, which can cut a fraction or a
    // root in half. If the tagged version has lost any, throw it away and
    // render plainly; the mark then falls back to the whole line.
    if(tagged && mrCount(tagged, '\\frac') >= mrCount(plain, '\\frac')
              && mrCount(tagged, '\\sqrt') >= mrCount(plain, '\\sqrt')){
      return tagged;
    }
  }
  return plain;
}

function mrCount(s, needle){
  return String(s).split(needle).length - 1;
}

// Split the source around the pieces to be tagged, convert each part on its
// own, and wrap the tagged parts. Returns null if nothing could be located.
function mrTagged(s, slots){
  var hits = [];
  for(var i = 0; i < slots.length; i++){
    var t = String(slots[i].text || '').trim();
    if(!t) continue;
    var from = 0, at;
    while((at = s.indexOf(t, from)) >= 0){
      hits.push({ start: at, end: at + t.length, slot: slots[i].slot });
      from = at + t.length;
      if(hits.length > 12) break;
    }
  }
  if(!hits.length) return null;
  // Marks matter more than pointer segments, so on an overlap the mark wins.
  hits.sort(function(a, b){
    if(a.start !== b.start) return a.start - b.start;
    var as = a.slot.charAt(0) === 's' ? 1 : 0;
    var bs = b.slot.charAt(0) === 's' ? 1 : 0;
    if(as !== bs) return as - bs;
    return (b.end - b.start) - (a.end - a.start);
  });
  var keep = [], lastEnd = -1;
  for(var j = 0; j < hits.length; j++){
    if(hits[j].start >= lastEnd){ keep.push(hits[j]); lastEnd = hits[j].end; }
  }
  var out = '', pos = 0;
  for(var k = 0; k < keep.length; k++){
    var h = keep[k];
    if(h.start > pos) out += mrConvert(s.substring(pos, h.start));
    var inner = mrConvert(s.substring(h.start, h.end));
    if(!inner) return null;
    out += '\\htmlClass{mk-t' + h.slot + '}{' + inner + '}';
    pos = h.end;
  }
  if(pos < s.length) out += mrConvert(s.substring(pos));
  return out;
}

// The conversion itself, on a whole string or on one piece of one.
function mrConvert(src){
  var s = String(src == null ? '' : src);
  if(!s.trim()) return s.length ? '\\;' : '';
  s = mrNormSup(s);
  s = s.replace(new RegExp('\\b(' + MR_FUNCS + ')\\b', 'gi'), function(m){ return '\\' + m.toLowerCase() + ' '; });
  s = mrRoots(s);
  s = mrFractions(s);
  for(var i = 0; i < MR_SYM.length; i++){
    s = s.split(MR_SYM[i][0]).join(MR_SYM[i][1]);
  }
  // English words on the board (e.g. "Sum = 820") must stay upright,
  // not be read as a product of italic letters.
  s = s.replace(/(\\[a-zA-Z]+)|([A-Za-z]{2,}(?:[ \-][A-Za-z]+)*)/g, function(m, cmd, word, offset){
    if(cmd) return m;
    var gap = (offset > 0 && s.charAt(offset - 1) === ' ') ? '\\,' : '';
    return gap + '\\text{' + word + '}';
  });
  s = s.replace(/[%&#$]/g, function(c){ return '\\' + c; });
  return s;
}

// True when a line has something worth drawing properly.
// "25x tan(32)" or "12 x 0.839": x between numbers is a times sign.
// "2x + 3" (algebra) is left alone.
function timesSign(text){
  return String(text || '').replace(/(\d|\))\s*x\s+(?=[\d(a-zA-Z])/g, '$1 × ');
}
// A long sentence stays as chalk writing; printed maths does not wrap
// and would run off the board.
function printMathFits(text){
  var t = String(text || '');
  var words = (t.match(/[A-Za-z]{3,}/g) || []).length;
  return t.length <= 60 && words <= 5;
}
function isQuizStep(s){
  return s && (s.kind === 'ask' || /check|question|try it|your turn to/i.test(String(s.title || '')));
}

function needsPrintMath(text){
  var t = String(text || '');
  return /[\/\u221a\u00b2\u00b3\u2074-\u2079\u00b0\u03c0\u00d7\u00f7]/.test(t);
}

// Render one line as real maths, revealed left to right like writing.
// Resolves when the reveal finishes. Returns false if it could not render,
// so the caller can fall back to the original chalk writer.
function katexWrite(el, text, charDelayMs, slots){
  if(!el) return null;
  if(typeof katex === 'undefined' || !katex.render) return null;
  var raw = String(text || '');
  if(!raw.trim()) return null;
  var tex;
  try { tex = mathToLatex(raw, slots); } catch(e){ tex = null; }
  if(!tex && slots){ try { tex = mathToLatex(raw); } catch(e){ tex = null; } }
  if(!tex) return null;
  var inner = document.createElement('span');
  try {
    katex.render(tex, inner, MR_OPTS);
  } catch(e){
    // A tagged render can fail if a target straddles a fraction; retry plain.
    if(slots){
      try { katex.render(mathToLatex(raw), inner, MR_OPTS); } catch(e2){ return null; }
    } else { return null; }
  }
  if(!inner.querySelector('.katex')) return null;
  el.innerHTML = '';
  inner.className = 'mr-line mr-reveal';
  var ms = Math.max(700, Math.min(4200, raw.length * (charDelayMs || 90) * 0.55));
  inner.style.setProperty('--mr-dur', ms + 'ms');
  el.appendChild(inner);
  return new Promise(function(resolve){ setTimeout(resolve, ms + 60); });
}

// Same, but with no animation — used when jumping straight to a step.
function katexSet(el, text, slots){
  if(!el) return false;
  if(typeof katex === 'undefined' || !katex.render) return false;
  var raw = String(text || '');
  if(!raw.trim()){ el.innerHTML = ''; return true; }
  var tex;
  try { tex = mathToLatex(raw, slots); } catch(e){ tex = null; }
  if(!tex && slots){ try { tex = mathToLatex(raw); } catch(e){ tex = null; } }
  if(!tex) return false;
  var inner = document.createElement('span');
  try {
    katex.render(tex, inner, MR_OPTS);
  } catch(e){
    if(slots){
      try { katex.render(mathToLatex(raw), inner, MR_OPTS); } catch(e2){ return false; }
    } else { return false; }
  }
  if(!inner.querySelector('.katex')) return false;
  inner.className = 'mr-line';
  el.innerHTML = '';
  el.appendChild(inner);
  return true;
}

async function runStep(i){
  if(i < 0 || i >= STEPS.length) return;
  IDX = i;
  window._IN_ACT = false;
  document.body.classList.remove('in-act');
  var my = ++SEQ;
  var s = STEPS[i];

  $('step-count').textContent = 'Step ' + (i + 1) + ' / ' + STEPS.length;

  var big = $('big');
  big.innerHTML = '';
  big.scrollTop = 0;
  if(big.parentElement) big.parentElement.scrollTop = 0;
  if(s.title){
    var t = document.createElement('div');
    t.className = 'b-title'; t.textContent = s.title;
    big.appendChild(t);
  }
  var quizStep = isQuizStep(s), hiddenAns = [];
  (s.board || []).forEach(function(line, n){
    line = timesSign(line);
    var d = document.createElement('div');
    d.className = 'b-line ' + kindClass(s.kind);
    d.style.animationDelay = (n * 0.13) + 's';
    if(quizStep && /^\s*(answer|ans)\s*[:\-]/i.test(line)){ d.style.display = 'none'; hiddenAns.push(d); }
    // Lines with fractions, roots or powers are drawn as real maths.
    // Anything else, or any failure, keeps the original plain text.
    var drawn = false;
    if(needsPrintMath(line) && printMathFits(line)){
      try { drawn = katexSet(d, line); } catch(e){ drawn = false; }
    }
    if(!drawn) d.textContent = line;
    big.appendChild(d);
  });
  // A check question: the class tries first, the teacher then shows the answer.
  if(hiddenAns.length){
    var sa = document.createElement('button');
    sa.className = 'show-ans-btn';
    sa.textContent = '👁 Show answer';
    sa.onclick = function(){ hiddenAns.forEach(function(x){ x.style.display = ''; }); sa.remove(); };
    big.appendChild(sa);
  }

  if(s.draw){
    // Layout A: picture on the left, the step's words beside it.
    var row = document.createElement('div'); row.className = 'b-row';
    var pic = document.createElement('div'); pic.className = 'b-pic';
    var txt = document.createElement('div'); txt.className = 'b-txt';
    while(big.firstChild) txt.appendChild(big.firstChild);
    row.appendChild(pic); row.appendChild(txt);
    big.appendChild(row);
    try { renderDrawing(s.draw, pic); } catch(e){}
  } else {
    // No drawing: show a picture the super admin has added, if any.
    addedStepPicture(s, big);
  }

  rebuildNotes(i);

  await speakStep(s);
  if(my !== SEQ) return;

  // A question step stops here. The class answers aloud, then the teacher
  // presses on. Without this the questions scroll past unanswered.
  if(s.kind === 'ask' && PLAYING && IDX < STEPS.length - 1){
    PLAYING = false;
    $('btn-play').textContent = '▶ Play';
    var gate = document.createElement('div');
    gate.className = 'b-line k-ask';
    gate.style.cssText = 'margin-top:18px;cursor:pointer;text-decoration:underline;';
    gate.textContent = 'Class answered — carry on ▶';
    gate.onclick = function(){ PLAYING = true; $('btn-play').textContent = '❚❚ Pause'; goNext(); };
    big.appendChild(gate);
    return;
  }

  if(PLAYING && IDX < STEPS.length - 1){
    setTimeout(function(){ if(my === SEQ && PLAYING) runStep(IDX + 1); }, 550);
  } else if(IDX >= STEPS.length - 1){
    PLAYING = false; $('btn-play').textContent = '▶ Play';
    // The lesson always ends with the class doing it themselves.
    if(window._ACTIVITY) setTimeout(function(){ if(my === SEQ) openActivity(); }, 900);
  }
}

function playPause(){
  PLAYING = !PLAYING;
  $('btn-play').textContent = PLAYING ? '❚❚ Pause' : '▶ Play';
  if(PLAYING) runStep(IDX);
  else { SEQ++; stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function goNext(){
  if(IDX < STEPS.length - 1){ SEQ++; stopAudio(); runStep(IDX + 1); }
  else if(window._ACTIVITY && !window._IN_ACT){ openActivity(); }   // last step → Your Turn
}
function goPrev(){
  if(window._IN_ACT){ SEQ++; stopAudio(); runStep(IDX); return; }  // Your Turn → back to last step
  if(IDX > 0){ SEQ++; stopAudio(); runStep(IDX - 1); }
}
function replay(){ SEQ++; stopAudio(); runStep(IDX); }


/* ════════════════════════════════════════════════════════════════
   BOARD DRAWINGS
   A step may carry a `draw` object. The AI chooses the shape and the
   numbers; this code draws it properly, in chalk, on the blackboard.
   The AI never writes the picture itself — a maths diagram has to be
   exact, and a drawn one always is.

   Shapes:
     elevation      — a person looking up (or down) at something tall
     right_triangle — a right triangle with the angle marked
     number_line    — a line with marks and highlights
     circle_angle   — two arms from a centre with the arc between them
     parts_bar      — a bar cut into equal parts, some shaded

   Any step with draw.interactive = true gets a slider the class can
   move, so they watch the angle and the numbers change together.
   ════════════════════════════════════════════════════════════════ */

var CHALK = '#f3e9b5', CHALK2 = '#bfe3c4', CHALK3 = '#ffd9a0';

function svgEl(name, attrs){
  var e = document.createElementNS('http://www.w3.org/2000/svg', name);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function svgText(x, y, str, size, fill, anchor){
  var t = svgEl('text', { x:x, y:y, fill: fill || CHALK, 'font-size': size || 15,
    'font-family':"'Patrick Hand','Comic Sans MS',cursive", 'text-anchor': anchor || 'middle' });
  t.textContent = str;
  return t;
}
function deg(r){ return r * 180 / Math.PI; }
function rad(d){ return d * Math.PI / 180; }

/* ── a person, drawn small and plain ── */
function chalkPerson(g, x, groundY, h){
  h = h || 34;
  var head = h * 0.22;
  g.appendChild(svgEl('circle', { cx:x, cy:groundY - h, r:head, fill:'none', stroke:CHALK, 'stroke-width':2 }));
  g.appendChild(svgEl('line', { x1:x, y1:groundY - h + head, x2:x, y2:groundY - h*0.35, stroke:CHALK, 'stroke-width':2 }));
  g.appendChild(svgEl('line', { x1:x - h*0.22, y1:groundY - h*0.62, x2:x + h*0.22, y2:groundY - h*0.62, stroke:CHALK, 'stroke-width':2 }));
  g.appendChild(svgEl('line', { x1:x, y1:groundY - h*0.35, x2:x - h*0.2, y2:groundY, stroke:CHALK, 'stroke-width':2 }));
  g.appendChild(svgEl('line', { x1:x, y1:groundY - h*0.35, x2:x + h*0.2, y2:groundY, stroke:CHALK, 'stroke-width':2 }));
}

/* ── angle arc between two directions from a point ── */
function angleArc(g, cx, cy, r, a1, a2, colour){
  var x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
  var x2 = cx + r * Math.cos(a2), y2 = cy - r * Math.sin(a2);
  g.appendChild(svgEl('path', {
    d: 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 0 0 ' + x2 + ' ' + y2,
    fill:'none', stroke: colour || CHALK3, 'stroke-width':2
  }));
}

/* ── 1. ELEVATION / DEPRESSION SCENE ── */
function drawElevation(spec, state){
  var W = 620, H = 300, ground = 250, left = 70, right = 520;
  var dist   = state.dist   != null ? state.dist   : (parseFloat(spec.distance) || 30);
  var height = state.height != null ? state.height : (parseFloat(spec.height)   || 20);
  var down   = (spec.mode === 'down' || spec.mode === 'depression');
  // The angle on the board is the one the class uses, so the drawing is built
  // from it (not from a rounded answer), and the side being found shows "?".
  var unknown  = String(spec.unknown || '').toLowerCase();
  var givenAng = parseFloat(spec.angle_deg);
  var useGiven = !isNaN(givenAng) && givenAng > 0 && givenAng < 90 && state.dist == null && state.height == null;
  if(useGiven){
    if(unknown === 'distance' || (spec.distance == null && spec.height != null)) dist = height / Math.tan(rad(givenAng));
    else height = dist * Math.tan(rad(givenAng));
  }

  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:330px;display:block;margin:6px auto;' });

  // ground
  svg.appendChild(svgEl('line', { x1:20, y1:ground, x2:600, y2:ground, stroke:CHALK, 'stroke-width':2 }));

  // the tall thing, drawn to the shape's real proportions
  var pxPerUnit = Math.min((right - left) / Math.max(dist, 1), 170 / Math.max(height, 1));
  var objX = left + dist * pxPerUnit;
  if(objX > right) { pxPerUnit = (right - left) / Math.max(dist, 1); objX = right; }
  var topY = ground - height * pxPerUnit;

  var eyeX = down ? objX : left;
  var eyeY = down ? topY : ground;   // from the ground, so the angle matches height / distance
  var farX = down ? left : objX;
  var farY = down ? ground : topY;

  // the object itself
  svg.appendChild(svgEl('line', { x1:objX, y1:ground, x2:objX, y2:topY, stroke:CHALK2, 'stroke-width':3 }));
  svg.appendChild(svgEl('line', { x1:objX - 12, y1:topY, x2:objX + 12, y2:topY, stroke:CHALK2, 'stroke-width':3 }));

  // horizontal from the eye, and the line of sight
  svg.appendChild(svgEl('line', { x1:eyeX, y1:eyeY, x2: down ? left : objX, y2:eyeY,
    stroke:CHALK, 'stroke-width':1.5, 'stroke-dasharray':'6 5', opacity:'0.75' }));
  svg.appendChild(svgEl('line', { x1:eyeX, y1:eyeY, x2:farX, y2:farY, stroke:CHALK3, 'stroke-width':2.5 }));

  // the angle at the eye
  var dx = farX - eyeX, dy = eyeY - farY;
  var theta = Math.atan2(Math.abs(dy), Math.abs(dx));
  var base = down ? (dx < 0 ? Math.PI : 0) : 0;
  var to   = down ? (dx < 0 ? Math.PI + theta : -theta) : theta;
  angleArc(svg, eyeX, eyeY, 34, base, to);
  var shownAng = useGiven ? Math.round(givenAng) : Math.round(deg(theta));
  svg.appendChild(svgText(eyeX + (down ? -52 : 46), eyeY + (down ? 20 : -12),
    shownAng + '°', 16, CHALK3));

  // Looking up: the person stands on the ground. Looking down: the person
  // stands on top, which is what "angle of depression" means.
  if(down) chalkPerson(svg, objX, topY, 26);
  else     chalkPerson(svg, left, ground, 30);

  // labels
  var dTxt = unknown === 'distance' ? '?' : elevNum(dist) + (spec.unit || ' m');
  var hTxt = unknown === 'height'   ? '?' : elevNum(height) + (spec.unit || ' m');
  svg.appendChild(svgText((left + objX) / 2, ground + 22,
    elevLabel(spec.distance_label, 'distance', dTxt), 14, CHALK));
  svg.appendChild(svgText(objX + 60, (ground + topY) / 2,
    elevLabel(spec.height_label, 'height', hTxt), 14, CHALK2, 'middle'));
  if(spec.object_label){
    // Looking up, the label belongs at the top of the tall thing.
    // Looking down, it belongs on the ground where that thing actually is.
    if(down) svg.appendChild(svgText(left, ground + 22, spec.object_label, 14, CHALK2));
    else     svg.appendChild(svgText(objX, topY - 30, spec.object_label, 14, CHALK2));
  }

  return { svg: svg, theta: shownAng, dist: dist, height: height, dTxt: dTxt, hTxt: hTxt,
           unknown: unknown };
}

// 15.6 stays 15.6; 21.0 becomes 21.
function elevNum(n){
  return Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);
}
// A label that already carries a number, "=" or "?" is shown as given,
// so nothing is written twice ("30 m = 30 m").
function elevLabel(lbl, fallback, valueTxt){
  var L = String(lbl || '').trim();
  if(/[0-9=?]/.test(L)) return L;
  return (L || fallback) + ' = ' + valueTxt;
}

/* ── 2. RIGHT TRIANGLE ── */
function drawRightTriangle(spec, state){
  var W = 560, H = 300;
  var angle = state.angle != null ? state.angle : (parseFloat(spec.angle_deg) || 35);
  angle = Math.max(10, Math.min(80, angle));
  var bx = 90, by = 245, baseLen = 330;
  var h = baseLen * Math.tan(rad(angle));
  if(h > 190){ h = 190; baseLen = h / Math.tan(rad(angle)); }
  var topX = bx + baseLen, topY = by - h;

  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:320px;display:block;margin:6px auto;' });

  svg.appendChild(svgEl('polygon', {
    points: bx + ',' + by + ' ' + (bx + baseLen) + ',' + by + ' ' + topX + ',' + topY,
    fill:'none', stroke:CHALK, 'stroke-width':2.5
  }));

  // the little square at the right angle
  svg.appendChild(svgEl('polyline', {
    points: (bx + baseLen - 16) + ',' + by + ' ' + (bx + baseLen - 16) + ',' + (by - 16) + ' ' + (bx + baseLen) + ',' + (by - 16),
    fill:'none', stroke:CHALK2, 'stroke-width':2
  }));

  angleArc(svg, bx, by, 40, 0, rad(angle));
  svg.appendChild(svgText(bx + 54, by - 12, Math.round(angle) + '°', 16, CHALK3, 'start'));

  svg.appendChild(svgText(bx + baseLen / 2, by + 24, spec.base_label || 'base', 14, CHALK));
  svg.appendChild(svgText(bx + baseLen + 46, by - h / 2, spec.height_label || 'height', 14, CHALK2));
  svg.appendChild(svgText((bx + topX) / 2 - 24, by - h / 2 - 12, spec.hyp_label || '', 14, CHALK3));

  return { svg: svg, angle: angle };
}

/* ── ANGLE FINDER (clinometer), drawn in chalk ──
   Always correct: the thread hangs straight down whatever the tilt, and
   the reading where it crosses is 90 minus the angle of elevation. */
function drawClinometer(spec, state){
  var W = 620, H = 330;
  var a = state.angle != null ? state.angle : (parseFloat(spec.angle_deg) || 30);
  a = Math.max(10, Math.min(80, Math.round(a)));
  var reading = 90 - a;
  var cx = 250, cy = 140, r = 105;
  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:46vh;display:block;margin:6px auto;' });

  // line of sight, carried on past the straw toward the top of the tall thing
  var ex = Math.cos(rad(a)), ey = -Math.sin(rad(a));
  svg.appendChild(svgEl('line', { x1: cx + 135 * ex, y1: cy + 135 * ey, x2: cx + 300 * ex, y2: cy + 300 * ey,
    stroke: CHALK, 'stroke-width': 1.5, 'stroke-dasharray': '6 5' }));
  svg.appendChild(svgText(cx + 300 * ex + 6, cy + 300 * ey + 4, 'to the top', 13, CHALK, 'start'));

  // protractor and straw, tilted together
  var g = svgEl('g', { transform: 'rotate(' + (-a) + ' ' + cx + ' ' + cy + ')' });
  g.appendChild(svgEl('path', { d: 'M' + (cx - r) + ',' + cy + ' A' + r + ',' + r + ' 0 0 0 ' + (cx + r) + ',' + cy + ' Z',
    fill: 'rgba(255,217,160,0.10)', stroke: CHALK3, 'stroke-width': 2 }));
  for(var t = 0; t <= 180; t += 10){
    var px = cx - r * Math.cos(rad(t)), py = cy + r * Math.sin(rad(t));
    var k = (t % 30 === 0) ? 0.86 : 0.92;
    g.appendChild(svgEl('line', { x1: cx - r * k * Math.cos(rad(t)), y1: cy + r * k * Math.sin(rad(t)),
      x2: px, y2: py, stroke: CHALK3, 'stroke-width': 1.5 }));
    if(t % 30 === 0){
      g.appendChild(svgText(cx - r * 0.72 * Math.cos(rad(t)), cy + r * 0.72 * Math.sin(rad(t)) + 4,
        String(t), 11, CHALK3));
    }
  }
  g.appendChild(svgEl('line', { x1: cx - r - 12, y1: cy - 5, x2: cx + r + 12, y2: cy - 5,
    stroke: '#ff9a6b', 'stroke-width': 7, 'stroke-linecap': 'round' }));
  svg.appendChild(g);

  // thread and stone: straight down, whatever the tilt
  svg.appendChild(svgEl('line', { x1: cx, y1: cy, x2: cx, y2: cy + 150, stroke: CHALK, 'stroke-width': 2 }));
  svg.appendChild(svgEl('circle', { cx: cx, cy: cy, r: 3.5, fill: CHALK }));
  svg.appendChild(svgEl('circle', { cx: cx, cy: cy + 160, r: 10, fill: 'rgba(243,233,181,0.35)', stroke: CHALK, 'stroke-width': 1.5 }));

  // labels
  var eyeX = cx - (r + 12) * Math.cos(rad(a)), eyeY = cy + (r + 12) * Math.sin(rad(a));
  svg.appendChild(svgText(eyeX - 8, eyeY + 18, 'eye here', 13, CHALK, 'end'));
  svg.appendChild(svgText(cx + 14, cy + r + 28, 'partner reads ' + reading + ' where the thread crosses', 13, CHALK2, 'start'));
  svg.appendChild(svgText(cx + 22, cy + 162, 'thread hangs straight down', 12, CHALK, 'start'));
  svg.appendChild(svgText(455, 205, 'angle of elevation', 14, CHALK3, 'start'));
  svg.appendChild(svgText(455, 228, '= 90 − ' + reading + ' = ' + a + '°', 16, CHALK3, 'start'));
  svg.appendChild(svgText(455, 252, 'straw on the straight edge', 12, CHALK, 'start'));

  return { svg: svg, angle: a };
}

/* ── PLAIN REAL PHOTO (no lines on it) ──
   Same picture style as the Your Turn cards, so the super admin can
   Replace it the same way. */
function drawRealPhoto(spec, host){
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;max-width:640px;margin:8px auto;border-radius:10px;overflow:hidden;';
  host.appendChild(wrap);
  var msg = document.createElement('div');
  msg.className = 'b-line';
  msg.style.cssText = 'text-align:center;opacity:0.7;padding:20px 0;';
  msg.textContent = 'Getting the picture…';
  wrap.appendChild(msg);

  var q = String(spec.scene || spec.photo || '').trim();
  if(q.length < 3){ msg.textContent = ''; return; }
  var ctx = 'Class ' + CLS + ' maths concept: ' + (CHAPTER ? (CHAPTER.chapter_title || '') : '');

  fetch('/api/gen-image', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ query: q, context: ctx, mode:'activity-step' })
  }).then(function(r){ return r.json(); }).then(function(d){
    var u = d && d.images && d.images[0] && d.images[0].url;
    if(!u){ msg.textContent = 'Picture not available' + (d && d.note ? ' (' + d.note + ')' : ''); return; }
    var img = document.createElement('img');
    img.alt = q;
    img.style.cssText = 'display:block;width:100%;height:auto;max-height:58vh;object-fit:contain;';
    img.onload = function(){ msg.remove(); };
    img.onerror = function(){ msg.textContent = 'Picture not available (it did not load)'; };
    img.src = u;
    wrap.appendChild(img);
    addReplaceButton(wrap, { query: q, context: ctx, mode:'activity-step' },
      function(nu){ img.src = nu; }, !!(d && d.admin));
  }).catch(function(e){ msg.textContent = 'Picture not available (' + (e.message || 'could not reach the picture service') + ')'; });
}

/* ── 3. NUMBER LINE ── */
function drawNumberLine(spec){
  var W = 620, H = 130, y = 70, x0 = 50, x1 = 570;
  var from = parseFloat(spec.from), to = parseFloat(spec.to);
  if(isNaN(from)) from = 0; if(isNaN(to)) to = 10;
  if(to <= from) to = from + 10;
  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:150px;display:block;margin:6px auto;' });
  svg.appendChild(svgEl('line', { x1:x0, y1:y, x2:x1, y2:y, stroke:CHALK, 'stroke-width':2.5 }));

  var marks = Array.isArray(spec.marks) && spec.marks.length ? spec.marks : null;
  if(!marks){
    marks = [];
    var stepv = (to - from) / 10;
    for(var v = from; v <= to + 0.0001; v += stepv) marks.push(Math.round(v * 100) / 100);
  }
  var hi = Array.isArray(spec.highlight) ? spec.highlight.map(Number) : [];
  marks.forEach(function(m){
    var v = Number(m);
    var x = x0 + (v - from) / (to - from) * (x1 - x0);
    var on = hi.some(function(z){ return Math.abs(z - v) < 0.0001; });
    svg.appendChild(svgEl('line', { x1:x, y1:y - (on ? 16 : 9), x2:x, y2:y + (on ? 16 : 9),
      stroke: on ? CHALK3 : CHALK, 'stroke-width': on ? 3 : 1.8 }));
    svg.appendChild(svgText(x, y + 34, String(m), on ? 15 : 13, on ? CHALK3 : CHALK));
  });
  return { svg: svg };
}

/* ── 4. CIRCLE WITH AN ANGLE ── */
function drawCircleAngle(spec, state){
  var W = 420, H = 300, cx = 210, cy = 165, r = 110;
  var angle = state.angle != null ? state.angle : (parseFloat(spec.angle_deg) || 60);
  angle = Math.max(5, Math.min(355, angle));
  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:300px;display:block;margin:6px auto;' });
  svg.appendChild(svgEl('circle', { cx:cx, cy:cy, r:r, fill:'none', stroke:CHALK, 'stroke-width':2, opacity:'0.6' }));
  svg.appendChild(svgEl('line', { x1:cx, y1:cy, x2:cx + r, y2:cy, stroke:CHALK, 'stroke-width':2.5 }));
  var ex = cx + r * Math.cos(rad(angle)), ey = cy - r * Math.sin(rad(angle));
  svg.appendChild(svgEl('line', { x1:cx, y1:cy, x2:ex, y2:ey, stroke:CHALK2, 'stroke-width':2.5 }));
  angleArc(svg, cx, cy, 44, 0, rad(angle));
  svg.appendChild(svgText(cx + 66, cy - 22, Math.round(angle) + '°', 16, CHALK3, 'start'));
  if(spec.radius_label) svg.appendChild(svgText(cx + r / 2, cy + 22, spec.radius_label, 13, CHALK));
  return { svg: svg, angle: angle };
}

/* ── 5. BAR CUT INTO PARTS (fractions) ── */
function drawPartsBar(spec){
  var W = 600, H = 150, x0 = 50, y0 = 45, bw = 500, bh = 60;
  var parts = Math.max(1, Math.min(20, parseInt(spec.parts, 10) || 4));
  var shaded = Math.max(0, Math.min(parts, parseInt(spec.shaded, 10) || 0));
  var svg = svgEl('svg', { viewBox:'0 0 ' + W + ' ' + H, width:'100%', height:'auto',
    style:'max-height:170px;display:block;margin:6px auto;' });
  var pw = bw / parts;
  for(var i = 0; i < parts; i++){
    svg.appendChild(svgEl('rect', { x:x0 + i * pw, y:y0, width:pw, height:bh,
      fill: i < shaded ? CHALK3 : 'none', opacity: i < shaded ? '0.45' : '1',
      stroke:CHALK, 'stroke-width':2 }));
  }
  if(spec.label) svg.appendChild(svgText(W / 2, y0 + bh + 30, spec.label, 15, CHALK));
  return { svg: svg };
}

/* ── 6. PHOTO SCENE ──
   A real-looking photograph of the actual thing — a gopuram, a water tank,
   an escalator — with the triangle, the angle and the labels drawn on top
   of it, the way a teacher draws on a photo. The picture is generated once
   and then served from the cache to every school for free.

   The lines are placed by percentage of the frame, and the picture is
   composed to match: ground along the bottom, the tall thing on the right,
   open space on the left. */
function drawPhotoScene(spec, host){
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;max-width:640px;margin:8px auto;border-radius:10px;overflow:hidden;';
  host.appendChild(wrap);

  var msg = document.createElement('div');
  msg.className = 'b-line';
  msg.style.cssText = 'text-align:center;opacity:0.7;padding:20px 0;';
  msg.textContent = 'Getting the picture…';
  wrap.appendChild(msg);

  var img = document.createElement('img');
  img.style.cssText = 'display:block;width:100%;height:auto;';

  function overlay(){
    var a = spec.anchors || {};
    var base = a.base || [70, 88];      // foot of the tall thing
    var top  = a.top  || [70, 18];      // its top
    var eye  = a.eye  || [14, 72];      // where the person's eyes are
    eye = [eye[0], base[1]];            // ground must be flat: eye and foot on one level
    var svg = svgEl('svg', { viewBox:'0 0 100 100', preserveAspectRatio:'none',
      style:'position:absolute;inset:0;width:100%;height:100%;' });

    function L(x1,y1,x2,y2,col,w,dash){
      var o = { x1:x1, y1:y1, x2:x2, y2:y2, stroke:col, 'stroke-width':w,
                'vector-effect':'non-scaling-stroke', 'stroke-linecap':'round' };
      if(dash) o['stroke-dasharray'] = dash;
      svg.appendChild(svgEl('line', o));
    }
    // the three sides: up the object, along the ground, and the line of sight
    L(base[0], base[1], top[0], top[1], '#ff5fd2', 5);
    L(eye[0],  eye[1],  base[0], base[1], '#ffffff', 5);
    L(eye[0],  eye[1],  top[0],  top[1],  '#ffffff', 5);
    // small square at the foot: this is a right-angled triangle
    L(base[0] - 4, base[1],     base[0] - 4, base[1] - 5, '#ffffff', 3);
    L(base[0] - 4, base[1] - 5, base[0],     base[1] - 5, '#ffffff', 3);

    // the angle, marked at the eye
    var dx = (base[0] - eye[0]), dy = (eye[1] - top[1]);
    var ang = spec.angle_deg != null ? spec.angle_deg
              : Math.round(Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI);
    var at = svgEl('text', { x: eye[0] + 7, y: eye[1] - 3, fill:'#ffffff',
      'font-size':'6', 'font-family':"'Patrick Hand',cursive", 'text-anchor':'start' });
    at.textContent = ang + '°';
    svg.appendChild(at);

    function T(x, y, str, col){
      if(!str) return;
      var e = svgEl('text', { x:x, y:y, fill: col || '#ffffff', 'font-size':'6.5',
        'font-family':"'Patrick Hand',cursive", 'text-anchor':'middle' });
      e.textContent = str;
      svg.appendChild(e);
    }
    var lb = spec.labels || {};
    var sightTxt = lb.sight;
    // Saved lessons may carry a number on BOTH the slanted line and the ground,
    // which is impossible. Keep the ground; hide the slanted one.
    if(sightTxt && /\d/.test(sightTxt) && lb.ground && /\d/.test(lb.ground)) sightTxt = '';
    T((eye[0] + top[0]) / 2, (eye[1] + top[1]) / 2 - 4, sightTxt);            // e.g. "10 feet"
    T(base[0] + 6, (base[1] + top[1]) / 2, lb.height, '#ff9be8');             // e.g. "?"
    T((eye[0] + base[0]) / 2, base[1] + 6, lb.ground);                        // e.g. "35 m"
    wrap.appendChild(svg);
  }

  // If the photo cannot be had, fall back to the chalk scene so the step is
  // never left empty, and say plainly what went wrong — a silent failure here
  // cost us a whole round of guessing once already.
  function fallback(why){
    console.warn('[photo_scene] ' + why, spec);
    wrap.remove();
    var note = document.createElement('div');
    note.className = 'b-line';
    note.style.cssText = 'text-align:center;opacity:0.6;font-size:0.8rem;';
    note.textContent = 'Photo unavailable (' + why + ') — drawn instead';
    host.appendChild(note);
    var alt = {
      type:'elevation', mode:'up',
      distance: spec.ground_m || 30, height: spec.height_m || 20,
      object_label: spec.object_label || '',
      distance_label:'distance', height_label:'height', unit:' m'
    };
    var out = drawElevation(alt, {});
    host.appendChild(out.svg);
  }

  img.onload = function(){ msg.remove(); overlay(); };
  img.onerror = function(){ fallback('picture did not load'); };

  var q = String(spec.photo || spec.scene || spec.query || '').trim();
  if(q.length < 3){ fallback('no scene described'); return; }

  fetch('/api/gen-image', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ query: q, context: 'maths concept class ' + CLS, mode:'maths-photo' })
  }).then(function(r){ return r.json(); }).then(function(d){
    var u = d && d.images && d.images[0] && d.images[0].url;
    if(!u){ fallback(d && d.note ? d.note : 'the drawing service returned nothing'); return; }
    img.src = u;
    wrap.appendChild(img);
    addReplaceButton(wrap, { query: q, context: 'maths concept class ' + CLS, mode:'maths-photo' },
      function(nu){
        wrap.querySelectorAll('svg').forEach(function(s){ s.remove(); });  // lines are redrawn on the new picture
        img.src = nu;
      }, !!(d && d.admin));
  }).catch(function(e){ fallback(e.message || 'could not reach the drawing service'); });
}

/* ── the one entry point the lesson uses ── */
function renderDrawing(spec, host){
  if(!spec || !spec.type) return;
  var state = {};
  var box = document.createElement('div');
  box.style.cssText = 'margin-top:10px;';
  host.appendChild(box);

  function paint(){
    box.innerHTML = '';
    var out;
    if(spec.type === 'photo_scene')          { drawPhotoScene(spec, box); return; }
    else if(spec.type === 'real_photo')      { drawRealPhoto(spec, box); return; }
    else if(spec.type === 'clinometer')      out = drawClinometer(spec, state);
    else if(spec.type === 'elevation')       out = drawElevation(spec, state);
    else if(spec.type === 'right_triangle')  out = drawRightTriangle(spec, state);
    else if(spec.type === 'number_line')     out = drawNumberLine(spec);
    else if(spec.type === 'circle_angle')    out = drawCircleAngle(spec, state);
    else if(spec.type === 'parts_bar')       out = drawPartsBar(spec);
    else return;
    box.appendChild(out.svg);

    // A line of working under the picture, so the numbers on screen and
    // the numbers in the child's notebook are the same numbers.
    if(spec.type === 'elevation'){
      var t = Math.round(out.theta);
      var line = document.createElement('div');
      line.className = 'b-line k-num';
      line.style.cssText = 'text-align:center;margin-top:2px;';
      line.textContent = 'tan ' + t + '° = '
        + (out.unknown === 'height' ? '?' : elevNum(out.height)) + ' / '
        + (out.unknown === 'distance' ? '?' : elevNum(out.dist));
      box.appendChild(line);
    }

    if(spec.interactive){
      var ctrl = document.createElement('div');
      ctrl.style.cssText = 'display:flex;align-items:center;gap:12px;justify-content:center;margin-top:10px;';
      var lab = document.createElement('span');
      lab.className = 'b-line';
      lab.style.cssText = 'font-size:0.9rem;opacity:0.9;';
      var sl = document.createElement('input');
      sl.type = 'range';
      sl.style.cssText = 'width:260px;accent-color:#f3e9b5;cursor:pointer;';

      if(spec.type === 'elevation'){
        lab.textContent = spec.slider_label || 'Move closer or further';
        sl.min = 5; sl.max = Math.max(60, Math.round((parseFloat(spec.distance) || 30) * 2));
        sl.value = Math.round(state.dist != null ? state.dist : (parseFloat(spec.distance) || 30));
        sl.oninput = function(){ state.dist = parseFloat(sl.value); paint(); };
      } else {
        lab.textContent = spec.slider_label || 'Change the angle';
        sl.min = 10; sl.max = 80;
        sl.value = Math.round(state.angle != null ? state.angle : (parseFloat(spec.angle_deg) || 35));
        sl.oninput = function(){ state.angle = parseFloat(sl.value); paint(); };
      }
      ctrl.appendChild(lab); ctrl.appendChild(sl);
      box.appendChild(ctrl);
    }
  }
  paint();
}

/* ════════ YOUR TURN — the activity students do themselves ════════
   Every lesson ends with something the class actually does with their
   hands: make it, measure it, write it down, compare answers with the
   other pairs. The comparing is the part that teaches — that is where
   children see why two groups got different heights for the same wall. */
function renderActivity(act){
  var big = $('big');
  big.innerHTML = '';

  var t = document.createElement('div');
  t.className = 'b-title';
  t.textContent = '✋ Your Turn — ' + (act.title || 'Do it yourself');
  big.appendChild(t);

  function line(txt, cls, indent){
    var d = document.createElement('div');
    d.className = 'b-line ' + (cls || '');
    if(indent) d.style.paddingLeft = '18px';
    d.textContent = txt;
    big.appendChild(d);
    return d;
  }

  if(act.materials && act.materials.length){
    line('You need: ' + act.materials.join(', '), 'act-mat');
  }
  // Each step as a card with a real photo of children doing it, so the
  // class can copy exactly how the things are held and used.
  var grid = document.createElement('div');
  grid.className = 'act-grid';
  big.appendChild(grid);
  (act.steps || []).forEach(function(st, i){
    var card = document.createElement('div'); card.className = 'act-card';
    var pic  = document.createElement('div'); pic.className  = 'act-pic';
    pic.textContent = 'Getting the picture…';
    var txt  = document.createElement('div'); txt.className  = 'act-txt';
    var num  = document.createElement('span'); num.className = 'act-num'; num.textContent = (i + 1);
    txt.appendChild(num); txt.appendChild(document.createTextNode(st));
    card.appendChild(pic); card.appendChild(txt); grid.appendChild(card);
    activityPicture(st, act.title || '', pic);
  });
  if(act.record) line('Write down: ' + act.record, 'k-key');
  if(act.check)  line('Check: ' + act.check, 'k-ask');
  line('Now compare your answer with the other pairs. Are they the same? Why not?', 'k-ask');

  $('step-count').textContent = 'Your Turn';
}

/* One picture per activity step, made once and then served from the cache.
   The same request is never sent twice in one visit, so opening Your Turn
   again while a picture is still being made does not pay for it twice. */
window._ACT_IMG = window._ACT_IMG || {};
/* ════════ REPLACE PICTURE — super admin only ════════
   The super admin can swap any AI picture for a checked one (e.g. from
   Firefly). The server checks the login too, so this button is only a
   convenience; nobody else can actually replace a picture. */
function isSuperAdmin(){
  try { return localStorage.getItem('dss_role') === 'super_admin' && !!localStorage.getItem('dss_session'); }
  catch(e){ return false; }
}

// Big Firefly files are shrunk to 1280px JPEG in the browser before upload.
function shrinkToJpeg(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function(){
      var s = Math.min(1, 1280 / Math.max(im.width, im.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      var g = cv.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.86));
    };
    im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('That file could not be opened as a picture.')); };
    im.src = url;
  });
}

function addReplaceButton(host, req, onDone, checked){
  if(!isSuperAdmin()) return;
  var b = document.createElement('button');
  b.className = 'rp-btn';
  function label(ok){ b.textContent = (ok ? '✓ Checked · ' : '') + '🔄 Replace picture'; }
  label(checked);
  b.onclick = function(ev){
    ev.stopPropagation();
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      b.disabled = true; b.textContent = 'Uploading…';
      shrinkToJpeg(f).then(function(b64){
        return fetch('/api/gen-image', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'x-dss-session': localStorage.getItem('dss_session') || '' },
          body: JSON.stringify({ action:'replace', query:req.query, context:req.context, mode:req.mode, image_base64:b64 })
        });
      }).then(function(r){ return r.json(); }).then(function(d){
        var u = d && d.images && d.images[0] && d.images[0].url;
        b.disabled = false;
        if(!u){ label(checked); alert(d && d.error ? d.error : 'The picture could not be replaced.'); return; }
        checked = true; label(true);
        onDone(/^https?:/.test(u) ? u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now() : u);   // show the new picture straight away
      }).catch(function(e){
        b.disabled = false; label(checked);
        alert('Could not replace the picture: ' + (e && e.message ? e.message : e));
      });
    };
    inp.click();
  };
  host.appendChild(b);
}

/* ════════ ADD PICTURE — super admin only ════════
   A step with no picture can be given one by the super admin. It is saved
   once and every school sees it. Other steps only LOOK for it; the server
   never draws these with AI, so looking costs nothing. */
window._ADDED_IMG = window._ADDED_IMG || {};

function addedStepReq(s){
  return {
    query: 'Class ' + CLS + ' | ' + (CHAPTER ? (CHAPTER.chapter_title || '') : '') + ' | '
           + (s.title || '') + ' | ' + ((s.board && s.board[0]) || ''),
    context: 'maths concept step',
    mode: 'added-step'
  };
}

function uploadAdminPicture(req, file){
  return shrinkToJpeg(file).then(function(b64){
    return fetch('/api/gen-image', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-dss-session': localStorage.getItem('dss_session') || '' },
      body: JSON.stringify({ action:'replace', query:req.query, context:req.context, mode:req.mode, image_base64:b64 })
    });
  }).then(function(r){ return r.json(); }).then(function(d){
    var u = d && d.images && d.images[0] && d.images[0].url;
    if(!u) throw new Error(d && d.error ? d.error : 'The picture could not be saved.');
    return /^https?:/.test(u) ? u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now() : u;
  });
}

function showAddedPicture(big, req, url){
  if(big.querySelector('.b-row')) return;
  var add = big.querySelector('.add-pic-btn'); if(add) add.remove();
  var row = document.createElement('div'); row.className = 'b-row';
  var pic = document.createElement('div'); pic.className = 'b-pic';
  var txt = document.createElement('div'); txt.className = 'b-txt';
  while(big.firstChild) txt.appendChild(big.firstChild);
  row.appendChild(pic); row.appendChild(txt);
  big.appendChild(row);
  var wrap = document.createElement('div'); wrap.className = 'added-wrap';
  var img = document.createElement('img'); img.alt = ''; img.src = url;
  wrap.appendChild(img); pic.appendChild(wrap);
  addReplaceButton(wrap, req, function(nu){
    window._ADDED_IMG[req.query] = Promise.resolve(nu);
    img.src = nu;
  }, true);
}

function addedStepPicture(s, big){
  var req = addedStepReq(s);
  var mySeq = SEQ;
  if(!window._ADDED_IMG[req.query]){
    window._ADDED_IMG[req.query] = fetch('/api/gen-image', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'lookup', query:req.query, context:req.context, mode:req.mode })
    }).then(function(r){ return r.json(); })
      .then(function(d){ return (d && d.images && d.images[0] && d.images[0].url) || null; })
      .catch(function(){ return null; });
  }
  window._ADDED_IMG[req.query].then(function(u){
    if(mySeq !== SEQ) return;                       // teacher already moved on
    if(u){ showAddedPicture(big, req, u); return; }
    if(!isSuperAdmin()) return;
    var b = document.createElement('button');
    b.className = 'add-pic-btn';
    b.textContent = '➕ Add picture';
    b.onclick = function(){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = function(){
        var f = inp.files && inp.files[0]; if(!f) return;
        b.disabled = true; b.textContent = 'Uploading…';
        uploadAdminPicture(req, f).then(function(nu){
          window._ADDED_IMG[req.query] = Promise.resolve(nu);
          showAddedPicture(big, req, nu);
        }).catch(function(e){
          b.disabled = false; b.textContent = '➕ Add picture';
          alert('Could not add the picture: ' + (e && e.message ? e.message : e));
        });
      };
      inp.click();
    };
    big.appendChild(b);
  });
}

function activityPicture(stepText, title, host){
  var q = String(stepText || '').trim();
  if(q.length < 3){ host.textContent = ''; return; }
  var ctx = 'Class ' + CLS + ' maths activity: ' + title;
  var key = q + '|' + ctx;
  if(!window._ACT_IMG[key]){
    window._ACT_IMG[key] = fetch('/api/gen-image', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, context: ctx, mode:'activity-step' })
    }).then(function(r){ return r.json(); })
      .then(function(d){ return (d && d.images && d.images[0] && d.images[0].url) || null; })
      .catch(function(){ return null; });
  }
  window._ACT_IMG[key].then(function(u){
    if(!u){ delete window._ACT_IMG[key]; host.textContent = 'Picture not available'; return; }
    var img = document.createElement('img');
    img.alt = q;
    img.onload  = function(){
      host.textContent = ''; host.appendChild(img);
      addReplaceButton(host, { query: q, context: ctx, mode:'activity-step' }, function(nu){
        window._ACT_IMG[key] = Promise.resolve(nu);
        img.src = nu;
      }, /-admin\.jpg/.test(img.src));
    };
    img.onerror = function(){ host.textContent = 'Picture not available'; };
    img.src = u;
  });
}

function openActivity(){
  var act = window._ACTIVITY;
  if(!act) return;
  PLAYING = false; SEQ++; stopAudio();
  try { window.speechSynthesis.cancel(); } catch(e){}
  $('btn-play').textContent = '▶ Play';
  renderActivity(act);
  window._IN_ACT = true;
  document.body.classList.add('in-act');
  $('step-count').textContent = '✋ Your Turn';
  try { $('big').scrollTop = 0; } catch(e){}
}

/* ════════ PRACTICE QUESTIONS ════════
   Shown only in the Foundation panel (Class 6 up). Four questions on the
   same chapter, in competitive-exam style, asked one at a time with the
   reason shown after the class answers. Questions are written once and
   saved for every school, exactly like the lesson itself. */
var PRACTICE = null, PQ_IDX = 0;

function practiceTopicKey(){ return cacheTopicKey() + '__q'; }

async function getSavedPractice(){
  try {
    var r = await fetch('/api/concept-cache', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'get', board:'NCERT', cls: CLS, subject:'Maths',
        topic: practiceTopicKey(), lang:'english', ver: lessonVer()
      })
    });
    var d = await r.json();
    if(d && d.found && d.map && d.map.steps && d.map.steps.length) return d.map.steps;
  } catch(e){}
  return null;
}

function savePractice(qs){
