      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'save', board:'NCERT', cls: CLS, subject:'Maths',
        topic: practiceTopicKey(), lang:'english', ver: lessonVer(),
        narration: { steps: qs }
      })
    }).catch(function(){});
  } catch(e){}
}

async function buildPractice(){
  var chTitle = CHAPTER ? (CHAPTER.chapter_title || '') : '';
  var prompt =
      'You are setting foundation-level practice questions for a ' + CLS + ' student in India '
    + 'who is starting to prepare for JEE and NEET.\n'
    + 'Chapter: "' + chTitle + '" (NCERT).\n\n'
    + (CH_TEXT ? ('Use only ideas that appear in this chapter text:\n' + CH_TEXT.substring(0, 5000) + '\n\n') : '')
    + 'Write 4 multiple-choice questions on this chapter.\n'
    + 'RULES:\n'
    + '1. Test understanding of the idea, not memory of a line from the book.\n'
    + '2. Question 1 easy, questions 2 and 3 medium, question 4 harder — the kind that '
    + 'makes a student think, but still fair for ' + CLS + '.\n'
    + '3. Exactly 4 options each. Wrong options must be believable mistakes a student '
    + 'really makes, not silly answers.\n'
    + '4. Plain text only. No markdown, no LaTeX. Keep each option under 40 characters.\n'
    + '5. why — one short sentence saying why the right answer is right.\n\n'
    + 'For each question give: q, options (array of 4), answer (0 to 3), why.\n'
    + 'Return ONLY a JSON array. Start with [ and end with ].';

  var r = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: 'You return ONLY a valid JSON array. No markdown fences, no preamble, no text after the array.',
      messages: [{ role:'user', content: prompt }],
      max_tokens: 1800
    })
  });
  var d = await r.json();
  // Same reply shapes the lesson builder already handles.
  var txt = '';
  if(Array.isArray(d.content)) txt = d.content.map(function(x){ return x.text || ''; }).join('');
  else txt = d.completion || d.text || d.content || '';
  if(typeof txt !== 'string') txt = JSON.stringify(txt);
  txt = txt.replace(/```json/gi, '').replace(/```/g, '').trim();
  var a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if(a === -1 || b === -1) throw new Error('Questions came back in an unexpected form');
  var arr = JSON.parse(txt.substring(a, b + 1));
  return arr.filter(function(q){
    return q && q.q && Array.isArray(q.options) && q.options.length === 4;
  }).map(function(q){
    return {
      q: String(q.q),
      options: q.options.map(String),
      answer: Math.max(0, Math.min(3, parseInt(q.answer, 10) || 0)),
      why: String(q.why || '')
    };
  });
}

// Prepared quietly while the class is being taught, so pressing Practice
// at the end of the lesson opens straight away.
async function preparePractice(){
  if(CONCEPT_BAND !== 'foundation') return;
  try {
    PRACTICE = await getSavedPractice();
    if(!PRACTICE || !PRACTICE.length){
      PRACTICE = await buildPractice();
      if(PRACTICE && PRACTICE.length) savePractice(PRACTICE);
    }
  } catch(e){ PRACTICE = null; }
  var btn = $('btn-practice');
  if(btn && PRACTICE && PRACTICE.length) btn.style.display = '';
}

function openPractice(){
  if(!PRACTICE || !PRACTICE.length) return;
  PLAYING = false; SEQ++; stopAudio();
  try { window.speechSynthesis.cancel(); } catch(e){}
  $('btn-play').textContent = '▶ Play';
  PQ_IDX = 0;
  $('note-list').innerHTML = '';
  addNote('k-title', 'Practice — ' + (CHAPTER ? CHAPTER.chapter_title : ''), false);
  renderQuestion();
}

function renderQuestion(){
  var q = PRACTICE[PQ_IDX];
  if(!q) return finishPractice();
  $('step-count').textContent = 'Question ' + (PQ_IDX + 1) + ' / ' + PRACTICE.length;

  var big = $('big');
  big.innerHTML = '';

  var t = document.createElement('div');
  t.className = 'b-title';
  t.textContent = 'Practice ' + (PQ_IDX + 1);
  big.appendChild(t);

  var qd = document.createElement('div');
  qd.className = 'b-line';
  qd.textContent = q.q;
  big.appendChild(qd);

  var wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:14px;display:flex;flex-direction:column;gap:10px;';
  q.options.forEach(function(opt, i){
    var row = document.createElement('div');
    row.className = 'b-line';
    row.style.cssText = 'cursor:pointer;padding:6px 10px;border:1.5px dashed rgba(255,255,255,0.25);border-radius:8px;';
    row.textContent = 'ABCD'.charAt(i) + '.  ' + opt;
    row.onclick = function(){ answerQuestion(i, wrap); };
    wrap.appendChild(row);
  });
  big.appendChild(wrap);

  if(VOICE_ON) speakAsync(q.q, 'english');
}

function answerQuestion(picked, wrap){
  var q = PRACTICE[PQ_IDX];
  var rows = wrap.querySelectorAll('.b-line');
  rows.forEach(function(r, i){
    r.onclick = null;
    r.style.cursor = 'default';
    if(i === q.answer){ r.style.borderColor = '#7CFC98'; r.style.color = '#7CFC98'; }
    else if(i === picked){ r.style.borderColor = '#ff9b9b'; r.style.color = '#ff9b9b'; }
  });

  addNote(picked === q.answer ? 'k-key' : '', 
    (picked === q.answer ? 'Correct — ' : 'Answer: ' + 'ABCD'.charAt(q.answer) + ' — ') + q.why, true);

  var nxt = document.createElement('div');
  nxt.className = 'b-line';
  nxt.style.cssText = 'margin-top:16px;cursor:pointer;text-decoration:underline;';
  nxt.textContent = (PQ_IDX < PRACTICE.length - 1) ? 'Next question ▶' : 'Finish practice ▶';
  nxt.onclick = function(){ PQ_IDX++; stopAudio(); renderQuestion(); };
  $('big').appendChild(nxt);

  if(VOICE_ON) speakAsync(q.why, 'english');
}

function finishPractice(){
  var big = $('big');
  big.innerHTML = '';
  var t = document.createElement('div');
  t.className = 'b-title'; t.textContent = 'Well done';
  big.appendChild(t);
  var d = document.createElement('div');
  d.className = 'b-line'; d.textContent = 'That is the practice round for this chapter.';
  big.appendChild(d);
  $('step-count').textContent = 'Practice over';
}

/* ════════ START ════════ */
async function startClass(){
  // Hand-built lesson wins whenever one exists for this chapter.
  var rich = richTopicFor(CLS, CHAPTER.chapter_number);
  if(rich){ handOffToRich(rich); return; }

  $('setup').classList.add('hidden');
  $('room').classList.add('show');
  $('hdr-meta').textContent = CLS + ' · ' + CHAPTER.chapter_title;
  $('note-list').innerHTML = '';
  $('big').innerHTML = '';
  $('btn-lang').textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');

  $('loading').classList.add('show');
  $('loading-msg').textContent = 'Getting the class ready…';
  $('loading-sub').textContent = '';

  await loadChapterText();
  STEPS = await getSavedLesson();
  setTimeout(preparePractice, 1200);   // quietly, while the class is being taught

  // The activity rides on whichever step carries it.
  window._ACTIVITY = null;
  (STEPS || []).forEach(function(st){ if(st.activity) window._ACTIVITY = st.activity; });
  var ab = $('btn-activity');
  if(ab) ab.style.display = window._ACTIVITY ? '' : 'none';

  if(!STEPS){
    $('loading-sub').textContent =
      'Preparing this chapter for the first time. Once it is ready it is saved '
      + 'for every class and every school, so this wait happens only once.';
    try {
      STEPS = await buildLesson();
      saveLesson(STEPS);
    } catch(e){
      var why = (e && e.message) ? String(e.message) : 'Unknown problem';
      STEPS = [{
        id:'err', title:'Could not prepare this lesson',
        board:['Reason: ' + why.substring(0,140), 'Press Replay to try again.'],
        kind:'idea', say_en:'Sorry, I could not prepare this lesson just now. Please try again.',
        say_ta:'', note:'Error: ' + why.substring(0,140)
      }];
    }
  }

  $('loading').classList.remove('show');
  IDX = 0; PLAYING = true; $('btn-play').textContent = '❚❚ Pause';
  runStep(0);
}

/* ════════ WIRING ════════ */

/* ════════ CLASS BAND ════════
   This page is shared by two entry points:
     Teach  -> 'primary'    : Class 1 to 5, concept and activity teaching
     Foundation -> 'foundation' : Class 6 up, NCERT concepts for JEE/NEET
   Opened directly (no band saved), every class stays on the list. */
var CONCEPT_BAND = '';
try { CONCEPT_BAND = sessionStorage.getItem('concept_band') || ''; } catch(e){}

function bandClassOk(n){
  if (CONCEPT_BAND === 'foundation') return n >= 6;
  if (CONCEPT_BAND === 'primary')    return n <= 5;
  return true;
}

function applyConceptBand(){
  var sel = document.getElementById('sel-class');
  if (sel) {
    var opts = Array.prototype.slice.call(sel.options);
    opts.forEach(function(o){
      var m = String(o.value || o.text).match(/(\d+)/);
      if (!m) return;                       // keep "Select Class"
      if (!bandClassOk(parseInt(m[1], 10))) o.parentNode.removeChild(o);
    });
  }
  var sub = document.querySelector('p.sub');
  if (sub) {
    if (CONCEPT_BAND === 'foundation') sub.textContent = 'Foundation — JEE / NEET · NCERT concepts, Class 6 onwards';
    else if (CONCEPT_BAND === 'primary') sub.textContent = 'Concepts and activities for young children — no book upload needed';
  }
}

/* Foundation is a paid add-on, so the page checks the school's switch itself.
   Knowing the page link is not enough to open it. */
async function guardFoundation(){
  if (CONCEPT_BAND !== 'foundation') return;
  var schoolId = '';
  try { var u = JSON.parse(localStorage.getItem('dss_user') || '{}'); schoolId = u.school_id || u.id || ''; } catch(e){}
  if (!schoolId) return;                    // cannot tell — let the page work
  try {
    var r = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'get_school_sources', school_id: schoolId }) });
    var d = await r.json();
    if (d && d.has_foundation === true) return;
  } catch(e){ return; }                     // offline or error — let the page work
  var setup = document.getElementById('setup');
  if (setup) {
    setup.innerHTML = '<h1>Foundation — JEE / NEET</h1>'
      + '<p class="sub">This part is not included in your school\'s plan yet.</p>'
      + '<div class="setup-card"><div class="muted" style="line-height:1.8;">'
      + 'Foundation concept classes are an add-on. Ask your school administrator to have it switched on.'
      + '</div></div>';
  }
}

document.addEventListener('DOMContentLoaded', function(){
  applyConceptBand();
  guardFoundation();


  $('sel-class').addEventListener('change', function(){
    CLS = this.value;
    if(CLS) loadChapters(CLS);
    else {
      $('chap-box').innerHTML = '<div class="muted">Select a class to see its chapters.</div>';
      $('btn-start').disabled = true;
    }
  });

  $('chap-box').addEventListener('click', function(e){
    var el = e.target.closest('.chap'); if(!el) return;
    $('chap-box').querySelectorAll('.chap').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
    CHAPTER = CHAPTERS[parseInt(el.getAttribute('data-i'), 10)] || null;
    $('btn-start').disabled = !CHAPTER;
  });

  $('lang-row').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); LANG = c.getAttribute('data-lang');
  });

  $('btn-start').onclick  = function(){ if(CLS && CHAPTER) startClass(); };
  $('btn-play').onclick   = playPause;
  $('btn-next').onclick   = goNext;
  $('btn-practice').onclick = openPractice;
  $('btn-activity').onclick = openActivity;
  $('btn-prev').onclick   = goPrev;
  $('btn-replay').onclick = replay;

  $('btn-new').onclick = function(){
    SEQ++; PLAYING = false; stopAudio();
    try{ window.speechSynthesis.cancel(); }catch(e){}
    $('room').classList.remove('show');
    $('setup').classList.remove('hidden');
  };

  $('btn-voice').onclick = function(){
    VOICE_ON = !VOICE_ON;
    this.textContent = VOICE_ON ? '🔊 Voice' : '🔇 Muted';
    if(!VOICE_ON){ stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
  };

  $('btn-lang').onclick = function(){
    LANG = (LANG === 'english') ? 'tamil' : (LANG === 'tamil' ? 'both' : 'english');
    this.textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');
  };

  $('btn-back').onclick = function(){
    var url = null;
    try { url = sessionStorage.getItem('mcn_returnUrl'); } catch(e){}
    if(url){ window.location.href = url; return; }
    if(window.history.length > 1) window.history.back();
    else window.location.href = '/learnbot.html';
  };

  autostart();
});

/* ── Launched from LearnBot: pre-select the class if one is known ── */
function autostart(){
  var raw = null;
  try { raw = sessionStorage.getItem('mcn_autostart'); } catch(e){ return; }
  if(!raw) return;
  try { sessionStorage.removeItem('mcn_autostart'); } catch(e){}
  var d; try { d = JSON.parse(raw); } catch(e){ return; }

  if(d.lang === 'tamil' || d.lang === 'both'){
    LANG = d.lang;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){
      x.classList.toggle('on', x.getAttribute('data-lang') === LANG);
    });
  }
  if(d.cls){
    var sel = $('sel-class');
    for(var i = 0; i < sel.options.length; i++){
      if(sel.options[i].value === d.cls || sel.options[i].text === d.cls){
        sel.selectedIndex = i; CLS = d.cls; loadChapters(CLS); break;
      }
    }
  }
}
</script>
