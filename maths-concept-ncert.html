<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Concept Class — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Noto+Sans+Tamil:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --gold:#C9962A; --sandal:#E8C99A;
  --board-dark:#163016; --board-mid:#1b3d1b;
  --chalk:#f2efe9; --chalk-dim:#c8c4be;
  --chalk-yellow:#f5e87a; --chalk-blue:#a8d8f0;
  --chalk-red:#f4a0a0; --chalk-green:#a8e6a8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0c08;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;}
.hidden{display:none !important;}

/* ═══ SETUP ═══ */
#setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1200 0%,#080808 70%);padding:2rem 1rem;}
#setup h1{font-family:'Caveat',cursive;font-size:clamp(2.2rem,6vw,3.6rem);color:var(--gold);
  text-align:center;text-shadow:0 0 40px rgba(201,150,42,.4);}
#setup p.sub{color:var(--sandal);opacity:.85;margin:.4rem 0 1.6rem;text-align:center;}
.setup-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(201,150,42,.3);
  border-radius:18px;padding:1.5rem;width:100%;max-width:720px;}
.fld{margin-bottom:1.1rem;}
.fld label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sandal);margin-bottom:.45rem;}
.fld select{width:100%;padding:.8rem .9rem;border-radius:10px;background:#161a12;color:#fff;
  border:1.5px solid rgba(201,150,42,.35);font-family:'Nunito',sans-serif;font-size:1rem;}
.chip-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.chip{flex:1;min-width:110px;padding:.8rem .6rem;border-radius:12px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,.03);border:2px solid rgba(201,150,42,.3);color:var(--sandal);
  font-weight:700;transition:.18s;font-size:.95rem;}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--maroon);border-color:var(--gold);color:#fff;}
.start-btn{width:100%;margin-top:.4rem;padding:1rem;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#6B1A1A,#8f2626);color:#fff;font-size:1.15rem;font-weight:700;
  font-family:'Nunito',sans-serif;letter-spacing:.03em;}
.start-btn:hover{filter:brightness(1.12);}
.start-btn:disabled{opacity:.45;cursor:not-allowed;}

/* Chapter list */
#chap-box{max-height:320px;overflow-y:auto;border:1.5px solid rgba(201,150,42,.28);
  border-radius:12px;padding:.5rem;background:rgba(0,0,0,.22);}
.chap{padding:.65rem .8rem;border-radius:9px;cursor:pointer;margin-bottom:.35rem;
  border:1.6px solid transparent;display:flex;gap:.7rem;align-items:flex-start;transition:.15s;}
.chap:hover{background:rgba(255,255,255,.05);}
.chap.on{background:var(--maroon);border-color:var(--gold);}
.chap-num{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--chalk-yellow);
  min-width:30px;line-height:1.1;}
.chap-t{font-size:.95rem;color:var(--chalk);line-height:1.35;}
.chap-sub{font-size:.75rem;color:var(--sandal);opacity:.75;margin-top:.15rem;}
.chap-rich{display:inline-block;margin-left:.4rem;padding:1px 8px;border-radius:20px;
  font-size:.67rem;font-weight:700;background:rgba(201,150,42,.28);
  color:var(--chalk-yellow);border:1px solid rgba(201,150,42,.5);vertical-align:middle;}
.theme-hd{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--gold);
  padding:.5rem .6rem .2rem;border-bottom:1px dashed rgba(201,150,42,.3);margin-bottom:.4rem;}
.muted{color:var(--sandal);opacity:.7;font-size:.9rem;padding:.9rem;text-align:center;}

/* ═══ CLASSROOM ═══ */
#room{display:none;flex-direction:column;}
#room.show{display:flex;height:100vh;overflow:hidden;}
.topbar{background:linear-gradient(90deg,#4d1212,#6B1A1A);padding:.7rem 1.1rem;
  display:flex;align-items:center;gap:.8rem;border-bottom:2px solid rgba(201,150,42,.4);}
.topbar h2{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--sandal);white-space:nowrap;}
.topbar .grow{flex:1;}
.topbar .meta{font-size:.85rem;color:rgba(232,201,154,.8);}
.tb-btn{padding:.5rem .9rem;border-radius:10px;cursor:pointer;font-weight:700;font-size:.9rem;
  background:rgba(0,0,0,.25);border:1.5px solid rgba(232,201,154,.45);color:var(--sandal);}
.tb-btn:hover{background:rgba(0,0,0,.45);}

.main{flex:1;min-height:0;display:flex;gap:14px;padding:14px;align-items:stretch;}
.stage-wrap{flex:1.35;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--board-dark),var(--board-mid));
  border:3px solid #3b2a12;border-radius:16px;overflow:hidden;position:relative;padding:20px;}
#big{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;}
#big .b-title{font-family:'Caveat',cursive;font-size:clamp(1.8rem,3.4vw,2.9rem);
  color:var(--chalk-yellow);margin-bottom:1rem;line-height:1.15;}
#big .b-line{font-family:'Kalam',cursive;font-size:clamp(1.05rem,1.7vw,1.35rem);
  color:var(--chalk);margin-bottom:.7rem;line-height:1.55;
  opacity:0;transform:translateY(8px);animation:noteIn .45s ease forwards;}
#big .b-line.k-key{color:var(--chalk-green);}
#big .b-line.k-ask{color:var(--chalk-blue);}
#big .b-line.k-num{font-family:'Caveat',cursive;font-size:clamp(1.6rem,2.8vw,2.3rem);
  color:var(--chalk-yellow);}
@keyframes noteIn{to{opacity:1;transform:none;}}

/* Notes panel */
.notes{flex:1;min-width:270px;max-width:420px;min-height:0;background:rgba(0,0,0,.28);
  border:2.5px solid #3b2a12;border-radius:16px;padding:14px;display:flex;flex-direction:column;}
.notes h3{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--chalk-yellow);
  border-bottom:1.5px dashed rgba(232,201,154,.3);padding-bottom:.4rem;margin-bottom:.7rem;}
#note-list{flex:1;min-height:0;overflow-y:auto;}
.note-item{font-family:'Kalam',cursive;font-size:1.05rem;color:var(--chalk);
  margin-bottom:.7rem;opacity:0;transform:translateY(8px);animation:noteIn .45s ease forwards;
  line-height:1.5;}
.note-item.k-title{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--chalk-yellow);}
.note-item.k-key{color:var(--chalk-green);}

/* Controls */
.controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
  padding:.75rem 1.1rem;border-top:2px solid rgba(201,150,42,.35);background:rgba(0,0,0,.35);}
.c-btn{padding:.65rem 1.15rem;border-radius:11px;cursor:pointer;font-weight:700;font-size:.98rem;
  background:rgba(255,255,255,.06);border:1.6px solid rgba(232,201,154,.4);color:var(--sandal);
  font-family:'Nunito',sans-serif;}
.c-btn:hover{background:rgba(255,255,255,.14);}
.c-btn.primary{background:linear-gradient(135deg,#6B1A1A,#8f2626);color:#fff;border-color:var(--gold);}
.step-count{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--sandal);margin:0 .3rem;}

/* Loading */
#loading{position:fixed;inset:0;background:rgba(6,8,5,.93);z-index:90;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:2rem;}
#loading.show{display:flex;}
.spin{width:54px;height:54px;border:5px solid rgba(201,150,42,.25);
  border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#loading-msg{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--sandal);text-align:center;}
#loading-sub{font-size:.9rem;color:var(--sandal);opacity:.7;text-align:center;max-width:420px;}

@media(max-width:900px){
  .main{flex-direction:column;padding:10px;gap:10px;}
  .notes{max-width:none;min-width:0;max-height:34vh;}
  .stage-wrap{padding:14px;}
  .topbar h2{font-size:1.25rem;}
}

/* ═══ PRINT MATHS ON THE CONCEPT BOARD (added) ═══ */
.mr-line{ display:inline-block; line-height:1.35; color:inherit; }
.mr-line .katex{ color:inherit; font-size:1.05em; }
.mr-line .katex .frac-line{ border-bottom-width:.055em; min-height:.055em; }
.b-line .mr-line{ font-size:1em; }
</style>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- ═══════════ SETUP ═══════════ -->
<div id="setup">
  <h1>Maths Concept Class</h1>
  <p class="sub">Teaches the idea, straight from the syllabus — no book upload needed</p>

  <div class="setup-card">
    <div class="fld">
      <label>Class</label>
      <select id="sel-class">
        <option value="">Select Class</option>
        <option>Class 1</option><option>Class 2</option><option>Class 3</option>
        <option>Class 4</option><option>Class 5</option><option>Class 6</option>
        <option>Class 7</option><option>Class 8</option><option>Class 9</option>
        <option>Class 10</option>
      </select>
    </div>

    <div class="fld">
      <label id="chap-label">Chapter</label>
      <div id="chap-box"><div class="muted">Select a class to see its chapters.</div></div>
    </div>

    <div class="fld">
      <label>Teaching language</label>
      <div class="chip-row" id="lang-row">
        <div class="chip on" data-lang="english">English</div>
        <div class="chip" data-lang="tamil">தமிழ்</div>
        <div class="chip" data-lang="both">EN + TA</div>
      </div>
    </div>

    <button class="start-btn" id="btn-start" disabled>Start Class</button>
  </div>
</div>

<!-- ═══════════ CLASSROOM ═══════════ -->
<div id="room">
  <div class="topbar">
    <h2>Maths Concept Class</h2>
    <span class="meta" id="hdr-meta"></span>
    <span class="grow"></span>
    <span class="tb-btn" id="btn-back">← Back</span>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div id="big"></div>
    </div>
    <div class="notes">
      <h3>On the board</h3>
      <div id="note-list"></div>
    </div>
  </div>

  <div class="controls">
    <button class="c-btn" id="btn-prev">◀ Prev</button>
    <button class="c-btn primary" id="btn-play">❚❚ Pause</button>
    <button class="c-btn" id="btn-next">Next ▶</button>
    <button class="c-btn" id="btn-replay">↻ Replay</button>
    <span class="step-count" id="step-count">Step 1 / 1</span>
    <span class="grow" style="flex:1"></span>
    <button class="c-btn" id="btn-voice">🔊 Voice</button>
    <button class="c-btn" id="btn-lang">EN</button>
    <button class="c-btn" id="btn-new">New</button>
  </div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div id="loading-msg">Getting the class ready…</div>
  <div id="loading-sub"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Maths Concept Class — syllabus driven (NCERT Classes 1-10)

   Teaches the IDEA from the syllabus topic. It never reads the
   school's uploaded book, so the same lesson is valid for every
   school on the same board and can be generated once and shared.

   Lessons are cached server-side through /api/concept-cache, so the
   first teacher to open a chapter pays for it and everyone after
   that — every classroom, every school — reads it free.

   Chapters that already have a hand-built interactive lesson are
   handed over to maths-concept.html instead of being AI-generated.
   ════════════════════════════════════════════════════════════════ */

var LESSON_VER = 'v1';          // bump to force every lesson to regenerate

var CLS = '', LANG = 'english';
var CHAPTER = null;             // the selected row from syllabus_chapters
var CHAPTERS = [];
var STEPS = [], IDX = 0, PLAYING = false, VOICE_ON = true, SEQ = 0;

function $(id){ return document.getElementById(id); }

/* ── Chapters that already have a better hand-built lesson ──
   Key: class number + '|' + chapter number. Value: the topic name
   understood by maths-concept.html. Add to this list as more
   hand-built lessons are made. Everything not listed is AI-taught. */
var RICH_MAP = {
  '1|2':  'plane',    // What is Long? What is Round? (Shapes)
  '1|4':  'numbers',  // Making 10 (Numbers 10 to 20)
  '1|9':  'patterns', // Utsav (Patterns)
  '2|1':  'groups',   // A Day at the Beach (Counting in Groups)
  '2|2':  'shapes',   // Shapes Around Us (3D Shapes)
  '2|4':  'plane',    // Shadow Story (Togalu) (2D Shapes)
  '2|5':  'plane'     // Playing with Lines
};
function classNum(cls){ var m = String(cls||'').match(/(\d+)/); return m ? m[1] : ''; }
function richTopicFor(cls, chNum){
  return RICH_MAP[classNum(cls) + '|' + String(chNum||'')] || null;
}

/* ════════ SYLLABUS ════════ */
async function loadChapters(cls){
  var box = $('chap-box');
  box.innerHTML = '<div class="muted">Loading chapters…</div>';
  CHAPTER = null; CHAPTERS = []; $('btn-start').disabled = true;

  var d = null;
  try {
    var r = await fetch('/api/syllabus', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'chapters', board:'NCERT', cls: cls, subject:'Maths' })
    });
    d = await r.json();
  } catch(e){}

  if(!d || !d.ok || !d.chapters || !d.chapters.length){
    box.innerHTML = '<div class="muted">No chapters found for this class yet.</div>';
    return;
  }

  CHAPTERS = d.chapters;
  var html = '', lastGroup = null;
  CHAPTERS.forEach(function(c, i){
    var group = c.part || c.theme_or_group || null;
    if(group && group !== lastGroup){
      html += '<div class="theme-hd">' + esc(group) + '</div>';
      lastGroup = group;
    }
    var rich = richTopicFor(cls, c.chapter_number);
    html += '<div class="chap" data-i="' + i + '">'
          +   '<div class="chap-num">' + esc(c.chapter_number || '·') + '</div>'
          +   '<div><div class="chap-t">' + esc(c.chapter_title)
          +     (rich ? '<span class="chap-rich">interactive</span>' : '')
          +   '</div>'
          +   (c.book_name ? '<div class="chap-sub">' + esc(c.book_name) + '</div>' : '')
          +   '</div></div>';
  });
  box.innerHTML = html;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ════════ HAND-BUILT HANDOFF ════════ */
function handOffToRich(topic){
  var payload = {
    cls: CLS,
    chapter: CHAPTER ? CHAPTER.chapter_title : '',
    lessonText: '',
    lang: LANG,
    forceTopic: topic
  };
  try { sessionStorage.setItem('mcx_autostart', JSON.stringify(payload)); } catch(e){}
  try { sessionStorage.setItem('mcx_returnUrl', window.location.href); } catch(e){}
  window.location.href = 'maths-concept.html';
}

/* ════════ LESSON BUILDING ════════ */
function cacheTopicKey(){
  // Stable across schools and wording: class + chapter number + title.
  return 'ch' + String(CHAPTER.chapter_number || '') + '__'
       + String(CHAPTER.chapter_title || '').toLowerCase().replace(/\s+/g,'-');
}

async function getSavedLesson(){
  try {
    var r = await fetch('/api/concept-cache', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'get', board:'NCERT', cls: CLS, subject:'Maths',
        topic: cacheTopicKey(), lang: LANG, ver: LESSON_VER
      })
    });
    var d = await r.json();
    if(d && d.found && d.map && d.map.steps && d.map.steps.length) return d.map.steps;
  } catch(e){}
  return null;
}

function saveLesson(steps){
  try {
    fetch('/api/concept-cache', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'save', board:'NCERT', cls: CLS, subject:'Maths',
        topic: cacheTopicKey(), lang: LANG, ver: LESSON_VER,
        narration: { steps: steps }
      })
    }).catch(function(){});
  } catch(e){}
}

function langInstruction(){
  if(LANG === 'tamil'){
    return 'Write say_ta in Tamil script, BUT keep every maths and textbook word in English '
         + 'letters exactly as printed in the book (number, fraction, angle, triangle, square, '
         + 'multiply, divide, area, perimeter). Never write those words in Tamil script. '
         + 'Also fill say_en with the plain English version.';
  }
  if(LANG === 'both'){
    return 'Fill BOTH say_en (simple Indian classroom English) and say_ta (Tamil script, but '
         + 'keeping every maths and textbook word in English letters exactly as printed).';
  }
  return 'Write say_en in simple Indian classroom English. Leave say_ta as an empty string.';
}

async function buildLesson(){
  var chNum = CHAPTER.chapter_number || '';
  var chTitle = CHAPTER.chapter_title || '';
  var book = CHAPTER.book_name || '';

  var prompt =
      'You are a warm, patient Tamil Nadu school teacher taking a ' + CLS + ' maths class.\n'
    + 'Board: NCERT / CBSE. Book: "' + book + '". Chapter ' + chNum + ': "' + chTitle + '".\n\n'
    + 'Teach the CONCEPT of this chapter — the idea behind it — not the exercises from the book. '
    + 'You have not seen the book. Teach what a ' + CLS + ' child needs to understand this topic.\n\n'
    + 'Build the lesson as 8 to 14 steps. Each step is one small idea, taught in order, '
    + 'building from what the child already knows to the new idea.\n\n'
    + 'RULES:\n'
    + '1. Start from something familiar in a Tamil Nadu child\'s life before any symbol or rule.\n'
    + '2. Name the strategy before you calculate. Never state a derived number without showing how.\n'
    + '3. Ask the class a question every few steps — real questions a teacher asks aloud.\n'
    + '4. Use everyday examples: rupees, idli, bus fare, cricket, rangoli, water tank, ration shop.\n'
    + '5. Age-appropriate for ' + CLS + '. Simple words for small classes, precise terms for big ones.\n'
    + '6. ' + langInstruction() + '\n'
    + '7. No markdown, no asterisks, no LaTeX. Plain text only.\n\n'
    + 'For each step give:\n'
    + '  id     — short unique id like "s1"\n'
    + '  title  — a few words, shown large on the blackboard\n'
    + '  board  — array of 1 to 4 SHORT lines written on the board. Keep each under 60 characters.\n'
    + '  kind   — one of "idea", "key", "ask", "number" (controls the chalk colour)\n'
    + '  say_en — 2 to 4 sentences the teacher speaks aloud\n'
    + '  say_ta — the Tamil version, or "" if not needed\n'
    + '  note   — one short line for the side notes panel, or ""\n\n'
    + 'Return ONLY a JSON array. Start with [ and end with ].';

  var r = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: 'You return ONLY a valid JSON array. No markdown fences, no preamble, no text after the array.',
      messages: [{ role:'user', content: prompt }],
      max_tokens: 6000
    })
  });
  var d = await r.json();
  if(d && (d.type === 'error' || d.error)){
    throw new Error(typeof d.error === 'string' ? d.error : (d.message || 'AI error'));
  }
  var txt = '';
  if(Array.isArray(d.content)) txt = d.content.map(function(x){ return x.text || ''; }).join('');
  else txt = d.completion || d.text || d.content || '';
  txt = String(txt).replace(/```json|```/g,'').trim();
  var a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if(a < 0 || b < 0) throw new Error('Unexpected reply: ' + txt.substring(0,120));

  var arr = JSON.parse(txt.slice(a, b + 1));
  var steps = [];
  arr.forEach(function(o, i){
    if(!o) return;
    steps.push({
      id:    String(o.id || ('s' + (i + 1))),
      title: String(o.title || ''),
      board: Array.isArray(o.board) ? o.board.map(String) : (o.board ? [String(o.board)] : []),
      kind:  String(o.kind || 'idea'),
      say_en:String(o.say_en || ''),
      say_ta:String(o.say_ta || ''),
      note:  String(o.note || '')
    });
  });
  if(!steps.length) throw new Error('empty lesson');
  return steps;
}

/* ════════ VOICE ════════ */
var mcAudio = null, mcSeq = 0;
function stopAudio(){ if(mcAudio){ try{ mcAudio.pause(); }catch(e){} mcAudio = null; } }

function speakBrowser(text, lang){
  return new Promise(function(res){
    if(!VOICE_ON || !('speechSynthesis' in window)) return res();
    try { window.speechSynthesis.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (lang === 'tamil') ? 'ta-IN' : 'en-IN';
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = function(){ res(); };
    u.onerror = function(){ res(); };
    window.speechSynthesis.speak(u);
    setTimeout(res, Math.min(22000, 1600 + text.length * 62));
  });
}

function speakAsync(text, lang){
  if(!VOICE_ON || !text || !String(text).trim()) return Promise.resolve();
  var my = ++mcSeq;
  try { window.speechSynthesis.cancel(); } catch(e){}
  stopAudio();
  return fetch('/api/voice-class', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: String(text), cls: CLS })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(my !== mcSeq || !VOICE_ON) return;
    if(d && d.audio_b64){
      return new Promise(function(res){
        stopAudio();
        mcAudio = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
        mcAudio.onended = function(){ mcAudio = null; res(); };
        mcAudio.onerror = function(){ res(); };
        mcAudio.play().catch(function(){ speakBrowser(text, lang).then(res); });
      });
    }
    return speakBrowser(text, lang);
  }).catch(function(){ return speakBrowser(text, lang); });
}

async function speakStep(step){
  if(LANG === 'both'){
    if(step.say_en) await speakAsync(step.say_en, 'english');
    if(step.say_ta) await speakAsync(step.say_ta, 'tamil');
  } else if(LANG === 'tamil'){
    await speakAsync(step.say_ta || step.say_en, 'tamil');
  } else {
    await speakAsync(step.say_en, 'english');
  }
}

/* ════════ PLAYBACK ════════ */
function kindClass(kind){
  return kind === 'key' ? 'k-key'
       : kind === 'ask' ? 'k-ask'
       : kind === 'number' ? 'k-num' : '';
}

function addNote(cls, text, animate){
  if(!text) return;
  var d = document.createElement('div');
  d.className = 'note-item ' + (cls || '');
  if(animate === false) d.style.animation = 'none';
  d.textContent = text;
  $('note-list').appendChild(d);
}

/* Rebuild the board notes for steps 0..upto.
   Rebuilding rather than appending means Prev, Next and Replay always
   leave exactly one copy of each line — a teacher moves back and forth
   constantly, and duplicated notes look broken on a projector. */
function rebuildNotes(upto){
  var nl = $('note-list');
  nl.innerHTML = '';
  addNote('k-title', CHAPTER.chapter_title, false);
  for(var k = 0; k <= upto && k < STEPS.length; k++){
    var st = STEPS[k];
    if(st.note) addNote(st.kind === 'key' ? 'k-key' : '', st.note, (k === upto));
  }
  nl.scrollTop = nl.scrollHeight;
}

// ═══════════════════════════════════════════
// PRINT MATHS RENDERER  (added — nothing above is changed)
// Converts the plain-text maths we already generate into properly drawn
// maths: stacked fractions, square roots that stretch, real exponents.
// The AI still writes plain text ("40/2"), so every other part of this
// file — speech, rough work, matrices, figures — is untouched, and
// lessons already sitting in the cache render correctly straight away.
// If KaTeX is unavailable or a line cannot be parsed, we silently fall
// back to the original chalk writer.
// ═══════════════════════════════════════════
var MR_SUP = { '\u00b2':'2','\u00b3':'3','\u00b9':'1','\u2070':'0','\u2074':'4',
               '\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9' };

var MR_SYM = [
  ['\u00d7','\\times '], ['\u00f7','\\div '], ['\u2212','-'],
  ['\u03c0','\\pi '], ['\u00b0','^{\\circ}'],
  ['\u2264','\\leq '], ['\u2265','\\geq '], ['\u2260','\\neq '],
  ['\u2248','\\approx '], ['\u2261','\\equiv '], ['\u00b1','\\pm '],
  ['\u2234','\\therefore '], ['\u2235','\\because '],
  ['\u21d2','\\Rightarrow '], ['\u2192','\\to '], ['\u21d4','\\Leftrightarrow '],
  ['\u2220','\\angle '], ['\u2225','\\parallel '], ['\u22a5','\\perp '],
  ['\u0394','\\triangle '], ['\u03b8','\\theta '], ['\u03b1','\\alpha '],
  ['\u03b2','\\beta '], ['\u03b3','\\gamma '], ['\u03bb','\\lambda '],
  ['\u03bc','\\mu '], ['\u03c3','\\sigma '], ['\u03a3','\\Sigma '],
  ['\u221e','\\infty '], ['\u2032',"'"]
];

var MR_OPTS = { throwOnError: true, displayMode: false, strict: false,
                trust: function(ctx){ return ctx.command === '\\htmlClass'; } };

var MR_FUNCS = 'sin|cos|tan|cot|sec|cosec|csc|sinh|cosh|tanh|log|ln|lim|max|min|gcd|lcm';

// Superscript characters (x²) become real exponents.
function mrNormSup(s){
  return s.replace(/[\u00b2\u00b3\u00b9\u2070\u2074-\u2079]+/g, function(run){
    var out = '';
    for(var i = 0; i < run.length; i++) out += (MR_SUP[run.charAt(i)] || '');
    return out ? ('^{' + out + '}') : '';
  });
}

// Walk backwards from a slash to find the whole numerator.
// Absorbs bracket groups, exponent groups and identifier characters,
// and stops at + - = space etc. so "x + 1/x" gives 1, not "x + 1".
function mrLeft(s, i){
  var j = i - 1, absorbed = false, d, k;
  while(j >= 0 && s.charAt(j) === ' ') j--;
  var end = j + 1;
  while(j >= 0){
    var c = s.charAt(j);
    if(c === ')'){
      d = 1; j--;
      while(j >= 0 && d > 0){ k = s.charAt(j); if(k === ')') d++; else if(k === '(') d--; j--; }
      absorbed = true; continue;
    }
    if(c === '}'){
      d = 1; j--;
      while(j >= 0 && d > 0){ k = s.charAt(j); if(k === '}') d++; else if(k === '{') d--; j--; }
      if(j >= 0 && s.charAt(j) === '^') j--;
      absorbed = true; continue;
    }
    if(/[A-Za-z0-9._]/.test(c)){ j--; absorbed = true; continue; }
    break;
  }
  return absorbed ? { start: j + 1, end: end } : null;
}

// Walk forwards from a slash to find the whole denominator.
function mrRight(s, i){
  var j = i + 1, absorbed = false, d, k;
  while(j < s.length && s.charAt(j) === ' ') j++;
  var start = j;
  while(j < s.length){
    var c = s.charAt(j);
    if(c === '('){
      d = 1; j++;
      while(j < s.length && d > 0){ k = s.charAt(j); if(k === '(') d++; else if(k === ')') d--; j++; }
      absorbed = true; continue;
    }
    if(c === '^' && s.charAt(j + 1) === '{'){
      j += 2; d = 1;
      while(j < s.length && d > 0){ k = s.charAt(j); if(k === '{') d++; else if(k === '}') d--; j++; }
      absorbed = true; continue;
    }
    if(/[A-Za-z0-9._]/.test(c)){ j++; absorbed = true; continue; }
    break;
  }
  return absorbed ? { start: start, end: j } : null;
}

// Strip one layer of outer brackets: "(x+1)" -> "x+1"
function mrUnwrap(t){
  t = t.trim();
  if(t.length > 1 && t.charAt(0) === '(' && t.charAt(t.length - 1) === ')'){
    var d = 0;
    for(var i = 0; i < t.length; i++){
      if(t.charAt(i) === '(') d++;
      else if(t.charAt(i) === ')'){ d--; if(d === 0 && i < t.length - 1) return t; }
    }
    return t.substring(1, t.length - 1);
  }
  return t;
}

// Every a/b becomes a stacked fraction, innermost handled by repetition.
function mrFractions(s){
  var guard = 0;
  while(guard++ < 24){
    var i = s.indexOf('/');
    if(i < 0) break;
    var L = mrLeft(s, i), R = mrRight(s, i);
    if(!L || !R){ s = s.substring(0, i) + '\\,\\text{/}\\,' + s.substring(i + 1); continue; }
    var num = mrUnwrap(s.substring(L.start, L.end));
    var den = mrUnwrap(s.substring(R.start, R.end));
    s = s.substring(0, L.start) + '\\frac{' + num + '}{' + den + '}' + s.substring(R.end);
  }
  return s;
}

// Square roots: √16, √(x+1), √x
function mrRoots(s){
  var guard = 0;
  while(guard++ < 12){
    var i = s.indexOf('\u221a');
    if(i < 0) break;
    var R = mrRight(s, i);
    if(!R){ s = s.substring(0, i) + '\\surd ' + s.substring(i + 1); continue; }
    var body = mrUnwrap(s.substring(R.start, R.end));
    s = s.substring(0, i) + '\\sqrt{' + body + '}' + s.substring(R.end);
  }
  return s;
}

// Main converter. Plain classroom maths in, LaTeX out.
// slots (optional) = [{slot:'0', text:'(x\u00b2+1)'}] — every occurrence of
// each piece is wrapped in a class so the marker layer can measure it.
function mathToLatex(src, slots){
  var s = String(src == null ? '' : src);
  if(!s.trim()) return '';
  if(slots && slots.length){
    var tagged = mrTagged(s, slots);
    if(tagged) return tagged;
    // fall through to a plain conversion; the mark falls back to the whole line
  }
  return mrConvert(s);
}

// Split the source around the pieces to be tagged, convert each part on its
// own, and wrap the tagged parts. Returns null if nothing could be located.
function mrTagged(s, slots){
  var hits = [];
  for(var i = 0; i < slots.length; i++){
    var t = String(slots[i].text || '').trim();
    if(!t) continue;
    var from = 0, at;
    while((at = s.indexOf(t, from)) >= 0){
      hits.push({ start: at, end: at + t.length, slot: slots[i].slot });
      from = at + t.length;
      if(hits.length > 12) break;
    }
  }
  if(!hits.length) return null;
  // Marks matter more than pointer segments, so on an overlap the mark wins.
  hits.sort(function(a, b){
    if(a.start !== b.start) return a.start - b.start;
    var as = a.slot.charAt(0) === 's' ? 1 : 0;
    var bs = b.slot.charAt(0) === 's' ? 1 : 0;
    if(as !== bs) return as - bs;
    return (b.end - b.start) - (a.end - a.start);
  });
  var keep = [], lastEnd = -1;
  for(var j = 0; j < hits.length; j++){
    if(hits[j].start >= lastEnd){ keep.push(hits[j]); lastEnd = hits[j].end; }
  }
  var out = '', pos = 0;
  for(var k = 0; k < keep.length; k++){
    var h = keep[k];
    if(h.start > pos) out += mrConvert(s.substring(pos, h.start));
    var inner = mrConvert(s.substring(h.start, h.end));
    if(!inner) return null;
    out += '\\htmlClass{mk-t' + h.slot + '}{' + inner + '}';
    pos = h.end;
  }
  if(pos < s.length) out += mrConvert(s.substring(pos));
  return out;
}

// The conversion itself, on a whole string or on one piece of one.
function mrConvert(src){
  var s = String(src == null ? '' : src);
  if(!s.trim()) return s.length ? '\\;' : '';
  s = mrNormSup(s);
  s = s.replace(new RegExp('\\b(' + MR_FUNCS + ')\\b', 'gi'), function(m){ return '\\' + m.toLowerCase() + ' '; });
  s = mrRoots(s);
  s = mrFractions(s);
  for(var i = 0; i < MR_SYM.length; i++){
    s = s.split(MR_SYM[i][0]).join(MR_SYM[i][1]);
  }
  // English words on the board (e.g. "Sum = 820") must stay upright,
  // not be read as a product of italic letters.
  s = s.replace(/(\\[a-zA-Z]+)|([A-Za-z]{2,}(?:[ \-][A-Za-z]+)*)/g, function(m, cmd, word, offset){
    if(cmd) return m;
    var gap = (offset > 0 && s.charAt(offset - 1) === ' ') ? '\\,' : '';
    return gap + '\\text{' + word + '}';
  });
  s = s.replace(/[%&#$]/g, function(c){ return '\\' + c; });
  return s;
}

// True when a line has something worth drawing properly.
function needsPrintMath(text){
  var t = String(text || '');
  return /[\/\u221a\u00b2\u00b3\u2074-\u2079\u00b0\u03c0\u00d7\u00f7]/.test(t);
}

// Render one line as real maths, revealed left to right like writing.
// Resolves when the reveal finishes. Returns false if it could not render,
// so the caller can fall back to the original chalk writer.
function katexWrite(el, text, charDelayMs, slots){
  if(!el) return null;
  if(typeof katex === 'undefined' || !katex.render) return null;
  var raw = String(text || '');
  if(!raw.trim()) return null;
  var tex;
  try { tex = mathToLatex(raw, slots); } catch(e){ tex = null; }
  if(!tex && slots){ try { tex = mathToLatex(raw); } catch(e){ tex = null; } }
  if(!tex) return null;
  var inner = document.createElement('span');
  try {
    katex.render(tex, inner, MR_OPTS);
  } catch(e){
    // A tagged render can fail if a target straddles a fraction; retry plain.
    if(slots){
      try { katex.render(mathToLatex(raw), inner, MR_OPTS); } catch(e2){ return null; }
    } else { return null; }
  }
  if(!inner.querySelector('.katex')) return null;
  el.innerHTML = '';
  inner.className = 'mr-line mr-reveal';
  var ms = Math.max(700, Math.min(4200, raw.length * (charDelayMs || 90) * 0.55));
  inner.style.setProperty('--mr-dur', ms + 'ms');
  el.appendChild(inner);
  return new Promise(function(resolve){ setTimeout(resolve, ms + 60); });
}

// Same, but with no animation — used when jumping straight to a step.
function katexSet(el, text, slots){
  if(!el) return false;
  if(typeof katex === 'undefined' || !katex.render) return false;
  var raw = String(text || '');
  if(!raw.trim()){ el.innerHTML = ''; return true; }
  var tex;
  try { tex = mathToLatex(raw, slots); } catch(e){ tex = null; }
  if(!tex && slots){ try { tex = mathToLatex(raw); } catch(e){ tex = null; } }
  if(!tex) return false;
  var inner = document.createElement('span');
  try {
    katex.render(tex, inner, MR_OPTS);
  } catch(e){
    if(slots){
      try { katex.render(mathToLatex(raw), inner, MR_OPTS); } catch(e2){ return false; }
    } else { return false; }
  }
  if(!inner.querySelector('.katex')) return false;
  inner.className = 'mr-line';
  el.innerHTML = '';
  el.appendChild(inner);
  return true;
}

async function runStep(i){
  if(i < 0 || i >= STEPS.length) return;
  IDX = i;
  var my = ++SEQ;
  var s = STEPS[i];

  $('step-count').textContent = 'Step ' + (i + 1) + ' / ' + STEPS.length;

  var big = $('big');
  big.innerHTML = '';
  if(s.title){
    var t = document.createElement('div');
    t.className = 'b-title'; t.textContent = s.title;
    big.appendChild(t);
  }
  (s.board || []).forEach(function(line, n){
    var d = document.createElement('div');
    d.className = 'b-line ' + kindClass(s.kind);
    d.style.animationDelay = (n * 0.13) + 's';
    // Lines with fractions, roots or powers are drawn as real maths.
    // Anything else, or any failure, keeps the original plain text.
    var drawn = false;
    if(needsPrintMath(line)){
      try { drawn = katexSet(d, line); } catch(e){ drawn = false; }
    }
    if(!drawn) d.textContent = line;
    big.appendChild(d);
  });

  rebuildNotes(i);

  await speakStep(s);
  if(my !== SEQ) return;
  if(PLAYING && IDX < STEPS.length - 1){
    setTimeout(function(){ if(my === SEQ && PLAYING) runStep(IDX + 1); }, 550);
  } else if(IDX >= STEPS.length - 1){
    PLAYING = false; $('btn-play').textContent = '▶ Play';
  }
}

function playPause(){
  PLAYING = !PLAYING;
  $('btn-play').textContent = PLAYING ? '❚❚ Pause' : '▶ Play';
  if(PLAYING) runStep(IDX);
  else { SEQ++; stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function goNext(){ if(IDX < STEPS.length - 1){ SEQ++; stopAudio(); runStep(IDX + 1); } }
function goPrev(){ if(IDX > 0){ SEQ++; stopAudio(); runStep(IDX - 1); } }
function replay(){ SEQ++; stopAudio(); runStep(IDX); }

/* ════════ START ════════ */
async function startClass(){
  // Hand-built lesson wins whenever one exists for this chapter.
  var rich = richTopicFor(CLS, CHAPTER.chapter_number);
  if(rich){ handOffToRich(rich); return; }

  $('setup').classList.add('hidden');
  $('room').classList.add('show');
  $('hdr-meta').textContent = CLS + ' · ' + CHAPTER.chapter_title;
  $('note-list').innerHTML = '';
  $('big').innerHTML = '';
  $('btn-lang').textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');

  $('loading').classList.add('show');
  $('loading-msg').textContent = 'Getting the class ready…';
  $('loading-sub').textContent = '';

  STEPS = await getSavedLesson();

  if(!STEPS){
    $('loading-sub').textContent =
      'Preparing this chapter for the first time. Once it is ready it is saved '
      + 'for every class and every school, so this wait happens only once.';
    try {
      STEPS = await buildLesson();
      saveLesson(STEPS);
    } catch(e){
      var why = (e && e.message) ? String(e.message) : 'Unknown problem';
      STEPS = [{
        id:'err', title:'Could not prepare this lesson',
        board:['Reason: ' + why.substring(0,140), 'Press Replay to try again.'],
        kind:'idea', say_en:'Sorry, I could not prepare this lesson just now. Please try again.',
        say_ta:'', note:'Error: ' + why.substring(0,140)
      }];
    }
  }

  $('loading').classList.remove('show');
  IDX = 0; PLAYING = true; $('btn-play').textContent = '❚❚ Pause';
  runStep(0);
}

/* ════════ WIRING ════════ */
document.addEventListener('DOMContentLoaded', function(){

  $('sel-class').addEventListener('change', function(){
    CLS = this.value;
    if(CLS) loadChapters(CLS);
    else {
      $('chap-box').innerHTML = '<div class="muted">Select a class to see its chapters.</div>';
      $('btn-start').disabled = true;
    }
  });

  $('chap-box').addEventListener('click', function(e){
    var el = e.target.closest('.chap'); if(!el) return;
    $('chap-box').querySelectorAll('.chap').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
    CHAPTER = CHAPTERS[parseInt(el.getAttribute('data-i'), 10)] || null;
    $('btn-start').disabled = !CHAPTER;
  });

  $('lang-row').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); LANG = c.getAttribute('data-lang');
  });

  $('btn-start').onclick  = function(){ if(CLS && CHAPTER) startClass(); };
  $('btn-play').onclick   = playPause;
  $('btn-next').onclick   = goNext;
  $('btn-prev').onclick   = goPrev;
  $('btn-replay').onclick = replay;

  $('btn-new').onclick = function(){
    SEQ++; PLAYING = false; stopAudio();
    try{ window.speechSynthesis.cancel(); }catch(e){}
    $('room').classList.remove('show');
    $('setup').classList.remove('hidden');
  };

  $('btn-voice').onclick = function(){
    VOICE_ON = !VOICE_ON;
    this.textContent = VOICE_ON ? '🔊 Voice' : '🔇 Muted';
    if(!VOICE_ON){ stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
  };

  $('btn-lang').onclick = function(){
    LANG = (LANG === 'english') ? 'tamil' : (LANG === 'tamil' ? 'both' : 'english');
    this.textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');
  };

  $('btn-back').onclick = function(){
    var url = null;
    try { url = sessionStorage.getItem('mcn_returnUrl'); } catch(e){}
    if(url){ window.location.href = url; return; }
    if(window.history.length > 1) window.history.back();
    else window.location.href = '/learnbot.html';
  };

  autostart();
});

/* ── Launched from LearnBot: pre-select the class if one is known ── */
function autostart(){
  var raw = null;
  try { raw = sessionStorage.getItem('mcn_autostart'); } catch(e){ return; }
  if(!raw) return;
  try { sessionStorage.removeItem('mcn_autostart'); } catch(e){}
  var d; try { d = JSON.parse(raw); } catch(e){ return; }

  if(d.lang === 'tamil' || d.lang === 'both'){
    LANG = d.lang;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){
      x.classList.toggle('on', x.getAttribute('data-lang') === LANG);
    });
  }
  if(d.cls){
    var sel = $('sel-class');
    for(var i = 0; i < sel.options.length; i++){
      if(sel.options[i].value === d.cls || sel.options[i].text === d.cls){
        sel.selectedIndex = i; CLS = d.cls; loadChapters(CLS); break;
      }
    }
  }
}
