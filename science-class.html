   Tomorrow the same lesson loads instantly and never generates live. */
var PREPARE_MODE = /[?&]prepare=1/.test(location.search);

async function scPlanKey(){
  var data = 'v6|' + LESSON.subject + '|' + LESSON.cls + '|' + LESSON.topic + '|' +
    LESSON.text.length + '|' + LESSON.text.substring(0, 8000);
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
  return Array.from(new Uint8Array(buf)).slice(0, 20)
    .map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}

/* Cached-first plan: prepared lesson loads instantly, else generate + save */

/* -- CAUSES STEP (second pass) --
   The main plan prompt has to balance twenty rules at once, and the causes step
   consistently lost that competition. Asked on its own, with nothing else
   competing for attention, it comes back reliably. Runs only when the main plan
   arrived without a causes step, so most lessons cost nothing extra. */
async function scCausesStep(){
  var sys = 'You read one school lesson and work out WHY the main event or change happened.\n' +
    'Return ONLY a JSON object. No prose, no markdown, no code fences.\n' +
    '{"type":"causes","title":"short heading","speech":"2 to 3 sentences a teacher would say aloud",' +
    '"longTerm":["short cause","short cause"],' +
    '"trigger":{"name":"the single event that finally set it off","detail":"one short line"},' +
    '"result":"what followed, one short line"}\n' +
    'RULES:\n' +
    '- "longTerm" is 2 to 5 pressures that built up over years. Each under 12 words.\n' +
    '- "trigger" is the ONE event that set it off, not a slow cause.\n' +
    '- Take everything ONLY from the lesson text below. Never add causes from your own knowledge.\n' +
    '- If the lesson explains no cause at all, return exactly {"none":true}';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 700,
      messages:[{ role:'user', content:'LESSON TEXT:\n\n' + LESSON.text.substring(0, 200000) }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return null;
  var t = String(raw).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s === -1 || e <= s) return null;
  var obj;
  try{ obj = JSON.parse(t.substring(s, e + 1)); }catch(err){ return null; }
  if (!obj || obj.none) return null;
  obj.type = 'causes';
  var step = scNormaliseStep(obj);
  return (step && step.type === 'causes') ? step : null;
}

/* Causes belong before the consequences, not after them. */
function scCausesIndex(){
  var after = /outcome|aftermath|result|consequence|treaty|effect|end of the|after the war|peace/i;
  for (var i = 1; i < STEPS.length; i++){
    if (after.test(STEPS[i].title || '')) return i;
  }
  return Math.min(Math.max(2, Math.round(STEPS.length * 0.45)), STEPS.length);
}


/* -- MID-LESSON RECALL (second pass) --
   Pulling a fact back out of memory fixes it far better than seeing it again,
   and it works best spread through the lesson rather than saved for the end.
   Built after the plan exists so each question can be tied to a step the class
   has already been taught, never to one still ahead of them. */
async function scRecallSteps(){
  var material = STEPS.map(function(s, i){
    return (i + 1) + '. ' + (s.title || '') + ' \u2014 ' + (s.speech || '').substring(0, 240);
  }).join('\n').substring(0, 7000);
  var sys = 'You add short recall checks to a lesson that has already been planned.\n' +
    'Return ONLY a JSON array. No prose, no markdown, no code fences.\n' +
    '[{"afterTitle":"exact title of the step this follows","question":"...","answer":"..."}]\n' +
    'RULES:\n' +
    '- Exactly 2 or 3 items, spread across the lesson, never two in a row.\n' +
    '- "afterTitle" must be copied EXACTLY from one of the numbered step titles below.\n' +
    '- Never use the first step, and never the last two steps.\n' +
    '- The question must be answerable from a step at or BEFORE that title. Never ask about something later.\n' +
    '- Answers must be short enough to call out in chorus: a name, a year, a word, a short phrase.\n' +
    '- Question under 110 characters. Answer under 60 characters.';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 600,
      messages:[{ role:'user', content:'LESSON STEPS:\n' + material }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return [];
  var t = String(raw).trim().replace(/```json|```/g,'').trim();
  var s = t.indexOf('['), e = t.lastIndexOf(']');
  if (s === -1 || e <= s) return [];
  var arr;
  try{ arr = JSON.parse(t.substring(s, e + 1)); }catch(err){ return []; }
  return Array.isArray(arr) ? arr.slice(0, 3) : [];
}

/* Insert from the back so earlier positions stay valid as the list grows. */
function scInsertRecall(items){
  var placed = [];
  items.forEach(function(it){
    if (!it || !it.afterTitle || !it.question || !it.answer) return;
    var want = String(it.afterTitle).trim().toLowerCase();
    for (var i = 0; i < STEPS.length; i++){
      if ((STEPS[i].title || '').trim().toLowerCase() === want){
        // Never at the very start, and never so late it becomes the end quiz.
        if (i >= 1 && i <= STEPS.length - 2) placed.push({ at: i + 1, item: it });
        break;
      }
    }
  });
  placed.sort(function(a, b){ return b.at - a.at; });
  var last = -99;
  placed = placed.filter(function(p){
    if (Math.abs(p.at - last) < 2) return false;   // never two checks back to back
    last = p.at; return true;
  });
  placed.forEach(function(p){
    var step = scNormaliseStep({ type:'recall', title:'Quick check',
      speech: p.item.question, question: p.item.question, answer: p.item.answer });
    if (step && step.type === 'recall') STEPS.splice(p.at, 0, step);
  });
  return placed.length;
}


/* -- COVERAGE CHECK (second pass) --
   A step counts as covering a topic when most of the topic\u2019s own words turn
   up somewhere in the plan. Deliberately generous: a wrong "missing" reading
   costs one small extra call, a wrong "covered" reading costs a student a
   whole exam topic. */
var SC_TOPIC_SKIP = { the:1, and:1, for:1, its:1, are:1, with:1, from:1, that:1, this:1, when:1, what:1, does:1, into:1, their:1, about:1, other:1 };

function scTopicWords(s){
  return String(s || '').toLowerCase()
    .replace(/[^a-z0-9\u0B80-\u0BFF ]+/g, ' ')
    .split(/\s+/)
    .filter(function(w){ return w.length >= 4 && !SC_TOPIC_SKIP[w]; });
}

function scMissingTopics(){
  if (!LESSON.topics || !LESSON.topics.length) return [];
  var blob = ' ' + STEPS.map(function(s){ return (s.title || '') + ' ' + (s.speech || ''); })
    .join(' ').toLowerCase().replace(/[^a-z0-9\u0B80-\u0BFF ]+/g, ' ') + ' ';
  var gaps = [];
  LESSON.topics.forEach(function(t){
    var words = scTopicWords(t);
    if (!words.length) return;
    var hit = 0;
    words.forEach(function(w){ if (blob.indexOf(' ' + w) !== -1) hit++; });
    if (hit / words.length < 0.7) gaps.push(t);
  });
  return gaps.slice(0, 8);
}

/* Builds steps for the gaps only, so a fully covered lesson pays nothing. */
async function scTopUpSteps(missing){
  var sys = 'You add the MISSING steps to a science lesson plan that is already written.\n' +
    'Return ONLY a JSON array of step objects. No prose, no markdown, no code fences.\n' +
    'Each step is ONE of these shapes:\n' +
    '{"type":"concept","topic":"...","title":"...","speech":"...","points":["short point","short point"]}\n' +
    '{"type":"cycle","topic":"...","title":"...","speech":"...","items":["stage one","stage two","stage three"]}\n' +
    '{"type":"compare","topic":"...","title":"...","speech":"...","left":{"name":"...","points":["..."]},"right":{"name":"...","points":["..."]}}\n' +
    'RULES:\n' +
    '- EXACTLY one step for each missing topic listed below, in the same order.\n' +
    '- "topic" must be copied EXACTLY, character for character, from the missing topic it teaches.\n' +
    '- Build every step ONLY from the lesson text. Never add facts from your own knowledge.\n' +
    '- "speech" is 2 to 4 warm, clear sentences a teacher says aloud in simple Indian classroom English, explaining construction and working. No emojis.\n' +
    '- "points" and "items": 2 to 5 entries, each under 70 characters. Short board-style phrases, never full sentences.\n' +
    '- Every string plain text. Keep JSON strictly valid.';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 2500,
      messages:[{ role:'user', content:'MISSING TOPICS:\n' + missing.join('\n') +
        '\n\nLESSON TEXT:\n\n' + LESSON.text.substring(0, 200000) }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return [];
  var t = String(raw).trim().replace(/```json|```/g, '').trim();
  var s = t.indexOf('['), e = t.lastIndexOf(']');
  if (s === -1 || e <= s) return [];
  var arr;
  try{ arr = JSON.parse(t.substring(s, e + 1)); }catch(err){ return []; }
  if (!Array.isArray(arr)) return [];
  var out = [];
  arr.slice(0, 8).forEach(function(o){
    var step = scNormaliseStep(o);
    if (step && step.title){ step._topic = String((o && o.topic) || '').trim(); out.push(step); }
  });
  return out;
}

/* Each gap sits straight after the topic the book puts before it, so the class
   still runs in chapter order instead of collecting leftovers at the end. */
function scInsertTopUp(steps){
  if (!steps || !steps.length) return 0;
  var order = LESSON.topics || [];
  var added = 0;
  steps.forEach(function(st){
    var idx = order.indexOf(st._topic);
    var at = STEPS.length;
    if (idx > 0){
      var prev = String(order[idx - 1] || '').toLowerCase().trim();
      for (var i = STEPS.length - 1; i >= 0; i--){
        var ttl = (STEPS[i].title || '').toLowerCase().trim();
        if (ttl && prev && (ttl.indexOf(prev) !== -1 || prev.indexOf(ttl) !== -1)){ at = i + 1; break; }
      }
    }
    delete st._topic;
    STEPS.splice(at, 0, st);
    added++;
  });
  return added;
}


/* The causes and recall passes finish the lesson off. They run once, on the way
   into the cache, so a lesson taught before loads whole and never pays again. */
async function scEnrichPlan(){
  /* Fill the gaps before anything else, so quick checks can use the new steps. */
  var gaps = scMissingTopics();
  if (gaps.length){
    scPrepMsg('Checking nothing was left out\u2026');
    try{
      var extra = await scTopUpSteps(gaps);
      if (extra.length) scInsertTopUp(extra);
    }catch(ge){ /* lesson is still fine without the top-up */ }
  }
  if (!STEPS.some(function(s){ return s.type === 'causes'; })){
    scPrepMsg('Working out why it happened\u2026');
    try{
      var cstep = await scCausesStep();
      if (cstep) STEPS.splice(scCausesIndex(), 0, cstep);
    }catch(ce){ /* lesson is still fine without it */ }
  }
  scPrepMsg('Adding quick checks\u2026');
  try{
    var recalls = await scRecallSteps();
    if (recalls.length) scInsertRecall(recalls);
  }catch(re){ /* lesson is still fine without them */ }
}

async function scGeneratePlan(){
  var key = null;
  try{
    key = await scPlanKey();
    var r = await fetch('/api/lesson-plan?key=' + key);
    if (r.ok){
      var d = await r.json();
      if (d && Array.isArray(d.steps) && d.steps.length){
        return d.steps;
      }
    }
  }catch(e){}
  var steps = await scGeneratePlanFresh();
  // Finish the lesson BEFORE saving, so the cached copy is the complete one.
  STEPS = steps;
  try{ await scEnrichPlan(); }catch(en){}
  steps = STEPS;
  if (key && steps && steps.length){
    try{
      fetch('/api/lesson-plan', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key: key, steps: steps,
          meta: { subject: LESSON.subject, cls: LESSON.cls, topic: LESSON.topic } })
      });
    }catch(e){}
  }
  return steps;
}

/* Every message on the prep screen now carries how much of the chapter
   actually arrived. A unit that reads 20,000 characters when the book runs to
   fifty thousand has been cut somewhere upstream, and the teacher can see it
   before the class starts rather than discovering it mid-lesson. */
function scLessonSize(){
  var n = (LESSON.text || '').length;
  if (!n) return '';
  return '  \u00B7  ' + n.toLocaleString('en-IN') + ' characters read';
}
function scPrepMsg(t){
  var m = document.getElementById('sc-loading-msg');
  if (m) m.textContent = t + scLessonSize();
}

async function scPrepareAll(){
  var ov = document.getElementById('sc-loading');
  ov.style.display = 'flex';
  document.querySelector('#sc-loading h2').textContent = 'Preparing tomorrow\u2019s class\u2026';
  try{
    /* photos */
    var photos = STEPS.filter(function(s){ return s.type === 'photo'; });
    for (var i = 0; i < photos.length; i++){
      scPrepMsg('Verifying photograph ' + (i + 1) + ' of ' + photos.length + '\u2026');
      try{ await scFetchImages(photos[i].search, photos[i].title + '. ' + photos[i].speech); }catch(e){}
    }
    /* 3D models (science-family pages only) */
    if (typeof sciFetchModel === 'function'){
      var models = STEPS.filter(function(s){ return s.type === 'model3d'; });
      for (var j = 0; j < models.length; j++){
        scPrepMsg('Finding 3D model ' + (j + 1) + ' of ' + models.length + '\u2026');
        try{ await sciFetchModel(models[j].organ); }catch(e){}
      }
    }
    /* narration — the big one: every line cached in Monika's voice */
    var spoken = STEPS.filter(function(s){ return (s.speech || s.title || '').trim().length > 0; });
    for (var k = 0; k < spoken.length; k++){
      scPrepMsg('Caching narration ' + (k + 1) + ' of ' + spoken.length + ' (this runs once, tonight)\u2026');
      try{
        await fetch('/api/voice-class', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ text: String(spoken[k].speech || spoken[k].title), cls: LESSON.cls })
        });
      }catch(e){}
    }
    scPrepMsg('Preparing the class quiz\u2026');
    try{ await scGetQuiz(); }catch(e){}
    /* done */
    document.querySelector('#sc-loading .sc-spin').style.display = 'none';
    document.querySelector('#sc-loading h2').textContent = '\u2705 Class prepared!';
    scPrepMsg('Plan, photographs, models and every narration line are saved. Tomorrow this lesson opens instantly \u2014 nothing is generated live in front of the students.');
    var btns = document.createElement('div');
    btns.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;justify-content:center;';
    var b1 = document.createElement('button');
    b1.className = 'ctrl-btn active';
    b1.textContent = '\u25B6 Run the class now';
    b1.onclick = function(){ ov.style.display = 'none'; scRender(0); };
    var b2 = document.createElement('button');
    b2.className = 'ctrl-btn';
    b2.textContent = '\u2190 Back to TeachBot';
    b2.onclick = function(){ scGoBack(); };
    btns.appendChild(b1); btns.appendChild(b2);
    ov.appendChild(btns);
  }catch(e){
    scPrepMsg('Preparation hit a problem \u2014 ' + e.message + '. What finished is saved; run Prepare again to complete the rest.');
  }
}

/* ══ CLASS QUIZ — whole-class chorus, teacher rates in one tap (22-07-2026) ══
   5 questions from today's lesson. Teacher reads aloud → class answers
   together → Show Answer → tap Most/Half/Few → next. No names, no marks,
   under 3 minutes. Results feed Class Insights. */
var QUIZ_QS = null;
var QUIZ_IDX = 0;
var QUIZ_RESULTS = [];
var QUIZ_STYLED = false;

function scQuizStyles(){
  if (QUIZ_STYLED) return;
  QUIZ_STYLED = true;
  var st = document.createElement('style');
  st.textContent =
    '.qz-wrap{width:100%;max-width:880px;text-align:center;animation:scFadeUp 0.6s ease both;}' +
    '.qz-prog{font-size:0.72rem;font-weight:800;letter-spacing:2px;color:var(--gold);margin-bottom:14px;}' +
    '.qz-q{background:linear-gradient(160deg,rgba(107,26,26,0.45),rgba(30,12,8,0.7));border:1.5px solid var(--gold);border-radius:16px;padding:22px 22px;font-size:clamp(1.05rem,2.2vw,1.5rem);color:var(--text-light);line-height:1.6;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,0.4);}' +
    '.qz-chorus{font-family:Caveat,cursive;font-size:1.3rem;color:var(--sandal);margin-bottom:16px;}' +
    '.qz-ans{display:none;background:linear-gradient(135deg,rgba(60,150,80,0.2),rgba(30,12,8,0.5));border:1.5px solid rgba(90,200,120,0.6);border-radius:13px;padding:14px 18px;font-size:clamp(1rem,1.9vw,1.35rem);font-weight:800;color:#a5eab8;margin-bottom:18px;}' +
    '.qz-ans.on{display:block;animation:scFadeUp 0.4s ease both;}' +
    '.qz-rate{display:none;gap:12px;justify-content:center;flex-wrap:wrap;}' +
    '.qz-rate.on{display:flex;}' +
    '.qz-rate button{border:none;border-radius:13px;padding:13px 20px;font-family:inherit;font-weight:800;font-size:0.9rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.3);}' +
    '.qz-r3{background:linear-gradient(135deg,#2f9e57,#1f7a40);color:#eafff0;}' +
    '.qz-r2{background:linear-gradient(135deg,#d9a530,#b3841f);color:#2a1c05;}' +
    '.qz-r1{background:linear-gradient(135deg,#b33a3a,#8a2525);color:#ffe4de;}' +
    '.qz-show{background:linear-gradient(135deg,var(--gold),#a8863a);color:#2a1505;border:none;border-radius:13px;padding:13px 26px;font-family:Cinzel,serif;font-weight:700;font-size:0.95rem;cursor:pointer;}' +
    '.qz-sum{max-width:760px;margin:0 auto;text-align:left;}' +
    '.qz-row{display:flex;gap:10px;align-items:flex-start;background:rgba(201,168,76,0.07);border-left:4px solid;border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:9px;font-size:0.86rem;color:var(--sandal);line-height:1.5;}' +
    '.qz-row.g{border-color:#2f9e57;}.qz-row.a{border-color:#d9a530;}.qz-row.m{border-color:#b33a3a;}';
  document.head.appendChild(st);
}

async function scQuizKey(){
  var data = 'quiz2|' + LESSON.subject + '|' + LESSON.cls + '|' + LESSON.topic + '|' +
    LESSON.text.length + '|' + LESSON.text.substring(0, 8000);
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
  return Array.from(new Uint8Array(buf)).slice(0, 20)
    .map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}

async function scGetQuiz(){
  if (QUIZ_QS && QUIZ_QS.length) return QUIZ_QS;
  var key = null;
  try{
    key = await scQuizKey();
    var r = await fetch('/api/lesson-plan?key=' + key);
    if (r.ok){
      var d = await r.json();
      if (d && Array.isArray(d.steps) && d.steps.length){
        QUIZ_QS = d.steps;
        return QUIZ_QS;
      }
    }
  }catch(e){}
  /* generate from today's actual steps */
  var material = STEPS.map(function(s){ return (s.title || '') + '. ' + (s.speech || ''); }).join('\n').substring(0, 7000);
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: 'You write a 5-question oral CLASS QUIZ for ' + LESSON.cls + ' from the lesson just taught. ' +
        'Questions must be answerable ALOUD IN CHORUS by the whole class: very short factual answers ' +
        '(a name, a year, a word, a short phrase \u2014 never long sentences). Cover different parts of the lesson. ' +
        'Reply ONLY with JSON: [{"q":"question","a":"short answer"}] \u2014 exactly 5 items, nothing else.',
      messages:[{ role:'user', content:'LESSON CONTENT:\n' + material }],
      max_tokens: 800
    })
  });
  var d2 = await res.json();
  var raw = '';
  if (d2 && Array.isArray(d2.content)) raw = d2.content.map(function(b){ return b.type === 'text' ? b.text : ''; }).join('');
  raw = raw.replace(/```json|```/g, '').trim();
  var s = raw.indexOf('['), e = raw.lastIndexOf(']');
  if (s === -1 || e <= s) throw new Error('quiz could not be generated \u2014 try again');
  var arr = JSON.parse(raw.substring(s, e + 1));
  QUIZ_QS = arr.slice(0, 5).map(function(x){
    return { q: String((x && x.q) || '').substring(0, 220), a: String((x && x.a) || '').substring(0, 220) };
  }).filter(function(x){ return x.q && x.a; });
  if (QUIZ_QS.length === 0) throw new Error('quiz empty \u2014 try again');
  if (key){
    try{
      fetch('/api/lesson-plan', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key: key, steps: QUIZ_QS, meta:{ kind:'class-quiz', topic: LESSON.topic } }) });
    }catch(e2){}
  }
  return QUIZ_QS;
}

async function scStartQuiz(){
  scQuizStyles();
  scStopAudio(); clearTimeout(scAdvanceTimer);
  var inner = document.getElementById('stage-inner');
  inner.innerHTML = '<div class="qz-wrap"><div class="sc-spin" style="margin:0 auto 14px;"></div>' +
                    '<div style="color:var(--sandal);">Preparing today\u2019s class quiz\u2026</div></div>';
  try{
    await scGetQuiz();
  }catch(e){
    inner.innerHTML = '<div class="qz-wrap"><div style="color:#ffb0a5;">' + e.message + '</div>' +
      '<button class="sc-done-btn ghost" style="margin-top:16px;" onclick="scShowComplete()">\u2190 Back</button></div>';
    return;
  }
  QUIZ_IDX = 0; QUIZ_RESULTS = [];
  scShowQuizQ();
}

function scShowQuizQ(){
  var inner = document.getElementById('stage-inner');
  var item = QUIZ_QS[QUIZ_IDX];
  document.getElementById('narr-text').textContent = '\uD83C\uDFAF Class quiz \u2014 read the question aloud, class answers together.';
  inner.innerHTML =
    '<div class="qz-wrap">' +
      '<div class="qz-prog">CLASS QUIZ \u00B7 QUESTION ' + (QUIZ_IDX + 1) + ' OF ' + QUIZ_QS.length + '</div>' +
      '<div class="qz-q"></div>' +
      '<div class="qz-chorus">\uD83D\uDDE3 Everyone answer together!</div>' +
      '<button class="qz-show" onclick="scQuizReveal()">\uD83D\uDC41 Show Answer</button>' +
      '<div class="qz-ans" id="qz-ans"></div>' +
      '<div class="qz-rate" id="qz-rate">' +
        '<button class="qz-r3" onclick="scQuizRate(3)">\uD83D\uDE03 Most got it</button>' +
        '<button class="qz-r2" onclick="scQuizRate(2)">\uD83D\uDE10 About half</button>' +
        '<button class="qz-r1" onclick="scQuizRate(1)">\uD83D\uDE1F Only a few</button>' +
      '</div>' +
    '</div>';
  inner.querySelector('.qz-q').textContent = item.q;
  document.getElementById('qz-ans').textContent = '\u2705 ' + item.a;
  scSpeak(item.q);
}

function scQuizReveal(){
  clearTimeout(scAdvanceTimer);
  document.getElementById('qz-ans').classList.add('on');
  document.getElementById('qz-rate').classList.add('on');
}

function scQuizRate(r){
  var item = QUIZ_QS[QUIZ_IDX];
  QUIZ_RESULTS.push({ q: item.q, a: item.a, rating: r });
  QUIZ_IDX++;
  if (QUIZ_IDX < QUIZ_QS.length) scShowQuizQ();
  else scQuizFinish();
}

async function scQuizFinish(){
  scStopAudio(); clearTimeout(scAdvanceTimer);
  var inner = document.getElementById('stage-inner');
  var rows = QUIZ_RESULTS.map(function(r){
    var cls = r.rating === 3 ? 'g' : r.rating === 2 ? 'a' : 'm';
    var ico = r.rating === 3 ? '\uD83D\uDE03' : r.rating === 2 ? '\uD83D\uDE10' : '\uD83D\uDE1F';
    return '<div class="qz-row ' + cls + '"><span>' + ico + '</span><span></span></div>';
  }).join('');
  inner.innerHTML =
    '<div class="qz-wrap"><div class="qz-prog">CLASS QUIZ \u00B7 RESULT</div>' +
    '<div class="qz-sum">' + rows + '</div>' +
    '<div id="qz-save" style="margin:14px 0;color:var(--sandal);font-size:0.82rem;">\u23F3 Saving to Class Insights\u2026</div>' +
    '<button class="sc-done-btn ghost" onclick="scShowComplete()">\u2190 Done</button></div>';
  var spans = inner.querySelectorAll('.qz-row span:last-child');
  for (var i = 0; i < spans.length; i++) spans[i].textContent = QUIZ_RESULTS[i].q;
  document.getElementById('narr-text').textContent = '\uD83C\uDFAF Quiz complete \u2014 well done, class!';
  try{
    var key = await scQuizKey();
    var r = await fetch('/api/class-quiz', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ cls: LESSON.cls, subject: LESSON.subject, topic: LESSON.topic,
                             planKey: key, results: QUIZ_RESULTS })
    });
    var d = await r.json();
    document.getElementById('qz-save').textContent = (d && d.saved)
      ? '\u2705 Saved to Class Insights.'
      : '\u26A0 Could not save (' + ((d && d.error) || 'server') + ') \u2014 the class still benefited!';
  }catch(e){
    var el = document.getElementById('qz-save');
    if (el) el.textContent = '\u26A0 Could not save \u2014 ' + e.message;
  }
}

document.addEventListener('DOMContentLoaded', scInit);
</script>
