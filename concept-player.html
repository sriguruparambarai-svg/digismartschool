<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept Class | DigiSmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400;500;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --maroon-deep:#4A1010; --gold:#C9A84C; --sandal:#E8C99A; --sandal-light:#F7EBD6;
  --board:#1F2C26; --board-edge:#6A4424; --chalk:#F1ECDF; --chalk-dim:#8E9A93; --chalk-blue:#8EC3D6; --chalk-pink:#EBA3A3;
  --ink:#2B1A12;
  --ui:"Baloo Thambi 2","Nirmala UI","Latha",system-ui,sans-serif;
  --hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);background:var(--sandal-light);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}

header{background:var(--maroon);color:var(--sandal-light);padding:10px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
.chapter{font-size:1.9rem;font-weight:800;line-height:1;margin:0}
.chapter span{display:block;font-size:.95rem;font-weight:500;color:var(--sandal);margin-top:4px}
.rail{display:flex;align-items:center;margin-left:auto;flex-wrap:wrap;gap:4px}
.rail button{background:none;border:0;color:var(--sandal);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;cursor:pointer;font-size:1rem}
.rail button b{width:28px;height:28px;border-radius:50%;border:2px solid var(--sandal);display:grid;place-items:center;font-size:.9rem}
.rail button.done b{background:var(--sandal);color:var(--maroon)}
.rail button.on{background:var(--gold);color:var(--maroon-deep);font-weight:700}
.rail button.on b{border-color:var(--maroon-deep);background:var(--maroon-deep);color:var(--gold)}

main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;padding:20px 24px;min-height:0}
.board{background:radial-gradient(ellipse at 40% 30%,#2A3A32,var(--board) 70%);border:12px solid var(--board-edge);border-radius:8px;box-shadow:inset 0 0 40px rgba(0,0,0,.45);display:flex;min-height:0}
.board svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}

.panel{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto;padding-right:4px}
.titlebar{display:flex;align-items:flex-start;gap:12px}
.titlebar h2{font-size:2.2rem;line-height:1.1;margin:0;color:var(--maroon);flex:1}
.speak{background:var(--maroon);color:var(--sandal-light);border:0;border-radius:8px;padding:8px 14px;font-size:1rem;cursor:pointer;white-space:nowrap}
.lines p{font-size:1.35rem;line-height:1.5;margin:0 0 8px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls:empty{display:none}
.controls label{font-size:1.1rem;font-weight:600;width:100%}
.controls input[type=range]{width:100%;accent-color:var(--maroon);height:32px}
.readout{font-size:1.25rem;line-height:1.5;background:#fff8ec;border:2px solid var(--sandal);border-radius:10px;padding:10px 14px;width:100%}
.readout strong{color:var(--maroon)}
.btn{background:var(--gold);color:var(--maroon-deep);border:0;border-radius:10px;padding:10px 20px;font-size:1.2rem;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:2px solid var(--maroon);color:var(--maroon)}

.ask{background:#fff8ec;border-left:8px solid var(--gold);border-radius:6px;padding:14px 16px}
.ask .q{font-size:1.35rem;font-weight:700;margin:0 0 10px;line-height:1.4}
.ask-row{display:flex;align-items:center;gap:14px}
.count{font-size:2rem;font-weight:800;color:var(--maroon);min-width:2ch}
.ans{margin:12px 0 0;background:var(--maroon);color:var(--sandal-light);border-radius:8px;padding:12px 14px;font-size:1.3rem;line-height:1.45}

.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{border:2px solid var(--sandal);border-radius:10px;padding:4px 12px;background:#fff;line-height:1.25}
.term b{display:block;font-size:1rem;color:var(--maroon)}
.term span{font-size:1.05rem}

.card{background:var(--maroon);color:var(--sandal-light);border-radius:12px;padding:16px 20px}
.card ol{margin:0;padding-left:1.3em}
.card li{font-size:1.3rem;line-height:1.5;margin:4px 0}
.card li b{color:var(--gold)}
.uses{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.uses li{font-size:1.2rem;line-height:1.45;border-bottom:1px solid var(--sandal);padding-bottom:8px}
.uses li b{color:var(--maroon)}
.error{background:#fff;border:3px solid var(--maroon);border-radius:10px;padding:16px;font-size:1.2rem;line-height:1.5}
.error code{background:var(--sandal-light);padding:2px 6px;border-radius:4px}

footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 24px 16px}
footer .pos{font-size:1rem;color:#6b5646}
footer .btn{min-width:140px}

/* chalk drawing styles used by the toolbox */
.cl{stroke:var(--chalk);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:2}
.dim{stroke:var(--chalk-dim)}
.dash{stroke-dasharray:6 9}
.gold{stroke:var(--gold);stroke-width:4;fill:none;stroke-linecap:round}
.blue{stroke:var(--chalk-blue);stroke-width:4;fill:none;stroke-linecap:round}
.far{stroke:var(--chalk-dim);stroke-width:3;fill:none;stroke-dasharray:3 7}
.mark{stroke:var(--chalk-pink);stroke-width:2.5;fill:none}
.dot{fill:var(--gold)}
.odot{fill:var(--chalk)}
.stone{fill:#C8B79A;stroke:var(--chalk);stroke-width:2}
.handle{fill:var(--gold);stroke:var(--chalk);stroke-width:3;pointer-events:none}
.hit{stroke:transparent;stroke-width:36;cursor:grab}
.hitc{fill:transparent;cursor:grab}
.t{fill:var(--chalk);font-family:var(--hand);font-size:24px}
.t.big{font-size:30px;font-weight:700}
.t.huge{font-size:44px;font-weight:700}
.t.g{fill:var(--gold)}
.t.p{fill:var(--chalk-pink)}
.t.d{fill:var(--chalk-dim);font-size:20px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .board{aspect-ratio:4/3}
  .titlebar h2{font-size:1.7rem}
  .rail button span{display:none}
}
</style>
</head>
<body>
<header>
  <h1 class="chapter" id="chapter">Loading…<span></span></h1>
  <nav class="rail" id="rail" aria-label="Lesson steps"></nav>
</header>

<main>
  <div class="board" aria-label="Chalkboard">
    <svg id="bd" viewBox="0 0 640 480" role="img" aria-label="Board drawing"></svg>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<footer>
  <button class="btn ghost" id="back">Back</button>
  <span class="pos" id="pos"></span>
  <button class="btn" id="next">Next</button>
</footer>

<script src="/js/concept-tools.js"></script>
<script>
/* DigiSmart concept lesson player.
   Open as: concept-player.html?lesson=maths/class10-circles
   It loads /lessons/<lesson>.json and plays it with the tools in /js/concept-tools.js. */
(function () {
  "use strict";
  const STEPS = [
    ["why", "Why"], ["see", "See it"], ["touch", "Touch it"], ["draw", "Draw it"],
    ["formula", "Formula"], ["where", "Where used"], ["say", "Say it"]
  ];
  const svg = document.getElementById("bd");
  const panel = document.getElementById("panel");
  const rail = document.getElementById("rail");
  const h = window.ConceptTools ? ConceptTools.helpers(svg) : null;
  let lesson = null, idx = 0, cleanup = null, currentAsk = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const boldify = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  function button(parent, label, fn, cls = "btn") {
    const b = document.createElement("button");
    b.className = cls; b.textContent = label; b.onclick = fn;
    parent.appendChild(b);
    return b;
  }

  /* Ask and reveal: ask, count down 5, then show the answer */
  function askBox(q, a) {
    const box = document.createElement("div");
    box.className = "ask";
    box.innerHTML = '<p class="q"></p><div class="ask-row"></div><p class="ans" hidden></p>';
    box.querySelector(".q").textContent = q;
    const ans = box.querySelector(".ans");
    ans.textContent = a;
    const row = box.querySelector(".ask-row");
    const count = document.createElement("span");
    count.className = "count";
    let timer = null, counting = false;
    const reveal = () => { clearInterval(timer); counting = false; count.textContent = ""; ans.hidden = false; btn.textContent = "Ask again"; };
    const start = () => {
      if (counting) { reveal(); return; }
      ans.hidden = true; counting = true; btn.textContent = "Show answer now";
      let n = 5; count.textContent = n;
      timer = setInterval(() => { n--; if (n <= 0) reveal(); else count.textContent = n; }, 1000);
    };
    const btn = button(row, "Ask the class", start);
    row.appendChild(count);
    return { box, start, stop: () => clearInterval(timer) };
  }

  /* Read aloud with the browser voice (ElevenLabs comes in a later step) */
  function speak(text, onEnd) {
    if (!("speechSynthesis" in window)) { if (onEnd) onEnd(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => x.lang === "en-IN") || vs.find(x => x.lang.startsWith("en"));
    if (v) u.voice = v;
    u.rate = 0.92;
    u.onend = () => { if (onEnd) onEnd(); };
    speechSynthesis.speak(u);
  }

  function showError(title, detail) {
    document.getElementById("chapter").firstChild.textContent = "Concept class";
    panel.innerHTML = "";
    const d = document.createElement("div");
    d.className = "error";
    d.innerHTML = `<strong></strong><br><span></span>`;
    d.querySelector("strong").textContent = title;
    d.querySelector("span").textContent = detail;
    panel.appendChild(d);
    document.getElementById("back").disabled = true;
    document.getElementById("next").disabled = true;
  }

  function stepIndex(key) { return STEPS.findIndex(s => s[0] === key); }

  function go(n) {
    const screens = lesson.screens;
    if (n < 0 || n >= screens.length) return;
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } }
    if (currentAsk) currentAsk.stop();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    cleanup = null; currentAsk = null; idx = n;
    const scr = screens[n];
    svg.innerHTML = ""; panel.innerHTML = "";

    const tb = document.createElement("div"); tb.className = "titlebar";
    const h2 = document.createElement("h2"); h2.textContent = scr.title || ""; tb.appendChild(h2);
    button(tb, "Read aloud", () => {
      const text = (scr.lines || []).join(" ") + (scr.ask ? " " + scr.ask.q : "");
      speak(text, () => { if (currentAsk) currentAsk.start(); });
    }, "speak");
    panel.appendChild(tb);

    const lines = document.createElement("div"); lines.className = "lines";
    (scr.lines || []).forEach(l => { const p = document.createElement("p"); p.textContent = l; lines.appendChild(p); });
    panel.appendChild(lines);

    const ctl = document.createElement("div"); ctl.className = "controls";
    panel.appendChild(ctl);

    if (Array.isArray(scr.card) && scr.card.length) {
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = "<ol>" + scr.card.map(t => `<li>${boldify(t)}</li>`).join("") + "</ol>";
      panel.appendChild(c);
    }
    if (Array.isArray(scr.uses) && scr.uses.length) {
      const ul = document.createElement("ul"); ul.className = "uses";
      scr.uses.forEach(([w, why]) => {
        const li = document.createElement("li");
        const b = document.createElement("b"); b.textContent = w + ": ";
        li.appendChild(b); li.append(why || "");
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    }
    if (Array.isArray(scr.chant) && scr.chant.length) {
      const c = document.createElement("div"); c.className = "card";
      const ol = document.createElement("ol");
      scr.chant.forEach(t => { const li = document.createElement("li"); li.textContent = t; ol.appendChild(li); });
      c.appendChild(ol); panel.appendChild(c);
    }
    if (scr.ask && scr.ask.q) {
      const a = askBox(scr.ask.q, scr.ask.a || "");
      panel.appendChild(a.box); currentAsk = a;
    }
    if (Array.isArray(scr.terms) && scr.terms.length) {
      const t = document.createElement("div"); t.className = "terms";
      scr.terms.forEach(([en, ta]) => {
        const d = document.createElement("div"); d.className = "term";
        const b = document.createElement("b"); b.textContent = en;
        const s = document.createElement("span"); s.textContent = ta || "";
        d.append(b, s); t.appendChild(d);
      });
      panel.appendChild(t);
    }

    /* Board: use the named tool; if it doesn't exist yet, write the lesson lines on the board */
    const board = scr.board || {};
    let tool = ConceptTools.tools[board.tool];
    let settings = board;
    if (!tool) {
      if (board.tool) console.warn("Tool not in toolbox yet:", board.tool);
      tool = ConceptTools.tools.plainBoard;
      settings = { heading: scr.title, lines: (board.lines || scr.lines || []).slice(0, 4) };
    }
    try {
      cleanup = tool(h, ctl, settings, { setAsk: a => { currentAsk = a; } }) || null;
    } catch (e) {
      console.error(e);
      svg.innerHTML = "";
      h.txt(24, 60, "Board error: " + e.message, "t p");
    }

    const si = stepIndex(scr.step);
    [...rail.children].forEach((b, k) => {
      b.classList.toggle("on", k === si);
      b.classList.toggle("done", k < si);
    });
    document.getElementById("pos").textContent = `Screen ${n + 1} of ${screens.length}`;
    document.getElementById("back").disabled = n === 0;
    document.getElementById("next").disabled = n === screens.length - 1;
  }

  function start(data) {
    if (!data || !Array.isArray(data.screens) || !data.screens.length) {
      showError("This lesson file has no screens.", "Check that the file has a \"screens\" list.");
      return;
    }
    lesson = data;
    const ch = document.getElementById("chapter");
    ch.firstChild.textContent = data.chapter || "Concept class";
    ch.querySelector("span").textContent = `Class ${data.class || ""} ${data.subject || ""} concept class`.replace(/\s+/g, " ").trim();
    document.title = `${data.chapter || "Concept class"} | Class ${data.class || ""} ${data.subject || ""}`;
    STEPS.forEach(([key, label], k) => {
      const b = document.createElement("button");
      b.innerHTML = `<b>${k + 1}</b><span>${label}</span>`;
      const first = lesson.screens.findIndex(s => s.step === key);
      if (first < 0) b.disabled = true;
      b.onclick = () => go(first);
      rail.appendChild(b);
    });
    go(0);
  }

  document.getElementById("back").onclick = () => go(idx - 1);
  document.getElementById("next").onclick = () => go(idx + 1);
  document.addEventListener("keydown", e => {
    if (!lesson || e.target.tagName === "INPUT") return;
    if (e.key === " " && e.target.tagName === "BUTTON") return;
    if (e.key === "ArrowRight") go(idx + 1);
    else if (e.key === "ArrowLeft") go(idx - 1);
    else if (e.key === " " && currentAsk) { e.preventDefault(); currentAsk.start(); }
  });
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  if (!window.ConceptTools) {
    showError("The toolbox file did not load.", "Check that /js/concept-tools.js is uploaded to the repo.");
    return;
  }
  const name = new URLSearchParams(location.search).get("lesson") || "";
  if (!/^[a-z0-9-]+(\/[a-z0-9-]+)*$/.test(name)) {
    showError("No lesson chosen.", "Open this page with ?lesson=maths/class10-circles at the end of the address.");
    return;
  }
  fetch(`/lessons/${name}.json`, { cache: "no-cache" })
    .then(r => {
      if (!r.ok) throw new Error(`Lesson file /lessons/${name}.json not found (status ${r.status}).`);
      return r.json().catch(() => { throw new Error(`Lesson file /lessons/${name}.json is not valid JSON.`); });
    })
    .then(start)
    .catch(e => showError("Could not load this lesson.", e.message));
})();
</script>
</body>
</html>
