<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Concept Class — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Noto+Sans+Tamil:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --gold:#C9962A; --sandal:#E8C99A;
  --board-dark:#163016; --board-mid:#1b3d1b;
  --chalk:#f2efe9; --chalk-dim:#c8c4be;
  --chalk-yellow:#f5e87a; --chalk-blue:#a8d8f0;
  --chalk-red:#f4a0a0; --chalk-green:#a8e6a8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0c08;font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;}
.hidden{display:none !important;}

/* ═══ SETUP ═══ */
#setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a1200 0%,#080808 70%);padding:2rem;}
#setup h1{font-family:'Caveat',cursive;font-size:clamp(2.4rem,6vw,4rem);color:var(--gold);
  text-align:center;text-shadow:0 0 40px rgba(201,150,42,.4);}
#setup p.sub{color:var(--sandal);opacity:.85;margin:.4rem 0 2rem;text-align:center;}
.setup-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(201,150,42,.3);
  border-radius:18px;padding:1.6rem;width:100%;max-width:620px;}
.fld{margin-bottom:1.1rem;}
.fld label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sandal);margin-bottom:.45rem;}
.fld select{width:100%;padding:.8rem .9rem;border-radius:10px;background:#161a12;color:#fff;
  border:1.5px solid rgba(201,150,42,.35);font-family:'Nunito',sans-serif;font-size:1rem;}
.chip-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.chip{flex:1;min-width:120px;padding:.85rem .6rem;border-radius:12px;text-align:center;cursor:pointer;
  background:rgba(255,255,255,.03);border:2px solid rgba(201,150,42,.3);color:var(--sandal);
  font-weight:700;transition:.18s;font-size:.95rem;}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--maroon);border-color:var(--gold);color:#fff;}
.start-btn{width:100%;margin-top:.4rem;padding:1rem;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#6B1A1A,#8f2626);color:#fff;font-size:1.15rem;font-weight:700;
  font-family:'Nunito',sans-serif;letter-spacing:.03em;}
.start-btn:hover{filter:brightness(1.12);}

/* ═══ CLASSROOM ═══ */
#room{display:none;min-height:100vh;flex-direction:column;}
#room.show{display:flex;}
.topbar{background:linear-gradient(90deg,#4d1212,#6B1A1A);padding:.7rem 1.1rem;
  display:flex;align-items:center;gap:.8rem;border-bottom:2px solid rgba(201,150,42,.4);}
.topbar h2{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--sandal);}
.topbar .grow{flex:1;}
.topbar .meta{font-size:.85rem;color:rgba(232,201,154,.8);}
.tb-btn{padding:.5rem .9rem;border-radius:10px;cursor:pointer;font-weight:700;font-size:.9rem;
  background:rgba(0,0,0,.25);border:1.5px solid rgba(232,201,154,.45);color:var(--sandal);}
.tb-btn:hover{background:rgba(0,0,0,.45);}

.main{flex:1;display:flex;gap:14px;padding:14px;align-items:stretch;}
.stage-wrap{flex:1.35;min-width:0;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--board-dark),var(--board-mid));
  border:3px solid #3b2a12;border-radius:16px;overflow:hidden;position:relative;}
#stage{flex:1;min-height:340px;position:relative;}
#stage canvas{display:block;width:100%;height:100%;}
#label-layer{position:absolute;inset:0;pointer-events:none;}
.face-lbl{position:absolute;transform:translate(-50%,-50%);font-family:'Caveat',cursive;
  font-size:2rem;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(0,0,0,.85);
  background:rgba(20,12,7,.6);border-radius:50%;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;transition:opacity .25s;}
#shape-chip{position:absolute;top:12px;left:14px;font-family:'Caveat',cursive;font-size:1.7rem;
  color:var(--chalk-yellow);text-shadow:0 0 12px rgba(0,0,0,.6);}
#count-badge{position:absolute;top:12px;right:14px;text-align:center;padding:.5rem .9rem;
  border-radius:12px;background:rgba(0,0,0,.4);border:1.5px solid rgba(232,201,154,.4);opacity:0;
  transition:opacity .3s;}
#count-badge.on{opacity:1;}
#count-badge .cb-lab{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sandal);}
#count-badge .cb-val{font-family:'Caveat',cursive;font-size:2.4rem;color:var(--chalk-yellow);line-height:1;}
.stage-tools{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem;border-top:1.5px dashed rgba(232,201,154,.25);}
.tool{padding:.5rem .85rem;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:700;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(232,201,154,.3);color:var(--sandal);}
.tool:hover{background:rgba(255,255,255,.12);}
.tool.on{background:rgba(201,150,42,.25);border-color:var(--gold);color:#fff;}

/* Notes panel */
.notes{flex:1;min-width:280px;max-width:430px;background:rgba(0,0,0,.28);
  border:2.5px solid #3b2a12;border-radius:16px;padding:14px;display:flex;flex-direction:column;}
.notes h3{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--chalk-yellow);
  border-bottom:1.5px dashed rgba(232,201,154,.3);padding-bottom:.4rem;margin-bottom:.7rem;}
#note-list{flex:1;overflow-y:auto;}
.note-item{font-family:'Kalam',cursive;font-size:1.08rem;color:var(--chalk);
  margin-bottom:.75rem;opacity:0;transform:translateY(8px);animation:noteIn .45s ease forwards;
  line-height:1.5;}
.note-item.k-title{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--chalk-yellow);}
.note-item.k-key{color:var(--chalk-green);}
.note-item.k-ask{color:var(--chalk-blue);}
@keyframes noteIn{to{opacity:1;transform:none;}}
.fec-row{display:flex;gap:.5rem;margin-top:.6rem;}
.fec{flex:1;text-align:center;padding:.5rem .2rem;border-radius:10px;
  background:rgba(255,255,255,.04);border:1.4px solid rgba(201,150,42,.38);}
.fec .l{font-family:'Kalam',cursive;font-size:.78rem;color:var(--sandal);}
.fec .v{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--chalk-yellow);line-height:1;}

/* Pattern stage */
#pattern-stage{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;}
#pattern-stage.show{display:flex;}
#pat-strip{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;}
.pat-cell{width:82px;height:82px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:2px dashed rgba(232,201,154,.3);
  opacity:0;transform:scale(.7);animation:patIn .4s ease forwards;}
.pat-cell.q{border-style:solid;border-color:var(--gold);background:rgba(201,150,42,.12);}
.pat-cell svg{width:60px;height:60px;}
.pat-cell .num{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--chalk-yellow);}
@keyframes patIn{to{opacity:1;transform:none;}}
#pat-options{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center;}
.pat-opt{width:96px;height:96px;border-radius:14px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.05);border:2px solid rgba(232,201,154,.35);transition:.18s;}
.pat-opt:hover{border-color:var(--gold);transform:translateY(-3px);}
.pat-opt.right{border-color:#6ee7a0;background:rgba(110,231,160,.18);}
.pat-opt.wrong{border-color:#f4a0a0;background:rgba(244,160,160,.15);}
.pat-opt svg{width:64px;height:64px;}
.pat-opt .num{font-family:'Caveat',cursive;font-size:2.4rem;color:var(--chalk-yellow);}
#pat-msg{margin-top:18px;font-family:'Caveat',cursive;font-size:1.7rem;color:var(--chalk-green);min-height:2rem;}

/* Bottom bar */
.botbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.7rem 1rem;
  background:linear-gradient(90deg,#1a1008,#241609);border-top:2px solid rgba(201,150,42,.35);}
.bb{padding:.6rem 1rem;border-radius:11px;cursor:pointer;font-weight:700;font-size:.92rem;
  border:1.6px solid rgba(232,201,154,.35);background:rgba(255,255,255,.05);color:var(--sandal);}
.bb:hover{background:rgba(255,255,255,.13);}
.bb.primary{background:#1d4ed8;border-color:#3b82f6;color:#fff;}
.bb.stop{background:#7f1d1d;border-color:#dc2626;color:#fff;}
.bb:disabled{opacity:.4;cursor:not-allowed;}
.stepcount{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--sandal);padding:0 .6rem;}
.spacer{flex:1;}

#loading{position:fixed;inset:0;background:rgba(6,8,5,.92);display:none;align-items:center;
  justify-content:center;flex-direction:column;z-index:60;}
#loading.show{display:flex;}
#loading .ring{width:54px;height:54px;border:4px solid rgba(201,150,42,.25);
  border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{margin-top:1rem;color:var(--sandal);font-family:'Caveat',cursive;font-size:1.4rem;}

@media(max-width:900px){
  .main{flex-direction:column;}
  .notes{max-width:none;}
  #stage{min-height:300px;}
}
</style>
</head>
<body>

<!-- ══════ SETUP ══════ -->
<div id="setup">
  <h1>Maths Concept Class</h1>
  <p class="sub">Understand the idea first — models you can turn, open and count</p>
  <div class="setup-card">
    <div class="fld">

      <select id="sel-class">
        <option>LKG</option><option>UKG</option>
        <option>Class 1</option><option selected>Class 2</option><option>Class 3</option>

        <option>Class 7</option><option>Class 8</option><option>Class 9</option>
        <option>Class 10</option><option>Class 11</option><option>Class 12</option>
      </select>

      <label>Concept</label>
      <div class="chip-row" id="topic-row">
        <div class="chip on" data-topic="shapes">3D Shapes</div>
        <div class="chip" data-topic="patterns">Patterns</div>
      </div>
    </div>
    <div class="fld">
      <label>Teaching language</label>
      <div class="chip-row" id="lang-row">
        <div class="chip on" data-lang="english">English</div>

        <div class="chip" data-lang="both">Both</div>

    </div>
    <button class="start-btn" id="btn-start">Start the class</button>
  </div>
</div>

<!-- ══════ CLASSROOM ══════ -->
<div id="room">
  <div class="topbar">
    <h2>Maths Concept Class</h2>
    <span class="meta" id="hdr-meta"></span>
    <span class="grow"></span>
    <span class="tb-btn" id="btn-back">← Back</span>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div id="stage">
        <div id="shape-chip"></div>
        <div id="count-badge"><div class="cb-lab" id="cb-lab">Faces</div><div class="cb-val" id="cb-val">0</div></div>
        <div id="label-layer"></div>
      </div>
      <div id="pattern-stage">
        <div id="pat-strip"></div>
        <div id="pat-options"></div>
        <div id="pat-msg"></div>
      </div>
      <div class="stage-tools" id="stage-tools"></div>
    </div>

    <div class="notes">
      <h3 id="notes-title">On the board</h3>
      <div id="note-list"></div>
      <div class="fec-row" id="fec-row" style="display:none;">
        <div class="fec"><div class="l">Faces</div><div class="v" id="fec-f">–</div></div>
        <div class="fec"><div class="l">Edges</div><div class="v" id="fec-e">–</div></div>
        <div class="fec"><div class="l">Corners</div><div class="v" id="fec-c">–</div></div>
      </div>

  <div class="botbar">
    <button class="bb" id="btn-prev">◀ Prev</button>

    <button class="bb stop" id="btn-new">New</button>

</div>

<div id="loading"><div class="ring"></div><p id="loading-msg">Getting the class ready…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   MATHS CONCEPT CLASS — DigiSmartSchool
   Teaches the IDEA (not the sums). Math Class stays the problem solver.
   Models are hand-built so they are always correct; the AI only speaks.
   ════════════════════════════════════════════════════════════ */

var $ = function(id){ return document.getElementById(id); };

/* ── Lesson state ── */
var CLS      = 'Class 2';
var TOPIC    = 'shapes';
var LANG     = 'english';
var BAND     = 'junior';
var STEPS    = [];
var IDX      = 0;
var PLAYING  = false;
var SEQ      = 0;          // cancels a step that is still running
var VOICE_ON = true;
var SAY_OVERRIDE = {};     // AI-written narration, keyed by step id

/* ── Age bands ── */
function bandFor(cls){
  var m = String(cls || '').match(/\d+/);
  if(!m) return 'junior';                 // LKG / UKG
  var n = parseInt(m[0], 10);
  if(n <= 3) return 'junior';
  if(n <= 7) return 'middle';
  return 'senior';
}
var PALETTE = {
  junior: { faces: [0xF4693B, 0xF7B32B, 0x3FA9F5, 0x5FD08B, 0xB06CF0, 0xFF7EB6],
            edge: 0xFFF3D6, corner: 0xFFD86A, hi: 0xFFFFFF, edgeR: 0.030, cornerR: 0.075 },
  middle: { faces: [0xC96A4A, 0xC9963A, 0x4A88C9, 0x4FA97A, 0x8A6BB0, 0xC97AA0],
            edge: 0xF0EAD8, corner: 0xE8C99A, hi: 0xFFF6C9, edgeR: 0.024, cornerR: 0.060 },
  senior: { faces: [0x51684F, 0x5A6B4C, 0x4C6360, 0x566B56, 0x5E6450, 0x4F6157],
            edge: 0xEDE9DD, corner: 0xE8C99A, hi: 0xF5E87A, edgeR: 0.018, cornerR: 0.048 }
};

/* ════════ THREE.JS SCENE ════════ */
var scene, camera, renderer, root, extras, curShape = null;
var autoSpin = true, camDist = 5.4;
var LABELS = [];           // [{obj:faceObj, n:int, el:div}]

function initThree(){
  var host = $('stage');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0.55, camDist);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  host.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  var d1 = new THREE.DirectionalLight(0xffffff, 0.75); d1.position.set(4, 6, 7); scene.add(d1);
  var d2 = new THREE.DirectionalLight(0xffffff, 0.30); d2.position.set(-5, -2, -4); scene.add(d2);

  root   = new THREE.Group(); scene.add(root);
  extras = new THREE.Group(); root.add(extras);

  resizeThree();
  window.addEventListener('resize', resizeThree);
  bindDrag(host);
  renderLoop();
}
function resizeThree(){
  if(!renderer) return;
  var host = $('stage');
  var w = host.clientWidth || 600, h = host.clientHeight || 400;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
function bindDrag(host){
  var down = false, lx = 0, ly = 0;
  host.addEventListener('pointerdown', function(e){ down = true; lx = e.clientX; ly = e.clientY; autoSpin = false; syncTools(); });
  window.addEventListener('pointerup',   function(){ down = false; });
  window.addEventListener('pointermove', function(e){
    if(!down) return;
    root.rotation.y += (e.clientX - lx) * 0.008;
    root.rotation.x += (e.clientY - ly) * 0.008;
    root.rotation.x = Math.max(-1.2, Math.min(1.2, root.rotation.x));
    lx = e.clientX; ly = e.clientY;
  });
}
function renderLoop(){
  requestAnimationFrame(renderLoop);
  if(autoSpin && root) root.rotation.y += 0.0055;
  if(renderer) renderer.render(scene, camera);
  updateLabels();
}

/* ── Screen-space numbers that sit on the faces ── */
function updateLabels(){
  if(!LABELS.length || !camera) return;
  var host = $('stage'), W = host.clientWidth, H = host.clientHeight;
  var wp = new THREE.Vector3(), wn = new THREE.Vector3();
  for(var i = 0; i < LABELS.length; i++){
    var L = LABELS[i];
    L.obj.mesh.updateWorldMatrix(true, false);
    wp.copy(L.obj.center).applyMatrix4(L.obj.mesh.matrixWorld);
    wn.copy(L.obj.normal).transformDirection(L.obj.mesh.matrixWorld);
    var toCam = new THREE.Vector3().subVectors(camera.position, wp);
    var facing = wn.dot(toCam.normalize()) > 0.12;
    var p = wp.clone().project(camera);
    L.el.style.left = ((p.x * 0.5 + 0.5) * W) + 'px';
    L.el.style.top  = ((-p.y * 0.5 + 0.5) * H) + 'px';
    L.el.style.opacity = (facing && p.z < 1) ? '1' : '0';
  }
}
function addLabel(obj, n){
  var el = document.createElement('div');
  el.className = 'face-lbl'; el.textContent = String(n);
  $('label-layer').appendChild(el);
  LABELS.push({ obj: obj, n: n, el: el });
}
function clearLabels(){ LABELS = []; $('label-layer').innerHTML = ''; }

/* ════════ SHAPE BUILDERS ════════ */
function faceMat(col){
  return new THREE.MeshPhongMaterial({ color: col, side: THREE.DoubleSide,
    shininess: 12, flatShading: false, transparent: true, opacity: 0.97 });
}
function plane(w, h, col){
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), faceMat(col));
  return m;
}
function edgeBar(p1, p2, rad, col){
  var dir = new THREE.Vector3().subVectors(p2, p1);
  var len = dir.length();
  var mesh = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, len, 8),
    new THREE.MeshPhongMaterial({ color: col, shininess: 30 }));
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}
function dot(pos, rad, col){
  var m = new THREE.Mesh(new THREE.SphereGeometry(rad, 16, 12),
    new THREE.MeshPhongMaterial({ color: col, shininess: 40 }));
  m.position.copy(pos);
  return m;
}

/* Cube / cuboid built as a hinged net. fold = 1 -> solid box, 0 -> flat net. */
function buildBox(w, h, d, pal){
  var g = new THREE.Group();
  var C = pal.faces;
  var F = [];

  var front = plane(w, h, C[0]); g.add(front);
  F.push({ mesh: front, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: C[0], name: 'front' });

  function hinge(px, py, axis, sign, pw, ph, cx, cy, col, nm){
    var hg = new THREE.Group(); hg.position.set(px, py, 0); g.add(hg);
    var pl = plane(pw, ph, col); pl.position.set(cx, cy, 0); hg.add(pl);
    F.push({ mesh: pl, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: col, name: nm });
    return { group: hg, axis: axis, sign: sign };
  }
  var hR = hinge( w / 2, 0, 'y',  1, d, h,  d / 2, 0, C[1], 'right');
  var hL = hinge(-w / 2, 0, 'y', -1, d, h, -d / 2, 0, C[2], 'left');
  var hT = hinge(0,  h / 2, 'x', -1, w, d, 0,  d / 2, C[3], 'top');
  var hB = hinge(0, -h / 2, 'x',  1, w, d, 0, -d / 2, C[4], 'bottom');

  // back face hangs off the far edge of the top face
  var hBk = new THREE.Group(); hBk.position.set(0, d, 0); hT.group.add(hBk);
  var back = plane(w, h, C[5]); back.position.set(0, h / 2, 0); hBk.add(back);
  F.push({ mesh: back, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: C[5], name: 'back' });

  var hinges = [hR, hL, hT, hB];
  function setFold(t){
    var a = (Math.PI / 2) * t;
    hR.group.rotation.y =  a;
    hL.group.rotation.y = -a;
    hT.group.rotation.x = -a;
    hB.group.rotation.x =  a;
    hBk.rotation.x      = -a;
    g.position.z = t * d / 2;
  }
  setFold(1);

  // edges + corners live on a centred box (only shown while folded)
  var E = [], V = [];
  var hx = w / 2, hy = h / 2, hz = d / 2;
  var c = [];
  [-1, 1].forEach(function(sx){ [-1, 1].forEach(function(sy){ [-1, 1].forEach(function(sz){
    c.push(new THREE.Vector3(sx * hx, sy * hy, sz * hz));
  }); }); });
  function idx(sx, sy, sz){ return ((sx > 0 ? 1 : 0) * 4) + ((sy > 0 ? 1 : 0) * 2) + (sz > 0 ? 1 : 0); }
  var pairs = [];
  [-1, 1].forEach(function(sy){ [-1, 1].forEach(function(sz){ pairs.push([idx(-1, sy, sz), idx(1, sy, sz)]); }); });
  [-1, 1].forEach(function(sx){ [-1, 1].forEach(function(sz){ pairs.push([idx(sx, -1, sz), idx(sx, 1, sz)]); }); });
  [-1, 1].forEach(function(sx){ [-1, 1].forEach(function(sy){ pairs.push([idx(sx, sy, -1), idx(sx, sy, 1)]); }); });
  pairs.forEach(function(p){ E.push(edgeBar(c[p[0]], c[p[1]], pal.edgeR, pal.edge)); });
  c.forEach(function(p){ V.push(dot(p, pal.cornerR, pal.corner)); });

  return { group: g, faces: F, edges: E, corners: V, setFold: setFold, foldable: true,
           hinges: hinges, netW: w + 2 * d, netH: 2 * h + 2 * d, netCY: h / 2 };
}

function buildCylinder(r, h, pal){
  var g = new THREE.Group(), C = pal.faces, F = [];
  var side = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 56, 1, true), faceMat(C[0]));
  g.add(side);
  F.push({ mesh: side, center: new THREE.Vector3(0, 0, r), normal: new THREE.Vector3(0, 0, 1), base: C[0], name: 'curved' });

  var top = new THREE.Mesh(new THREE.CircleGeometry(r, 56), faceMat(C[1]));
  top.rotation.x = -Math.PI / 2; top.position.y = h / 2; g.add(top);
  F.push({ mesh: top, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: C[1], name: 'top' });

  var bot = new THREE.Mesh(new THREE.CircleGeometry(r, 56), faceMat(C[2]));
  bot.rotation.x = Math.PI / 2; bot.position.y = -h / 2; g.add(bot);
  F.push({ mesh: bot, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: C[2], name: 'bottom' });

  var E = [];
  [h / 2, -h / 2].forEach(function(y){
    var t = new THREE.Mesh(new THREE.TorusGeometry(r, pal.edgeR, 8, 64),
      new THREE.MeshPhongMaterial({ color: pal.edge, shininess: 30 }));
    t.rotation.x = Math.PI / 2; t.position.y = y; E.push(t);
  });
  return { group: g, faces: F, edges: E, corners: [], setFold: null, foldable: false };
}

function buildCone(r, h, pal){
  var g = new THREE.Group(), C = pal.faces, F = [];
  var side = new THREE.Mesh(new THREE.ConeGeometry(r, h, 56, 1, true), faceMat(C[0]));
  g.add(side);
  F.push({ mesh: side, center: new THREE.Vector3(0, -h * 0.12, r * 0.55),
           normal: new THREE.Vector3(0, 0.35, 1).normalize(), base: C[0], name: 'curved' });

  var bot = new THREE.Mesh(new THREE.CircleGeometry(r, 56), faceMat(C[1]));
  bot.rotation.x = Math.PI / 2; bot.position.y = -h / 2; g.add(bot);
  F.push({ mesh: bot, center: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), base: C[1], name: 'base' });

  var ring = new THREE.Mesh(new THREE.TorusGeometry(r, pal.edgeR, 8, 64),
    new THREE.MeshPhongMaterial({ color: pal.edge, shininess: 30 }));
  ring.rotation.x = Math.PI / 2; ring.position.y = -h / 2;

  return { group: g, faces: F, edges: [ring],
           corners: [dot(new THREE.Vector3(0, h / 2, 0), pal.cornerR * 1.2, pal.corner)],
           setFold: null, foldable: false };
}

function buildSphere(r, pal){
  var g = new THREE.Group(), C = pal.faces;
  var s = new THREE.Mesh(new THREE.SphereGeometry(r, 56, 36), faceMat(C[0]));
  g.add(s);
  return { group: g,
    faces: [{ mesh: s, center: new THREE.Vector3(0, 0, r), normal: new THREE.Vector3(0, 0, 1), base: C[0], name: 'curved' }],
    edges: [], corners: [], setFold: null, foldable: false };
}

/* ── small helpers ── */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function ease(k){ return k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k; }
function tween(ms, fn){
  return new Promise(function(res){
    var t0 = performance.now();
    (function frame(now){
      var k = Math.min(1, (now - t0) / ms);
      fn(ease(k));
      if(k < 1) requestAnimationFrame(frame); else res();
    })(performance.now());
  });
}

async function actUnfold(mySeq){
  if(!curShape || !curShape.foldable) { await sleep(600); return; }
  clearLabels(); $('count-badge').classList.remove('on');
  autoSpin = false; syncTools();
  curShape.edges.forEach(function(m){ m.visible = false; });
  curShape.corners.forEach(function(m){ m.visible = false; });
  var r0 = { x: root.rotation.x, y: root.rotation.y };
  var d0 = camDist, y0 = camera.position.y;
  var fit = netCamera(curShape);
  await tween(1500, function(k){
    if(mySeq !== SEQ) return;
    curShape.setFold(1 - k);
    root.rotation.x = r0.x * (1 - k);
    root.rotation.y = r0.y * (1 - k);
    camDist = d0 + (fit.dist - d0) * k;
    camera.position.set(0, y0 + (fit.y - y0) * k, camDist);
  });
  if(mySeq !== SEQ) return;
  // number the flat faces so they can be counted again
  var pal = PALETTE[BAND] || PALETTE.junior;
  for(var i = 0; i < curShape.faces.length; i++){

    litFace(curShape.faces[i], true, pal);
    addLabel(curShape.faces[i], i + 1);

    litFace(curShape.faces[i], false, pal);

  if(!curShape || !curShape.foldable){ await sleep(400); return; }
  clearLabels();
  var d0 = camDist, y0 = camera.position.y;
  await tween(1100, function(k){
    if(mySeq !== SEQ) return;
    curShape.setFold(k);
    camDist = d0 + (5.4 - d0) * k;
    camera.position.set(0, y0 + (0.55 - y0) * k, camDist);
  });
  root.rotation.set(0.18, -0.5, 0);
  autoSpin = true; syncTools();
}
/* how far back the camera must sit to show the whole flat net */
function netCamera(S){
  var host = $('stage');
  var aspect = (host.clientWidth || 600) / (host.clientHeight || 400);
  var tanH = Math.tan((camera.fov * Math.PI / 180) / 2);
  var dH = (S.netH / 2) / tanH;
  var dW = (S.netW / 2) / (tanH * aspect);
  return { dist: Math.max(dH, dW) * 1.16, y: S.netCY };
}

/* rotate the model so a given face points at the camera */
function turnToFace(obj, ms){
  obj.mesh.updateWorldMatrix(true, false);
  var n = obj.normal.clone().transformDirection(obj.mesh.matrixWorld);
  // undo current root rotation to get the face normal in root-local space
  var inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  var nl = n.clone().transformDirection(inv).normalize();
  var targetY = Math.atan2(nl.x, nl.z);
  var targetX = -Math.asin(Math.max(-1, Math.min(1, nl.y)));
  var y0 = root.rotation.y, x0 = root.rotation.x;
  var dy = -targetY - y0, dx = -targetX - x0;
  while(dy >  Math.PI) dy -= Math.PI * 2;
  while(dy < -Math.PI) dy += Math.PI * 2;
  dx = Math.max(-1.5, Math.min(1.5, x0 + dx)) - x0;
  return tween(ms || 420, function(k){
    root.rotation.y = y0 + dy * k;
    root.rotation.x = x0 + dx * k;
  });
}

function cellHTML(item, kind){
  if(kind === 'number' || typeof item === 'number') return '<span class="num">' + item + '</span>';

function renderPattern(p, mySeq){
  var strip = $('pat-strip'), opts = $('pat-options');
  strip.innerHTML = ''; opts.innerHTML = ''; $('pat-msg').textContent = '';
  return (async function(){
    for(var i = 0; i < p.seq.length; i++){

      var c = document.createElement('div');
      c.className = 'pat-cell';
      c.innerHTML = cellHTML(p.seq[i], p.kind);
      strip.appendChild(c);

    }
    if(mySeq !== SEQ) return;
    var q = document.createElement('div');
    q.className = 'pat-cell q';
    q.innerHTML = '<span class="num">?</span>';

    p.opts.forEach(function(o){
      var b = document.createElement('div');
      b.className = 'pat-opt';
      b.innerHTML = cellHTML(o, p.kind);

          ? (o === p.answer)
          : (o[0] === p.answer[0] && o[1] === p.answer[1] && (o[2] || 1) === (p.answer[2] || 1));
        b.classList.add(same ? 'right' : 'wrong');
        if(same){
          q.classList.remove('q');
          q.innerHTML = cellHTML(p.answer, p.kind);
          $('pat-msg').textContent = 'Correct! ' + p.rule;

          $('pat-msg').textContent = 'Look at the pattern once more.';
        }
      };
      opts.appendChild(b);

}

/* ════════ LESSON BUILDING ════════ */
function shapesLesson(band){

  S.push({ id:'intro', act:'intro', note:{ k:'title', t:'3D Shapes' } });
  order.forEach(function(sh){
    var I = SHAPE_INFO[sh];

      note:{ k:'title', t: I.en.charAt(0).toUpperCase() + I.en.slice(1) } });
    S.push({ id: sh + '_faces', act:'faces', shape: sh,
      note:{ k:'key', t: 'A flat side is called a FACE. A ' + I.en + ' has ' + I.f + ' face' + (I.f > 1 ? 's' : '') + '.' } });
    if(I.e > 0) S.push({ id: sh + '_edges', act:'edges', shape: sh,
      note:{ k:'key', t: 'Where two faces meet we get an EDGE. A ' + I.en + ' has ' + I.e + ' edge' + (I.e > 1 ? 's' : '') + '.' } });
    else S.push({ id: sh + '_edges', act:'edges', shape: sh,
      note:{ k:'key', t: 'A ' + I.en + ' has no edges at all.' } });
    if(I.v > 0) S.push({ id: sh + '_corners', act:'corners', shape: sh,

    else S.push({ id: sh + '_corners', act:'corners', shape: sh,
      note:{ k:'key', t: 'A ' + I.en + ' has no corners.' } });
    if(sh === 'cube' || sh === 'cuboid'){

      S.push({ id: sh + '_close', act:'fold', shape: sh,

    case 'edges':
      en = (sh && sh.e > 0)
        ? 'Where two faces meet, we get a line. That line is called an edge. The ' + nm + ' has ' + sh.e + ' edges.'
        : 'Run your finger over the ' + nm + '. It is smooth everywhere. So the ' + nm + ' has no edges.';
      ta = (sh && sh.e > 0)
        ? 'இரண்டு faces சந்திக்கும் இடத்தில் ஒரு கோடு கிடைக்கும். அதற்கு edge என்று பெயர். ' + nm + '-ல் ' + sh.e + ' edges உள்ளன.'
        : nm + '-ஐ விரலால் தடவிப் பாருங்கள். எங்கும் மென்மையாக இருக்கும். எனவே edges இல்லை.';
      break;
    case 'corners':
      en = (sh && sh.v > 0)
        ? 'Where the edges meet at a point, that point is called a corner. In big classes we call it a vertex. The ' + nm + ' has ' + sh.v + '.'
        : 'The ' + nm + ' has no sharp point anywhere, so it has no corners.';
      ta = (sh && sh.v > 0)
        ? 'Edges சந்திக்கும் புள்ளிக்கு corner என்று பெயர். பெரிய வகுப்புகளில் இதை vertex என்போம். ' + nm + '-ல் ' + sh.v + ' உள்ளன.'
        : nm + '-ல் கூர்மையான புள்ளி எதுவும் இல்லை, எனவே corners இல்லை.';
      break;
    case 'unfold':
      en = 'Now watch carefully. I am going to open the ' + nm + ' out flat, just like opening a biscuit carton. '
         + 'This flat picture is called the net. Count the faces once more — ' + (sh ? sh.f : '') + '.';
      ta = 'இப்போது கவனமாகப் பாருங்கள். ' + nm + '-ஐ biscuit carton மாதிரி விரித்துக் காட்டுகிறேன். '
         + 'இந்தத் தட்டையான படத்திற்கு net என்று பெயர். மீண்டும் faces-ஐ எண்ணுங்கள் — ' + (sh ? sh.f : '') + '.';
      break;
    case 'fold':
      en = 'Now I fold it back, and we have our ' + nm + ' again. The same six faces, just closed up.';
      ta = 'இப்போது மீண்டும் மடித்து வைக்கிறேன், நமது ' + nm + ' கிடைத்துவிட்டது. அதே faces தான், மூடிவிட்டோம்.';
      break;
    case 'recap':
      en = 'So remember these three words. A face is a flat side. An edge is the line where two faces meet. '
         + 'A corner is the point where edges meet. Face, edge, corner.';
      ta = 'இந்த மூன்று வார்த்தைகளை நினைவில் வையுங்கள். Face என்பது தட்டையான பக்கம். '
         + 'Edge என்பது இரண்டு faces சந்திக்கும் கோடு. Corner என்பது edges சந்திக்கும் புள்ளி.';
      break;
    case 'pintro':
      en = 'A pattern is something that repeats in a rule. If we find the rule, we can always say what comes next. Let us try.';
      ta = 'ஒரு விதிப்படி திரும்பத் திரும்ப வருவதுதான் pattern. விதியைக் கண்டுபிடித்தால், அடுத்து என்ன வரும் என்று சொல்லிவிடலாம்.';
      break;
    case 'pattern':
      en = 'Look at this line carefully. What should come in the empty box? Tap the one you think is right.';
      ta = 'இந்த வரிசையைக் கவனமாகப் பாருங்கள். காலி இடத்தில் எது வர வேண்டும்? சரியானதைத் தொடுங்கள்.';
      break;
    case 'prule':
      en = 'The rule here is simple: ' + (step.pat ? step.pat.rule : '');
      ta = 'இங்கே விதி எளிது: ' + (step.pat ? step.pat.rule : '');
      break;
    case 'precap':
      en = 'Whenever you see a line of shapes or numbers, first ask — what is repeating? Once you find the rule, the next one is easy.';
      ta = 'வடிவங்கள் அல்லது எண்கள் வரிசையாக இருந்தால், முதலில் கேளுங்கள் — எது திரும்ப வருகிறது? விதி கிடைத்துவிட்டால் அடுத்தது எளிது.';
      break;
  }
  return lang === 'tamil' ? ta : en;
}

/* ── AI enrichment: better wording, same steps. Falls back silently. ── */
async function enrichNarration(){
  var key = 'mcx_say__' + CLS + '__' + TOPIC + '__' + LANG + '__v1';
  try {
    var cached = localStorage.getItem(key);
    if(cached){ SAY_OVERRIDE = JSON.parse(cached); return; }
  } catch(e){}
  var list = STEPS.map(function(s){
    return { id: s.id, act: s.act, shape: s.shape || '', base: sayFor(s, LANG === 'tamil' ? 'tamil' : 'english') };
  });
  var langLine = LANG === 'tamil'
    ? 'Write in Tamil script, BUT keep every maths and textbook word in English letters exactly as printed in the book: cube, cuboid, cylinder, cone, sphere, face, edge, vertex, corner, net, pattern. Never write those words in Tamil script.'
    : 'Write in simple Indian classroom English.';
  var prompt = 'You are a warm, patient Tamil Nadu school teacher taking a ' + CLS + ' class on "'
    + (TOPIC === 'shapes' ? '3D Shapes' : 'Patterns') + '".\n'
    + 'Below is the lesson, step by step, with a basic sentence for each step.\n'
    + 'Rewrite each "base" sentence so it sounds like a real teacher speaking aloud to ' + CLS + ' children.\n'
    + langLine + '\n'
    + 'RULES: Keep the same meaning and the same numbers — never change a face, edge or corner count. '
    + '2 to 3 short sentences per step. Add one everyday Tamil Nadu example where it helps '
    + '(dice, biscuit box, ball, ice cream cone, water tank). No markdown. No extra steps.\n\n'
    + 'STEPS:\n' + JSON.stringify(list) + '\n\n'
    + 'Return ONLY a JSON array like [{"id":"cube_faces","say":"..."}]. Start with [ and end with ].';
  try {
    var r = await fetch('/api/ai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: 'You return ONLY a valid JSON array. No markdown fences, no preamble, no text after the array.',
        prompt: prompt, max_tokens: 4000
      })
    });
    var d = await r.json();
    var txt = d.completion || d.text || d.content || '';
    if(Array.isArray(d.content)) txt = d.content.map(function(x){ return x.text || ''; }).join('');
    txt = String(txt).replace(/```json|```/g, '').trim();
    var a = txt.indexOf('['), b = txt.lastIndexOf(']');
    if(a < 0 || b < 0) return;
    var arr = JSON.parse(txt.slice(a, b + 1));
    var map = {};
    arr.forEach(function(o){ if(o && o.id && o.say) map[o.id] = String(o.say); });
    if(Object.keys(map).length){
      SAY_OVERRIDE = map;
      try { localStorage.setItem(key, JSON.stringify(map)); } catch(e){}
    }
  } catch(e){ /* built-in narration is used */ }
}

/* ════════ VOICE ════════ */
var mcAudio = null, mcSeq = 0;
function stopAudio(){ if(mcAudio){ try{ mcAudio.pause(); }catch(e){} mcAudio = null; } }
function speakBrowser(text, lang){
  return new Promise(function(res){
    if(!VOICE_ON || !('speechSynthesis' in window)) return res();
    try { window.speechSynthesis.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = (lang === 'tamil') ? 'ta-IN' : 'en-IN';
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = function(){ res(); };
    u.onerror = function(){ res(); };
    window.speechSynthesis.speak(u);
    setTimeout(res, Math.min(22000, 1600 + text.length * 62));
  });
}
function speakAsync(text, lang){
  if(!VOICE_ON || !text || !String(text).trim()) return Promise.resolve();
  var my = ++mcSeq;
  try { window.speechSynthesis.cancel(); } catch(e){}
  stopAudio();
  return fetch('/api/voice-class', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: String(text), cls: CLS })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(my !== mcSeq || !VOICE_ON) return;
    if(d && d.audio_b64){
      return new Promise(function(res){
        stopAudio();
        mcAudio = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
        mcAudio.onended = function(){ mcAudio = null; res(); };
        mcAudio.onerror = function(){ res(); };
        mcAudio.play().catch(function(){ speakBrowser(text, lang).then(res); });
      });
    }
    return speakBrowser(text, lang);
  }).catch(function(){ return speakBrowser(text, lang); });
}
async function speakStep(step){
  if(LANG === 'both'){
    await speakAsync(sayOf(step, 'english'), 'english');
    await speakAsync(sayOf(step, 'tamil'), 'tamil');
  } else {
    await speakAsync(sayOf(step, LANG), LANG);
  }
}
function sayOf(step, lang){
  if(lang === LANG && SAY_OVERRIDE[step.id]) return SAY_OVERRIDE[step.id];
  return sayFor(step, lang);
}

/* ════════ PLAYER ════════ */
function addNote(k, t){
  var d = document.createElement('div');
  d.className = 'note-item' + (k ? ' k-' + k : '');
  d.textContent = t;
  $('note-list').appendChild(d);
  $('note-list').scrollTop = $('note-list').scrollHeight;
}
function syncTools(){
  var t = $('tool-spin');
  if(t) t.classList.toggle('on', autoSpin);
}
function buildTools(){
  var box = $('stage-tools');
  box.innerHTML = '';
  if(TOPIC !== 'shapes') return;
  var defs = [
    ['tool-spin',    '⟳ Spin',        function(){ autoSpin = !autoSpin; syncTools(); }],
    ['tool-faces',   '▣ Faces',       function(){ SEQ++; actCountFaces(SEQ); }],
    ['tool-edges',   '／ Edges',      function(){ SEQ++; actCountEdges(SEQ); }],
    ['tool-corners', '• Corners',     function(){ SEQ++; actCountCorners(SEQ); }],
    ['tool-open',    '⬒ Open flat',   function(){ SEQ++; actUnfold(SEQ); }],
    ['tool-close',   '⬔ Fold back',   function(){ SEQ++; actFold(SEQ); }]
  ];
  defs.forEach(function(d){
    var b = document.createElement('div');
    b.className = 'tool'; b.id = d[0]; b.textContent = d[1];
    b.onclick = d[2];
    box.appendChild(b);
  });
  syncTools();
}
async function doAction(step, mySeq){
  if(TOPIC === 'patterns'){
    $('pattern-stage').classList.add('show');
    $('stage').style.display = 'none';
    if(step.act === 'pattern') return renderPattern(step.pat, mySeq);
    return sleep(500);
  }
  switch(step.act){
    case 'show':    showShape(step.shape); autoSpin = true; syncTools(); return sleep(1400);
    case 'faces':   if(!curShape || curShape.name !== step.shape) showShape(step.shape);
                    return actCountFaces(mySeq);
    case 'edges':   return actCountEdges(mySeq);
    case 'corners': return actCountCorners(mySeq);
    case 'unfold':  return actUnfold(mySeq);
    case 'fold':    return actFold(mySeq);
    default:        return sleep(900);
  }
}
async function runStep(i){
  if(i < 0 || i >= STEPS.length) return;
  IDX = i;
  var mySeq = ++SEQ;
  var step = STEPS[i];
  $('stepcount').textContent = 'Step ' + (i + 1) + ' / ' + STEPS.length;
  if(step.note && step.note.t) addNote(step.note.k, step.note.t);
  var vis = doAction(step, mySeq);
  var aud = speakStep(step);
  await Promise.all([vis, aud]);
  if(mySeq !== SEQ) return;
  if(PLAYING && i + 1 < STEPS.length){ runStep(i + 1); }
  else if(i + 1 >= STEPS.length){ PLAYING = false; $('btn-play').textContent = '▶ Play'; }
}
function playPause(){
  PLAYING = !PLAYING;
  $('btn-play').textContent = PLAYING ? '❚❚ Pause' : '▶ Play';
  if(PLAYING) runStep(IDX);
  else { SEQ++; stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function goNext(){ if(IDX + 1 < STEPS.length){ stopAudio(); runStep(IDX + 1); } }
function goPrev(){ if(IDX > 0){ stopAudio(); runStep(IDX - 1); } }
function replay(){ stopAudio(); runStep(IDX); }

/* ════════ START ════════ */
async function startClass(){
  BAND  = bandFor(CLS);
  STEPS = (TOPIC === 'shapes') ? shapesLesson(BAND) : patternsLesson(BAND);
  SAY_OVERRIDE = {};
  $('setup').classList.add('hidden');
  $('room').classList.add('show');
  $('hdr-meta').textContent = CLS + ' · ' + (TOPIC === 'shapes' ? '3D Shapes' : 'Patterns');
  $('note-list').innerHTML = '';
  $('btn-lang').textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');

  if(TOPIC === 'shapes'){
    $('stage').style.display = 'block';
    $('pattern-stage').classList.remove('show');
    if(!renderer) initThree(); else resizeThree();
    $('fec-row').style.display = 'flex';
  } else {
    $('stage').style.display = 'none';
    $('pattern-stage').classList.add('show');
    $('fec-row').style.display = 'none';
  }
  buildTools();

  $('loading').classList.add('show');
  $('loading-msg').textContent = 'Getting the class ready…';
  await enrichNarration();
  $('loading').classList.remove('show');

  IDX = 0; PLAYING = true; $('btn-play').textContent = '❚❚ Pause';
  runStep(0);
}

/* ════════ WIRING ════════ */
document.addEventListener('DOMContentLoaded', function(){
  $('topic-row').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    $('topic-row').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); TOPIC = c.getAttribute('data-topic');
  });
  $('lang-row').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); LANG = c.getAttribute('data-lang');
  });
  $('sel-class').addEventListener('change', function(){ CLS = this.value; });
  $('btn-start').onclick  = function(){ CLS = $('sel-class').value; startClass(); };
  $('btn-play').onclick   = playPause;
  $('btn-next').onclick   = goNext;
  $('btn-prev').onclick   = goPrev;
  $('btn-replay').onclick = replay;
  $('btn-new').onclick    = function(){
    SEQ++; PLAYING = false; stopAudio();
    try{ window.speechSynthesis.cancel(); }catch(e){}
    $('room').classList.remove('show'); $('setup').classList.remove('hidden');
  };
  $('btn-voice').onclick  = function(){
    VOICE_ON = !VOICE_ON;
    this.textContent = VOICE_ON ? '🔊 Voice' : '🔇 Muted';
    if(!VOICE_ON){ stopAudio(); try{ window.speechSynthesis.cancel(); }catch(e){} }
  };
  $('btn-lang').onclick = function(){
    LANG = (LANG === 'english') ? 'tamil' : (LANG === 'tamil' ? 'both' : 'english');
    this.textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');
  };
  $('btn-back').onclick = function(){
    var url = null;
    try { url = sessionStorage.getItem('bb_returnUrl') || sessionStorage.getItem('mcx_returnUrl'); } catch(e){}
    if(url){ window.location.href = url; return; }
    if(window.history.length > 1) window.history.back();
    else window.location.href = '/learnbot.html';
  };
  autostart();
  modelTest();
});

/* ── Launched from TeachBot / LearnBot: skip the setup screen ── */
function autostart(){
  var raw = null;
  try { raw = sessionStorage.getItem('mcx_autostart') || sessionStorage.getItem('bb_autostart'); } catch(e){ return; }
  if(!raw) return;
  try { sessionStorage.removeItem('mcx_autostart'); sessionStorage.removeItem('bb_autostart'); } catch(e){}
  var d; try { d = JSON.parse(raw); } catch(e){ return; }
  if(d.cls) { CLS = d.cls;
    var sel = $('sel-class');
    for(var i = 0; i < sel.options.length; i++){
      if(sel.options[i].value === d.cls || sel.options[i].text === d.cls){ sel.selectedIndex = i; break; }
    }
  }
  if(d.lang === 'tamil') LANG = 'tamil';
  else if(d.lang === 'both') LANG = 'both';
  var hay = ((d.chapter || '') + ' ' + (d.lessonText || '')).toLowerCase();
  TOPIC = /pattern|தொடர்/.test(hay) ? 'patterns' : 'shapes';
  $('topic-row').querySelectorAll('.chip').forEach(function(x){
    x.classList.toggle('on', x.getAttribute('data-topic') === TOPIC);
  });
  startClass();
}

/* ── Visual test: open maths-concept.html#modeltest ── */
function modelTest(){
  if(window.location.hash !== '#modeltest') return;
  CLS = 'Class 2'; TOPIC = 'shapes'; LANG = 'english'; BAND = 'junior';
  VOICE_ON = false;
  $('setup').classList.add('hidden');
  $('room').classList.add('show');
  $('hdr-meta').textContent = 'Model test — all shapes';
  $('stage').style.display = 'block';
  if(!renderer) initThree(); else resizeThree();
  buildTools();
  STEPS = shapesLesson('junior');
  $('note-list').innerHTML = '';
  addNote('title', 'Model test');
  addNote('', 'Use the buttons under the model. Drag to turn it.');
  showShape('cube');
  var order = ['cube', 'cuboid', 'cylinder', 'cone', 'sphere'], k = 0;
  var b = document.createElement('div');
  b.className = 'tool'; b.textContent = '→ Next shape';
  b.onclick = function(){ k = (k + 1) % order.length; SEQ++; showShape(order[k]); };
  $('stage-tools').appendChild(b);
}
