<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DigiSmartSchool — Teaching</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--m:#6B1A1A;--md:#4A0A12;--g:#C9A84C;--gl:#E8C96A;--gd:#A07830;--s:#F5E6C8;--sd:#EDD9A3;--tx:#2A0A0F;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Lexend',sans-serif;background:#1a1a1a;}

/* TOP BAR */
.bar{height:44px;background:linear-gradient(90deg,#4A0A12,#6B1A1A);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:relative;z-index:10;}
.bar-lesson{font-size:0.88rem;font-weight:800;color:var(--gl);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-meta{font-size:0.7rem;color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:7px;}
.bar-pages{font-size:0.7rem;color:rgba(255,255,255,0.4);padding:2px 9px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.2);border-radius:7px;}
.bar-voice{font-size:0.65rem;padding:2px 8px;border-radius:7px;font-weight:700;}
.bar-voice.el{background:#d4edda;color:#155724;}
.bar-voice.ws{background:#fff3cd;color:#856404;}
.bar-sp{flex:1;}
.bar-back{background:rgba(255,255,255,0.08);border:1px solid rgba(201,168,76,0.25);color:var(--s);padding:4px 11px;border-radius:7px;font-family:'Lexend',sans-serif;font-size:0.7rem;font-weight:700;cursor:pointer;}

/* MAIN LAYOUT */
.app{display:flex;height:calc(100vh - 44px);}

/* LEFT: PDF VIEWER (60%) */
.pdf-side{flex:1;display:flex;flex-direction:column;background:#2a2a2a;min-width:0;}
.pdf-nav{height:34px;background:#1a1a1a;display:flex;align-items:center;padding:0 10px;gap:7px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.05);}
.pnb{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:0.75rem;font-weight:700;}
.pnb:disabled{opacity:0.2;cursor:not-allowed;}
.pn-info{display:flex;align-items:center;gap:4px;font-size:0.7rem;color:rgba(255,255,255,0.35);}
.pn-inp{width:36px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);border-radius:3px;padding:1px 4px;font-size:0.7rem;text-align:center;font-family:'Lexend',sans-serif;}
.zoom-row{display:flex;align-items:center;gap:4px;margin-left:auto;}
.zoom-val{font-size:0.62rem;color:rgba(255,255,255,0.3);min-width:30px;text-align:center;}
.lesson-range{font-size:0.65rem;color:rgba(201,168,76,0.6);background:rgba(201,168,76,0.08);padding:2px 8px;border-radius:5px;margin-left:4px;}

.pdf-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:12px;background:#3a3a3a;position:relative;}
.page-box{position:relative;display:inline-block;line-height:0;}
.page-box canvas{display:block;box-shadow:0 4px 24px rgba(0,0,0,0.6);}
.hl{position:absolute;background:rgba(255,220,50,0.32);border:2px solid rgba(255,190,0,0.6);border-radius:3px;pointer-events:none;transition:all 0.3s;z-index:5;}

/* No textbook state */
.no-tb{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;text-align:center;padding:24px;}
.no-tb-icon{font-size:2.5rem;opacity:0.25;}
.no-tb-t{font-size:0.95rem;font-weight:700;color:rgba(255,255,255,0.4);}
.no-tb-s{font-size:0.75rem;color:rgba(255,255,255,0.2);line-height:1.65;max-width:240px;}
.no-tb-link{color:rgba(201,168,76,0.5);font-size:0.72rem;background:none;border:none;border-bottom:1px dashed rgba(201,168,76,0.3);cursor:pointer;padding:0;font-family:'Lexend',sans-serif;margin-top:6px;}

/* Loading bar */
.ld-bar{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.05);z-index:20;display:none;}
.ld-fill{height:2px;background:linear-gradient(90deg,var(--g),var(--gl));width:0%;transition:width 0.3s;}

/* RIGHT: AI PANEL (fixed 280px) */
.ai-side{width:280px;flex-shrink:0;background:#1a1a1a;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,0.05);}
.ai-hdr{padding:9px 13px 7px;font-size:0.6rem;font-weight:800;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:5px;}
.ai-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.12);}
.ai-dot.on{background:#4ade80;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* Current paragraph */
.ai-para{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;}
.ai-para-lbl{font-size:0.57rem;font-weight:800;color:var(--gd);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;}
.ai-para-txt{font-size:0.78rem;line-height:1.7;color:rgba(245,230,200,0.82);font-family:'Lora',serif;max-height:120px;overflow-y:auto;}
.ai-para-txt.mt{color:rgba(255,255,255,0.18);font-size:0.72rem;font-style:italic;}
.ai-pg{font-size:0.6rem;color:var(--gd);margin-top:4px;font-weight:700;}

/* Playback */
.ai-pb{padding:10px 13px;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;}
.pb-row{display:flex;gap:5px;margin-bottom:7px;}
.pb{border:none;border-radius:7px;font-family:'Lexend',sans-serif;font-weight:800;cursor:pointer;padding:7px 0;}
.pb:disabled{opacity:0.25;cursor:not-allowed;}
.pb-main{background:linear-gradient(135deg,var(--gd),var(--g));color:var(--md);flex:1;font-size:0.78rem;}
.pb-sm{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.08);width:34px;font-size:0.78rem;}
.pg-bar{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:5px;}
.pg-fill{height:3px;background:linear-gradient(90deg,var(--g),var(--gl));width:0%;transition:width 0.3s;}
.pb-meta{display:flex;justify-content:space-between;align-items:center;}
.pb-ct{font-size:0.6rem;color:rgba(255,255,255,0.22);}
.spd-row{display:flex;align-items:center;gap:3px;}
.spd-lbl{font-size:0.57rem;color:rgba(255,255,255,0.22);font-weight:700;}
.spd-b{width:18px;height:18px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.45);border-radius:3px;cursor:pointer;font-size:0.7rem;font-weight:800;border-style:solid;}
.spd-v{font-size:0.6rem;color:rgba(255,255,255,0.3);min-width:22px;text-align:center;}

/* AI Explain */
.ai-exp{flex:1;padding:10px 13px;overflow-y:auto;}
.exp-btn{width:100%;padding:6px;background:rgba(26,107,107,0.1);border:1.5px solid rgba(26,107,107,0.18);color:rgba(26,180,180,0.7);border-radius:7px;font-family:'Lexend',sans-serif;font-size:0.68rem;font-weight:700;cursor:pointer;margin-bottom:8px;}
.exp-btn:disabled{opacity:0.25;cursor:not-allowed;}
.exp-box{background:rgba(26,107,107,0.07);border:1px solid rgba(26,107,107,0.12);border-radius:8px;padding:9px;display:none;}
.exp-box.on{display:block;}
.exp-lbl{font-size:0.57rem;font-weight:800;color:rgba(26,180,180,0.7);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;}
.exp-txt{font-size:0.75rem;line-height:1.6;color:rgba(245,230,200,0.78);}

/* ElevenLabs row */
.ai-audio{padding:8px 13px;border-top:1px solid rgba(255,255,255,0.04);flex-shrink:0;}
.aud-row{display:flex;align-items:center;gap:6px;}
.aud-lbl{font-size:0.63rem;color:rgba(255,255,255,0.28);flex:1;}
.aud-btn{padding:4px 9px;background:rgba(26,107,107,0.12);border:1px solid rgba(26,107,107,0.2);color:rgba(26,180,180,0.65);border-radius:5px;font-family:'Lexend',sans-serif;font-size:0.63rem;font-weight:700;cursor:pointer;}
.aud-btn:disabled{opacity:0.25;cursor:not-allowed;}
.aud-pg{width:100%;height:2px;background:rgba(255,255,255,0.04);border-radius:1px;overflow:hidden;margin-top:4px;}
.aud-pg-fill{height:2px;background:#1a6b6b;width:0%;transition:width 0.3s;}

/* BOTTOM CONTROLS */
.btm{height:42px;background:linear-gradient(90deg,#4A0A12,#6B1A1A);display:flex;align-items:center;padding:0 12px;gap:7px;border-top:2px solid rgba(201,168,76,0.15);}
.bc{padding:5px 12px;border:none;border-radius:7px;font-family:'Lexend',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;}
.bc:disabled{opacity:0.22;cursor:not-allowed;}
.bc-nav{background:rgba(255,255,255,0.1);color:var(--s);border:1px solid rgba(255,255,255,0.09);}
.bc-play{background:linear-gradient(135deg,var(--gd),var(--g));color:var(--md);min-width:76px;}
.bc-stop{background:rgba(220,53,69,0.2);color:#ff8888;border:1px solid rgba(220,53,69,0.2);display:none;}
.bc-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.12);}
.bc-dot.on{background:#4ade80;box-shadow:0 0 5px #4ade80;animation:pulse 1s infinite;}
.bc-ct{font-size:0.62rem;color:rgba(255,255,255,0.22);}
.bc-sp{flex:1;}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.1);}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:100vh;">

<!-- TOP BAR -->
<div class="bar">
  <span class="bar-lesson" id="b-lesson">Loading…</span>
  <span class="bar-meta" id="b-meta"></span>
  <span class="bar-pages" id="b-pages"></span>
  <span class="bar-sp"></span>
  <span class="bar-voice ws" id="b-voice">🗣 Browser Voice</span>
  <button class="bar-back" onclick="goBack()">← Back</button>
</div>

<!-- MAIN -->
<div class="app">

  <!-- PDF VIEWER -->
  <div class="pdf-side">
    <div class="pdf-nav">
      <button class="pnb" id="pn-prev" onclick="goPrev()" disabled>◀</button>
      <div class="pn-info">
        <input class="pn-inp" type="number" id="pn-inp" value="1" min="1" onchange="goInp()"/>
        <span>/ <span id="pn-tot">—</span></span>
      </div>
      <button class="pnb" id="pn-next" onclick="goNext()" disabled>▶</button>
      <span class="lesson-range" id="pn-range"></span>
      <div class="zoom-row">
        <button class="pnb" onclick="adjZ(-0.15)">−</button>
        <span class="zoom-val" id="z-val">100%</span>
        <button class="pnb" onclick="adjZ(+0.15)">+</button>
        <button class="pnb" onclick="fitZ()" style="width:auto;padding:0 5px;font-size:0.6rem;">Fit</button>
      </div>
    </div>
    <div class="pdf-wrap" id="pdf-wrap" style="position:relative;">
      <div class="ld-bar" id="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
      <!-- No textbook message -->
      <div class="no-tb" id="no-tb">
        <div class="no-tb-icon">📄</div>
        <div class="no-tb-t" id="no-tb-t">Loading textbook…</div>
        <div class="no-tb-s" id="no-tb-s">Please wait</div>
        <button class="no-tb-link" id="no-tb-link" style="display:none;" onclick="window.location.href='learnbot.html'">← Go back to Teacher Panel</button>
      </div>
      <!-- PDF canvas -->
      <div class="page-box" id="page-box" style="display:none;">
        <canvas id="pdf-cv"></canvas>
        <div id="hl-layer"></div>
      </div>
    </div>
  </div>

  <!-- AI PANEL -->
  <div class="ai-side">
    <div class="ai-hdr"><span class="ai-dot" id="ai-dot"></span>AI Teaching Assistant</div>
    <div class="ai-para">
      <div class="ai-para-lbl">Current Paragraph</div>
      <div class="ai-para-txt mt" id="ai-txt">Press ▶ Play to begin…</div>
      <div class="ai-pg" id="ai-pg"></div>
    </div>
    <div class="ai-pb">
      <div class="pb-row">
        <button class="pb pb-sm" id="p-prev" onclick="prevP()" disabled>◀</button>
        <button class="pb pb-main" id="p-play" onclick="togglePlay()" disabled>▶ Play</button>
        <button class="pb pb-sm" id="p-next" onclick="nextP()" disabled>▶</button>
      </div>
      <div class="pg-bar"><div class="pg-fill" id="pg-fill"></div></div>
      <div class="pb-meta">
        <span class="pb-ct" id="pb-ct">—</span>
        <div class="spd-row">
          <span class="spd-lbl">SPD</span>
          <button class="spd-b" onclick="adjSpd(-0.1)">−</button>
          <span class="spd-v" id="spd-v">1×</span>
          <button class="spd-b" onclick="adjSpd(+0.1)">+</button>
        </div>
      </div>
    </div>
    <div class="ai-exp">
      <div style="display:flex;gap:5px;margin-bottom:8px;">
        <button class="exp-btn" id="exp-btn" onclick="toggleExp()" disabled style="flex:1;margin-bottom:0;">💡 Explain This Paragraph</button>
        <button id="exp-stop-btn" onclick="stopExp()" style="display:none;padding:6px 9px;background:rgba(220,53,69,0.15);border:1px solid rgba(220,53,69,0.25);color:#ff8888;border-radius:7px;font-family:Lexend,sans-serif;font-size:0.68rem;font-weight:700;cursor:pointer;">■ Stop</button>
      </div>
      <div class="exp-box" id="exp-box">
        <div class="exp-lbl">Simple Explanation</div>
        <div class="exp-txt" id="exp-txt"></div>
      </div>
    </div>
    <div class="ai-audio">
      <div class="aud-row">
        <span class="aud-lbl" id="aud-lbl">🎙 ElevenLabs Voice</span>
        <button class="aud-btn" id="aud-btn" onclick="genAudio()" disabled>Generate</button>
      </div>
      <div class="aud-pg"><div class="aud-pg-fill" id="aud-fill"></div></div>
    </div>
  </div>
</div>

<!-- BOTTOM CONTROLS -->
<div class="btm">
  <button class="bc bc-nav" id="bc-prev" onclick="prevP()" disabled>◀ Prev</button>
  <button class="bc bc-play" id="bc-play" onclick="togglePlay()" disabled>▶ Play</button>
  <button class="bc bc-stop" id="bc-stop" onclick="stopAll()">■ Stop</button>
  <button class="bc bc-nav" id="bc-next" onclick="nextP()" disabled>Next ▶</button>
  <span class="bc-dot" id="bc-dot"></span>
  <span class="bc-ct" id="bc-ct"></span>
  <span class="bc-sp"></span>
</div>

</div><!-- app wrapper -->

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── STATE ──
var pdfDoc=null,curPg=1,totPg=0,zoom=1.0,fitScale=1.0;
var paras=[],curPara=0,playing=false,spd=1.0,ptimer=null;
var audioMap={},curAudio=null,lessonId='';
var rtask=null,idb=null;
var lessonFrom=0,lessonTo=0,bookId='';

// ── IDB ──
function openIDB(){return new Promise(function(res){var q=indexedDB.open('dss_textbooks',1);q.onupgradeneeded=function(e){e.target.result.createObjectStore('pdfs',{keyPath:'key'});};q.onsuccess=function(e){idb=e.target.result;res(true);};q.onerror=function(){res(false);};});}
function getPdf(k){return new Promise(function(r){if(!idb){r(null);return;}try{var tx=idb.transaction('pdfs','readonly');var q=tx.objectStore('pdfs').get(k);q.onsuccess=function(e){r(e.target.result||null);};q.onerror=function(){r(null);};}catch(e){r(null);}});}

// ── INIT ──
window.addEventListener('load',async function(){
  if(typeof speechSynthesis!=='undefined'){speechSynthesis.onvoiceschanged=function(){};speechSynthesis.getVoices();}
  await openIDB();

  var params=new URLSearchParams(window.location.search);
  var chName=decodeURIComponent(params.get('chapter')||params.get('topic')||'Lesson');
  var cls=decodeURIComponent(params.get('cls')||'');
  var subj=decodeURIComponent(params.get('subject')||'Science');
  lessonFrom=parseInt(params.get('page_from'))||0;
  lessonTo=parseInt(params.get('page_to'))||0;
  bookId=params.get('book_id')||'';
  var lessonText='';

  // sessionStorage fallback
  try{var raw=sessionStorage.getItem('science_autostart');if(raw){var sd=JSON.parse(raw);sessionStorage.removeItem('science_autostart');chName=chName||sd.chapter||'';cls=cls||sd.cls||'';subj=subj||sd.subject||'Science';lessonFrom=lessonFrom||sd.pageFrom||0;lessonTo=lessonTo||sd.pageTo||0;bookId=bookId||sd.bookId||'';lessonText=sd.lessonText||'';}}catch(e){}
  try{var act=sessionStorage.getItem('tm_activated');if(act){var ad=JSON.parse(act);chName=chName||ad.topic||'';cls=cls||ad.cls||'';subj=subj||ad.subject||'Science';lessonFrom=lessonFrom||ad.pageFrom||0;lessonTo=lessonTo||ad.pageTo||0;bookId=bookId||ad.bookId||'';lessonText=lessonText||ad.lessonText||'';}}catch(e){}

  // Update top bar
  document.getElementById('b-lesson').textContent=chName||subj;
  document.getElementById('b-meta').textContent=cls+(cls&&subj?' · ':'')+subj;
  if(lessonFrom&&lessonTo)document.getElementById('b-pages').textContent='p.'+lessonFrom+'–'+lessonTo;
  lessonId=(bookId||('book_'+cls.replace(/\s+/g,'').toLowerCase()+'_'+subj.toLowerCase().replace(/\s+/g,'_')))+'_'+chName.replace(/\s+/g,'_').toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(lessonFrom&&lessonTo)document.getElementById('pn-range').textContent='Lesson: p.'+lessonFrom+'–'+lessonTo;

  // Try all possible PDF keys
  var keys=[bookId,'pdf_'+bookId,('book_'+cls.replace(/\s+/g,'').toLowerCase()+'_'+subj.toLowerCase().replace(/\s+/g,'_'))];
  var saved=null;
  for(var i=0;i<keys.length;i++){if(keys[i]){saved=await getPdf(keys[i]);if(saved&&saved.data)break;}}

  if(saved&&saved.data){
    // PDF found — load instantly
    document.getElementById('no-tb').style.display='none';
    document.getElementById('page-box').style.display='block';
    showLd(20);
    pdfDoc=await pdfjsLib.getDocument({data:saved.data.slice(0)}).promise;
    totPg=pdfDoc.numPages;
    document.getElementById('pn-tot').textContent=totPg;
    document.getElementById('pn-next').disabled=false;
    document.getElementById('pn-prev').disabled=false;
    hideLd();
    // Extract paragraphs from lesson pages only
    var extractFrom=lessonFrom||1;
    var extractTo=lessonTo||Math.min(totPg,50);
    await extractParas(extractFrom,Math.min(extractTo,extractFrom+30));
    enablePlay();
    // Jump directly to lesson start page
    await renderPg(lessonFrom||1);
    fetchAudio();
  } else if(lessonText&&lessonText.trim().length>30){
    buildFromText(lessonText,chName,subj,cls);
  } else {
    document.getElementById('no-tb-t').textContent='No textbook configured';
    document.getElementById('no-tb-s').textContent='Upload the textbook PDF in the Teacher Panel first.';
    document.getElementById('no-tb-link').style.display='inline';
    document.getElementById('no-tb').style.display='flex';
  }
});

// ── PARAGRAPH EXTRACTION ──
async function extractParas(fromPg,toPg){
  paras=[];var order=0;
  for(var pn=fromPg;pn<=Math.min(toPg,totPg);pn++){
    try{
      var page=await pdfDoc.getPage(pn);
      var vp=page.getViewport({scale:1});
      var tc=await page.getTextContent();
      var lines=groupLines(tc.items,vp);
      var ps=groupParas(lines);
      ps.forEach(function(p){if(!p.text||p.text.trim().length<15)return;paras.push({order:order++,text:p.text.trim(),pageNum:pn,bbox:p.bbox,pageW:vp.width,pageH:vp.height});});
    }catch(e){}
  }
}
function groupLines(items,vp){
  // Detect if page has two columns by checking x-distribution
  var midX=vp.width/2;
  var leftItems=[],rightItems=[];
  items.forEach(function(item){
    var x=item.transform[4]||0;
    if(x<midX*0.8)leftItems.push(item);
    else rightItems.push(item);
  });
  // If significant content on both sides — two column layout
  var isTwoCols=(leftItems.length>5&&rightItems.length>5&&rightItems.length>leftItems.length*0.3);
  var processSet=isTwoCols?leftItems.concat(rightItems):items;
  var lines=[],cur=null,TOL=3,lastColX=null;
  var sorted=processSet.slice().sort(function(a,b){
    var ax=a.transform[4]||0,bx=b.transform[4]||0;
    var ay=vp.height-(a.transform[5]||0),by=vp.height-(b.transform[5]||0);
    // If two cols: sort left col first (all left items by y), then right col by y
    if(isTwoCols){
      var aLeft=ax<midX*0.8,bLeft=bx<midX*0.8;
      if(aLeft&&!bLeft)return -1;
      if(!aLeft&&bLeft)return 1;
    }
    return Math.abs(ay-by)<TOL?ax-bx:ay-by;
  });
  sorted.forEach(function(item){
    var t=item.str||'';if(!t.trim()&&t.length<2)return;
    var x=item.transform[4]||0,y=vp.height-(item.transform[5]||0),w=item.width||0,h=Math.abs(item.transform[0])||10;
    // New column = big x jump while y is similar
    var newCol=isTwoCols&&cur&&Math.abs(y-cur.y)<20&&Math.abs(x-cur.x)>midX*0.5;
    if(!cur||Math.abs(y-cur.y)>TOL||newCol){cur={text:'',y,x,w:0,h,items:[]};lines.push(cur);}
    cur.text+=t;cur.w=Math.max(cur.w,x+w-cur.x);
  });
  return lines;
}
function groupParas(lines){
  var paras=[],cur=null,GAP=14;
  lines.forEach(function(line,i){var text=line.text.trim();if(!text){cur=null;return;}var isNew=!cur;if(!isNew&&i>0){var prev=lines[i-1];if(line.y-(prev.y+prev.h)>GAP)isNew=true;}if(isNew){cur={text:text,bbox:{x:line.x,y:line.y-line.h,w:line.w,h:line.h}};paras.push(cur);}else{cur.text+=' '+text;cur.bbox.h=(line.y-cur.bbox.y)+line.h;cur.bbox.w=Math.max(cur.bbox.w,line.w);}});
  return paras;
}

// ── RENDER PAGE ──
async function renderPg(pn){
  if(!pdfDoc)return;
  pn=Math.max(1,Math.min(pn,totPg));
  curPg=pn;
  if(rtask){try{rtask.cancel();}catch(e){}}
  var page=await pdfDoc.getPage(pn);
  var wrap=document.getElementById('pdf-wrap');
  var availW=wrap.clientWidth-24;
  var vp1=page.getViewport({scale:1});
  fitScale=availW/vp1.width;
  var scale=fitScale*zoom;
  var vp=page.getViewport({scale});
  var cv=document.getElementById('pdf-cv');
  cv.width=vp.width;cv.height=vp.height;cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  clearHL();showLd(50);
  rtask=page.render({canvasContext:cv.getContext('2d'),viewport:vp});
  await rtask.promise;hideLd();
  document.getElementById('pn-inp').value=pn;
  document.getElementById('pn-prev').disabled=(pn<=1)||(lessonFrom>0&&pn<=lessonFrom);
  document.getElementById('pn-next').disabled=(pn>=totPg)||(lessonTo>0&&pn>=lessonTo);
  document.getElementById('z-val').textContent=Math.round(zoom*100)+'%';
  // Show highlight for current para if on this page
  var p=paras[curPara];if(p&&p.pageNum===pn)drawHL(p);
}
async function goPrev(){if(curPg>1&&(!lessonFrom||curPg>lessonFrom))await renderPg(curPg-1);}
async function goNext(){if(curPg<totPg&&(!lessonTo||curPg<lessonTo))await renderPg(curPg+1);}
function goInp(){var v=parseInt(document.getElementById('pn-inp').value);if(v>=1&&v<=totPg)renderPg(v);}
function adjZ(d){zoom=Math.max(0.5,Math.min(3.0,zoom+d));if(pdfDoc)renderPg(curPg);}
function fitZ(){zoom=1.0;if(pdfDoc)renderPg(curPg);}
function showLd(p){document.getElementById('ld-bar').style.display='block';document.getElementById('ld-fill').style.width=p+'%';}
function hideLd(){document.getElementById('ld-bar').style.display='none';}

// ── HIGHLIGHT ──
function clearHL(){document.getElementById('hl-layer').innerHTML='';}
function drawHL(para){
  clearHL();if(!para||!para.bbox)return;
  var cv=document.getElementById('pdf-cv');
  var sx=cv.width/para.pageW,sy=cv.height/para.pageH;
  var x=para.bbox.x*sx,y=para.bbox.y*sy,w=Math.max(para.bbox.w*sx,40),h=Math.max(para.bbox.h*sy+6,14);
  x=Math.max(0,Math.min(x,cv.width-w));y=Math.max(0,y);
  var div=document.createElement('div');div.className='hl';
  div.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;';
  document.getElementById('hl-layer').appendChild(div);
  div.scrollIntoView({block:'center',behavior:'smooth'});
}

// ── PANEL UPDATE ──
function updatePanel(){
  var p=paras[curPara];if(!p)return;
  var txt=document.getElementById('ai-txt');txt.textContent=cleanText(p.text);txt.classList.remove('mt');
  document.getElementById('ai-pg').textContent='📖 Page '+(p.pageNum||'—')+' · §'+(curPara+1);
  document.getElementById('pg-fill').style.width=((curPara+1)/paras.length*100)+'%';
  var ct=(curPara+1)+'/'+paras.length;
  document.getElementById('pb-ct').textContent=ct;
  document.getElementById('bc-ct').textContent=ct;
  document.getElementById('p-prev').disabled=(curPara===0);
  document.getElementById('p-next').disabled=(curPara>=paras.length-1);
  document.getElementById('bc-prev').disabled=(curPara===0);
  document.getElementById('bc-next').disabled=(curPara>=paras.length-1);
  document.getElementById('exp-btn').disabled=false;
  document.getElementById('exp-box').classList.remove('on');
  if(p.pageNum&&p.pageNum!==curPg)renderPg(p.pageNum);else drawHL(p);
}
function enablePlay(){
  document.getElementById('p-play').disabled=false;document.getElementById('bc-play').disabled=false;document.getElementById('aud-btn').disabled=false;
  if(paras.length)updatePanel();
}

// ── PLAYBACK ──
function togglePlay(){if(playing)stopPb();else{playing=true;setPlayUI(true);readCur();}}
function stopAll(){stopPb();}
function stopPb(){playing=false;clearTimeout(ptimer);stopSpeech();if(curAudio){curAudio.pause();curAudio=null;}setPlayUI(false);}
function setPlayUI(on){['p-play','bc-play'].forEach(function(id){document.getElementById(id).textContent=on?'⏸ Pause':'▶ Play';});document.getElementById('bc-stop').style.display=on?'flex':'none';document.getElementById('bc-dot').className='bc-dot'+(on?' on':'');document.getElementById('ai-dot').className='ai-dot'+(on?' on':'');}
function readCur(){
  if(!playing||curPara>=paras.length){stopPb();return;}
  var p=paras[curPara];
  var cached=audioMap[p.order];
  if(cached&&cached.url&&cached.status==='ready'){
    playAudioItem(p,function(){if(!playing)return;ptimer=setTimeout(function(){if(playing){curPara++;updatePanel();readCur();}},700);});return;
  }
  var sents=splitS(p.text);
  readSents(sents,0,function(){if(!playing)return;ptimer=setTimeout(function(){if(!playing)return;if(curPara<paras.length-1){curPara++;updatePanel();readCur();}else stopPb();},1100);});
}
function readSents(sents,i,done){if(!playing||i>=sents.length){if(done)done();return;}speak(sents[i],function(){if(!playing){if(done)done();return;}ptimer=setTimeout(function(){readSents(sents,i+1,done);},260);});}
function prevP(){stopPb();if(curPara>0){curPara--;updatePanel();}}
function nextP(){stopPb();if(curPara<paras.length-1){curPara++;updatePanel();}}

// ── AI EXPLAIN ──
async function toggleExp(){
  var eb=document.getElementById('exp-box'),et=document.getElementById('exp-txt');
  var on=!eb.classList.contains('on');eb.classList.toggle('on',on);if(!on)return;
  var p=paras[curPara];if(!p)return;
  if(et.textContent&&et.textContent!=='Generating…'){speak(et.textContent,null);return;}
  et.textContent='Generating…';
  try{var r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:'You are a friendly science teacher for Tamil Nadu school students. Explain in 2-3 simple sentences. End with one interesting fact.',messages:[{role:'user',content:'Explain simply: "'+p.text+'"'}],max_tokens:160})});var d=await r.json();var txt=(d.content||[]).map(function(b){return b.type==='text'?b.text:'';}).join('').trim();et.textContent=txt||'Could not generate.';speak(txt,null);}catch(e){et.textContent='Error: '+e.message;}
}

// ── ELEVENLABS ──
async function fetchAudio(){if(!lessonId)return;try{var r=await fetch('/api/get-lesson-audio?lesson_id='+encodeURIComponent(lessonId));if(!r.ok)return;var d=await r.json();audioMap={};var rdy=0;(d.paragraphs||[]).forEach(function(p){audioMap[p.paragraph_order]={url:p.audio_url,status:p.status,audio:null};if(p.status==='ready')rdy++;});updateAudioUI(rdy,d.paragraphs?d.paragraphs.length:0);[0,1,2].forEach(preloadAudio);}catch(e){}}
function updateAudioUI(rdy,tot){var pct=tot>0?(rdy/tot*100):0;document.getElementById('aud-fill').style.width=pct+'%';document.getElementById('aud-lbl').textContent=rdy>0?'🎙 ElevenLabs: '+rdy+'/'+tot:'🎙 ElevenLabs (not generated)';var vb=document.getElementById('b-voice');if(rdy>0){vb.textContent='🎙 ElevenLabs';vb.className='bar-voice el';}else{vb.textContent='🗣 Browser Voice';vb.className='bar-voice ws';}var btn=document.getElementById('aud-btn');btn.textContent=(rdy===tot&&tot>0)?'✅ Done':'Generate';if(rdy===tot&&tot>0)btn.disabled=true;}
async function genAudio(){var btn=document.getElementById('aud-btn');btn.disabled=true;btn.textContent='⏳…';var list=paras.slice(0,60).filter(function(p){return p.text.length>15;}).map(function(p){return{order:p.order,text:p.text,type:'paragraph'};});try{var r=await fetch('/api/generate-lesson-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id:lessonId,paragraphs:list,voice_type:'default'})});var d=await r.json();if(d.success)await fetchAudio();else{btn.disabled=false;btn.textContent='Retry';}}catch(e){btn.disabled=false;btn.textContent='Retry';}}
function preloadAudio(order){var a=audioMap[order];if(!a||!a.url||a.audio)return;var au=new Audio();au.preload='auto';au.src=a.url;a.audio=au;}
function playAudioItem(para,onEnd){var a=audioMap[para.order];if(!a||!a.url){if(onEnd)onEnd();return;}if(!a.audio){var au=new Audio();au.src=a.url;a.audio=au;}curAudio=a.audio;a.audio.playbackRate=spd;a.audio.onended=function(){curAudio=null;preloadAudio(para.order+1);if(onEnd)onEnd();};a.audio.onerror=function(){curAudio=null;if(onEnd)onEnd();};a.audio.play().catch(function(){if(onEnd)onEnd();});}

// ── TEXT-ONLY MODE (no PDF) ──
function buildFromText(text,chName,subj,cls){
  paras=[];var order=0,buf=[],lines=text.trim().split('\n');
  lines.forEach(function(line){line=line.trim();if(!line){if(buf.length){var t=buf.join(' ').trim();if(t.length>15)paras.push({order:order++,text:t,pageNum:null,bbox:null,pageW:0,pageH:0});buf=[];};}else buf.push(line);});
  if(buf.length){var t=buf.join(' ').trim();if(t.length>15)paras.push({order:order++,text:t,pageNum:null,bbox:null,pageW:0,pageH:0});}
  document.getElementById('no-tb-t').textContent=chName||subj;
  document.getElementById('no-tb-s').textContent='Text mode ('+paras.length+' paragraphs). Upload textbook PDF for visual mode.';
  document.getElementById('no-tb-link').style.display='inline';
  enablePlay();
}

// ── SPEECH ──
function speak(text,onEnd){if(!text||!window.speechSynthesis){if(onEnd)onEnd();return;}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=spd;u.pitch=1.05;u.lang='en-IN';var vs=speechSynthesis.getVoices();var pv=vs.find(function(v){return v.lang.includes('en')&&(v.name.includes('India')||v.name.includes('Zira'));});if(pv)u.voice=pv;u.onend=function(){if(onEnd)onEnd();};u.onerror=function(){if(onEnd)onEnd();};speechSynthesis.speak(u);}
function stopSpeech(){if(window.speechSynthesis)speechSynthesis.cancel();}
function cleanText(t){
  return t
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/__(.*?)__/g,'$1')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/#{1,6}\s/g,'')
    .replace(/\[Page\s*\d+\]/g,'')
    .replace(/\s+/g,' ').trim();
}
function splitS(t){var clean=cleanText(t);var p=clean.match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g)||[clean];return p.map(function(s){return s.trim();}).filter(function(s){return s.length>3;});}
function adjSpd(d){spd=Math.max(0.5,Math.min(1.8,Math.round((spd+d)*10)/10));document.getElementById('spd-v').textContent=spd.toFixed(1)+'×';if(window.speechSynthesis)speechSynthesis.cancel();}
function goBack(){stopPb();if(document.referrer)window.history.back();else window.location.href='learnbot.html';}
</script>
