<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300">
  <!-- 1/2 -->
  <circle cx="65"  cy="115" r="52" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="2"/>
  <path d="M 65,63 A 52,52 0 0,1 65,167 Z" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <line x1="65" y1="63" x2="65" y2="167" stroke="#a8d8f0" stroke-width="1.5"/>
  <text x="65"  y="185" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#a8d8f0">½</text>
  <text x="65"  y="200" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">one half</text>

  <!-- 1/3 -->
  <circle cx="195" cy="115" r="52" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="2"/>
  <path d="M 195,63 A 52,52 0 0,1 240,167 L 195,115 Z" fill="rgba(168,230,168,0.35)" stroke="#a8e6a8" stroke-width="1.5"/>
  <line x1="195" y1="63" x2="195" y2="115" stroke="#a8e6a8" stroke-width="1.5"/>
  <line x1="195" y1="115" x2="240" y2="167" stroke="#a8e6a8" stroke-width="1.5"/>
  <line x1="195" y1="115" x2="150" y2="167" stroke="#a8e6a8" stroke-width="1.5"/>
  <text x="195" y="185" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#a8e6a8">⅓</text>
  <text x="195" y="200" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">one third</text>

  <!-- 1/4 -->
  <circle cx="325" cy="115" r="52" fill="rgba(245,232,122,0.08)" stroke="#f5e87a" stroke-width="2"/>
  <path d="M 325,63 A 52,52 0 0,1 377,115 L 325,115 Z" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <line x1="325" y1="63" x2="325" y2="167" stroke="#f5e87a" stroke-width="1.5"/>
  <line x1="273" y1="115" x2="377" y2="115" stroke="#f5e87a" stroke-width="1.5"/>
  <text x="325" y="185" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">¼</text>
  <text x="325" y="200" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">one quarter</text>

  <!-- 3/4 -->
  <circle cx="455" cy="115" r="52" fill="rgba(244,160,160,0.08)" stroke="#f4a0a0" stroke-width="2"/>
  <path d="M 455,63 A 52,52 0 1,1 403,115 L 455,115 Z" fill="rgba(244,160,160,0.35)" stroke="#f4a0a0" stroke-width="1.5"/>
  <line x1="455" y1="63" x2="455" y2="167" stroke="#f4a0a0" stroke-width="1.5"/>
  <line x1="403" y1="115" x2="507" y2="115" stroke="#f4a0a0" stroke-width="1.5"/>
  <text x="455" y="185" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f4a0a0">¾</text>
  <text x="455" y="200" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">three quarters</text>

  <!-- Bar fractions at bottom -->
  <text x="260" y="232" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="rgba(200,196,190,0.7)">Fraction bars</text>
  <!-- 2/5 bar -->
  <rect x="22"  y="244" width="40" height="22" rx="4" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <rect x="62"  y="244" width="40" height="22" rx="0" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <rect x="102" y="244" width="40" height="22" rx="0" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="1.5"/>
  <rect x="142" y="244" width="40" height="22" rx="0" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="1.5"/>
  <rect x="182" y="244" width="40" height="22" rx="0" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="1.5" stroke-linecap="round"/>
  <text x="124" y="282" text-anchor="middle" font-family="Kalam,cursive" font-size="12" font-weight="700" fill="#a8d8f0">2/5 shaded</text>
  <!-- 3/5 bar -->
  <rect x="278" y="244" width="40" height="22" rx="4" fill="rgba(168,230,168,0.35)" stroke="#a8e6a8" stroke-width="1.5"/>
  <rect x="318" y="244" width="40" height="22" rx="0" fill="rgba(168,230,168,0.35)" stroke="#a8e6a8" stroke-width="1.5"/>
  <rect x="358" y="244" width="40" height="22" rx="0" fill="rgba(168,230,168,0.35)" stroke="#a8e6a8" stroke-width="1.5"/>
  <rect x="398" y="244" width="40" height="22" rx="0" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="1.5"/>
  <rect x="438" y="244" width="40" height="22" rx="0" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="1.5" stroke-linecap="round"/>
  <text x="378" y="282" text-anchor="middle" font-family="Kalam,cursive" font-size="12" font-weight="700" fill="#a8e6a8">3/5 shaded</text>
  <text x="260" y="300" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Fractions — Visual</text>
</svg>
