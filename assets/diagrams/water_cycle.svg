<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <!-- Sun -->
  <circle cx="60" cy="50" r="32" fill="rgba(245,232,122,0.18)" stroke="#f5e87a" stroke-width="2"/>
  <line x1="60" y1="10" x2="60" y2="2"  stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="60" y2="98" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="12" y2="50" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="50" x2="108" y2="50" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="26" y2="16" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="78" x2="94" y2="84" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="22" x2="94" y2="16" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="78" x2="26" y2="84" stroke="#f5e87a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Evaporation arrows from ocean -->
  <path d="M 140,240 Q 160,180 180,140" fill="none" stroke="#a8d8f0" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 180,240 Q 200,175 220,130" fill="none" stroke="#a8d8f0" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 220,240 Q 240,180 255,135" fill="none" stroke="#a8d8f0" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Cloud -->
  <ellipse cx="300" cy="80" rx="70" ry="30" fill="rgba(168,216,240,0.18)" stroke="#a8d8f0" stroke-width="2"/>
  <ellipse cx="260" cy="88" rx="40" ry="22" fill="rgba(168,216,240,0.18)" stroke="#a8d8f0" stroke-width="1.5"/>
  <ellipse cx="340" cy="90" rx="38" ry="22" fill="rgba(168,216,240,0.18)" stroke="#a8d8f0" stroke-width="1.5"/>
  <!-- Rain -->
  <line x1="265" y1="115" x2="258" y2="135" stroke="#a8d8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="285" y1="118" x2="278" y2="138" stroke="#a8d8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="305" y1="118" x2="298" y2="138" stroke="#a8d8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="325" y1="115" x2="318" y2="135" stroke="#a8d8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="345" y1="112" x2="338" y2="132" stroke="#a8d8f0" stroke-width="2" stroke-linecap="round"/>
  <!-- Mountain -->
  <polygon points="390,220 450,100 510,220" fill="rgba(200,196,190,0.08)" stroke="#c8c4be" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="430,220 470,130 510,220" fill="rgba(200,196,190,0.06)" stroke="#c8c4be" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Runoff river -->
  <path d="M 450,200 Q 430,230 390,255 Q 350,270 300,268 Q 230,265 180,258" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <!-- Ocean / ground -->
  <path d="M 30,260 Q 100,250 180,258 Q 230,265 300,268 Q 350,270 420,265 Q 480,260 530,262 L 530,310 L 30,310 Z" fill="rgba(168,216,240,0.10)" stroke="#a8d8f0" stroke-width="1.8"/>
  <!-- Underground water -->
  <path d="M 80,290 Q 200,285 320,290 Q 400,293 480,290" fill="none" stroke="#a8d8f0" stroke-width="1.2" stroke-dasharray="8 5" opacity="0.6"/>
  <!-- Transpiration from tree -->
  <rect x="128" y="200" width="8" height="40" fill="rgba(168,230,168,0.3)" stroke="#a8e6a8" stroke-width="1.5"/>
  <ellipse cx="132" cy="190" rx="22" ry="18" fill="rgba(168,230,168,0.18)" stroke="#a8e6a8" stroke-width="1.8"/>
  <path d="M 118,178 Q 110,155 115,138" fill="none" stroke="#a8e6a8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- LABELS -->
  <text x="60" y="54" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f5e87a">Sun</text>
  <text x="300" y="78" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8d8f0">Cloud</text>
  <text x="185" y="165" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="#a8d8f0">Evaporation</text>
  <text x="297" y="128" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="#a8d8f0">Precipitation</text>
  <text x="470" y="155" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="#c8c4be">Mountain</text>
  <text x="350" y="252" font-family="Kalam,cursive" font-size="10" fill="#a8d8f0">Runoff</text>
  <text x="280" y="302" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="#a8d8f0">Ocean / Water Body</text>
  <text x="100" y="175" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Transpiration</text>
  <text x="280" y="328" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#f5e87a">Water Cycle</text>
</svg>
