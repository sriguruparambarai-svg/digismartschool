<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480">
  <!-- Body silhouette hint -->
  <path d="M 120,30 C 100,30 82,45 80,68 L 75,160 C 72,175 65,188 62,210 L 55,340 C 54,365 68,382 90,385 L 90,450 L 130,450 L 130,385 L 210,385 L 210,450 L 250,450 L 250,385 C 272,382 286,365 285,340 L 278,210 C 275,188 268,175 265,160 L 260,68 C 258,45 240,30 220,30 Z" fill="rgba(200,180,160,0.04)" stroke="rgba(200,180,160,0.12)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <!-- Heart (centre) -->
  <path d="M 170,115 C 170,105 158,98 148,102 C 135,108 130,124 132,136 C 134,148 143,158 153,166 L 170,180 L 187,166 C 197,158 206,148 208,136 C 210,124 205,108 192,102 C 182,98 170,105 170,115 Z" fill="rgba(244,160,160,0.20)" stroke="#f4a0a0" stroke-width="2.2"/>
