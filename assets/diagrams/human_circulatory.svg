  <path d="M 185,140 C 210,135 232,125 245,115 C 255,108 258,95 252,88" fill="none" stroke="#a8d8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 155,140 C 130,135 108,125 95,115 C 85,108 82,95 88,88" fill="none" stroke="#a8d8f0" stroke-width="4" stroke-linecap="round"/>
  <!-- Lungs -->
  <ellipse cx="248" cy="118" rx="24" ry="32" fill="rgba(244,160,160,0.12)" stroke="#f4a0a0" stroke-width="1.8"/>
  <ellipse cx="92"  cy="118" rx="24" ry="32" fill="rgba(244,160,160,0.12)" stroke="#f4a0a0" stroke-width="1.8"/>
  <!-- Pulmonary veins back -->
  <path d="M 224,128 C 210,148 200,160 188,162" fill="none" stroke="#f4a0a0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 116,128 C 130,148 140,160 152,162" fill="none" stroke="#f4a0a0" stroke-width="3" stroke-linecap="round"/>
  <!-- Veins up body (vena cava) -->
  <path d="M 178,175 C 182,210 184,250 182,290 C 180,320 178,345 178,370" fill="none" stroke="#a8d8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arms arteries -->
  <path d="M 165,180 C 145,192 118,200 95,220 C 75,238 68,268 72,298" fill="none" stroke="#a8e6a8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 175,180 C 195,192 222,200 245,220 C 265,238 272,268 268,298" fill="none" stroke="#a8e6a8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arm veins -->
  <path d="M 170,180 C 150,192 124,200 102,220 C 82,238 76,268 80,298" fill="none" stroke="#a8d8f0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 180,180 C 200,192 226,200 248,220 C 268,238 274,268 270,298" fill="none" stroke="#a8d8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M 162,370 C 158,395 155,418 153,448" fill="none" stroke="#a8e6a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 178,370 C 182,395 185,418 187,448" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 200,370 C 202,395 205,418 207,448" fill="none" stroke="#a8e6a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215,370 C 218,395 220,418 220,448" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <!-- Head blood supply -->
  <path d="M 168,52 C 165,35 162,18 163,8" fill="none" stroke="#a8e6a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 172,52 C 175,35 178,18 177,8" fill="none" stroke="#a8d8f0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="170" cy="10" r="12" fill="rgba(200,180,160,0.08)" stroke="rgba(200,180,160,0.25)" stroke-width="1.5"/>
  <!-- LABELS -->
  <text x="290" y="8"  font-family="Kalam,cursive" font-size="8" fill="#a8e6a8">● Arteries</text>
  <text x="290" y="20" font-family="Kalam,cursive" font-size="8" fill="#a8d8f0">● Veins</text>
  <text x="290" y="32" font-family="Kalam,cursive" font-size="8" fill="#a8e6a8">(O₂ rich)</text>
  <text x="290" y="44" font-family="Kalam,cursive" font-size="8" fill="#a8d8f0">(O₂ poor)</text>
  <text x="170" y="195" text-anchor="middle" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#f4a0a0">Heart</text>
  <text x="248" y="162" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#f4a0a0">R. Lung</text>
  <text x="92"  y="162" text-anchor="middle" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#f4a0a0">L. Lung</text>
  <text x="170" y="462" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#f5e87a">Circulatory System</text>
</svg>
