<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460">
  <!-- Nasal cavity -->
  <path d="M 155,30 C 145,30 135,38 135,50 C 135,62 145,68 155,68 L 225,68 C 235,68 245,62 245,50 C 245,38 235,30 225,30 Z" fill="rgba(168,216,240,0.12)" stroke="#a8d8f0" stroke-width="1.8"/>
  <path d="M 168,30 L 168,68 M 212,30 L 212,68" stroke="#a8d8f0" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Pharynx -->
  <rect x="162" y="68" width="56" height="32" rx="4" fill="rgba(168,216,240,0.10)" stroke="#a8d8f0" stroke-width="1.8"/>
  <!-- Larynx/voice box -->
  <path d="M 158,100 L 162,130 L 218,130 L 222,100 Z" fill="rgba(245,232,122,0.12)" stroke="#f5e87a" stroke-width="1.8"/>
  <line x1="168" y1="100" x2="168" y2="130" stroke="#f5e87a" stroke-width="0.8" opacity="0.5"/>
  <line x1="180" y1="100" x2="180" y2="130" stroke="#f5e87a" stroke-width="0.8" opacity="0.5"/>
  <line x1="200" y1="100" x2="200" y2="130" stroke="#f5e87a" stroke-width="0.8" opacity="0.5"/>
  <!-- Trachea -->
  <rect x="172" y="130" width="36" height="62" rx="8" fill="rgba(168,216,240,0.10)" stroke="#a8d8f0" stroke-width="2"/>
  <line x1="178" y1="138" x2="202" y2="138" stroke="#a8d8f0" stroke-width="1.2" opacity="0.6"/>
  <line x1="178" y1="150" x2="202" y2="150" stroke="#a8d8f0" stroke-width="1.2" opacity="0.6"/>
  <line x1="178" y1="162" x2="202" y2="162" stroke="#a8d8f0" stroke-width="1.2" opacity="0.6"/>
  <line x1="178" y1="174" x2="202" y2="174" stroke="#a8d8f0" stroke-width="1.2" opacity="0.6"/>
  <line x1="178" y1="184" x2="202" y2="184" stroke="#a8d8f0" stroke-width="1.2" opacity="0.6"/>
  <!-- Bronchi -->
  <path d="M 172,192 C 148,200 128,218 125,242" fill="none" stroke="#a8d8f0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 208,192 C 232,200 252,218 255,242" fill="none" stroke="#a8d8f0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 172,192 C 148,200 128,218 125,242" fill="none" stroke="rgba(168,216,240,0.18)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 208,192 C 232,200 252,218 255,242" fill="none" stroke="rgba(168,216,240,0.18)" stroke-width="12" stroke-linecap="round"/>
  <!-- Bronchioles -->
  <path d="M 125,242 C 110,258 108,278 114,295" fill="none" stroke="#a8d8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 125,242 C 140,258 142,278 136,295" fill="none" stroke="#a8d8f0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 255,242 C 270,258 272,278 266,295" fill="none" stroke="#a8d8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 255,242 C 240,258 238,278 244,295" fill="none" stroke="#a8d8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left lung -->
  <path d="M 90,200 C 68,210 55,240 58,280 C 61,320 80,355 108,368 C 128,376 148,368 158,350 C 168,332 165,305 162,282 C 159,258 152,235 140,218 C 128,202 108,196 90,200 Z" fill="rgba(244,160,160,0.12)" stroke="#f4a0a0" stroke-width="2.2"/>
  <!-- Right lung -->
  <path d="M 290,200 C 312,210 325,240 322,280 C 319,320 300,355 272,368 C 252,376 232,368 222,350 C 212,332 215,305 218,282 C 221,258 228,235 240,218 C 252,202 272,196 290,200 Z" fill="rgba(244,160,160,0.12)" stroke="#f4a0a0" stroke-width="2.2"/>
  <!-- Alveoli cluster left -->
  <circle cx="115" cy="308" r="9"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="132" cy="300" r="8"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="120" cy="324" r="8"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="136" cy="318" r="7"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <!-- Alveoli cluster right -->
  <circle cx="265" cy="308" r="9"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="248" cy="300" r="8"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="260" cy="324" r="8"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="244" cy="318" r="7"  fill="rgba(168,216,240,0.20)" stroke="#a8d8f0" stroke-width="1.5"/>
  <!-- Diaphragm -->
  <path d="M 52,385 Q 190,405 328,385" fill="none" stroke="#d4a0f0" stroke-width="3" stroke-linecap="round"/>
  <!-- LABELS -->
  <text x="310" y="50"  font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Nasal Cavity</text>
  <text x="310" y="90"  font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Pharynx</text>
  <text x="310" y="118" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Larynx</text>
  <text x="310" y="165" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Trachea</text>
  <text x="22"  y="228" text-anchor="end" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Bronchi</text>
  <text x="22"  y="282" text-anchor="end" font-family="Kalam,cursive" font-size="9"  fill="#f4a0a0">Left Lung</text>
  <text x="358" y="282" font-family="Kalam,cursive" font-size="9"  fill="#f4a0a0">Right Lung</text>
  <text x="22"  y="318" text-anchor="end" font-family="Kalam,cursive" font-size="9"  fill="#a8d8f0">Alveoli</text>
  <text x="358" y="318" font-family="Kalam,cursive" font-size="9"  fill="#a8d8f0">Alveoli</text>
  <text x="190" y="400" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#d4a0f0">Diaphragm</text>
  <text x="190" y="445" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Human Respiratory System</text>
</svg>
