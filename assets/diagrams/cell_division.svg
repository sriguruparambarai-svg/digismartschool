<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300">
  <!-- Stage labels at top -->
  <text x="58"  y="16" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Interphase</text>
  <text x="168" y="16" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Prophase</text>
  <text x="278" y="16" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8e6a8">Metaphase</text>
  <text x="388" y="16" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f4a0a0">Anaphase</text>
  <text x="518" y="16" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#d4a0f0">Telophase</text>
  <!-- Arrows between phases -->
  <path d="M 100,150 L 125,150" stroke="rgba(200,196,190,0.4)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 212,150 L 237,150" stroke="rgba(200,196,190,0.4)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 322,150 L 347,150" stroke="rgba(200,196,190,0.4)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 432,150 L 458,150" stroke="rgba(200,196,190,0.4)" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="rgba(200,196,190,0.6)"/></marker></defs>

  <!-- INTERPHASE: Normal cell with nucleus -->
  <ellipse cx="58" cy="150" rx="52" ry="52" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="2"/>
  <ellipse cx="58" cy="150" rx="22" ry="22" fill="rgba(168,216,240,0.15)" stroke="#a8d8f0" stroke-width="1.8"/>
  <!-- chromatin (tangled) -->
  <path d="M 48,145 C 52,138 62,138 66,145 C 70,152 62,158 55,155" fill="none" stroke="#a8d8f0" stroke-width="1.2"/>
  <text x="58" y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">DNA replicates</text>

  <!-- PROPHASE: Chromosomes visible -->
  <ellipse cx="168" cy="150" rx="52" ry="52" fill="rgba(168,230,168,0.06)" stroke="#a8e6a8" stroke-width="1.8"/>
  <!-- Chromosomes forming -->
  <path d="M 155,138 C 157,132 162,130 165,135 C 168,140 166,148 163,152" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 170,138 C 173,132 178,132 180,138 C 182,144 180,152 177,155" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 158,158 C 160,163 164,165 167,161 C 170,157 169,150 166,148" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 172,158 C 174,163 178,165 181,161 C 184,157 182,150 179,148" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spindle fibers hint -->
  <line x1="168" y1="100" x2="160" y2="148" stroke="rgba(245,232,122,0.3)" stroke-width="1"/>
  <line x1="168" y1="100" x2="170" y2="148" stroke="rgba(245,232,122,0.3)" stroke-width="1"/>
  <line x1="168" y1="200" x2="160" y2="158" stroke="rgba(245,232,122,0.3)" stroke-width="1"/>
  <line x1="168" y1="200" x2="170" y2="158" stroke="rgba(245,232,122,0.3)" stroke-width="1"/>
  <text x="168" y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Chromosomes condense</text>

  <!-- METAPHASE: Chromosomes aligned at centre -->
  <ellipse cx="278" cy="150" rx="52" ry="52" fill="rgba(168,230,168,0.06)" stroke="#a8e6a8" stroke-width="1.8"/>
  <!-- Chromosomes at equator -->
  <path d="M 265,142 C 267,136 272,134 275,139 C 278,144 276,152 273,156" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 265,162 C 267,168 272,170 275,165 C 278,160 276,152 273,148" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 280,142 C 282,136 287,134 290,139 C 293,144 291,152 288,156" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 280,162 C 282,168 287,170 290,165 C 293,160 291,152 288,148" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spindle fibres -->
  <line x1="278" y1="100" x2="270" y2="148" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="278" y1="100" x2="282" y2="148" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="278" y1="100" x2="285" y2="148" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="278" y1="200" x2="270" y2="158" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="278" y1="200" x2="282" y2="158" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="278" y1="200" x2="285" y2="158" stroke="rgba(245,232,122,0.4)" stroke-width="1.2"/>
  <line x1="226" y1="150" x2="265" y2="150" stroke="rgba(245,232,122,0.3)" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="278" y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Align at equator</text>

  <!-- ANAPHASE: Chromosomes pulling apart -->
  <ellipse cx="388" cy="150" rx="52" ry="62" fill="rgba(168,230,168,0.06)" stroke="#a8e6a8" stroke-width="1.8"/>
  <path d="M 375,118 C 377,112 382,110 385,115 C 388,120 386,126 383,128" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 390,118 C 392,112 397,112 399,118 C 401,124 399,130 396,132" fill="none" stroke="#a8d8f0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 375,178 C 377,183 382,185 385,180 C 388,175 386,168 383,165" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 390,178 C 392,183 397,183 399,178 C 401,172 399,165 396,163" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="388" y="226" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Chromosomes separate</text>

  <!-- TELOPHASE: Two daughter cells forming -->
  <ellipse cx="508" cy="125" rx="44" ry="38" fill="rgba(212,160,240,0.08)" stroke="#d4a0f0" stroke-width="1.8"/>
  <ellipse cx="508" cy="178" rx="44" ry="38" fill="rgba(212,160,240,0.08)" stroke="#d4a0f0" stroke-width="1.8"/>
  <ellipse cx="508" cy="118" rx="18" ry="15" fill="rgba(168,216,240,0.15)" stroke="#a8d8f0" stroke-width="1.2"/>
  <ellipse cx="508" cy="185" rx="18" ry="15" fill="rgba(168,216,240,0.15)" stroke="#a8d8f0" stroke-width="1.2"/>
  <!-- Cleavage furrow -->
  <path d="M 466,152 Q 508,155 550,152" fill="none" stroke="#d4a0f0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="518" y="230" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#d4a0f0">2 daughter cells</text>

  <text x="290" y="280" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Mitosis — Cell Division</text>
</svg>
