<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320">
  <!-- SOLID box -->
  <rect x="20" y="40" width="145" height="145" rx="10" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="2"/>
  <!-- Solid particles - tightly packed grid -->
  <circle cx="52" cy="72"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="82" cy="72"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="112" cy="72" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="142" cy="72" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="52" cy="102"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="82" cy="102"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="112" cy="102" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="142" cy="102" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="52" cy="132"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="82" cy="132"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="112" cy="132" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="142" cy="132" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="52" cy="162"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="82" cy="162"  r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="112" cy="162" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="142" cy="162" r="12" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>

  <!-- LIQUID box -->
  <rect x="197" y="40" width="145" height="145" rx="10" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="2"/>
  <!-- Liquid - bottom settled, irregular -->
  <circle cx="228" cy="132" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="258" cy="128" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="288" cy="133" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="318" cy="130" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="215" cy="158" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="244" cy="162" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="274" cy="159" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="304" cy="163" r="12" fill="rgba(168,230,168,0.38)" stroke="#a8e6a8" stroke-width="1.5"/>
  <!-- Flowing motion hint -->
  <path d="M 220,105 C 240,98 260,102 275,96 C 290,90 310,95 328,92" fill="none" stroke="rgba(168,230,168,0.3)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Level line -->
  <path d="M 200,122 L 340,122" stroke="#a8e6a8" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- GAS box -->
  <rect x="374" y="40" width="145" height="145" rx="10" fill="rgba(245,232,122,0.06)" stroke="#f5e87a" stroke-width="2"/>
  <!-- Gas particles - spread out randomly -->
  <circle cx="400" cy="65"  r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="450" cy="72"  r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="500" cy="58"  r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="408" cy="112" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="468" cy="125" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="510" cy="105" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="392" cy="158" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="440" cy="168" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="505" cy="160" r="9" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.5"/>
  <!-- Motion lines for gas -->
  <path d="M 450,72 L 462,60" stroke="#f5e87a" stroke-width="1" opacity="0.5"/>
  <path d="M 468,125 L 480,115" stroke="#f5e87a" stroke-width="1" opacity="0.5"/>
  <path d="M 440,168 L 428,155" stroke="#f5e87a" stroke-width="1" opacity="0.5"/>

  <!-- Transition arrows -->
  <path d="M 92,210 Q 92,240 270,240 Q 448,240 448,210" fill="none" stroke="rgba(200,196,190,0.35)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="rgba(200,196,190,0.5)"/></marker></defs>
  <text x="270" y="235" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="rgba(200,196,190,0.6)">Heating →</text>

  <!-- Labels -->
  <text x="92"  y="202" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#a8d8f0">SOLID</text>
  <text x="270" y="202" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#a8e6a8">LIQUID</text>
  <text x="448" y="202" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#f5e87a">GAS</text>
  <text x="92"  y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Fixed shape &amp; volume</text>
  <text x="270" y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Fixed volume, no shape</text>
  <text x="448" y="218" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">No fixed shape or volume</text>
  <!-- Change of state labels -->
  <text x="181" y="265" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Melting ↗</text>
  <text x="181" y="278" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Freezing ↙</text>
  <text x="359" y="265" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Evaporation ↗</text>
  <text x="359" y="278" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Condensation ↙</text>
  <text x="270" y="305" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">States of Matter</text>
</svg>
