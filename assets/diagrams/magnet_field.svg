<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320">
  <!-- Field lines (closed curves around magnet) -->
  <path d="M 240,100 C 160,85 80,95 65,135 C 50,175 80,215 160,228 C 200,234 240,235 240,235" fill="none" stroke="#a8d8f0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 240,100 C 320,85 400,95 415,135 C 430,175 400,215 320,228 C 280,234 240,235 240,235" fill="none" stroke="#a8d8f0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 240,80  C 145,58 48,75 30,140 C 12,205 58,255 155,272 C 200,280 240,282 240,282" fill="none" stroke="#a8d8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 240,80  C 335,58 432,75 450,140 C 468,205 422,255 325,272 C 280,280 240,282 240,282" fill="none" stroke="#a8d8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Inner strong lines -->
  <path d="M 240,108 C 196,105 168,112 165,135 C 162,158 185,172 215,175 C 228,177 240,177 240,177" fill="none" stroke="#a8d8f0" stroke-width="2.2" opacity="0.9"/>
  <path d="M 240,108 C 284,105 312,112 315,135 C 318,158 295,172 265,175 C 252,177 240,177 240,177" fill="none" stroke="#a8d8f0" stroke-width="2.2" opacity="0.9"/>
  <!-- Arrow heads on field lines -->
  <polygon points="65,135 72,128 72,142" fill="#a8d8f0" opacity="0.8"/>
  <polygon points="415,135 408,128 408,142" fill="#a8d8f0" opacity="0.8"/>
  <polygon points="165,135 172,128 172,142" fill="#a8d8f0"/>
  <polygon points="315,135 308,128 308,142" fill="#a8d8f0"/>
  <!-- Magnet body -->
  <rect x="180" y="120" width="60" height="90" rx="6" fill="rgba(244,160,160,0.22)" stroke="#f4a0a0" stroke-width="2.5"/>
  <rect x="240" y="120" width="60" height="90" rx="6" fill="rgba(168,216,240,0.22)" stroke="#a8d8f0" stroke-width="2.5"/>
  <!-- N and S labels on magnet -->
  <text x="210" y="168" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="24" font-weight="700" fill="#f4a0a0">N</text>
  <text x="270" y="168" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="24" font-weight="700" fill="#a8d8f0">S</text>
  <!-- Field direction labels -->
  <text x="68"  y="108" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Field lines</text>
  <text x="68"  y="120" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">N→S outside</text>
  <text x="240" y="300" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="rgba(200,196,190,0.6)">Lines closer together = stronger field</text>
  <!-- Compass needles -->
  <ellipse cx="100" cy="165" rx="14" ry="6" fill="none" stroke="rgba(200,196,190,0.3)" stroke-width="1"/>
  <line x1="92" y1="165" x2="108" y2="165" stroke="#f5e87a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="100" cy="165" r="2.5" fill="#f5e87a"/>
  <ellipse cx="380" cy="165" rx="14" ry="6" fill="none" stroke="rgba(200,196,190,0.3)" stroke-width="1"/>
  <line x1="372" y1="165" x2="388" y2="165" stroke="#f5e87a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="380" cy="165" r="2.5" fill="#f5e87a"/>
  <text x="240" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="15" font-weight="700" fill="#f5e87a">Magnetic Field Lines</text>
  <text x="240" y="38" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="rgba(200,196,190,0.6)">Bar Magnet — field from North to South pole</text>
</svg>
