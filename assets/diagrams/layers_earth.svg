<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Inner core -->
  <circle cx="200" cy="200" r="52" fill="rgba(245,200,80,0.35)" stroke="#f5c850" stroke-width="2.5"/>
  <!-- Outer core -->
  <circle cx="200" cy="200" r="96" fill="rgba(244,140,60,0.15)" stroke="#f48c3c" stroke-width="2.2"/>
  <!-- Mantle -->
  <circle cx="200" cy="200" r="152" fill="rgba(212,100,60,0.12)" stroke="#d4643c" stroke-width="2.2"/>
  <!-- Crust -->
  <circle cx="200" cy="200" r="180" fill="rgba(168,200,100,0.10)" stroke="#a8c864" stroke-width="3"/>
  <!-- Cross section cut lines -->
  <line x1="200" y1="20" x2="200" y2="200" stroke="rgba(200,196,190,0.25)" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="200" y1="200" x2="380" y2="200" stroke="rgba(200,196,190,0.25)" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- Measurement arrows -->
  <line x1="200" y1="200" x2="200" y2="148" stroke="rgba(200,196,190,0.3)" stroke-width="1"/>
  <line x1="200" y1="200" x2="200" y2="104" stroke="rgba(200,196,190,0.3)" stroke-width="1"/>
  <line x1="200" y1="200" x2="200" y2="48" stroke="rgba(200,196,190,0.3)" stroke-width="1"/>
  <!-- Ocean hint at surface -->
  <path d="M 23,200 C 24,195 32,190 45,190 C 58,190 62,200 70,200" fill="none" stroke="#a8d8f0" stroke-width="1.5" opacity="0.6"/>
  <path d="M 334,180 C 345,175 358,178 365,185 C 372,192 368,200 360,200" fill="none" stroke="#a8d8f0" stroke-width="1.5" opacity="0.6"/>
  <!-- LABELS with lines -->
  <text x="205" y="195" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f5c850">Inner</text>
  <text x="205" y="208" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f5c850">Core</text>
  <text x="205" y="222" font-family="Kalam,cursive" font-size="8" fill="#f5c850">Solid, 5000°C</text>

  <text x="300" y="155" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f48c3c">Outer Core</text>
  <text x="300" y="168" font-family="Kalam,cursive" font-size="8" fill="#f48c3c">Liquid iron, 4000°C</text>
  <line x1="296" y1="158" x2="252" y2="175" stroke="#f48c3c" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="310" y="100" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#d4643c">Mantle</text>
  <text x="310" y="113" font-family="Kalam,cursive" font-size="8" fill="#d4643c">Semi-molten rock</text>
  <text x="310" y="124" font-family="Kalam,cursive" font-size="8" fill="#d4643c">Thickest layer</text>
  <line x1="306" y1="106" x2="270" y2="125" stroke="#d4643c" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="310" y="52" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8c864">Crust</text>
  <text x="310" y="65" font-family="Kalam,cursive" font-size="8" fill="#a8c864">Oceanic: 5-10 km</text>
  <text x="310" y="76" font-family="Kalam,cursive" font-size="8" fill="#a8c864">Continental: 30-50 km</text>
  <line x1="306" y1="56" x2="278" y2="60" stroke="#a8c864" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="200" y="392" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Layers of the Earth</text>
</svg>
