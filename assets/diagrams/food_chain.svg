<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300">
  <!-- Sun energy arrow at top -->
  <path d="M 50,20 L 50,50" stroke="#f5e87a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#f5e87a"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#a8e6a8"/>
    </marker>
  </defs>
  <!-- Level backgrounds -->
  <rect x="10"  y="55"  width="110" height="80" rx="10" fill="rgba(168,230,168,0.10)" stroke="#a8e6a8" stroke-width="1.8"/>
  <rect x="150" y="55"  width="110" height="80" rx="10" fill="rgba(168,216,240,0.10)" stroke="#a8d8f0" stroke-width="1.8"/>
  <rect x="290" y="55"  width="110" height="80" rx="10" fill="rgba(244,160,160,0.10)" stroke="#f4a0a0" stroke-width="1.8"/>
  <rect x="430" y="55"  width="110" height="80" rx="10" fill="rgba(212,160,240,0.10)" stroke="#d4a0f0" stroke-width="1.8"/>
  <!-- Arrows between levels -->
  <path d="M 122,95 L 148,95" stroke="#a8e6a8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr2)"/>
  <path d="M 262,95 L 288,95" stroke="#a8e6a8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr2)"/>
  <path d="M 402,95 L 428,95" stroke="#a8e6a8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr2)"/>
  <!-- Plant icon -->
  <line x1="65" y1="120" x2="65" y2="100" stroke="#a8e6a8" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="65" cy="94" rx="14" ry="10" fill="rgba(168,230,168,0.3)" stroke="#a8e6a8" stroke-width="1.5"/>
  <ellipse cx="52" cy="106" rx="10" ry="7" fill="rgba(168,230,168,0.2)" stroke="#a8e6a8" stroke-width="1.2"/>
  <ellipse cx="78" cy="106" rx="10" ry="7" fill="rgba(168,230,168,0.2)" stroke="#a8e6a8" stroke-width="1.2"/>
  <!-- Rabbit/herbivore icon -->
  <ellipse cx="205" cy="105" rx="18" ry="13" fill="rgba(168,216,240,0.2)" stroke="#a8d8f0" stroke-width="1.8"/>
  <ellipse cx="205" cy="88" rx="10" ry="8" fill="rgba(168,216,240,0.2)" stroke="#a8d8f0" stroke-width="1.5"/>
  <ellipse cx="200" cy="80" rx="4" ry="8" fill="rgba(168,216,240,0.15)" stroke="#a8d8f0" stroke-width="1.2"/>
  <ellipse cx="212" cy="80" rx="4" ry="8" fill="rgba(168,216,240,0.15)" stroke="#a8d8f0" stroke-width="1.2"/>
  <!-- Fox/carnivore icon -->
  <ellipse cx="345" cy="105" rx="20" ry="14" fill="rgba(244,160,160,0.2)" stroke="#f4a0a0" stroke-width="1.8"/>
  <polygon points="333,94 340,78 347,94" fill="rgba(244,160,160,0.2)" stroke="#f4a0a0" stroke-width="1.5"/>
  <path d="M 358,108 Q 370,112 372,105" fill="none" stroke="#f4a0a0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Eagle/top carnivore icon -->
  <path d="M 485,80 Q 470,95 475,112 Q 485,125 495,112 Q 500,95 485,80 Z" fill="rgba(212,160,240,0.2)" stroke="#d4a0f0" stroke-width="1.8"/>
  <path d="M 460,88 Q 472,92 475,100" fill="none" stroke="#d4a0f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 510,88 Q 498,92 495,100" fill="none" stroke="#d4a0f0" stroke-width="2" stroke-linecap="round"/>
  <!-- Level labels -->
  <text x="65"  y="145" text-anchor="middle" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8e6a8">Producers</text>
  <text x="205" y="145" text-anchor="middle" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8d8f0">Herbivores</text>
  <text x="345" y="145" text-anchor="middle" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f4a0a0">Carnivores</text>
  <text x="485" y="145" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  font-weight="700" fill="#d4a0f0">Top Carnivores</text>
  <text x="65"  y="160" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  fill="#a8e6a8">(Plants)</text>
  <text x="205" y="160" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  fill="#a8d8f0">(Rabbit/Deer)</text>
  <text x="345" y="160" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  fill="#f4a0a0">(Fox/Snake)</text>
  <text x="485" y="160" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  fill="#d4a0f0">(Eagle/Lion)</text>
  <!-- Trophic levels -->
  <text x="65"  y="178" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="#c8c4be">Trophic Level 1</text>
  <text x="205" y="178" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="#c8c4be">Trophic Level 2</text>
  <text x="345" y="178" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="#c8c4be">Trophic Level 3</text>
  <text x="485" y="178" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="#c8c4be">Trophic Level 4</text>
  <!-- Energy loss -->
  <path d="M 65,195 Q 130,205 130,212 Q 130,220 100,222" fill="none" stroke="rgba(245,232,122,0.3)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="290" y="210" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="rgba(245,232,122,0.6)">Energy lost at each level (≈90%)</text>
  <!-- Decomposers -->
  <rect x="220" y="225" width="130" height="38" rx="8" fill="rgba(200,168,100,0.10)" stroke="#c8a850" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="285" y="240" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#c8a850">Decomposers</text>
  <text x="285" y="256" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#c8a850">(Bacteria, Fungi)</text>
  <text x="290" y="284" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Food Chain</text>
  <text x="50"  y="38" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">Solar</text>
  <text x="50"  y="50" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">Energy</text>
</svg>
