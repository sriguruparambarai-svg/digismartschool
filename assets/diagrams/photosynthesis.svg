<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#f5e87a"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#a8d8f0"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#a8e6a8"/></marker>
  </defs>
  <!-- Leaf outline -->
  <path d="M 260,30 C 330,30 420,90 420,175 C 420,260 330,320 260,320 C 190,320 100,260 100,175 C 100,90 190,30 260,30 Z"
        fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Midrib -->
  <line x1="260" y1="32" x2="260" y2="318" stroke="#a8e6a8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Veins -->
  <path d="M 260,100 Q 210,120 175,145" fill="none" stroke="#a8e6a8" stroke-width="1.4"/>
  <path d="M 260,100 Q 310,120 345,145" fill="none" stroke="#a8e6a8" stroke-width="1.4"/>
  <path d="M 260,165 Q 200,178 162,192" fill="none" stroke="#a8e6a8" stroke-width="1.4"/>
  <path d="M 260,165 Q 320,178 358,192" fill="none" stroke="#a8e6a8" stroke-width="1.4"/>
  <path d="M 260,230 Q 215,242 185,255" fill="none" stroke="#a8e6a8" stroke-width="1.2"/>
  <path d="M 260,230 Q 305,242 335,255" fill="none" stroke="#a8e6a8" stroke-width="1.2"/>
  <!-- Chloroplast in cell hint -->
  <ellipse cx="220" cy="155" rx="22" ry="12" fill="rgba(168,230,168,0.22)" stroke="#a8e6a8" stroke-width="1.2"/>
  <ellipse cx="300" cy="155" rx="22" ry="12" fill="rgba(168,230,168,0.22)" stroke="#a8e6a8" stroke-width="1.2"/>
  <ellipse cx="220" cy="200" rx="20" ry="11" fill="rgba(168,230,168,0.22)" stroke="#a8e6a8" stroke-width="1.2"/>
  <ellipse cx="300" cy="200" rx="20" ry="11" fill="rgba(168,230,168,0.22)" stroke="#a8e6a8" stroke-width="1.2"/>
  <!-- Sunlight arrows in -->
  <line x1="40" y1="60" x2="95" y2="130" stroke="#f5e87a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a1)"/>
  <line x1="60" y1="40" x2="110" y2="100" stroke="#f5e87a" stroke-width="2" stroke-linecap="round" marker-end="url(#a1)"/>
  <!-- CO2 arrow in -->
  <line x1="30" y1="190" x2="98" y2="185" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a1)"/>
  <!-- H2O arrow up from roots -->
  <line x1="260" y1="360" x2="260" y2="322" stroke="#a8d8f0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2)"/>
  <!-- O2 arrow out right -->
  <line x1="422" y1="130" x2="488" y2="80" stroke="#a8e6a8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a3)"/>
  <!-- Glucose arrow out bottom-right -->
  <line x1="410" y1="240" x2="476" y2="265" stroke="#f5e87a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a1)"/>
  <!-- Formula box -->
  <rect x="145" y="340" width="230" height="32" rx="8" fill="rgba(168,230,168,0.08)" stroke="#a8e6a8" stroke-width="1.2"/>
  <text x="260" y="360" text-anchor="middle" font-family="Kalam,cursive" font-size="11" fill="#a8e6a8">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</text>
  <!-- Input/output labels -->
  <text x="34" y="55"  font-family="Kalam,cursive" font-size="12" font-weight="700" fill="#f5e87a">☀ Sunlight</text>
  <text x="8"  y="188" font-family="Kalam,cursive" font-size="12" font-weight="700" fill="#f4a0a0">CO₂ in</text>
  <text x="220" y="376" text-anchor="middle" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8d8f0">H₂O (roots)</text>
  <text x="492" y="78"  font-family="Kalam,cursive" font-size="12" font-weight="700" fill="#a8e6a8">O₂ out</text>
  <text x="480" y="262" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f5e87a">Glucose</text>
  <text x="260" y="175" text-anchor="middle" font-family="Kalam,cursive" font-size="11" fill="#a8e6a8">Chloroplast</text>
  <text x="260" y="15" text-anchor="middle" font-family="Kalam,cursive" font-size="15" font-weight="700" fill="#f5e87a">Photosynthesis</text>
</svg>
