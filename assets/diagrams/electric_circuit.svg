<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340">
  <!-- Main circuit wires -->
  <rect x="80" y="80" width="320" height="180" rx="0" fill="none" stroke="#a8e6a8" stroke-width="3" stroke-linecap="square"/>
  <!-- Battery (left side) -->
  <line x1="80" y1="145" x2="80" y2="155" stroke="none"/>
  <!-- Battery symbol on left wire -->
  <line x1="60" y1="135" x2="100" y2="135" stroke="rgba(0,0,0,0)" stroke-width="0"/>
  <!-- Break wire to insert battery -->
  <line x1="80" y1="80"  x2="80" y2="128" stroke="#a8e6a8" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="172" x2="80" y2="260" stroke="#a8e6a8" stroke-width="3" stroke-linecap="round"/>
  <!-- Battery symbol -->
  <line x1="60" y1="128" x2="100" y2="128" stroke="#f5e87a" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="138" x2="92"  y2="138" stroke="#f5e87a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="148" x2="100" y2="148" stroke="#f5e87a" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="158" x2="92"  y2="158" stroke="#f5e87a" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="158" x2="80"  y2="172" stroke="#a8e6a8" stroke-width="3"/>
  <!-- Bulb (top wire) -->
  <line x1="180" y1="80" x2="220" y2="80" stroke="#a8e6a8" stroke-width="3"/>
  <circle cx="240" cy="60" r="22" fill="rgba(245,232,122,0.12)" stroke="#f5e87a" stroke-width="2.5"/>
  <path d="M 228,70 C 228,55 234,50 240,50 C 246,50 252,55 252,70" fill="none" stroke="#f5e87a" stroke-width="1.8"/>
  <line x1="236" y1="72" x2="244" y2="72" stroke="#f5e87a" stroke-width="1.2"/>
  <!-- Glow effect -->
  <circle cx="240" cy="60" r="18" fill="rgba(245,232,122,0.08)"/>
  <line x1="260" y1="80" x2="320" y2="80" stroke="#a8e6a8" stroke-width="3"/>
  <!-- Resistor (bottom wire) -->
  <line x1="80"  y1="260" x2="168" y2="260" stroke="#a8e6a8" stroke-width="3"/>
  <path d="M 168,260 L 176,248 L 188,272 L 200,248 L 212,272 L 224,248 L 236,272 L 244,260" fill="none" stroke="#f4a0a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="244" y1="260" x2="400" y2="260" stroke="#a8e6a8" stroke-width="3"/>
  <!-- Switch (right top) -->
  <line x1="400" y1="80" x2="400" y2="118" stroke="#a8e6a8" stroke-width="3"/>
  <circle cx="400" cy="126" r="5" fill="none" stroke="#a8d8f0" stroke-width="2"/>
  <line x1="400" y1="131" x2="415" y2="115" stroke="#a8d8f0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="400" cy="144" r="5" fill="none" stroke="#a8d8f0" stroke-width="2"/>
  <line x1="400" y1="149" x2="400" y2="260" stroke="#a8e6a8" stroke-width="3"/>
  <!-- Ammeter on right bottom -->
  <line x1="400" y1="140" x2="400" y2="260" stroke="none"/>
  <!-- Current direction arrows -->
  <polygon points="240,80 232,74 232,86" fill="#a8e6a8" opacity="0.8"/>
  <polygon points="80,200 74,192 86,192" fill="#a8e6a8" opacity="0.8"/>
  <polygon points="240,260 248,254 248,266" fill="#a8e6a8" opacity="0.8"/>
  <!-- LABELS -->
  <text x="30"  y="148" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Battery</text>
  <text x="30"  y="162" text-anchor="middle" font-family="Kalam,cursive" font-size="9"  fill="#f5e87a">(Cell)</text>
  <text x="240" y="22"  text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Bulb</text>
  <text x="206" y="282" text-anchor="middle" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f4a0a0">Resistor</text>
  <text x="440" y="130" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8d8f0">Switch</text>
  <text x="190" y="55"  font-family="Kalam,cursive" font-size="8"  fill="#a8e6a8">→ Current</text>
  <!-- Legend -->
  <rect x="22" y="285" width="200" height="38" rx="6" fill="rgba(0,0,0,0.2)" stroke="rgba(200,196,190,0.15)" stroke-width="1"/>
  <line x1="30"  y1="298" x2="55"  y2="298" stroke="#a8e6a8" stroke-width="2"/>
  <text x="60"  y="302" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Wire (conductor)</text>
  <line x1="30"  y1="314" x2="55"  y2="314" stroke="#f5e87a" stroke-width="2.5"/>
  <text x="60"  y="318" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">+ / − battery plates</text>
  <text x="240" y="320" text-anchor="middle" font-family="Kalam,cursive" font-size="13" font-weight="700" fill="#f5e87a">Simple Electric Circuit</text>
</svg>
