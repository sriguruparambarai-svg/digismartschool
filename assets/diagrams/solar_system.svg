<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <!-- Sun -->
  <circle cx="52" cy="160" r="44" fill="rgba(245,232,122,0.22)" stroke="#f5e87a" stroke-width="2.5"/>
  <circle cx="52" cy="160" r="34" fill="rgba(245,232,122,0.15)" stroke="#f5e87a" stroke-width="1"/>
  <text x="52" y="160" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Sun</text>
  <!-- Orbits -->
  <ellipse cx="52" cy="160" rx="80"  ry="16"  fill="none" stroke="rgba(200,196,190,0.18)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="120" ry="24"  fill="none" stroke="rgba(200,196,190,0.18)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="170" ry="34"  fill="none" stroke="rgba(200,196,190,0.18)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="230" ry="46"  fill="none" stroke="rgba(200,196,190,0.16)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="298" ry="58"  fill="none" stroke="rgba(200,196,190,0.15)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="368" ry="72"  fill="none" stroke="rgba(200,196,190,0.14)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="438" ry="86"  fill="none" stroke="rgba(200,196,190,0.12)" stroke-width="1"/>
  <ellipse cx="52" cy="160" rx="508" ry="100" fill="none" stroke="rgba(200,196,190,0.10)" stroke-width="1"/>
  <!-- Planets -->
  <!-- Mercury -->
  <circle cx="132" cy="160" r="5" fill="#b0acaa" stroke="#c8c4be" stroke-width="1.2"/>
  <!-- Venus -->
  <circle cx="172" cy="160" r="7" fill="rgba(244,200,120,0.6)" stroke="#f5c880" stroke-width="1.5"/>
  <!-- Earth -->
  <circle cx="222" cy="160" r="7.5" fill="rgba(100,160,240,0.5)" stroke="#78aaf0" stroke-width="1.8"/>
  <!-- Mars -->
  <circle cx="282" cy="160" r="6"  fill="rgba(220,80,50,0.45)" stroke="#dc5032" stroke-width="1.5"/>
  <!-- Jupiter -->
  <circle cx="350" cy="160" r="16" fill="rgba(200,160,100,0.35)" stroke="#c8a064" stroke-width="2"/>
  <path d="M 334,156 Q 350,152 366,156" fill="none" stroke="rgba(200,160,100,0.5)" stroke-width="1.5"/>
  <path d="M 334,164 Q 350,168 366,164" fill="none" stroke="rgba(200,160,100,0.5)" stroke-width="1.5"/>
  <!-- Saturn -->
  <ellipse cx="420" cy="160" rx="22" ry="8" fill="none" stroke="#d4c080" stroke-width="1.5" opacity="0.7"/>
  <circle cx="420" cy="160" r="13" fill="rgba(212,192,100,0.35)" stroke="#d4c080" stroke-width="2"/>
  <!-- Uranus -->
  <circle cx="490" cy="160" r="9" fill="rgba(150,220,240,0.35)" stroke="#96dcf0" stroke-width="1.8"/>
  <!-- Neptune -->
  <circle cx="560" cy="160" r="8" fill="rgba(80,120,220,0.4)" stroke="#5078dc" stroke-width="1.8"/>
  <!-- Planet labels (below) -->
  <text x="132" y="172" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#c8c4be">Mercury</text>
  <text x="172" y="175" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#f5c880">Venus</text>
  <text x="222" y="175" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#78aaf0">Earth</text>
  <text x="282" y="173" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#dc5032">Mars</text>
  <text x="350" y="184" text-anchor="middle" font-family="Kalam,cursive" font-size="8.5" fill="#c8a064">Jupiter</text>
  <text x="420" y="180" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="#d4c080">Saturn</text>
  <text x="490" y="177" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#96dcf0">Uranus</text>
  <text x="560" y="176" text-anchor="middle" font-family="Kalam,cursive" font-size="7.5" fill="#5078dc">Neptune</text>
  <!-- Distance note -->
  <text x="350" y="295" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="rgba(200,196,190,0.5)">Not to scale — distances much larger in reality</text>
  <text x="350" y="312" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">The Solar System</text>
</svg>
