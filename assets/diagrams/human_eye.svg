<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340">
  <!-- Sclera (white) -->
  <ellipse cx="200" cy="165" rx="148" ry="118" fill="rgba(240,237,232,0.08)" stroke="#f2efe9" stroke-width="2.5"/>
  <!-- Choroid -->
  <ellipse cx="200" cy="165" rx="136" ry="108" fill="rgba(100,60,40,0.08)" stroke="rgba(180,100,60,0.5)" stroke-width="1.2"/>
  <!-- Retina -->
  <ellipse cx="200" cy="165" rx="122" ry="96" fill="rgba(244,160,160,0.06)" stroke="#f4a0a0" stroke-width="1.5"/>
  <!-- Vitreous humor (clear inside) -->
  <ellipse cx="200" cy="165" rx="108" ry="84" fill="rgba(168,216,240,0.05)" stroke="rgba(168,216,240,0.2)" stroke-width="0.8"/>
  <!-- Cornea (front curve) -->
  <path d="M 68,145 C 50,150 48,165 50,180 C 52,198 68,205 80,200" fill="rgba(168,216,240,0.12)" stroke="#a8d8f0" stroke-width="2.2"/>
  <!-- Iris -->
  <circle cx="162" cy="165" r="38" fill="rgba(100,130,200,0.22)" stroke="#a8b8e8" stroke-width="2"/>
  <!-- Pupil -->
  <circle cx="162" cy="165" r="18" fill="rgba(10,10,10,0.6)" stroke="#202020" stroke-width="1.5"/>
  <!-- Lens -->
  <ellipse cx="185" cy="165" rx="18" ry="30" fill="rgba(245,232,122,0.10)" stroke="#f5e87a" stroke-width="1.8"/>
  <!-- Optic nerve -->
  <path d="M 325,165 L 378,165" stroke="#d4a0f0" stroke-width="7" stroke-linecap="round"/>
  <path d="M 325,165 L 378,165" stroke="rgba(212,160,240,0.22)" stroke-width="12" stroke-linecap="round"/>
  <!-- Blind spot -->
  <circle cx="322" cy="165" r="8" fill="rgba(212,160,240,0.22)" stroke="#d4a0f0" stroke-width="1.5"/>
  <!-- Yellow spot (fovea) -->
  <circle cx="290" cy="158" r="9" fill="rgba(245,232,122,0.25)" stroke="#f5e87a" stroke-width="1.5"/>
  <!-- Suspensory ligaments -->
  <path d="M 185,135 C 192,122 195,110 194,96"  fill="none" stroke="rgba(200,196,190,0.45)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 185,195 C 192,208 195,220 194,234" fill="none" stroke="rgba(200,196,190,0.45)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Ciliary body -->
  <ellipse cx="190" cy="92" rx="14" ry="7" fill="rgba(168,230,168,0.18)" stroke="#a8e6a8" stroke-width="1.2"/>
  <ellipse cx="190" cy="238" rx="14" ry="7" fill="rgba(168,230,168,0.18)" stroke="#a8e6a8" stroke-width="1.2"/>
  <!-- Aqueous humor label area -->
  <path d="M 90,165 Q 130,165 162,165" fill="none" stroke="rgba(168,216,240,0.2)" stroke-width="0.8"/>
  <!-- Light ray -->
  <path d="M 18,165 L 54,165" stroke="#f5e87a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#lr)"/>
  <defs><marker id="lr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#f5e87a"/></marker></defs>
  <!-- LABELS -->
  <text x="22"  y="155" font-family="Kalam,cursive" font-size="9"  fill="#f5e87a">Light</text>
  <text x="68"  y="240" text-anchor="end" font-family="Kalam,cursive" font-size="9"  font-weight="700" fill="#a8d8f0">Cornea</text>
  <text x="110" y="125" text-anchor="end" font-family="Kalam,cursive" font-size="9"  font-weight="700" fill="#f2efe9">Sclera</text>
  <text x="138" y="210" text-anchor="end" font-family="Kalam,cursive" font-size="9"  font-weight="700" fill="#a8b8e8">Iris</text>
  <text x="138" y="228" text-anchor="end" font-family="Kalam,cursive" font-size="9"  fill="#202020">Pupil</text>
  <text x="210" y="108" text-anchor="middle" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#f5e87a">Lens</text>
  <text x="165" y="82"  text-anchor="end" font-family="Kalam,cursive" font-size="9"  fill="#a8e6a8">Ciliary body</text>
  <text x="308" y="145" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">Fovea</text>
  <text x="322" y="183" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#d4a0f0">Blind spot</text>
  <text x="382" y="158" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#d4a0f0">Optic</text>
  <text x="382" y="170" font-family="Kalam,cursive" font-size="9" font-weight="700" fill="#d4a0f0">Nerve</text>
  <text x="270" y="220" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Retina</text>
  <text x="210" y="325" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Human Eye — Cross Section</text>
</svg>
