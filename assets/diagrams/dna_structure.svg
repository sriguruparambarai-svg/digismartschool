<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 500">
  <!-- Left backbone (sugar-phosphate) -->
  <path d="M 80,30 C 80,60 120,80 120,110 C 120,140 80,160 80,190 C 80,220 120,240 120,270 C 120,300 80,320 80,350 C 80,380 120,400 120,430" fill="none" stroke="#a8d8f0" stroke-width="5" stroke-linecap="round"/>
  <!-- Right backbone -->
  <path d="M 220,30 C 220,60 180,80 180,110 C 180,140 220,160 220,190 C 220,220 180,240 180,270 C 180,300 220,320 220,350 C 220,380 180,400 180,430" fill="none" stroke="#a8d8f0" stroke-width="5" stroke-linecap="round"/>
  <!-- Base pairs (rungs) - colored by pair type -->
  <!-- A-T pairs (yellow/red) -->
  <line x1="88"  y1="55"  x2="212" y2="55"  stroke="#f5e87a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="88"  cy="55"  r="7" fill="rgba(245,232,122,0.45)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="212" cy="55"  r="7" fill="rgba(244,160,160,0.45)" stroke="#f4a0a0" stroke-width="1.5"/>
  <text x="100" y="50" font-family="Kalam,cursive" font-size="8" fill="#f5e87a">A</text>
  <text x="200" y="50" font-family="Kalam,cursive" font-size="8" fill="#f4a0a0">T</text>

  <!-- G-C pair -->
  <line x1="112" y1="105" x2="188" y2="105" stroke="#a8e6a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="105" r="7" fill="rgba(168,230,168,0.45)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="188" cy="105" r="7" fill="rgba(212,160,240,0.45)" stroke="#d4a0f0" stroke-width="1.5"/>
  <text x="101" y="100" font-family="Kalam,cursive" font-size="8" fill="#a8e6a8">G</text>
  <text x="192" y="100" font-family="Kalam,cursive" font-size="8" fill="#d4a0f0">C</text>

  <!-- T-A -->
  <line x1="88"  y1="155" x2="212" y2="155" stroke="#f4a0a0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="88"  cy="155" r="7" fill="rgba(244,160,160,0.45)" stroke="#f4a0a0" stroke-width="1.5"/>
  <circle cx="212" cy="155" r="7" fill="rgba(245,232,122,0.45)" stroke="#f5e87a" stroke-width="1.5"/>
  <text x="77"  y="150" font-family="Kalam,cursive" font-size="8" fill="#f4a0a0">T</text>
  <text x="216" y="150" font-family="Kalam,cursive" font-size="8" fill="#f5e87a">A</text>

  <!-- C-G -->
  <line x1="112" y1="205" x2="188" y2="205" stroke="#d4a0f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="205" r="7" fill="rgba(212,160,240,0.45)" stroke="#d4a0f0" stroke-width="1.5"/>
  <circle cx="188" cy="205" r="7" fill="rgba(168,230,168,0.45)" stroke="#a8e6a8" stroke-width="1.5"/>
  <text x="101" y="200" font-family="Kalam,cursive" font-size="8" fill="#d4a0f0">C</text>
  <text x="192" y="200" font-family="Kalam,cursive" font-size="8" fill="#a8e6a8">G</text>

  <!-- A-T -->
  <line x1="88"  y1="255" x2="212" y2="255" stroke="#f5e87a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="88"  cy="255" r="7" fill="rgba(245,232,122,0.45)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="212" cy="255" r="7" fill="rgba(244,160,160,0.45)" stroke="#f4a0a0" stroke-width="1.5"/>

  <!-- G-C -->
  <line x1="112" y1="305" x2="188" y2="305" stroke="#a8e6a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="305" r="7" fill="rgba(168,230,168,0.45)" stroke="#a8e6a8" stroke-width="1.5"/>
  <circle cx="188" cy="305" r="7" fill="rgba(212,160,240,0.45)" stroke="#d4a0f0" stroke-width="1.5"/>

  <!-- T-A -->
  <line x1="88"  y1="355" x2="212" y2="355" stroke="#f4a0a0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="88"  cy="355" r="7" fill="rgba(244,160,160,0.45)" stroke="#f4a0a0" stroke-width="1.5"/>
  <circle cx="212" cy="355" r="7" fill="rgba(245,232,122,0.45)" stroke="#f5e87a" stroke-width="1.5"/>

  <!-- A-T -->
  <line x1="112" y1="405" x2="188" y2="405" stroke="#f5e87a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="405" r="7" fill="rgba(245,232,122,0.45)" stroke="#f5e87a" stroke-width="1.5"/>
  <circle cx="188" cy="405" r="7" fill="rgba(244,160,160,0.45)" stroke="#f4a0a0" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="240" y="200" width="85" height="110" rx="7" fill="rgba(0,0,0,0.2)" stroke="rgba(200,196,190,0.2)" stroke-width="1"/>
  <circle cx="254" cy="218" r="6" fill="rgba(245,232,122,0.5)" stroke="#f5e87a" stroke-width="1.2"/>
  <text x="264" y="222" font-family="Kalam,cursive" font-size="9" fill="#f5e87a">Adenine (A)</text>
  <circle cx="254" cy="238" r="6" fill="rgba(244,160,160,0.5)" stroke="#f4a0a0" stroke-width="1.2"/>
  <text x="264" y="242" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Thymine (T)</text>
  <circle cx="254" cy="258" r="6" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.2"/>
  <text x="264" y="262" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Guanine (G)</text>
  <circle cx="254" cy="278" r="6" fill="rgba(212,160,240,0.5)" stroke="#d4a0f0" stroke-width="1.2"/>
  <text x="264" y="282" font-family="Kalam,cursive" font-size="9" fill="#d4a0f0">Cytosine (C)</text>
  <text x="275" y="300" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="rgba(200,196,190,0.6)">A pairs T</text>
  <text x="275" y="312" text-anchor="middle" font-family="Kalam,cursive" font-size="8" fill="rgba(200,196,190,0.6)">G pairs C</text>
  <!-- Labels -->
  <text x="42"  y="240" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Sugar</text>
  <text x="42"  y="252" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Phosphate</text>
  <text x="42"  y="264" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Backbone</text>
  <text x="170" y="486" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">DNA Double Helix</text>
  <text x="170" y="500" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="rgba(200,196,190,0.6)">Deoxyribonucleic Acid</text>
</svg>
