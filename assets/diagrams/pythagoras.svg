<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380">
  <!-- Right triangle (large, centered) -->
  <polygon points="100,300 100,80 340,300" fill="rgba(168,216,240,0.08)" stroke="#a8d8f0" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right angle box -->
  <rect x="100" y="280" width="20" height="20" fill="none" stroke="#f5e87a" stroke-width="1.8"/>
  <!-- Side labels -->
  <!-- 'a' left side -->
  <text x="72"  y="195" text-anchor="middle" font-family="Kalam,cursive" font-size="18" font-weight="700" fill="#f4a0a0">a</text>
  <!-- 'b' bottom -->
  <text x="220" y="330" text-anchor="middle" font-family="Kalam,cursive" font-size="18" font-weight="700" fill="#a8e6a8">b</text>
  <!-- 'c' hypotenuse -->
  <text x="232" y="175" text-anchor="middle" font-family="Kalam,cursive" font-size="18" font-weight="700" fill="#f5e87a">c</text>
  <!-- Squares on sides -->
  <!-- Square on side 'a' (left, vertical 220px) -->
  <rect x="20" y="80" width="80" height="220" fill="rgba(244,160,160,0.10)" stroke="#f4a0a0" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="60" y="192" text-anchor="middle" font-family="Kalam,cursive" font-size="13" fill="#f4a0a0">a²</text>
  <!-- Square on 'b' (bottom, 240px) -->
  <rect x="100" y="300" width="240" height="70" fill="rgba(168,230,168,0.10)" stroke="#a8e6a8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="220" y="342" text-anchor="middle" font-family="Kalam,cursive" font-size="13" fill="#a8e6a8">b²</text>
  <!-- Square on hypotenuse (rotated, hinted) -->
  <path d="M 340,300 L 440,170 L 310,50 L 210,80 Z" fill="rgba(245,232,122,0.08)" stroke="#f5e87a" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="358" y="185" text-anchor="middle" font-family="Kalam,cursive" font-size="13" fill="#f5e87a">c²</text>
  <!-- The theorem -->
  <rect x="90" y="14" width="260" height="44" rx="10" fill="rgba(245,232,122,0.10)" stroke="#f5e87a" stroke-width="1.8"/>
  <text x="220" y="32" text-anchor="middle" font-family="Kalam,cursive" font-size="15" font-weight="700" fill="#f5e87a">a² + b² = c²</text>
  <text x="220" y="50" text-anchor="middle" font-family="Kalam,cursive" font-size="10" fill="#c8c4be">Pythagorean Theorem</text>
  <!-- Example numbers -->
  <text x="220" y="368" text-anchor="middle" font-family="Kalam,cursive" font-size="11" fill="rgba(200,196,190,0.7)">Example: a=3, b=4, c=5   →   9+16=25 ✓</text>
</svg>
