<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380">
  <!-- Electron orbits -->
  <ellipse cx="210" cy="185" rx="170" ry="60" fill="none" stroke="rgba(168,216,240,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="210" cy="185" rx="170" ry="60" fill="none" stroke="rgba(168,216,240,0.3)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(60,210,185)"/>
  <ellipse cx="210" cy="185" rx="170" ry="60" fill="none" stroke="rgba(168,216,240,0.3)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(120,210,185)"/>
  <!-- Inner orbit -->
  <ellipse cx="210" cy="185" rx="95" ry="35" fill="none" stroke="rgba(168,216,240,0.45)" stroke-width="1.8" stroke-dasharray="5 3"/>
  <ellipse cx="210" cy="185" rx="95" ry="35" fill="none" stroke="rgba(168,216,240,0.45)" stroke-width="1.8" stroke-dasharray="5 3" transform="rotate(60,210,185)"/>
  <ellipse cx="210" cy="185" rx="95" ry="35" fill="none" stroke="rgba(168,216,240,0.45)" stroke-width="1.8" stroke-dasharray="5 3" transform="rotate(120,210,185)"/>
  <!-- Nucleus -->
  <circle cx="210" cy="185" r="32" fill="rgba(244,160,160,0.12)" stroke="#f4a0a0" stroke-width="2.2"/>
  <!-- Protons + Neutrons in nucleus -->
  <circle cx="200" cy="178" r="8" fill="rgba(244,160,160,0.35)" stroke="#f4a0a0" stroke-width="1.5"/>
  <circle cx="218" cy="178" r="8" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="200" cy="194" r="8" fill="rgba(244,160,160,0.35)" stroke="#f4a0a0" stroke-width="1.5"/>
  <circle cx="218" cy="194" r="8" fill="rgba(168,216,240,0.35)" stroke="#a8d8f0" stroke-width="1.5"/>
  <circle cx="210" cy="185" r="6" fill="rgba(244,160,160,0.35)" stroke="#f4a0a0" stroke-width="1.2"/>
  <!-- Electrons -->
  <circle cx="40"  cy="185" r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="380" cy="185" r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="210" cy="25"  r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="210" cy="345" r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="110" cy="60"  r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="310" cy="310" r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="310" cy="60"  r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <circle cx="110" cy="310" r="7" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.8"/>
  <!-- LABELS -->
  <text x="210" y="185" text-anchor="middle" dominant-baseline="central" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#f5e87a">Nucleus</text>
  <text x="155" y="174" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Proton (+)</text>
  <text x="155" y="200" text-anchor="end" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Neutron (0)</text>
  <text x="28"  y="172" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <text x="392" y="172" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <text x="210" y="14"  text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <text x="210" y="358" text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <text x="100" y="48"  text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <text x="320" y="48"  text-anchor="middle" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">e⁻</text>
  <!-- Orbit labels -->
  <text x="365" y="138" font-family="Kalam,cursive" font-size="9" fill="rgba(168,216,240,0.7)">K shell (n=1)</text>
  <!-- Legend box -->
  <rect x="18" y="300" width="130" height="60" rx="8" fill="rgba(0,0,0,0.2)" stroke="rgba(200,196,190,0.2)" stroke-width="1"/>
  <circle cx="34" cy="316" r="6" fill="rgba(244,160,160,0.5)" stroke="#f4a0a0" stroke-width="1.2"/>
  <text x="46" y="320" font-family="Kalam,cursive" font-size="9" fill="#f4a0a0">Proton (positive)</text>
  <circle cx="34" cy="336" r="6" fill="rgba(168,216,240,0.5)" stroke="#a8d8f0" stroke-width="1.2"/>
  <text x="46" y="340" font-family="Kalam,cursive" font-size="9" fill="#a8d8f0">Neutron (neutral)</text>
  <circle cx="34" cy="354" r="6" fill="rgba(168,230,168,0.5)" stroke="#a8e6a8" stroke-width="1.2"/>
  <text x="46" y="358" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">Electron (negative)</text>
  <text x="210" y="372" text-anchor="middle" font-family="Kalam,cursive" font-size="14" font-weight="700" fill="#f5e87a">Structure of an Atom</text>
</svg>
