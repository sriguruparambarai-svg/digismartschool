<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <!-- Roots -->
  <line x1="200" y1="420" x2="200" y2="480" stroke="#c8a850" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="450" x2="155" y2="490" stroke="#c8a850" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="450" x2="245" y2="490" stroke="#c8a850" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="465" x2="168" y2="505" stroke="#c8a850" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="465" x2="232" y2="505" stroke="#c8a850" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="155" y1="490" x2="130" y2="512" stroke="#c8a850" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="245" y1="490" x2="270" y2="512" stroke="#c8a850" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Soil line -->
  <path d="M 60,418 Q 200,410 340,418" fill="none" stroke="#c8a850" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <!-- Stem -->
  <rect x="190" y="200" width="20" height="220" rx="5" fill="rgba(168,200,100,0.15)" stroke="#a8c860" stroke-width="2.2"/>
  <!-- Node indicators -->
  <ellipse cx="200" cy="280" rx="14" ry="5" fill="rgba(168,200,100,0.25)" stroke="#a8c860" stroke-width="1.5"/>
  <ellipse cx="200" cy="340" rx="14" ry="5" fill="rgba(168,200,100,0.25)" stroke="#a8c860" stroke-width="1.5"/>
  <!-- Leaves left -->
  <path d="M 190,270 C 140,240 100,255 108,285 C 116,310 165,295 190,278" fill="rgba(168,230,168,0.20)" stroke="#a8e6a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 154,268" fill="none"/>
  <line x1="190" y1="274" x2="120" y2="274" stroke="#a8e6a8" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Leaves right -->
  <path d="M 210,260 C 260,230 300,245 292,275 C 284,300 238,285 210,268" fill="rgba(168,230,168,0.20)" stroke="#a8e6a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="210" y1="264" x2="280" y2="264" stroke="#a8e6a8" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <!-- Leaves 2nd pair -->
  <path d="M 190,330 C 138,302 98,318 106,346 C 114,370 162,354 190,338" fill="rgba(168,230,168,0.18)" stroke="#a8e6a8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 210,320 C 262,294 302,310 294,338 C 286,362 240,346 210,328" fill="rgba(168,230,168,0.18)" stroke="#a8e6a8" stroke-width="2" stroke-linecap="round"/>
  <!-- Flower -->
  <circle cx="200" cy="160" r="22" fill="rgba(244,160,160,0.15)" stroke="#f4a0a0" stroke-width="1.8"/>
  <ellipse cx="200" cy="128" rx="12" ry="18" fill="rgba(244,160,160,0.18)" stroke="#f4a0a0" stroke-width="1.5"/>
  <ellipse cx="200" cy="192" rx="12" ry="18" fill="rgba(244,160,160,0.18)" stroke="#f4a0a0" stroke-width="1.5"/>
  <ellipse cx="168" cy="160" rx="18" ry="12" fill="rgba(244,160,160,0.18)" stroke="#f4a0a0" stroke-width="1.5"/>
  <ellipse cx="232" cy="160" rx="18" ry="12" fill="rgba(244,160,160,0.18)" stroke="#f4a0a0" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="10" fill="rgba(245,232,122,0.35)" stroke="#f5e87a" stroke-width="1.8"/>
  <!-- Bud at top -->
  <path d="M 188,200 C 185,185 190,170 200,165" fill="none" stroke="#a8c860" stroke-width="1.5"/>
  <!-- LABELS -->
  <text x="296" y="160" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#f4a0a0">Flower</text>
  <line x1="232" y1="160" x2="292" y2="160" stroke="#f4a0a0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="268" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8e6a8">Leaf</text>
  <line x1="292" y1="268" x2="307" y2="268" stroke="#a8e6a8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="300" font-family="Kalam,cursive" font-size="9" fill="#a8e6a8">(Lamina)</text>
  <text x="310" y="340" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#a8c860">Node</text>
  <line x1="214" y1="340" x2="307" y2="340" stroke="#a8c860" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="310" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8c860">Stem</text>
  <text x="310" y="380" font-family="Kalam,cursive" font-size="10" font-weight="700" fill="#a8c860">Internode</text>
  <text x="42" y="408" font-family="Kalam,cursive" font-size="9" fill="#c8a850" opacity="0.8">Soil Level</text>
  <text x="310" y="445" font-family="Kalam,cursive" font-size="11" font-weight="700" fill="#c8a850">Root System</text>
  <text x="310" y="462" font-family="Kalam,cursive" font-size="9" fill="#c8a850">(Tap root)</text>
  <line x1="245" y1="450" x2="307" y2="450" stroke="#c8a850" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="15" text-anchor="middle" font-family="Kalam,cursive" font-size="15" font-weight="700" fill="#f5e87a">Parts of a Plant</text>
</svg>
