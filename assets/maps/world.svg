<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" style="background:transparent">
  <!-- Equator line -->
  <line x1="20" y1="178" x2="600" y2="178"
        stroke="rgba(200,196,190,0.18)" stroke-width="0.8" stroke-dasharray="6 5"/>
  <text x="604" y="182" font-family="Kalam,cursive" font-size="7"
        fill="rgba(200,196,190,0.35)">Equator</text>

  <!-- North America -->
  <path d="M 50,54 C 62,44 78,40 95,42 C 115,44 134,52 148,64
    C 162,76 170,92 170,108 C 170,126 162,142 150,152 C 140,162 126,168 112,170
    C 98,172 84,168 72,160 C 58,150 48,136 44,120 C 40,104 40,86 48,72 Z"
        fill="rgba(168,216,240,0.07)" stroke="#a8d8f0" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenland hint -->
  <ellipse cx="170" cy="32" rx="28" ry="18"
           fill="none" stroke="rgba(200,196,190,0.35)" stroke-width="1.2"/>

  <!-- South America -->
  <path d="M 110,190 C 122,182 136,180 148,184 C 162,188 172,198 176,212
    C 180,226 178,242 170,254 C 162,266 150,274 136,276 C 122,278 108,272 99,260
    C 89,248 86,232 90,218 C 94,204 102,196 110,190 Z"
        fill="rgba(168,230,168,0.07)" stroke="#a8e6a8" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Europe -->
  <path d="M 258,40 C 268,32 280,30 292,34 C 305,38 316,48 320,60
    C 324,72 322,86 315,96 C 308,106 296,112 284,114 C 272,116 259,112 250,104
    C 240,96 236,84 238,72 C 240,60 248,48 258,40 Z"
        fill="rgba(245,232,122,0.07)" stroke="#f5e87a" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Africa -->
  <path d="M 252,140 C 264,130 278,128 292,132 C 308,136 320,148 326,164
    C 332,180 330,198 322,212 C 314,226 302,234 288,236 C 274,238 260,232 250,220
    C 240,208 236,192 238,178 C 240,164 248,150 252,140 Z"
        fill="rgba(244,160,160,0.07)" stroke="#f4a0a0" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Asia (large) -->
  <path d="M 355,36 C 375,26 400,24 424,28 C 450,32 474,46 490,64
    C 506,82 512,104 508,126 C 504,148 490,166 472,178 C 454,190 432,194 410,190
    C 388,186 368,174 354,158 C 340,142 334,122 334,102 C 334,80 342,56 355,36 Z"
        fill="rgba(168,230,168,0.07)" stroke="#a8e6a8" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- India sub-continent hint inside Asia -->
  <path d="M 420,148 C 426,142 434,140 440,144 C 448,148 452,158 450,168
    C 448,178 440,186 432,188 C 426,186 422,180 420,172 C 418,164 418,156 420,148 Z"
        fill="rgba(245,232,122,0.14)" stroke="#f5e87a" stroke-width="1.2"
        stroke-dasharray="4 3"/>

  <!-- Australia -->
  <path d="M 474,198 C 486,190 500,188 514,192 C 528,196 540,206 546,220
    C 552,234 550,250 542,262 C 534,272 522,278 508,278 C 494,278 480,272 471,260
    C 462,248 459,234 462,220 C 465,206 470,204 474,198 Z"
        fill="rgba(212,160,240,0.07)" stroke="#d4a0f0" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Antarctica hint -->
  <path d="M 140,305 C 170,296 210,292 260,292 C 320,292 380,296 430,304 C 460,309 490,316 510,320"
        fill="none" stroke="rgba(200,196,190,0.3)" stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- LABELS -->
  <text x="108" y="110" text-anchor="middle" font-family="Kalam,cursive"
        font-size="10" font-weight="700" fill="#a8d8f0">North America</text>
  <text x="138" y="234" text-anchor="middle" font-family="Kalam,cursive"
        font-size="9" fill="#a8e6a8">South America</text>
  <text x="284" y="78" text-anchor="middle" font-family="Kalam,cursive"
        font-size="10" font-weight="700" fill="#f5e87a">Europe</text>
  <text x="288" y="190" text-anchor="middle" font-family="Kalam,cursive"
        font-size="10" font-weight="700" fill="#f4a0a0">Africa</text>
  <text x="422" y="110" text-anchor="middle" font-family="Kalam,cursive"
        font-size="12" font-weight="700" fill="#a8e6a8">Asia</text>
  <text x="440" y="166" text-anchor="middle" font-family="Kalam,cursive"
        font-size="8" fill="#f5e87a">India ★</text>
  <text x="508" y="238" text-anchor="middle" font-family="Kalam,cursive"
        font-size="9" fill="#d4a0f0">Australia</text>
  <text x="310" y="328" text-anchor="middle" font-family="Kalam,cursive"
        font-size="8" fill="rgba(200,196,190,0.4)">Antarctica</text>
  <!-- Ocean labels -->
  <text x="44" y="178" font-family="Kalam,cursive" font-size="8"
        fill="rgba(168,216,240,0.35)">Atlantic</text>
  <text x="200" y="270" text-anchor="middle" font-family="Kalam,cursive"
        font-size="7" fill="rgba(168,216,240,0.25)">S. Atlantic</text>
  <text x="348" y="260" text-anchor="middle" font-family="Kalam,cursive"
        font-size="7" fill="rgba(168,216,240,0.25)">Indian Ocean</text>
  <text x="570" y="140" text-anchor="middle" font-family="Kalam,cursive"
        font-size="7" fill="rgba(168,216,240,0.25)" transform="rotate(80,570,140)">Pacific</text>
  <text x="310" y="338" text-anchor="middle" font-family="Kalam,cursive"
        font-size="12" fill="rgba(245,232,122,0.45)">World Map</text>
</svg>
