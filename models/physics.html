<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Working Models — DigiSmartSchool</title>
<style>
  :root{
    --maroon:#6B1A1A; --gold:#C9A84C; --sandal:#E8C99A;
    --bg:#140A0A; --panel:#241010; --panel2:#2E1414;
    --line:#5A2A2A; --dim:#B99A7A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    color:var(--sandal); display:flex; flex-direction:column; overflow:hidden;
  }
  .pm-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .pm-bar h1{ font-size:17px; font-weight:600; color:var(--gold); margin:0 14px 0 0; letter-spacing:.4px; }
  .chip{
    background:transparent; color:var(--sandal); border:1px solid var(--line);
    border-radius:22px; padding:8px 18px; font-size:15px; cursor:pointer;
    font-family:inherit; transition:background .15s,border-color .15s;
  }
  .chip:hover{ background:var(--panel2); }
  .chip.on{ background:var(--maroon); border-color:var(--gold); color:var(--gold); font-weight:600; }
  .pm-stage{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 16px; }
  .pm-stage svg{ width:100%; height:100%; max-height:100%; }
  .pm-foot{ border-top:1px solid var(--line); background:var(--panel); padding:12px 20px 16px; }
  .pm-ctrls{ display:flex; flex-wrap:wrap; gap:22px; align-items:center; }
  .ctl{ display:flex; align-items:center; gap:10px; font-size:15px; }
  .ctl > .lb{ color:var(--dim); min-width:96px; }
  .ctl input[type=range]{ width:190px; accent-color:var(--gold); cursor:pointer; }
  .ctl .val{ color:var(--gold); font-weight:600; min-width:66px; }
  .btn{
    background:var(--maroon); color:var(--sandal); border:1px solid var(--gold);
    border-radius:8px; padding:9px 22px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:#7d2020; }
  .pm-read{ display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; }
  .stat{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 16px; min-width:150px; }
  .stat .k{ font-size:12.5px; color:var(--dim); letter-spacing:.3px; }
  .stat .v{ font-size:21px; color:var(--gold); font-weight:600; margin-top:2px; }
  .note{ font-size:14px; color:var(--dim); margin-top:12px; line-height:1.5; }
  text{ font-family:'Segoe UI',system-ui,Arial,sans-serif; }
  .lbl{ fill:var(--sandal); font-size:19px; }
  .lbl-sm{ fill:var(--dim); font-size:16px; }
  .lbl-gold{ fill:var(--gold); font-size:21px; font-weight:600; }
</style>
</head>
<body>

<div class="pm-bar">
  <h1>Working Models</h1>
  <button class="chip" type="button" data-m="force">Force</button>
  <button class="chip" type="button" data-m="inertia">Inertia</button>
  <button class="chip" type="button" data-m="momentum">Momentum</button>
  <button class="chip" type="button" data-m="rocket">Rocket</button>
  <button class="chip" type="button" data-m="moments">Moments</button>
  <button class="chip" type="button" data-m="impulse">Impulse</button>
  <button class="chip" type="button" data-m="friction">Friction</button>
</div>

<div class="pm-stage">
  <svg id="stage" viewBox="0 0 1000 440" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div class="pm-foot">
  <div class="pm-ctrls" id="ctrls"></div>
  <div class="pm-read" id="read"></div>
  <div class="note" id="note"></div>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   Physics working models — force, inertia, momentum.
   Hand-built, no API calls, no libraries. Runs offline once loaded,
   so a classroom projector with a weak connection still shows it.
   Every model exposes: build(), reset(), step(dt). One rAF loop.
   ────────────────────────────────────────────────────────────── */

var SVGNS = 'http://www.w3.org/2000/svg';
var stage = document.getElementById('stage');
var ctrlBox = document.getElementById('ctrls');
var readBox = document.getElementById('read');
var noteBox = document.getElementById('note');

function el(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs){ if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]); }
  return n;
}
function txt(x, y, s, cls, anchor){
  var n = el('text', { x:x, y:y, 'class': cls || 'lbl', 'text-anchor': anchor || 'middle' });
  n.textContent = s;
  return n;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

/* Sliders and buttons are declared by each model and rendered here, so a new
   model never has to touch the page layout. */
var SLIDERS = {};
function slider(id, label, min, max, val, stepv, unit, onChange){
  var wrap = document.createElement('div'); wrap.className = 'ctl';
  var lb = document.createElement('span'); lb.className = 'lb'; lb.textContent = label;
  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = stepv; inp.value = val;
  var out = document.createElement('span'); out.className = 'val';
  out.textContent = (+val).toFixed(stepv < 1 ? 1 : 0) + ' ' + unit;
  inp.oninput = function(){
    out.textContent = (+inp.value).toFixed(stepv < 1 ? 1 : 0) + ' ' + unit;
    if (onChange) onChange(+inp.value);
  };
  wrap.appendChild(lb); wrap.appendChild(inp); wrap.appendChild(out);
  ctrlBox.appendChild(wrap);
  SLIDERS[id] = inp;
  return inp;
}
function button(label, fn){
  var b = document.createElement('button');
  b.className = 'btn'; b.type = 'button'; b.textContent = label; b.onclick = fn;
  ctrlBox.appendChild(b);
  return b;
}
function stat(id, label){
  var d = document.createElement('div'); d.className = 'stat';
  var k = document.createElement('div'); k.className = 'k'; k.textContent = label;
  var v = document.createElement('div'); v.className = 'v'; v.id = 'st-' + id; v.textContent = '—';
  d.appendChild(k); d.appendChild(v); readBox.appendChild(d);
}
function setStat(id, value){
  var n = document.getElementById('st-' + id);
  if (n) n.textContent = value;
}
function sv(id){ return SLIDERS[id] ? +SLIDERS[id].value : 0; }

function wheel(cx, cy, r){
  var g = el('g', {});
  g.appendChild(el('circle', { cx:cx, cy:cy, r:r, fill:'#3A1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
  g.appendChild(el('circle', { cx:cx, cy:cy, r:3, fill:'#C9A84C' }));
  return g;
}
function ground(y){
  var g = el('g', {});
  g.appendChild(el('line', { x1:40, y1:y, x2:960, y2:y, stroke:'#5A2A2A', 'stroke-width':4, 'stroke-linecap':'round' }));
  return g;
}

/* ══════════════ MODEL 1 — FORCE ══════════════
   A bigger push makes the arrow longer and the cart pick up speed faster.
   The same push on a heavier cart barely moves it. That is a = F / m,
   seen rather than memorised. */
var Force = {
  x:0, v:0, cart:null, arrow:null, alab:null, mlab:null,
  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    var defs = el('defs', {});
    var mk = el('marker', { id:'ah', viewBox:'0 0 10 10', refX:'8', refY:'5',
      markerWidth:'5', markerHeight:'5', orient:'auto-start-reverse' });
    mk.appendChild(el('path', { d:'M1 1L9 5L1 9', fill:'none', stroke:'#C9A84C',
      'stroke-width':2, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
    defs.appendChild(mk); stage.appendChild(defs);

    stage.appendChild(ground(356));
    stage.appendChild(txt(500, 60, 'What is force?', 'lbl-gold'));
    stage.appendChild(txt(500, 90, 'A push or a pull  \u2014  \u0BB5\u0BBF\u0B9A\u0BC8', 'lbl-sm'));

    this.alab = txt(300, 200, 'Force \u2014 \u0BB5\u0BBF\u0B9A\u0BC8', 'lbl');
    stage.appendChild(this.alab);
    this.arrow = el('line', { x1:250, y1:224, x2:400, y2:224, stroke:'#C9A84C',
      'stroke-width':7, 'stroke-linecap':'round', 'marker-end':'url(#ah)' });
    stage.appendChild(this.arrow);

    var g = el('g', { id:'cart' });
    g.appendChild(el('rect', { x:150, y:262, width:120, height:78, rx:8,
      fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    g.appendChild(wheel(180, 340, 16));
    g.appendChild(wheel(240, 340, 16));
    this.mlab = txt(210, 308, '1 kg', 'lbl');
    g.appendChild(this.mlab);
    this.cart = g; stage.appendChild(g);

    stage.appendChild(txt(60, 400, 'Ground', 'lbl-sm', 'start'));

    slider('F', 'Force (N)', 1, 10, 4, 1, 'N', function(){ Force.reset(); });
    slider('m', 'Mass (kg)', 1, 5, 1, 1, 'kg', function(){ Force.reset(); });
    button('Push again', function(){ Force.reset(); });
    stat('a', 'Acceleration  a = F / m');
    stat('v', 'Speed now');
    noteBox.textContent = 'Make the force bigger \u2014 the arrow grows and the cart picks up speed faster. '
      + 'Now make the cart heavier with the same force \u2014 it crawls. That is a = F / m.';
    this.reset();
  },
  reset: function(){ this.x = 0; this.v = 0; this.paint(); },
  step: function(dt){
    var a = sv('F') / sv('m');
    this.v += a * dt;
    this.x += this.v * 26 * dt;
    if (this.x > 440){ this.x = 0; this.v = 0; }
    this.paint();
  },
  paint: function(){
    var F = sv('F'), m = sv('m'), len = 30 + F * 16;
    this.cart.setAttribute('transform', 'translate(' + this.x.toFixed(1) + ',0)');
    this.mlab.textContent = m + ' kg';
    var a1 = 285 + this.x, a2 = a1 + len;
    this.arrow.setAttribute('x1', a1.toFixed(1));
    this.arrow.setAttribute('x2', a2.toFixed(1));
    this.alab.setAttribute('x', ((a1 + a2) / 2).toFixed(1));
    setStat('a', (F / m).toFixed(1) + ' m/s\u00B2');
    setStat('v', this.v.toFixed(1) + ' m/s');
  }
};

/* ══════════════ MODEL 2 — INERTIA ══════════════
   The bus starts: the standing passenger is still at rest, so he falls
   backward. The bus brakes: he is still moving, so he pitches forward.
   Two buttons, two lessons - inertia of rest and inertia of motion. */
var Inertia = {
  v:0, mode:'rest', lean:0, target:0, road:0, dashes:[], person:null, cap:null, tag:null,
  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    stage.appendChild(txt(500, 52, 'Inertia \u2014 \u0BA8\u0BBF\u0BB2\u0BC8\u0BAE\u0BAE\u0BCD', 'lbl-gold'));
    this.cap = txt(500, 82, 'A body resists any change to its state of rest or motion', 'lbl-sm');
    stage.appendChild(this.cap);

    var road = el('g', {}); this.dashes = [];
    for (var i = 0; i < 14; i++){
      var d = el('rect', { x: 40 + i * 70, y:384, width:38, height:5, rx:2, fill:'#5A2A2A' });
      road.appendChild(d); this.dashes.push(d);
    }
    stage.appendChild(road);
    stage.appendChild(ground(372));

    var bus = el('g', {});
    bus.appendChild(el('rect', { x:250, y:170, width:460, height:172, rx:14,
      fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    bus.appendChild(el('rect', { x:600, y:192, width:92, height:70, rx:8,
      fill:'#2E1414', stroke:'#C9A84C', 'stroke-width':1.5 }));
    bus.appendChild(el('rect', { x:270, y:192, width:92, height:70, rx:8,
      fill:'#2E1414', stroke:'#C9A84C', 'stroke-width':1.5 }));
    bus.appendChild(wheel(340, 356, 22));
    bus.appendChild(wheel(630, 356, 22));
    stage.appendChild(bus);

    var p = el('g', { id:'person' });
    p.appendChild(el('circle', { cx:480, cy:214, r:16, fill:'#E8C99A' }));
    p.appendChild(el('line', { x1:480, y1:230, x2:480, y2:298, stroke:'#E8C99A',
      'stroke-width':7, 'stroke-linecap':'round' }));
    p.appendChild(el('line', { x1:480, y1:250, x2:512, y2:238, stroke:'#E8C99A',
      'stroke-width':6, 'stroke-linecap':'round' }));
    p.appendChild(el('line', { x1:480, y1:298, x2:464, y2:340, stroke:'#E8C99A',
      'stroke-width':6, 'stroke-linecap':'round' }));
    p.appendChild(el('line', { x1:480, y1:298, x2:498, y2:340, stroke:'#E8C99A',
      'stroke-width':6, 'stroke-linecap':'round' }));
    this.person = p; stage.appendChild(p);

    this.tag = txt(500, 424, 'Bus is standing still', 'lbl');
    stage.appendChild(this.tag);

    button('Start the bus', function(){ Inertia.mode = 'start'; });
    button('Apply brakes', function(){ Inertia.mode = 'brake'; });
    button('Reset', function(){ Inertia.reset(); });
    stat('v', 'Bus speed');
    stat('w', 'What the passenger feels');
    noteBox.textContent = 'Start the bus \u2014 the passenger falls backward, because his body is still at rest. '
      + 'Brake \u2014 he pitches forward, because his body is still moving. Nobody pushed him either time.';
    this.reset();
  },
  reset: function(){ this.v = 0; this.mode = 'rest'; this.lean = 0; this.target = 0; this.paint(); },
  step: function(dt){
    var msg = 'At rest';
    if (this.mode === 'start'){
      this.v += 9 * dt;
      if (this.v >= 16){ this.v = 16; this.mode = 'moving'; }
      this.target = -15; msg = 'Falls BACKWARD \u2014 inertia of rest';
    } else if (this.mode === 'moving'){
      this.target = 0; msg = 'Standing steady \u2014 no change in motion';
    } else if (this.mode === 'brake'){
      this.v -= 13 * dt;
      if (this.v <= 0){ this.v = 0; this.mode = 'rest'; }
      this.target = 17; msg = 'Pitches FORWARD \u2014 inertia of motion';
    } else {
      this.target = 0; msg = this.v > 0 ? 'Standing steady' : 'At rest';
    }
    this.lean += (this.target - this.lean) * Math.min(1, dt * 7);
    this.road += this.v * 34 * dt;
    this.paint(msg);
  },
  paint: function(msg){
    for (var i = 0; i < this.dashes.length; i++){
      var x = 40 + i * 70 - (this.road % 70);
      if (x < 20) x += this.dashes.length * 70;
      this.dashes[i].setAttribute('x', x.toFixed(1));
    }
    this.person.setAttribute('transform', 'rotate(' + this.lean.toFixed(2) + ',480,340)');
    setStat('v', this.v.toFixed(1) + ' m/s');
    setStat('w', msg || 'At rest');
    var t = 'Bus is standing still';
    if (this.mode === 'start') t = 'Bus is starting \u2014 speeding up';
    else if (this.mode === 'moving') t = 'Bus is moving steadily';
    else if (this.mode === 'brake') t = 'Bus is braking \u2014 slowing down';
    if (this.tag) this.tag.textContent = t;
  }
};

/* ══════════════ MODEL 3 — MOMENTUM ══════════════
   Ball A rolls into a resting ball B. Whatever the masses, the two
   momentum bars always add back to the same total. The number does not
   have to be believed - it is on screen before and after. */
var Momentum = {
  xA:0, xB:0, vA:0, vB:0, hit:false, running:false,
  ballA:null, ballB:null, labA:null, labB:null, barA:null, barB:null, barT:null, stateTag:null,
  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    stage.appendChild(txt(500, 50, 'Conservation of momentum \u2014 \u0B89\u0BA8\u0BCD\u0BA4\u0BAE\u0BCD', 'lbl-gold'));
    stage.appendChild(txt(500, 80, 'Momentum p = mass \u00D7 velocity. The total never changes.', 'lbl-sm'));

    stage.appendChild(ground(300));
    this.ballA = el('circle', { cx:150, cy:262, r:34, fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2.5 });
    this.ballB = el('circle', { cx:700, cy:262, r:34, fill:'#2E1414', stroke:'#E8C99A', 'stroke-width':2.5 });
    stage.appendChild(this.ballA); stage.appendChild(this.ballB);
    this.labA = txt(150, 270, 'A', 'lbl'); this.labB = txt(700, 270, 'B', 'lbl');
    stage.appendChild(this.labA); stage.appendChild(this.labB);

    stage.appendChild(txt(60, 348, 'Momentum of A', 'lbl-sm', 'start'));
    stage.appendChild(txt(60, 388, 'Momentum of B', 'lbl-sm', 'start'));
    stage.appendChild(txt(60, 428, 'Total  A + B', 'lbl-sm', 'start'));
    this.barA = el('rect', { x:250, y:332, width:0, height:20, rx:6, fill:'#C9A84C' });
    this.barB = el('rect', { x:250, y:372, width:0, height:20, rx:6, fill:'#E8C99A' });
    this.barT = el('rect', { x:250, y:412, width:0, height:20, rx:6, fill:'#8E5A2A' });
    stage.appendChild(this.barA); stage.appendChild(this.barB); stage.appendChild(this.barT);

    this.stateTag = txt(500, 130, 'Before the collision', 'lbl');
    stage.appendChild(this.stateTag);

    slider('mA', 'Mass of A', 1, 6, 3, 1, 'kg', function(){ Momentum.reset(); });
    slider('vA', 'Speed of A', 1, 8, 4, 1, 'm/s', function(){ Momentum.reset(); });
    slider('mB', 'Mass of B', 1, 6, 2, 1, 'kg', function(){ Momentum.reset(); });
    button('Release', function(){ Momentum.running = true; });
    button('Reset', function(){ Momentum.reset(); });
    stat('pb', 'Total before');
    stat('pa', 'Total after');
    noteBox.textContent = 'B is standing still. Release A and watch the two bars change \u2014 '
      + 'but the total bar never moves. Momentum is only passed on, never created or destroyed.';
    this.reset();
  },
  reset: function(){
    this.xA = 150; this.xB = 700; this.vA = sv('vA'); this.vB = 0;
    this.hit = false; this.running = false;
    this.paint(); setStat('pa', '\u2014');
  },
  radius: function(m){ return 20 + m * 5; },
  step: function(dt){
    if (!this.running) { this.paint(); return; }
    var rA = this.radius(sv('mA')), rB = this.radius(sv('mB'));
    this.xA += this.vA * 22 * dt;
    this.xB += this.vB * 22 * dt;
    if (!this.hit && (this.xA + rA) >= (this.xB - rB)){
      this.collide();
      this.xA = this.xB - rB - rA;   // sit them exactly touching, no overlap
    }
    if (this.xB > 900 || this.xA < 90 || this.xA > 900) this.running = false;
    this.paint();
  },
  collide: function(){
    var m1 = sv('mA'), m2 = sv('mB'), u1 = this.vA;
    this.vA = ((m1 - m2) * u1) / (m1 + m2);   // elastic, B initially at rest
    this.vB = (2 * m1 * u1) / (m1 + m2);
    this.hit = true;
  },
  paint: function(){
    var mA = sv('mA'), mB = sv('mB');
    var rA = this.radius(mA), rB = this.radius(mB);
    this.ballA.setAttribute('cx', this.xA.toFixed(1)); this.ballA.setAttribute('r', rA);
    this.ballB.setAttribute('cx', this.xB.toFixed(1)); this.ballB.setAttribute('r', rB);
    this.labA.setAttribute('x', this.xA.toFixed(1));
    this.labB.setAttribute('x', this.xB.toFixed(1));
    this.labA.textContent = mA + ' kg';
    this.labB.textContent = mB + ' kg';

    var pA = mA * this.vA, pB = mB * this.vB, tot = pA + pB;
    var scale = 620 / Math.max(1, sv('mA') * sv('vA'));
    this.barA.setAttribute('width', Math.max(0, pA * scale).toFixed(1));
    this.barB.setAttribute('width', Math.max(0, pB * scale).toFixed(1));
    this.barT.setAttribute('width', Math.max(0, tot * scale).toFixed(1));

    if (this.stateTag) this.stateTag.textContent = this.hit ? 'After the collision' : 'Before the collision';
    setStat('pb', (mA * sv('vA')).toFixed(1) + ' kg\u00B7m/s');
    if (this.hit) setStat('pa', tot.toFixed(1) + ' kg\u00B7m/s');
  }
};

/* ── switching and the single animation loop ── */
/* ══════════════ MODEL 4 — ROCKET PROPULSION ══════════════
   Built to the answer the book asks for, not just to look like a rocket.

   A student is asked to "describe rocket propulsion", and the marks are for a
   fixed chain of statements: fuel in the propellant tank, burnt gas thrown out
   of the nozzle carrying momentum, an equal and opposite reaction in the
   combustion chamber, falling mass, no external force so momentum is conserved,
   rising velocity, escape from Earth's pull. So the model walks those
   statements in that order, with the parts named on screen.

   The narration is laid over a REAL simulation - the bars and the mass are
   computed from the same physics as free flight, never faked to look equal. */
var Rocket = {
  DRY:20, FUEL0:80, G:9.8, RATE:6, U:60,
  mode:'story', stepIdx:0, space:false,
  alt:0, v:0, fuel:80, gasP:0, maxAlt:0, flying:false, outcome:'', burn:false,
  parts:[], lines:[],

  STORY:[
    { part:'tank',    burn:false,
      line:'A rocket carries its fuel \u2014 liquid or solid \u2014 in the propellant tank.' },
    { part:'chamber', burn:false,
      line:'When the rocket is fired, this fuel is burnt in the combustion chamber.' },
    { part:'nozzle',  burn:true,
      line:'The hot gas is ejected at high speed through the nozzle, carrying a huge momentum downward.' },
    { part:'chamber', burn:true,
      line:'To balance that momentum, an equal and opposite reaction force is produced in the combustion chamber, and this drives the rocket forward. This is Newton\u2019s third law.' },
    { part:'tank',    burn:true,
      line:'While in motion the mass of the rocket gradually decreases, because the fuel is burning away.' },
    { part:'',        burn:true,
      line:'No net external force acts on the system, so its linear momentum is conserved \u2014 the gas momentum down and the rocket momentum up stay equal and cancel to zero.' },
    { part:'',        burn:true, lift:true,
      line:'As the mass keeps falling, the velocity keeps rising, until the rocket is fast enough to escape the gravitational pull of the Earth.' }
  ],

  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    var t = this.mode === 'story' ? 'Rocket propulsion \u2014 how the book explains it'
                                  : 'Rocket propulsion \u2014 free flight';
    stage.appendChild(txt(285, 34, t, 'lbl-gold'));

    var st = el('g', { opacity:0 }); this.stars = st;
    var sx = 71, sy = 43;
    for (var i = 0; i < 22; i++){
      sx = (sx * 37 + 11) % 380; sy = (sy * 29 + 7) % 300;

  reset: function(){
    this.alt = 0; this.v = 0; this.fuel = this.FUEL0; this.gasP = 0;
    this.maxAlt = 0; this.outcome = ''; this.stepIdx = 0;
    this.flying = (this.mode === 'story');
    this.burn = false;
    while (this.pGroup.firstChild) this.pGroup.removeChild(this.pGroup.firstChild);
    this.parts = [];
    if (this.gBtn) this.gBtn.textContent = this.space ? 'Place: in space' : 'Place: on Earth';
    this.writeNote();
    this.paint();
  },

  next: function(d){
    var n = this.stepIdx + d;
    if (n < 0 || n >= this.STORY.length) return;
    this.stepIdx = n;
    this.writeNote();
  },

  /* The answer builds up line by line, so by the last step the whole thing is
     on screen for the class to copy down. */
  writeNote: function(){
    if (this.mode !== 'story'){
      noteBox.textContent = this.space
        ? 'No gravity and no air out here \u2014 the two bars stay mirror images. A rocket does not push against air; it pushes against its own gas.'
        : 'Thrust must beat weight or the rocket never leaves the pad. And when the fuel runs out, it falls back.';
      return;
    }
    noteBox.textContent = '';
    for (var i = 0; i <= this.stepIdx; i++){
      var d = document.createElement('div');
      d.style.marginBottom = '5px';
      d.style.color = (i === this.stepIdx) ? '#C9A84C' : '#B99A7A';
      d.textContent = (i + 1) + '.  ' + this.STORY[i].line;
      noteBox.appendChild(d);
    }
  },

  step: function(dt){
    var rate, u, g;
    if (this.mode === 'story'){
      var sdef = this.STORY[this.stepIdx];
      this.burn = !!sdef.burn;
      rate = this.RATE; u = this.U; g = 0;          // the book's case: no external force
      if (this.burn && this.fuel > 0){
        var dm = Math.min(rate * dt, this.fuel);
        var m0 = this.DRY + this.fuel;
        this.gasP += dm * (this.v - u);
        this.v += u * dm / m0;
        this.fuel -= dm;
        this.spawn(dt);
      }
      if (sdef.lift) this.alt += this.v * dt * 0.5;
    } else {
      if (this.flying){
        rate = sv('r'); u = sv('u'); g = this.space ? 0 : this.G;
        var m = this.DRY + this.fuel;
        this.burn = this.fuel > 0;
        if (this.fuel > 0){
          var dm2 = Math.min(rate * dt, this.fuel);
          this.gasP += dm2 * (this.v - u);
          this.v += u * dm2 / m;
          this.fuel -= dm2;
          this.spawn(dt);
        }
        this.v -= g * dt;
        this.alt += this.v * dt;
        if (this.alt > this.maxAlt) this.maxAlt = this.alt;
        if (this.alt <= 0){
          this.alt = 0;
          if (this.v < 0){
            this.v = 0;
            if (this.maxAlt > 1){ this.flying = false; this.outcome = 'fell'; }
          }
        }
        if (this.fuel <= 0 && this.maxAlt <= 1 && !this.space){
          this.flying = false; this.outcome = 'nolift';
        }
        if (this.alt > 4000){ this.flying = false; this.outcome = 'away'; }
      } else { this.burn = false; }
    }
    this.drift(dt);
    this.paint();
  },

  spawn: function(dt){
    if (this.parts.length > 30) return;
    if (Math.random() > dt * 38) return;
    var n = el('circle', { cx: 200 + (Math.random() * 26 - 13), cy: 366,
      r: 3 + Math.random() * 4, fill:'#C9A84C', opacity:0.85 });
    this.pGroup.appendChild(n);
    this.parts.push({ n:n, y:366, vy: 140 + Math.random() * 110, o:0.85 });
  },

  drift: function(dt){
    for (var i = this.parts.length - 1; i >= 0; i--){
      var p = this.parts[i];
      p.y += p.vy * dt; p.o -= dt * 0.85;
      if (p.o <= 0 || p.y > 470){ this.pGroup.removeChild(p.n); this.parts.splice(i, 1); continue; }
      p.n.setAttribute('cy', p.y.toFixed(1));
      p.n.setAttribute('opacity', p.o.toFixed(2));
    }
  },

  highlight: function(part){
    var boxes = {
      tank:    [174, 130, 52, 114],
      chamber: [174, 246, 52, 68],
      nozzle:  [156, 314, 88, 52]
    };
    var b = boxes[part];
    this.ring.setAttribute('opacity', b ? 1 : 0);
    if (b){
      this.ring.setAttribute('x', b[0]); this.ring.setAttribute('y', b[1]);
      this.ring.setAttribute('width', b[2]); this.ring.setAttribute('height', b[3]);
    }
    this.lTank.setAttribute('fill', part === 'tank'    ? '#C9A84C' : '#B99A7A');
    this.lCham.setAttribute('fill', part === 'chamber' ? '#C9A84C' : '#B99A7A');
    this.lNozz.setAttribute('fill', part === 'nozzle'  ? '#C9A84C' : '#B99A7A');
  },

  paint: function(){
    var story = this.mode === 'story';
    var sdef = story ? this.STORY[this.stepIdx] : null;
    var m = this.DRY + this.fuel;
    var thrust = this.burn ? (story ? this.RATE * this.U : sv('r') * sv('u')) : 0;

    this.highlight(story ? sdef.part : '');

    var off = Math.min(this.alt * 1.6, 200);
    this.ground.setAttribute('y', (392 + off).toFixed(1));
    this.groundLine.setAttribute('y1', (392 + off).toFixed(1));
    this.groundLine.setAttribute('y2', (392 + off).toFixed(1));
    this.stars.setAttribute('opacity',
      (!story && this.space) ? 1 : Math.min(1, this.alt / 60).toFixed(2));

    if (thrust > 0){
      var fl = 26 + (thrust / 1000) * 84 + Math.random() * 12;
      this.flame.setAttribute('opacity', 0.92);
      this.flame.setAttribute('points', '182,362 218,362 210,' + (366 + fl * 0.55).toFixed(0) +
        ' 200,' + (366 + fl).toFixed(0) + ' 190,' + (366 + fl * 0.55).toFixed(0));
    } else {
      this.flame.setAttribute('opacity', 0);
    }

    var rp = m * this.v, gp = Math.abs(this.gasP);
    var earth = (!story && !this.space);
    var aLen, bLen;
    if (earth){
      this.labA.textContent = 'Thrust';
      this.labB.textContent = 'Weight of the rocket';
      aLen = (thrust / 1000) * 410;
      bLen = (m * this.G / 1000) * 410;
      this.totTag.textContent = thrust > m * this.G ? 'Thrust beats weight \u2014 it climbs'
                                                    : 'Weight beats thrust \u2014 it stays down';
    } else {
      this.labA.textContent = 'Momentum of hot gas (downward)';
      this.labB.textContent = 'Momentum of rocket (upward)';
      var sc = 400 / Math.max(1, Math.max(gp, Math.abs(rp)));
      aLen = gp * sc; bLen = Math.abs(rp) * sc;
      this.totTag.textContent = (gp > 0.5 && (story ? this.stepIdx >= 5 : true))
        ? 'Down + up  =  0    momentum is conserved' : '';
    }
    this.barA.setAttribute('width', Math.max(0, Math.min(410, aLen)).toFixed(1));
    this.barB.setAttribute('width', Math.max(0, Math.min(410, bLen)).toFixed(1));

    var lit = story && this.stepIdx >= 5;
    this.pr1.setAttribute('fill', lit ? '#C9A84C' : '#B99A7A');
    this.pr2.setAttribute('fill', (story && this.stepIdx >= 3) ? '#C9A84C' : '#B99A7A');

    this.massTag.textContent = 'Mass of the rocket   ' + m.toFixed(0) + ' kg'
      + (this.fuel < this.FUEL0 ? '   (fuel is burning away)' : '');
    this.velTag.textContent = 'Velocity   ' + this.v.toFixed(1) + ' m/s'
      + (this.alt > 0.5 ? '     Height ' + this.alt.toFixed(0) + ' m' : '');

    if (story && sdef.lift) this.escTag.textContent = 'To leave the Earth it must reach 11.2 km/s \u2014 the escape speed';
    else if (this.outcome === 'fell') this.escTag.textContent = 'Fuel finished \u2014 it fell back to the ground';
    else if (this.outcome === 'nolift') this.escTag.textContent = 'Never lifted off \u2014 thrust was less than weight';
    else if (this.outcome === 'away') this.escTag.textContent = 'Away it goes';
    else this.escTag.textContent = '';
  }
};

/* ══════════════ MODEL 5 — MOMENTS AND THE LEVER ══════════════
   One model for five topics in the chapter: the rotating effect of force,
   moment of a force, torque, the principle of moments, and the couple.

   Turning cannot be photographed. A child looking at a picture of a seesaw
   sees two people sitting down. Only when the distance slider moves and the
   heavy side rises does "moment = force x distance" stop being a formula.

   SEESAW  - anticlockwise moment F1*d1 against clockwise moment F2*d2. The
             beam settles level only when they are equal. Slide the small
             weight further out and it lifts the big one: the same reason a
             long spanner turns a nut a short one cannot.
   COUPLE  - two equal, opposite, parallel forces. They add to zero, so the
             wheel does not move anywhere, and yet it turns. */
var Moments = {
  scene:'lever', ang:0, wheelAng:0,
  PX:85,          /* pixels per metre along the beam */
  leverG:null, wheelG:null, b1:null, b2:null, t1:null, t2:null,

  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    addArrowDefs();
    if (this.scene === 'lever') this.buildLever(); else this.buildCouple();
    this.reset();
  },

  buildLever: function(){
    stage.appendChild(txt(500, 34, 'Moment of a force \u2014 \u0BA4\u0BBF\u0BB0\u0BC1\u0B95\u0BC1 \u0BB5\u0BBF\u0B9A\u0BC8', 'lbl-gold'));
    stage.appendChild(txt(500, 62, 'Moment  =  force  \u00D7  distance from the pivot', 'lbl-sm'));

    var g = el('g', {}); this.leverG = g;
    g.appendChild(el('rect', { x:220, y:294, width:560, height:12, rx:4,
      fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    for (var d = -3; d <= 3; d += 0.5){
      if (Math.abs(d) < 0.01) continue;
      g.appendChild(el('line', { x1:500 + d * this.PX, y1:306, x2:500 + d * this.PX, y2:314,
        stroke:'#8E5A2A', 'stroke-width':1.5 }));
    }
    this.b1 = el('rect', { x:0, y:0, width:0, height:0, rx:4, fill:'#C9A84C' });
    this.b2 = el('rect', { x:0, y:0, width:0, height:0, rx:4, fill:'#E8C99A' });
    g.appendChild(this.b1); g.appendChild(this.b2);
    this.t1 = txt(0, 0, '', 'lbl-sm'); this.t2 = txt(0, 0, '', 'lbl-sm');
    g.appendChild(this.t1); g.appendChild(this.t2);
    stage.appendChild(g);

    stage.appendChild(el('polygon', { points:'500,300 470,352 530,352',
      fill:'#3A1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    stage.appendChild(el('line', { x1:400, y1:352, x2:600, y2:352, stroke:'#5A2A2A', 'stroke-width':4 }));
    stage.appendChild(txt(500, 376, 'Pivot', 'lbl-sm'));

    stage.appendChild(txt(40, 404, 'Anticlockwise  F\u2081 \u00D7 d\u2081', 'lbl-sm', 'start'));
    stage.appendChild(txt(40, 432, 'Clockwise  F\u2082 \u00D7 d\u2082', 'lbl-sm', 'start'));
    stage.appendChild(el('rect', { x:280, y:390, width:660, height:18, rx:6, fill:'#2E1414' }));
    stage.appendChild(el('rect', { x:280, y:418, width:660, height:18, rx:6, fill:'#2E1414' }));
    this.barA = el('rect', { x:280, y:390, width:0, height:18, rx:6, fill:'#C9A84C' });
    this.barB = el('rect', { x:280, y:418, width:0, height:18, rx:6, fill:'#E8C99A' });
    stage.appendChild(this.barA); stage.appendChild(this.barB);

    this.verdict = txt(500, 110, '', 'lbl');
    stage.appendChild(this.verdict);

    slider('f1', 'Left force', 10, 60, 40, 10, 'N', function(){});
    slider('d1', 'Left distance', 0.5, 3, 1.5, 0.5, 'm', function(){});
    slider('f2', 'Right force', 10, 60, 20, 10, 'N', function(){});
    slider('d2', 'Right distance', 0.5, 3, 3, 0.5, 'm', function(){});
    button('Show a couple', function(){ Moments.scene = 'couple'; Moments.build(); });
    stat('m1', 'Anticlockwise moment');
    stat('m2', 'Clockwise moment');
    noteBox.textContent = 'Slide the small force further from the pivot and it lifts the big one. '
      + 'That is why a spanner with a long handle turns a stiff nut that a short one cannot \u2014 '
      + 'the force has not changed, the distance has.';
  },

  buildCouple: function(){
    stage.appendChild(txt(500, 34, 'Couple \u2014 \u0B87\u0BB0\u0B9F\u0BCD\u0B9F\u0BC8 \u0BB5\u0BBF\u0B9A\u0BC8', 'lbl-gold'));
    stage.appendChild(txt(500, 62, 'Two equal, opposite, parallel forces that do not act along the same line', 'lbl-sm'));

    var g = el('g', {}); this.wheelG = g;
    g.appendChild(el('circle', { cx:500, cy:240, r:104, fill:'none', stroke:'#C9A84C', 'stroke-width':10 }));
    g.appendChild(el('circle', { cx:500, cy:240, r:26, fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':3 }));
    for (var a = 0; a < 3; a++){
      var rad = (a * 120) * Math.PI / 180;
      g.appendChild(el('line', { x1:500, y1:240,
        x2:(500 + 100 * Math.cos(rad)).toFixed(1), y2:(240 + 100 * Math.sin(rad)).toFixed(1),
        stroke:'#C9A84C', 'stroke-width':7, 'stroke-linecap':'round' }));
    }
    stage.appendChild(g);

    this.ar1 = el('line', { x1:500, y1:118, x2:640, y2:118, stroke:'#E8C99A',
      'stroke-width':6, 'stroke-linecap':'round', 'marker-end':'url(#ah)' });
    this.ar2 = el('line', { x1:500, y1:362, x2:360, y2:362, stroke:'#E8C99A',
      'stroke-width':6, 'stroke-linecap':'round', 'marker-end':'url(#ah)' });
    stage.appendChild(this.ar1); stage.appendChild(this.ar2);
    stage.appendChild(txt(660, 112, 'F', 'lbl', 'start'));
    stage.appendChild(txt(340, 368, 'F', 'lbl', 'end'));
    stage.appendChild(el('line', { x1:500, y1:118, x2:500, y2:362,
      stroke:'#8E5A2A', 'stroke-width':1.5, 'stroke-dasharray':'5 5' }));
    stage.appendChild(txt(516, 244, 'd', 'lbl-sm', 'start'));

    stage.appendChild(txt(500, 404, 'The two forces add up to zero \u2014 the wheel goes nowhere, and still it turns.', 'lbl-sm'));

    slider('cf', 'Each force', 10, 60, 30, 10, 'N', function(){});
    button('Back to the seesaw', function(){ Moments.scene = 'lever'; Moments.build(); });
    stat('net', 'Net force  F \u2212 F');
    stat('cm', 'Moment of the couple  F \u00D7 d');
    noteBox.textContent = 'A couple has no resultant force, so nothing is pushed anywhere \u2014 '
      + 'but the pair still turns the body. Turning a steering wheel and opening a tap both work this way.';
  },

  reset: function(){ this.ang = 0; this.wheelAng = 0; this.paint(); },

  step: function(dt){
    if (this.scene === 'lever'){
      var diff = this.clockwise() - this.anticlockwise();
      var target = Math.max(-18, Math.min(18, diff / 10));
      this.ang += (target - this.ang) * Math.min(1, dt * 5);
    } else {
      this.wheelAng += sv('cf') * dt * 1.6;
      if (this.wheelAng > 360) this.wheelAng -= 360;
    }
    this.paint();
  },

  anticlockwise: function(){ return sv('f1') * sv('d1'); },
  clockwise:     function(){ return sv('f2') * sv('d2'); },

  paint: function(){
    if (this.scene === 'couple'){
      var F = sv('cf');
      this.wheelG.setAttribute('transform', 'rotate(' + this.wheelAng.toFixed(2) + ',500,240)');
      var len = 60 + F * 1.8;
      this.ar1.setAttribute('x2', (500 + len).toFixed(1));
      this.ar2.setAttribute('x2', (500 - len).toFixed(1));
      setStat('net', '0 N');
      setStat('cm', (F * 2).toFixed(0) + ' N\u00B7m');   /* d = 2 m across the wheel */
      return;
    }

    var f1 = sv('f1'), d1 = sv('d1'), f2 = sv('f2'), d2 = sv('d2');
    var mA = f1 * d1, mB = f2 * d2;

    var s1 = 22 + f1 * 0.55, s2 = 22 + f2 * 0.55;
    var x1 = 500 - d1 * this.PX, x2 = 500 + d2 * this.PX;
    this.b1.setAttribute('x', (x1 - s1 / 2).toFixed(1)); this.b1.setAttribute('y', (294 - s1).toFixed(1));
    this.b1.setAttribute('width', s1.toFixed(1)); this.b1.setAttribute('height', s1.toFixed(1));
    this.b2.setAttribute('x', (x2 - s2 / 2).toFixed(1)); this.b2.setAttribute('y', (294 - s2).toFixed(1));
    this.b2.setAttribute('width', s2.toFixed(1)); this.b2.setAttribute('height', s2.toFixed(1));
    this.t1.setAttribute('x', x1.toFixed(1)); this.t1.setAttribute('y', (286 - s1).toFixed(1));
    this.t2.setAttribute('x', x2.toFixed(1)); this.t2.setAttribute('y', (286 - s2).toFixed(1));
    this.t1.textContent = f1 + ' N'; this.t2.textContent = f2 + ' N';
    this.leverG.setAttribute('transform', 'rotate(' + this.ang.toFixed(2) + ',500,300)');

    var sc = 660 / 180;
    this.barA.setAttribute('width', Math.min(660, mA * sc).toFixed(1));
    this.barB.setAttribute('width', Math.min(660, mB * sc).toFixed(1));
    setStat('m1', mA.toFixed(0) + ' N\u00B7m');
    setStat('m2', mB.toFixed(0) + ' N\u00B7m');
    this.verdict.textContent = (Math.abs(mA - mB) < 0.001)
      ? 'Balanced \u2014 the two moments are equal'
      : (mA > mB ? 'The left side goes down' : 'The right side goes down');
  }
};

/* ══════════════ MODEL 6 — IMPULSE ══════════════
   The whole idea is time, so a photograph cannot hold it.

   The ball arrives with the same momentum every throw. Catching it always
   destroys the same momentum, so the impulse bar never moves. What changes is
   how long the catch takes - and the force bar collapses as the time grows.
   That is why a fielder pulls his hands back, why cars carry shock absorbers,
   and why jumping onto sand hurts less than onto concrete. */
var Impulse = {
  M:0.16,                       /* a real cricket ball, in kilograms */
  state:'ready', bx:120, hand:0, elapsed:0, peakF:0,
  ball:null, mitt:null, tag:null, barJ:null, barF:null,

  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    addArrowDefs();
    stage.appendChild(txt(500, 34, 'Impulse \u2014 \u0BA8\u0BC6\u0B95\u0BC1\u0BB5\u0BC1', 'lbl-gold'));
    stage.appendChild(txt(500, 62, 'Impulse  =  force  \u00D7  time  =  the change in momentum', 'lbl-sm'));

    stage.appendChild(el('line', { x1:40, y1:300, x2:960, y2:300, stroke:'#5A2A2A', 'stroke-width':3 }));

    var m = el('g', {}); this.mitt = m;
    m.appendChild(el('path', { d:'M726,196 q-34,0 -34,34 l0,44 q0,34 34,34 l26,0 l0,-112 z',
      fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    m.appendChild(el('rect', { x:750, y:200, width:26, height:104, rx:8,
      fill:'#3A1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    stage.appendChild(m);
    stage.appendChild(txt(790, 336, 'Hands', 'lbl-sm', 'start'));

    this.ball = el('circle', { cx:120, cy:252, r:15, fill:'#C9A84C', stroke:'#E8C99A', 'stroke-width':2 });
    stage.appendChild(this.ball);

    stage.appendChild(txt(40, 384, 'Impulse  (never changes)', 'lbl-sm', 'start'));
    stage.appendChild(txt(40, 424, 'Force on the hands', 'lbl-sm', 'start'));
    stage.appendChild(el('rect', { x:300, y:370, width:640, height:18, rx:6, fill:'#2E1414' }));
    stage.appendChild(el('rect', { x:300, y:410, width:640, height:18, rx:6, fill:'#2E1414' }));
    this.barJ = el('rect', { x:300, y:370, width:0, height:18, rx:6, fill:'#E8C99A' });
    this.barF = el('rect', { x:300, y:410, width:0, height:18, rx:6, fill:'#C9A84C' });
    stage.appendChild(this.barJ); stage.appendChild(this.barF);

    this.tag = txt(500, 120, 'Press Throw', 'lbl');
    stage.appendChild(this.tag);

    slider('bv', 'Ball speed', 5, 30, 20, 5, 'm/s', function(){ Impulse.reset(); });
    slider('ct', 'Catching time', 0.01, 0.2, 0.02, 0.01, 's', function(){ Impulse.reset(); });
    button('Throw', function(){ if (Impulse.state === 'ready') Impulse.state = 'flying'; });
    button('Reset', function(){ Impulse.reset(); });
    stat('j', 'Impulse  =  m \u00D7 v');
    stat('f', 'Force  =  impulse \u00F7 time');
    stat('d', 'How far the hands move back');
    noteBox.textContent = 'Throw it with a very short catching time \u2014 the force is huge and it stings. '
      + 'Now drag the time out and throw again: the same ball, the same impulse, but a gentle force. '
      + 'That is why a fielder pulls his hands back as he catches.';
    this.reset();
  },

  reset: function(){ this.state = 'ready'; this.bx = 120; this.hand = 0; this.elapsed = 0; this.paint(); },

  /* Impulse J = m*v, and the average force over the catch is J / t. */
  impulse: function(){ return this.M * sv('bv'); },
  force:   function(){ return this.impulse() / sv('ct'); },
  recoil:  function(){ return sv('bv') * sv('ct') / 2; },   /* metres, average speed x time */

  step: function(dt){
    if (this.state === 'flying'){
      this.bx += sv('bv') * 22 * dt;
      if (this.bx >= 700){ this.bx = 700; this.state = 'catching'; this.elapsed = 0; }
    } else if (this.state === 'catching'){
      this.elapsed += dt;
      var t = sv('ct');
      var frac = Math.min(1, this.elapsed / Math.max(0.35, t * 4));   /* slowed so the class can see it */
      var px = Math.min(180, this.recoil() * 42);
      this.hand = px * frac;
      if (frac >= 1) this.state = 'done';
    }
    this.paint();
  },

  paint: function(){
    var J = this.impulse(), F = this.force();
    this.ball.setAttribute('cx', (this.bx + this.hand).toFixed(1));
    this.mitt.setAttribute('transform', 'translate(' + this.hand.toFixed(1) + ',0)');

    this.barJ.setAttribute('width', Math.min(640, (J / 4.8) * 640).toFixed(1));
    this.barF.setAttribute('width', Math.min(640, (F / 400) * 640).toFixed(1));

    setStat('j', J.toFixed(2) + ' kg\u00B7m/s');
    setStat('f', F.toFixed(0) + ' N');
    setStat('d', this.recoil().toFixed(2) + ' m');

    if (this.state === 'ready') this.tag.textContent = 'Ball ' + this.M + ' kg at ' + sv('bv') + ' m/s';
    else if (this.state === 'flying') this.tag.textContent = 'Coming in\u2026';
    else if (this.state === 'catching') this.tag.textContent = 'Catching \u2014 hands giving way';
    else this.tag.textContent = (F > 150) ? 'Caught hard \u2014 that stings' : 'Caught softly \u2014 hands moved with it';
  }
};

/* ══════════════ MODEL 7 — FRICTION ══════════════
   Two scenes, because the chapter asks two different things.

   PUSH IT   - why a heavy box on sand will not budge while the same box slides
               on ice. The friction arrow grows to match your push and the block
               stays still; that is static friction, and a child can watch it
               happen. Push past the limiting value and it breaks free, and the
               friction arrow suddenly SHRINKS - sliding friction is smaller
               than the static friction that had to be beaten first.
   THE RACE  - three objects, one shove each, three very different distances.
               Static is greatest, sliding less, rolling least of all, and the
               stopping marks make the order impossible to argue with. */
var Friction = {
  G:9.8, scene:'push', si:2, x:0, v:0, pushing:false, moving:false,
  SURF:[
    { n:'Ice',            s:0.10, k:0.05, c:'#6E93AD' },
    { n:'Polished wood',  s:0.35, k:0.25, c:'#8A6636' },
    { n:'Concrete road',  s:0.70, k:0.55, c:'#6B6B6B' },
    { n:'Sand',           s:0.90, k:0.75, c:'#9C7C42' }
  ],
  RACE:[
    { n:'Block sliding',  k:0.55 },
    { n:'Block on rollers', k:0.12 },
    { n:'Wheel',          k:0.05 }
  ],
  runners:[],

  build: function(){
    clear(stage); clear(ctrlBox); clear(readBox);
    addArrowDefs();
    if (this.scene === 'push') this.buildPush(); else this.buildRace();
    this.reset();
  },

  buildPush: function(){
    stage.appendChild(txt(500, 34, 'Friction \u2014 \u0BB2\u0BCB\u0B95\u0BC1\u0BAE\u0BC1\u0BB1\u0BC8', 'lbl-gold'));
    stage.appendChild(txt(500, 62, 'The surfaces push back against whatever slides across them', 'lbl-sm'));

    this.groundS = el('rect', { x:40, y:330, width:920, height:26, rx:4, fill:'#6B6B6B', opacity:0.55 });
    stage.appendChild(this.groundS);
    stage.appendChild(el('line', { x1:40, y1:330, x2:960, y2:330, stroke:'#5A2A2A', 'stroke-width':3 }));
    this.surfTag = txt(50, 376, '', 'lbl-sm', 'start');
    stage.appendChild(this.surfTag);

    var g = el('g', {}); this.blockG = g;
    g.appendChild(el('rect', { x:120, y:270, width:80, height:60, rx:6,
      fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 }));
    this.wTag = txt(160, 306, '', 'lbl-sm');
    g.appendChild(this.wTag);
    stage.appendChild(g);

    this.pArrow = el('line', { x1:0, y1:240, x2:0, y2:240, stroke:'#C9A84C',
      'stroke-width':7, 'stroke-linecap':'round', 'marker-end':'url(#ah)' });
    this.pLab = txt(0, 220, 'Your push', 'lbl-sm');
    this.fArrow = el('line', { x1:0, y1:398, x2:0, y2:398, stroke:'#E8C99A',
      'stroke-width':7, 'stroke-linecap':'round', 'marker-end':'url(#ah)' });
    this.fLab = txt(0, 424, 'Friction', 'lbl-sm');
    stage.appendChild(this.pArrow); stage.appendChild(this.pLab);
    stage.appendChild(this.fArrow); stage.appendChild(this.fLab);

    this.verdict = txt(500, 120, '', 'lbl');
    stage.appendChild(this.verdict);

    slider('p', 'Your push', 0, 100, 30, 5, 'N', function(){});
    slider('w', 'Weight of box', 1, 10, 5, 1, 'kg', function(){ Friction.reset(); });
    this.sBtn = button('Surface: ', function(){
      Friction.si = (Friction.si + 1) % Friction.SURF.length; Friction.reset();
    });
    button('Push', function(){ Friction.pushing = true; });
    button('Let go', function(){ Friction.pushing = false; });
    button('The three kinds', function(){ Friction.scene = 'race'; Friction.build(); });
    stat('lim', 'Limiting friction  \u03BC\u209B \u00D7 N');
    stat('fnow', 'Friction acting now');
    stat('sp', 'Speed');
    noteBox.textContent = 'Push gently on sand \u2014 the friction arrow grows to match you and nothing moves. '
      + 'Push harder and it breaks free, and the friction arrow SHRINKS, because sliding friction is less '
      + 'than the static friction you had to beat. Now try the same push on ice.';
  },

  buildRace: function(){
    stage.appendChild(txt(500, 34, 'Static, sliding and rolling friction', 'lbl-gold'));
    stage.appendChild(txt(500, 62, 'The same shove to all three \u2014 watch how far each one gets', 'lbl-sm'));

    this.runners = [];
    for (var i = 0; i < this.RACE.length; i++){
      var y = 150 + i * 92;
      stage.appendChild(el('line', { x1:120, y1:y + 26, x2:960, y2:y + 26,
        stroke:'#5A2A2A', 'stroke-width':2.5 }));
      stage.appendChild(txt(112, y + 20, this.RACE[i].n, 'lbl-sm', 'end'));
      var shape;
      if (i === 2){
        shape = el('circle', { cx:150, cy:y + 8, r:18, fill:'none', stroke:'#C9A84C', 'stroke-width':6 });
      } else {
        shape = el('rect', { x:132, y:y - 10, width:44, height:36, rx:4,
          fill:'#6B1A1A', stroke:'#C9A84C', 'stroke-width':2 });
      }
      stage.appendChild(shape);
      var mark = el('line', { x1:150, y1:y - 22, x2:150, y2:y + 26,
        stroke:'#E8C99A', 'stroke-width':2, 'stroke-dasharray':'4 4', opacity:0 });
      stage.appendChild(mark);
      var dTag = txt(150, y - 30, '', 'lbl-sm');
      stage.appendChild(dTag);
      this.runners.push({ shape:shape, mark:mark, dTag:dTag, x:0, v:0, y:y, wheel:(i === 2) });
    }
    stage.appendChild(txt(500, 424, 'Rolling friction is the smallest \u2014 which is why wheels and ball bearings exist.', 'lbl-sm'));

    slider('rv', 'The shove', 3, 9, 6, 1, 'm/s', function(){ Friction.reset(); });
    button('Let them go', function(){ Friction.launch(); });
    button('Reset', function(){ Friction.reset(); });
    button('Back to pushing', function(){ Friction.scene = 'push'; Friction.build(); });
    stat('r0', 'Block sliding');
    stat('r1', 'On rollers');
    stat('r2', 'Wheel');
    noteBox.textContent = 'Every one of them gets exactly the same shove. The block barely moves, '
      + 'the rollers carry it much further, and the wheel goes furthest of all.';
  },

  surf: function(){ return this.SURF[this.si]; },

  reset: function(){
    this.x = 0; this.v = 0; this.pushing = false; this.moving = false;
    for (var i = 0; i < this.runners.length; i++){
      var r = this.runners[i];
      r.x = 0; r.v = 0;
      r.mark.setAttribute('opacity', 0);
      r.dTag.textContent = '';
    }
    if (this.sBtn) this.sBtn.textContent = 'Surface: ' + this.surf().n;
    this.paint();
  },

  launch: function(){
    for (var i = 0; i < this.runners.length; i++){
      this.runners[i].x = 0; this.runners[i].v = sv('rv');
      this.runners[i].mark.setAttribute('opacity', 0);
      this.runners[i].dTag.textContent = '';
    }
  },

  /* Stopping distance for a body shoved at v against friction mu: v^2 / (2*mu*g) */
  stopDist: function(v, mu){ return (v * v) / (2 * mu * this.G); },

  step: function(dt){
    if (this.scene === 'race'){
      for (var i = 0; i < this.runners.length; i++){
        var r = this.runners[i];
        if (r.v > 0){
          /* Exact for constant deceleration: step with the midpoint velocity, and
             on the last step add the true remaining distance v^2/(2a) instead of
             letting the clock overshoot and swallow it. */
          var a = this.RACE[i].k * this.G, dv = a * dt;
          if (r.v <= dv){
            r.x += (r.v * r.v) / (2 * a);
            r.v = 0; r.mark.setAttribute('opacity', 1);
          } else {
            r.x += (r.v - dv / 2) * dt;
            r.v -= dv;
          }
        }
      }
      this.paint(); return;
    }

    var m = sv('w'), N = m * this.G, s = this.surf();
    var P = this.pushing ? sv('p') : 0;
    var limit = s.s * N, kf = s.k * N;

    if (!this.moving){
      if (P > limit) this.moving = true;
    }
    if (this.moving){
      var net = P - kf;
      this.v += (net / m) * dt;
      if (this.v <= 0){ this.v = 0; this.moving = false; }
      this.x += this.v * 26 * dt;
      if (this.x > 640){ this.x = 0; this.v = 0; this.moving = false; }
    }
    this.paint();
  },

  paint: function(){
    if (this.scene === 'race'){
      var maxD = this.stopDist(sv('rv'), this.RACE[2].k);
      var sc = 790 / Math.max(0.001, maxD);
      for (var i = 0; i < this.runners.length; i++){
        var r = this.runners[i], px = Math.min(790, r.x * sc);
        if (r.wheel) r.shape.setAttribute('cx', (150 + px).toFixed(1));
        else r.shape.setAttribute('x', (132 + px).toFixed(1));
        r.mark.setAttribute('x1', (150 + px).toFixed(1));
        r.mark.setAttribute('x2', (150 + px).toFixed(1));
        r.dTag.setAttribute('x', (150 + px).toFixed(1));
        if (r.v === 0 && r.x > 0) r.dTag.textContent = r.x.toFixed(1) + ' m';
        setStat('r' + i, r.x > 0 ? r.x.toFixed(1) + ' m' : '\u2014');
      }
      return;
    }

    var m = sv('w'), N = m * this.G, s = this.surf();
    var P = this.pushing ? sv('p') : 0;
    var limit = s.s * N, kf = s.k * N;
    var acting = this.moving ? kf : Math.min(P, limit);

    this.groundS.setAttribute('fill', s.c);
    this.surfTag.textContent = s.n + '    \u03BC\u209B = ' + s.s.toFixed(2) + '   \u03BC\u2096 = ' + s.k.toFixed(2);
    this.wTag.textContent = m + ' kg';
    this.blockG.setAttribute('transform', 'translate(' + this.x.toFixed(1) + ',0)');

    var cx = 160 + this.x;
    var pl = P * 1.9, fl = acting * 1.9;
    this.pArrow.setAttribute('x1', cx.toFixed(1));
    this.pArrow.setAttribute('x2', (cx + pl).toFixed(1));
    this.pArrow.setAttribute('opacity', P > 0 ? 1 : 0);
    this.pLab.setAttribute('x', (cx + pl / 2).toFixed(1));
    this.pLab.setAttribute('opacity', P > 0 ? 1 : 0);
    this.fArrow.setAttribute('x1', cx.toFixed(1));
    this.fArrow.setAttribute('x2', (cx - fl).toFixed(1));
    this.fArrow.setAttribute('opacity', acting > 0 ? 1 : 0);
    this.fLab.setAttribute('x', (cx - fl / 2).toFixed(1));
    this.fLab.setAttribute('opacity', acting > 0 ? 1 : 0);

    setStat('lim', limit.toFixed(0) + ' N');
    setStat('fnow', acting.toFixed(0) + ' N' + (this.moving ? '   (sliding)' : '   (static)'));
    setStat('sp', this.v.toFixed(1) + ' m/s');

    if (this.moving) this.verdict.textContent = 'Moving \u2014 now only sliding friction acts, and it is smaller';
    else if (P <= 0) this.verdict.textContent = 'Press Push';
    else this.verdict.textContent = 'Still not moving \u2014 static friction is matching your push';
  }
};

var MODELS = { force: Force, inertia: Inertia, momentum: Momentum, rocket: Rocket, moments: Moments, impulse: Impulse, friction: Friction };
var current = null, last = 0;

function show(name){
  if (!MODELS[name]) name = 'force';
  current = MODELS[name];
  noteBox.textContent = '';
  current.build();
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++){
    chips[i].className = 'chip' + (chips[i].getAttribute('data-m') === name ? ' on' : '');
  }
  try{ if (window.history && history.replaceState) history.replaceState(null, '', '?m=' + name); }catch(e){}
}

var chipEls = document.querySelectorAll('.chip');
for (var ci = 0; ci < chipEls.length; ci++){
  chipEls[ci].onclick = (function(n){ return function(){ show(n); }; })(chipEls[ci].getAttribute('data-m'));
}

function loop(t){
  if (!last) last = t;
  var dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;            // a stalled projector must not teleport the cart
  if (current && current.step) current.step(dt);
  requestAnimationFrame(loop);
}

function startModel(){
  /* Inside a lesson the class already knows which model it wants, so the
     chip bar is hidden and only the model itself is shown. */
  try{
    if (/[?&]embed=1/.test(String(window.location.search || ''))){
      var bar = document.querySelector('.pm-bar');
      if (bar) bar.style.display = 'none';
    }
  }catch(eb){}
  var m = 'force';
  try{
    var q = String(window.location.search || '').match(/[?&]m=([a-z]+)/);
    if (q && MODELS[q[1]]) m = q[1];
  }catch(e){}
  show(m);
  requestAnimationFrame(loop);
}
startModel();
</script>
