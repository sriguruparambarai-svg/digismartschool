<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --gold:#C9962A; --sandal:#E8C99A;
  --chalk:#f2efe9; --chalk-yellow:#f5e87a; --chalk-blue:#a8d8f0; --chalk-green:#a8e6a8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:transparent;font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;}
#wrap{height:100%;display:flex;flex-direction:column;}
#stage{flex:1;min-height:0;position:relative;}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;}
#stage canvas:active{cursor:grabbing;}

#state-badge{position:absolute;top:12px;left:14px;pointer-events:none;max-width:70%;}
#state-name{font-family:'Caveat',cursive;font-size:2.2rem;line-height:1;
  color:var(--chalk-yellow);text-shadow:0 0 14px rgba(0,0,0,.8);}
#state-sub{font-family:'Kalam',cursive;font-size:.95rem;color:var(--sandal);
  text-shadow:0 0 10px rgba(0,0,0,.85);margin-top:3px;line-height:1.35;}

#read-badge{position:absolute;top:12px;right:14px;text-align:center;
  padding:.45rem .85rem;border-radius:12px;background:rgba(0,0,0,.45);
  border:1.5px solid rgba(232,201,154,.4);pointer-events:none;}
#read-badge .l{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sandal);}
#read-badge .v{font-family:'Caveat',cursive;font-size:1.9rem;color:var(--chalk-yellow);line-height:1;}

.tamil{font-family:'Noto Sans Tamil','Nunito',sans-serif;}

#controls{padding:.7rem .9rem;border-top:1.5px dashed rgba(232,201,154,.28);
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}
.pbtn{padding:.5rem .95rem;border-radius:10px;cursor:pointer;font-weight:700;font-size:.9rem;
  background:rgba(255,255,255,.05);border:1.6px solid rgba(232,201,154,.35);
  color:var(--sandal);font-family:'Nunito',sans-serif;white-space:nowrap;}
.pbtn:hover{background:rgba(255,255,255,.13);}
.pbtn.on{background:var(--maroon);border-color:var(--gold);color:#fff;}
.pbtn.big{font-size:1rem;padding:.55rem 1.2rem;}
.sep{width:1px;height:26px;background:rgba(232,201,154,.28);margin:0 .2rem;}
.lab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sandal);opacity:.8;}

@media(max-width:640px){
  #state-name{font-size:1.6rem;}
  #read-badge .v{font-size:1.4rem;}
  .pbtn{padding:.42rem .7rem;font-size:.82rem;}
}
</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <div id="state-badge">
      <div id="state-name"></div>
      <div id="state-sub"></div>
    </div>
    <div id="read-badge">
      <div class="l" id="read-lab">Bulb</div>
      <div class="v" id="read-val">Off</div>
    </div>
  </div>

  <div id="controls">
    <span class="pbtn big on" id="b-switch">Switch</span>
    <span class="sep"></span>
    <span class="lab" id="cell-lab">Cells</span>
    <span class="pbtn on" data-cells="1" id="b-c1">1</span>
    <span class="pbtn"    data-cells="2" id="b-c2">2</span>
    <span class="pbtn"    data-cells="3" id="b-c3">3</span>
    <span class="sep" id="mat-sep"></span>
    <span class="pbtn" id="b-material">Material</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   CIRCUIT ENGINE — a working electric circuit in 3D

   A teaching model, not a SPICE simulator. What a child must see:

     open switch   — nothing moves, bulb dark
     closed switch — current runs all the way round, bulb lights
     more cells    — same circuit, brighter bulb, faster current
     series        — two bulbs share the push, both go dimmer
     parallel      — each bulb gets the full push, both stay bright
     material      — the circuit only works if the gap can carry current

   The moving dots are the point of the whole thing. A child who sees
   the dots stop the instant the switch opens has understood a closed
   circuit better than any sentence can teach.

   Embed with URL settings, all optional:
     ?mode=simple      simple | series | parallel | material
     &cells=1          1 | 2 | 3
     &closed=1         1 (switch closed) | 0 (open)
     &lang=english     english | tamil

   Covers: Class 7 Electricity: Circuits and their Components,
   Class 8 Electricity: Magnetic and Heating Effects,
   Class 10 Electricity.
   ══════════════════════════════════════════════════════════════ */

var P = new URLSearchParams(location.search);
var MODE   = (P.get('mode') || 'simple').toLowerCase();
var LANG   = (P.get('lang') || 'english').toLowerCase();
var cells  = Math.max(1, Math.min(3, parseInt(P.get('cells') || '1', 10) || 1));
var closed = P.get('closed') !== '0';

if(['simple','series','parallel','material'].indexOf(MODE) < 0) MODE = 'simple';

/* ── Words ── */
var WORDS = {
  english: {
    switchL:'Switch', cellsL:'Cells', materialL:'Material', bulbL:'Bulb',
    on:'On', off:'Off', dim:'Dim', bright:'Bright', veryBright:'Very bright',
    open:'Open circuit', closedC:'Closed circuit',
    openSub:'There is a gap, so nothing can flow',
    closedSub:'The path goes all the way round, so current flows',
    seriesT:'Two bulbs in series', parallelT:'Two bulbs in parallel',
    seriesSub:'One path only. Both bulbs share the push, so both are dimmer.',
    parallelSub:'Two paths. Each bulb gets the full push, so both stay bright.',
    matT:'Will it carry current?',
    conducts:'carries current', blocks:'does not carry current',
    copper:'Copper', plastic:'Plastic', iron:'Iron', rubber:'Rubber', pencil:'Pencil lead'
  },
  tamil: {
    switchL:'சுவிட்ச்', cellsL:'செல்கள்', materialL:'பொருள்', bulbL:'பல்பு',
    on:'எரிகிறது', off:'அணைந்துள்ளது', dim:'மங்கலாக', bright:'பிரகாசமாக', veryBright:'மிகப் பிரகாசமாக',
    open:'திறந்த சுற்று', closedC:'மூடிய சுற்று',
    openSub:'இடைவெளி உள்ளது, எனவே எதுவும் பாய முடியாது',
    closedSub:'பாதை முழுவதும் சுற்றி வருகிறது, எனவே current பாய்கிறது',
    seriesT:'இரண்டு பல்புகள் series-ல்', parallelT:'இரண்டு பல்புகள் parallel-ல்',
    seriesSub:'ஒரே பாதை. இரு பல்புகளும் பங்கிட்டுக் கொள்கின்றன, எனவே இரண்டும் மங்கலாக.',
    parallelSub:'இரண்டு பாதைகள். ஒவ்வொரு பல்பும் முழு அளவு பெறுகிறது, எனவே இரண்டும் பிரகாசமாக.',
    matT:'இது current-ஐ கடத்துமா?',
    conducts:'current கடத்தும்', blocks:'current கடத்தாது',
    copper:'செம்பு', plastic:'பிளாஸ்டிக்', iron:'இரும்பு', rubber:'ரப்பர்', pencil:'பென்சில் முனை'
  }
};
var W = WORDS[LANG] || WORDS.english;

/* Materials for the conductor test. Everyday things a child has held. */
var MATERIALS = [
  { key:'copper',  conducts:true,  colour:0xC97B3A },
  { key:'plastic', conducts:false, colour:0xE85D9A },
  { key:'iron',    conducts:true,  colour:0x9AA5B1 },
  { key:'rubber',  conducts:false, colour:0x3B3B3B },
  { key:'pencil',  conducts:true,  colour:0x5A5A5A }
];
var matIndex = 0;

/* ── Scene ── */
var scene, camera, renderer, root;
var paths = [];        // { pts:[Vector3], dots:[Mesh], share:Number }
var bulbs = [];        // { mesh, light, glow, share }
var switchBar, switchPivot, matBlock;
var current = 0;       // 0..1, how hard the current is flowing
var shownCurrent = 0;  // eased, so the class sees it build not snap

var rotY = 0, rotX = 0, dragging = false, lastX = 0, lastY = 0;

var WIRE_COL = 0x9AA5B1, DOT_COL = 0xf5e87a;

function V(x, y){ return new THREE.Vector3(x, y, 0); }

/* ── Circuit layouts ──
   Each mode gives the wire paths, where the bulbs sit, and how much of
   the push each bulb gets. Keeping them explicit is clearer than one
   clever generator, and a wrong circuit on a projector is unforgivable. */
function layout(){
  var L = -4.6, R = 4.6, T = 2.5, B = -2.5;
  var BG = 0.74;   // half the gap a bulb sits in
  var CG = 1.02;   // half the gap a cell sits in
  var SG = 0.78;   // half the gap a switch sits in

  if(MODE === 'parallel'){
    return {
      // Two loops sharing the bottom wire. The dots double up along the
      // shared part, which is exactly right: more current flows there.
      flow: [
        { pts:[V(L,B), V(R,B), V(R,T), V(L,T), V(L,B)], share:1 },
        { pts:[V(L,B), V(R,B), V(R,0), V(L,0), V(L,B)], share:1 }
      ],
      wires: [
        [V(L,B), V(-CG,B)], [V(CG,B), V(R,B)],
        [V(R,B), V(R,-2.08)], [V(R,-0.52), V(R,T)],
        [V(R,T), V(BG,T)],  [V(-BG,T), V(L,T)],
        [V(R,0), V(BG,0)],  [V(-BG,0), V(L,0)],
        [V(L,T), V(L,B)]
      ],
      bulbs: [ { at:V(0,T), share:1 }, { at:V(0,0), share:1 } ],
      sw:    V(R,-1.3),
      cell:  V(0,B),
      title: W.parallelT, sub: W.parallelSub
    };
  }

  if(MODE === 'series'){
    return {
      flow: [ { pts:[V(L,B), V(R,B), V(R,T), V(L,T), V(L,B)], share:1 } ],
      wires: [
        [V(L,B), V(-CG,B)], [V(CG,B), V(R,B)],
        [V(R,B), V(R,-SG)], [V(R,SG), V(R,T)],
        [V(R,T), V(1.8+BG,T)], [V(1.8-BG,T), V(-1.8+BG,T)], [V(-1.8-BG,T), V(L,T)],
        [V(L,T), V(L,B)]
      ],
      bulbs: [ { at:V(1.8,T), share:0.5 }, { at:V(-1.8,T), share:0.5 } ],
      sw:    V(R,0),
      cell:  V(0,B),
      title: W.seriesT, sub: W.seriesSub
    };
  }

  if(MODE === 'material'){
    var MX = -1.5, MW = 1.15;   // the test block and its half-width
    var CX = 2.2;
    return {
      flow: [ { pts:[V(L,B), V(R,B), V(R,T), V(L,T), V(L,B)], share:1 } ],
      wires: [
        [V(L,B), V(MX-MW,B)], [V(MX+MW,B), V(CX-CG,B)], [V(CX+CG,B), V(R,B)],
        [V(R,B), V(R,T)],
        [V(R,T), V(BG,T)], [V(-BG,T), V(L,T)],
        [V(L,T), V(L,B)]
      ],
      bulbs: [ { at:V(0,T), share:1 } ],
      sw:    null,
      cell:  V(CX,B),
      gap:   V(MX,B),
      title: W.matT, sub: ''
    };
  }

  return {
    flow: [ { pts:[V(L,B), V(R,B), V(R,T), V(L,T), V(L,B)], share:1 } ],
    wires: [
      [V(L,B), V(-CG,B)], [V(CG,B), V(R,B)],
      [V(R,B), V(R,-SG)], [V(R,SG), V(R,T)],
      [V(R,T), V(BG,T)], [V(-BG,T), V(L,T)],
      [V(L,T), V(L,B)]
    ],
    bulbs: [ { at:V(0,T), share:1 } ],
    sw:    V(R,0),
    cell:  V(0,B),
    title: '', sub: ''
  };
}

var LAY = layout();

/* ── Build ── */
function init(){
  var stage = document.getElementById('stage');

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  root = new THREE.Group();
  scene.add(root);

  LAY.wires.forEach(buildWireRun);
  LAY.flow.forEach(buildFlow);
  LAY.bulbs.forEach(buildBulb);
  buildCell(LAY.cell);
  if(LAY.sw)  buildSwitch(LAY.sw);
  if(LAY.gap) buildMaterial(LAY.gap);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(4, 7, 9); scene.add(key);
  var rim = new THREE.DirectionalLight(0xC9962A, 0.3);
  rim.position.set(-6, -3, -5); scene.add(rim);

  resize();
  window.addEventListener('resize', resize);
  wireControls();
  refresh();
  animate();
}

/* A wire run is a straight length of metal. Drawing each run separately
   with a rounded joint at every corner keeps the corners square, the way
   a circuit is drawn in every textbook. The earlier smoothed curve bent
   the corners and pulled the whole shape crooked. */
function buildWireRun(seg){
  var a = seg[0], b = seg[1];
  var dir = new THREE.Vector3().subVectors(b, a);
  var len = dir.length();
  if(len < 0.001) return;

  var mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.10, 0.10, len, 10),
    new THREE.MeshStandardMaterial({ color:WIRE_COL, roughness:0.42, metalness:0.72 })
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  root.add(mesh);

  // A small ball at each end hides the joint where two runs meet.
  var jointGeo = new THREE.SphereGeometry(0.10, 10, 8);
  var jointMat = new THREE.MeshStandardMaterial({ color:WIRE_COL, roughness:0.42, metalness:0.72 });
  [a, b].forEach(function(pt){
    var j = new THREE.Mesh(jointGeo, jointMat);
    j.position.copy(pt);
    root.add(j);
  });
}

/* The dots follow the full loop, straight from corner to corner — no
   smoothing, so they turn sharply exactly where the wire does. */
function buildFlow(p){
  var pts = p.pts;
  var cum = [0], total = 0;
  for(var i = 1; i < pts.length; i++){
    total += pts[i].distanceTo(pts[i-1]);
    cum.push(total);
  }

  var dots = [];
  var n = Math.max(8, Math.round(total * 1.15));
  var geo = new THREE.SphereGeometry(0.155, 10, 8);
  for(var k = 0; k < n; k++){
    var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color:DOT_COL, emissive:DOT_COL, emissiveIntensity:0.9, roughness:0.3
    }));
    m.visible = false;
    root.add(m);
    dots.push(m);
  }
  paths.push({ pts:pts, cum:cum, total:total, dots:dots,
               share:(p.share == null ? 1 : p.share), offset:0 });
}

/* Where along the loop is fraction t? */
function flowPointAt(p, t){
  var d = ((t % 1) + 1) % 1 * p.total;
  for(var i = 1; i < p.cum.length; i++){
    if(d <= p.cum[i]){
      var seg = p.cum[i] - p.cum[i-1];
      var f = seg > 0 ? (d - p.cum[i-1]) / seg : 0;
      return new THREE.Vector3().lerpVectors(p.pts[i-1], p.pts[i], f);
    }
  }
  return p.pts[p.pts.length - 1].clone();
}

/* The bulb sits IN the wire, centred on the line, the way the symbol is
   drawn in the book — a circle on the wire. It used to hang above the
   wire, which read as a lamp floating in space. The filament inside is
   what actually glows, so a child sees WHERE the light comes from. */
function buildBulb(b){
  var g = new THREE.Group();
  g.position.copy(b.at);

  var glass = new THREE.Mesh(
    new THREE.SphereGeometry(0.66, 24, 18),
    new THREE.MeshStandardMaterial({
      color:0xdfe8ee, emissive:0xffd24a, emissiveIntensity:0,
      roughness:0.12, metalness:0.02, transparent:true, opacity:0.42
    })
  );
  g.add(glass);

  // Filament: a small coil across the middle. This is the part that lights.
  var fil = new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.045, 8, 20),
    new THREE.MeshStandardMaterial({
      color:0x8a7a55, emissive:0xffc94a, emissiveIntensity:0, roughness:0.4
    })
  );
  g.add(fil);

  // Metal caps where the wire enters each side.
  var capMat = new THREE.MeshStandardMaterial({ color:0xB0B6BD, roughness:0.4, metalness:0.75 });
  [-1, 1].forEach(function(s){
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 12), capMat);
    cap.rotation.z = Math.PI / 2;
    cap.position.x = s * 0.68;
    g.add(cap);
  });

  var light = new THREE.PointLight(0xffd24a, 0, 10);
  g.add(light);

  root.add(g);
  bulbs.push({ glass:glass, fil:fil, light:light, share:(b.share == null ? 1 : b.share) });
}

/* A cell a child recognises: dark body, gold cap at the plus end, and
   a plus and a minus sign built from bars so no font is needed. */
function buildCell(at){
  var g = new THREE.Group();
  g.position.copy(at);

  var body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.42, 1.5, 20),
    new THREE.MeshStandardMaterial({ color:0x6B1A1A, roughness:0.5, metalness:0.25 })
  );
  body.rotation.z = Math.PI / 2;
  g.add(body);

  var band = new THREE.Mesh(
    new THREE.CylinderGeometry(0.44, 0.44, 0.18, 20),
    new THREE.MeshStandardMaterial({ color:0xC9962A, roughness:0.35, metalness:0.7 })
  );
  band.rotation.z = Math.PI / 2;
  band.position.x = 0.5;
  g.add(band);

  // plus terminal
  var nub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, 0.22, 12),
    new THREE.MeshStandardMaterial({ color:0xC9962A, roughness:0.3, metalness:0.85 })
  );
  nub.rotation.z = Math.PI / 2;
  nub.position.x = 0.86;
  g.add(nub);

  var signMat = new THREE.MeshStandardMaterial({
    color:0xfff2d0, emissive:0xfff2d0, emissiveIntensity:0.55, roughness:0.4
  });
  var bar = function(w, h, x, y, z){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.06), signMat);
    m.position.set(x, y, z);
    return m;
  };
  g.add(bar(0.32, 0.09, 0.30, 0, 0.43));   // plus, across
  g.add(bar(0.09, 0.32, 0.30, 0, 0.43));   // plus, up
  g.add(bar(0.32, 0.09, -0.42, 0, 0.43));  // minus

  root.add(g);
}

/* Switch: a lever hinged at the lower contact. Closed, it bridges the two
   posts. Open, it swings clear and the gap in the metal is plainly visible
   — that gap is the entire lesson. */
function buildSwitch(at){
  var postMat = new THREE.MeshStandardMaterial({ color:0xB0B6BD, roughness:0.35, metalness:0.8 });
  var posts = [];
  [-0.78, 0.78].forEach(function(dy){
    var k = new THREE.Mesh(new THREE.SphereGeometry(0.19, 14, 12), postMat);
    k.position.set(at.x, at.y + dy, 0);
    root.add(k);
    posts.push(k);
  });

  switchPivot = new THREE.Group();
  switchPivot.position.set(at.x, at.y - 0.78, 0.04);   // hinge on the lower post
  switchBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.19, 1.56, 0.19),
    new THREE.MeshStandardMaterial({ color:0xC9962A, roughness:0.3, metalness:0.82 })
  );
  switchBar.position.y = 0.78;                          // reaches the upper post
  switchPivot.add(switchBar);
  root.add(switchPivot);
}

function buildMaterial(at){
  var postMat = new THREE.MeshStandardMaterial({ color:0xB0B6BD, roughness:0.35, metalness:0.8 });
  [-1.15, 1.15].forEach(function(dx){
    var k = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), postMat);
    k.position.set(at.x + dx, at.y, 0);
    root.add(k);
  });
  matBlock = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.62, 0.5),
    new THREE.MeshStandardMaterial({ color:MATERIALS[0].colour, roughness:0.6, metalness:0.25 })
  );
  matBlock.position.copy(at);
  root.add(matBlock);
}

function resize(){
  var stage = document.getElementById('stage');
  var w = stage.clientWidth || 640, h = stage.clientHeight || 420;
  camera.aspect = w / h;

  // Frame the whole circuit whatever the screen shape — never cut it off.
  var needW = 12.8, needH = 8.6;
  var vFov = camera.fov * Math.PI / 180;
  var distV = (needH / 2) / Math.tan(vFov / 2);
  var hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  var distH = (needW / 2) / Math.tan(hFov / 2);
  camera.position.set(0, 0.4, Math.max(distV, distH));
  camera.lookAt(0, 0, 0);

  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

/* ── What the circuit is doing ── */
function conducting(){
  if(MODE === 'material') return MATERIALS[matIndex].conducts;
  return closed;
}

function refresh(){
  current = conducting() ? (cells / 3) : 0;

  var nm = document.getElementById('state-name');
  var sub = document.getElementById('state-sub');
  var title, subtitle;

  if(MODE === 'material'){
    var m = MATERIALS[matIndex];
    title = W[m.key];
    subtitle = W[m.key] + ' ' + (m.conducts ? W.conducts : W.blocks);
    if(matBlock) matBlock.material.color.setHex(m.colour);
  } else if(MODE === 'series' || MODE === 'parallel'){
    title = closed ? LAY.title : W.open;
    subtitle = closed ? LAY.sub : W.openSub;
  } else {
    title = closed ? W.closedC : W.open;
    subtitle = closed ? W.closedSub : W.openSub;
  }

  nm.textContent = title;
  sub.textContent = subtitle;
  nm.className = (LANG === 'tamil') ? 'tamil' : '';
  sub.className = (LANG === 'tamil') ? 'tamil' : '';

  // Reading: what the bulb is actually doing.
  var b = bulbs.length ? current * bulbs[0].share : 0;
  var v = b <= 0 ? W.off : b < 0.3 ? W.dim : b < 0.62 ? W.bright : W.veryBright;
  var rv = document.getElementById('read-val');
  rv.textContent = v;
  rv.className = 'v' + (LANG === 'tamil' ? ' tamil' : '');
  document.getElementById('read-lab').textContent = W.bulbL;

  document.getElementById('b-switch').classList.toggle('on', closed);
  [1,2,3].forEach(function(n){
    document.getElementById('b-c' + n).classList.toggle('on', n === cells);
  });
}

function animate(){
  requestAnimationFrame(animate);

  // Ease the current so the class watches it build, not jump.
  shownCurrent += (current - shownCurrent) * 0.09;

  // Switch bar swings open, leaving a visible gap in the path.
  if(switchPivot){
    var want = closed ? 0 : 0.72;   // swings clear, leaving a visible break
    switchPivot.rotation.z += (want - switchPivot.rotation.z) * 0.15;
  }

  // Current dots run round the loop. Speed follows the current, so more
  // cells visibly means faster flow, not just a brighter bulb.
  paths.forEach(function(p){
    var speed = shownCurrent * p.share * 0.0045;
    p.offset = (p.offset + speed) % 1;
    var n = p.dots.length;
    for(var i = 0; i < n; i++){
      p.dots[i].position.copy(flowPointAt(p, p.offset + i / n));
      p.dots[i].visible = shownCurrent > 0.02;
      p.dots[i].material.emissiveIntensity = 0.5 + shownCurrent * 0.9;
    }
  });

  bulbs.forEach(function(b){
    var lit = shownCurrent * b.share;
    b.glass.material.emissiveIntensity = lit * 1.5;
    b.glass.material.opacity = 0.42 + lit * 0.35;
    b.fil.material.emissiveIntensity = lit * 3.2;   // the filament is what glows
    b.light.intensity = lit * 2.8;
  });

  root.rotation.y = rotY;
  root.rotation.x = rotX;
  renderer.render(scene, camera);
}

/* ── Teacher controls ── */
function wireControls(){
  document.getElementById('b-switch').textContent = W.switchL;
  document.getElementById('cell-lab').textContent = W.cellsL;
  document.getElementById('b-material').textContent = W.materialL;
  if(LANG === 'tamil'){
    document.getElementById('b-switch').classList.add('tamil');
    document.getElementById('b-material').classList.add('tamil');
  }

  // Only show the controls this mode actually uses.
  var showMat = (MODE === 'material');
  document.getElementById('b-material').style.display = showMat ? '' : 'none';
  document.getElementById('mat-sep').style.display = showMat ? '' : 'none';
  document.getElementById('b-switch').style.display = LAY.sw ? '' : 'none';

  document.getElementById('b-switch').addEventListener('click', function(){
    closed = !closed; refresh();
  });
  [1,2,3].forEach(function(n){
    document.getElementById('b-c' + n).addEventListener('click', function(){
      cells = n; refresh();
    });
  });
  document.getElementById('b-material').addEventListener('click', function(){
    matIndex = (matIndex + 1) % MATERIALS.length; refresh();
  });

  var cv = renderer.domElement;
  function down(x, y){ dragging = true; lastX = x; lastY = y; }
  function move(x, y){
    if(!dragging) return;
    rotY += (x - lastX) * 0.006;
    rotX += (y - lastY) * 0.004;
    rotY = Math.max(-0.8, Math.min(0.8, rotY));
    rotX = Math.max(-0.7, Math.min(0.7, rotX));
    lastX = x; lastY = y;
  }
  function up(){ dragging = false; }

  cv.addEventListener('mousedown', function(e){ down(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', function(e){
    if(e.touches[0]) down(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  cv.addEventListener('touchmove', function(e){
    if(e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  window.addEventListener('touchend', up);
}

/* Let the parent page drive the model if it wants to. */
window.addEventListener('message', function(e){
  var d = e.data;
  if(!d || d.kind !== 'circuit') return;
  if(typeof d.closed === 'boolean') closed = d.closed;
  if(typeof d.cells === 'number') cells = Math.max(1, Math.min(3, d.cells));
  refresh();
});

// Opened directly rather than inside a lesson? Give it a board to sit on.
if(window.self === window.top){
  document.body.style.background =
    'radial-gradient(ellipse at center, #1b3d1b 0%, #0e1f0e 75%)';
}

if(window.THREE) init();
else document.getElementById('stage').innerHTML =
  '<div style="padding:2rem;text-align:center;color:#E8C99A;font-family:Kalam,cursive">'
  + '3D could not load. Please check the internet connection.</div>';
</script>
