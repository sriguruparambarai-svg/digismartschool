<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/session-header.js"></script>
<script src="js/class-roster.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Mystery Class — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --maroon-deep:#2a0b0b; --maroon-mid:#431212;
  --gold:#C9A84C; --sandal:#E8C99A; --cream:#fbf1e1;
  --right:#4f9a5a; --text:#f6ead6;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--maroon-deep);color:var(--text);
  font-family:'Nunito','Noto Sans Tamil',sans-serif;overflow-x:hidden;}
.hidden{display:none !important;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ═══ SETUP ═══ */
#setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1rem;background:radial-gradient(ellipse at 50% 20%,var(--maroon-mid) 0%,var(--maroon-deep) 70%);}
#setup h1{font-family:'Kalam',cursive;font-weight:700;color:var(--gold);
  font-size:clamp(2.2rem,6vw,3.4rem);text-align:center;line-height:1.1;}
#setup p.sub{color:var(--sandal);margin:.5rem 0 1.6rem;text-align:center;max-width:36rem;line-height:1.5;}
.setup-card{background:rgba(232,201,154,.06);border:1.5px solid rgba(201,168,76,.35);
  border-radius:16px;padding:1.4rem;width:100%;max-width:720px;}
.fld{margin-bottom:1.1rem;}
.fld label{display:block;font-weight:700;color:var(--sandal);margin-bottom:.45rem;}
.fld select{width:100%;padding:.8rem .9rem;border-radius:10px;background:#1c0808;color:var(--text);
  border:1.5px solid rgba(201,168,76,.4);font-size:1rem;font-family:inherit;}
#chap-box{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;}
.chap{display:flex;gap:.8rem;align-items:center;padding:.7rem .8rem;border-radius:10px;cursor:pointer;
  border:1.5px solid rgba(201,168,76,.18);background:rgba(0,0,0,.18);}
.chap:hover{border-color:var(--gold);}
.chap.on{background:var(--maroon);border-color:var(--gold);}
.chap-num{font-family:'Kalam',cursive;font-size:1.3rem;color:var(--gold);min-width:1.8rem;text-align:center;}
.chap-t{font-weight:700;}
.chap-sub{font-size:.8rem;opacity:.7;}
.theme-hd{margin-top:.5rem;font-weight:800;color:var(--gold);font-size:.9rem;}
.muted{opacity:.7;padding:.4rem 0;}
.chip-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.chip{flex:1;min-width:100px;padding:.75rem .6rem;border-radius:10px;text-align:center;cursor:pointer;
  border:2px solid rgba(201,168,76,.3);color:var(--sandal);font-weight:700;}
.chip.on{background:var(--maroon);border-color:var(--gold);color:#fff;}
.start-btn{width:100%;margin-top:.4rem;padding:1rem;border:none;border-radius:12px;cursor:pointer;
  background:var(--gold);color:var(--maroon-deep);font-size:1.15rem;font-weight:800;}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}

/* ═══ CLASSROOM ═══ */
#room{display:none;height:100vh;flex-direction:column;}
#room.show{display:flex;}
.topbar{display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;background:var(--maroon);
  border-bottom:2px solid var(--gold);}
.topbar h2{font-family:'Kalam',cursive;color:var(--gold);font-size:1.35rem;white-space:nowrap;}
.topbar .meta{color:var(--sandal);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btn{margin-left:auto;cursor:pointer;color:var(--sandal);font-weight:700;background:none;border:none;font-size:1rem;}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:1rem 1.4rem .6rem;gap:.8rem;}
.st-head{display:flex;align-items:baseline;gap:.9rem;}
.st-tag{font-weight:800;color:var(--maroon-deep);background:var(--sandal);border-radius:999px;
  padding:.2rem .8rem;font-size:.95rem;white-space:nowrap;}
.st-title{font-family:'Kalam','Noto Sans Tamil',cursive;font-weight:700;color:var(--cream);
  font-size:clamp(1.6rem,3.4vw,2.7rem);line-height:1.15;}
.st-body{flex:1;min-height:0;display:flex;gap:1.4rem;}
.media{flex:1.7;min-width:0;position:relative;border-radius:14px;overflow:hidden;
  background:#140505;border:2px solid rgba(201,168,76,.35);display:flex;align-items:center;justify-content:center;}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block;}
.media iframe{width:100%;height:100%;border:0;background:#fff;}
.media .wait{padding:2rem;text-align:center;color:var(--sandal);line-height:1.6;}
.badge{position:absolute;left:.8rem;bottom:.8rem;background:rgba(42,11,11,.85);color:var(--sandal);
  border:1px solid var(--gold);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:700;}
.badge.err{border-color:#e08a7a;color:#f3c0b4;max-width:90%;}
.words{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.7rem;}
.st-body.full .words{flex:1;align-items:flex-start;padding:0 4vw;}
.line{font-size:clamp(1.15rem,2.2vw,1.75rem);font-weight:700;line-height:1.35;color:var(--text);
  animation:rise .5s ease both;}
.line.key{color:var(--gold);}
.opt .ta{display:block;font-size:.72em;font-weight:700;opacity:.8;margin-top:.15rem;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* vote: big answer tiles the class can read from the back */
.vote{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1rem;max-width:1100px;margin:0 auto;width:100%;}
.opt{display:flex;align-items:center;gap:1.2rem;background:var(--sandal);color:var(--maroon-deep);
  border-radius:14px;padding:1rem 1.4rem;font-size:clamp(1.2rem,2.6vw,2rem);font-weight:800;
  border:3px solid transparent;transition:background .4s,border-color .4s,opacity .4s;}
.opt .l{font-family:'Kalam',cursive;font-size:1.3em;background:var(--maroon);color:var(--gold);
  width:2.2em;height:2.2em;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.opt.right{background:#dff0d8;border-color:var(--right);}
.opt.dim{opacity:.35;}
.hands{text-align:center;color:var(--sandal);font-size:1.1rem;font-weight:700;}
.reveal{background:#dff0d8;color:#123d18;border-radius:12px;padding:.8rem 1rem;font-weight:800;
  font-size:clamp(1.05rem,2vw,1.5rem);animation:rise .5s ease both;}

.opt.pick{cursor:default;}
.st-body{overflow-y:auto;}
.vote.q{gap:.55rem;justify-content:flex-start;}
.vote.q .opt{padding:.5rem 1.1rem;font-size:clamp(1.05rem,2.2vw,1.6rem);}
.vote.q .opt .l{width:1.9em;height:1.9em;}
.why{margin-top:.2rem;color:var(--sandal);font-size:clamp(1rem,1.8vw,1.35rem);font-weight:700;text-align:center;animation:rise .5s ease both;}
.qbar{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:.4rem;}
.qbtn{padding:.75rem 1.3rem;border-radius:12px;border:2px solid var(--gold);background:transparent;color:var(--sandal);
  font-weight:800;font-size:clamp(.95rem,1.7vw,1.2rem);cursor:pointer;}
.qbtn.main{background:var(--gold);color:var(--maroon-deep);}
.qbtn.r3{border-color:#7fc28a;} .qbtn.r2{border-color:#e0c060;} .qbtn.r1{border-color:#e08a7a;}
.qnum{text-align:center;color:var(--sandal);opacity:.8;font-weight:700;}
.summary{flex:1;display:grid;grid-template-columns:1fr 1.3fr;gap:1.6rem;align-items:start;}
.summary h4{color:var(--gold);font-size:1.2rem;margin-bottom:.6rem;}
.srow{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid rgba(201,168,76,.2);
  font-size:clamp(1rem,1.7vw,1.25rem);font-weight:700;}
.hw{width:100%;min-height:11rem;border-radius:12px;padding:.8rem;background:#1c0808;color:var(--text);
  border:1.5px solid rgba(201,168,76,.4);font:inherit;font-size:1.05rem;line-height:1.5;resize:vertical;}
.note{margin-top:.5rem;color:var(--sandal);font-weight:700;}
.live{text-align:center;color:var(--sandal);font-weight:700;font-size:.95rem;}
.live b{color:var(--gold);font-size:1.15em;letter-spacing:.12em;}
.opt .cnt{margin-left:auto;font-family:'Kalam',cursive;font-size:1.2em;color:var(--maroon);min-width:2.5em;text-align:right;}
.qbtn.sug{box-shadow:0 0 0 3px var(--gold);}
.cardgrid{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem;}
.cardgrid span{background:rgba(232,201,154,.1);border:1px solid rgba(201,168,76,.35);border-radius:8px;padding:.2rem .5rem;font-weight:700;font-size:.95rem;}
.cardgrid span.low{border-color:#e08a7a;color:#f3c0b4;}
.cardgrid span small{opacity:.7;font-weight:600;margin-right:.3rem;}

/* activity card */
.act{flex:1;display:grid;grid-template-columns:1fr 1.4fr auto;gap:1.4rem;align-items:start;}
.act h4{color:var(--gold);font-size:1.15rem;margin-bottom:.5rem;}
.act ul,.act ol{padding-left:1.3rem;font-size:clamp(1.05rem,1.9vw,1.45rem);line-height:1.55;font-weight:600;}
.timer{text-align:center;background:rgba(232,201,154,.08);border:2px solid var(--gold);border-radius:14px;padding:1rem 1.4rem;}
.timer .t{font-family:'Kalam',cursive;font-size:3.4rem;color:var(--gold);line-height:1;}
.timer button{margin-top:.6rem;padding:.5rem 1rem;border-radius:8px;border:none;background:var(--gold);
  color:var(--maroon-deep);font-weight:800;cursor:pointer;}
.safety{margin-top:.8rem;color:#f3c0b4;font-weight:700;}

/* step trail: the lesson IS a sequence, so it is shown as one */
.trail{display:flex;gap:.35rem;padding:.4rem 1.4rem;overflow-x:auto;}
.dot{flex:1;min-width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(201,168,76,.3);
  background:rgba(0,0,0,.2);color:var(--sandal);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.dot.done{background:rgba(201,168,76,.18);}
.dot.now{background:var(--gold);color:var(--maroon-deep);border-color:var(--gold);}

.controls{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;background:#1c0808;
  border-top:1px solid rgba(201,168,76,.3);flex-wrap:wrap;}
.c-btn{padding:.55rem 1rem;border-radius:9px;border:1.5px solid rgba(201,168,76,.4);background:transparent;
  color:var(--sandal);font-weight:700;cursor:pointer;font-size:.95rem;}
.c-btn.primary{background:var(--gold);color:var(--maroon-deep);border-color:var(--gold);}
.step-count{color:var(--sandal);opacity:.8;margin-left:.4rem;}
.vid-status{color:var(--sandal);opacity:.8;font-size:.85rem;}

#loading{position:fixed;inset:0;background:rgba(42,11,11,.94);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:1rem;z-index:50;text-align:center;padding:2rem;}
#loading.show{display:flex;}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(201,168,76,.25);border-top-color:var(--gold);
  animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#loading-msg{font-family:'Kalam',cursive;font-size:1.6rem;color:var(--gold);}
#loading-sub{color:var(--sandal);max-width:32rem;line-height:1.5;}

@media (max-width:820px){
  .st-body{flex-direction:column;}
  .media{min-height:220px;}
  .act{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){ .line,.reveal{animation:none;} .spin{animation-duration:3s;} }
</style>
</head>
<body>

<!-- ═══════════ SETUP ═══════════ -->
<div id="setup">
  <h1>Science Mystery Class</h1>
  <p class="sub">Every chapter starts with a puzzle from real life. The class guesses, watches it happen, then learns why.</p>
  <div class="setup-card">
    <div class="fld">
      <label for="sel-class">Class</label>
      <select id="sel-class">
        <option value="">Select class</option>
        <option>Class 3</option><option>Class 4</option><option>Class 5</option>
        <option>Class 6</option><option>Class 7</option><option>Class 8</option>
        <option>Class 9</option><option>Class 10</option>
      </select>
    </div>
    <div class="fld">
      <label>Chapter</label>
      <div id="chap-box"><div class="muted">Select a class to see its chapters.</div></div>
    </div>
    <div class="fld">
      <label>Teaching language</label>
      <div class="chip-row" id="lang-row">
        <div class="chip on" data-lang="english">English</div>
        <div class="chip" data-lang="tamil">தமிழ்</div>
        <div class="chip" data-lang="both">EN + TA</div>
      </div>
    </div>
    <button class="start-btn" id="btn-start" disabled>Start class</button>
  </div>
</div>

<!-- ═══════════ CLASSROOM ═══════════ -->
<div id="room">
  <div class="topbar">
    <h2>Science Mystery</h2>
    <span class="meta" id="hdr-meta"></span>
    <button class="tb-btn" id="btn-back">Back</button>
  </div>

  <div class="stage">
    <div class="st-head">
      <span class="st-tag" id="st-tag"></span>
      <div class="st-title" id="st-title"></div>
    </div>
    <div class="st-body" id="st-body"></div>
  </div>

  <div class="trail" id="trail"></div>

  <div class="controls">
    <button class="c-btn" id="btn-prev">◀ Prev</button>
    <button class="c-btn primary" id="btn-play">❚❚ Pause</button>
    <button class="c-btn" id="btn-next">Next ▶</button>
    <button class="c-btn" id="btn-replay">↻ Replay</button>
    <span class="step-count" id="step-count"></span>
    <span style="flex:1"></span>
    <span class="vid-status" id="vid-status"></span>
    <button class="c-btn" id="btn-voice">🔊 Voice</button>
    <button class="c-btn" id="btn-lang">EN</button>
    <button class="c-btn hidden" id="btn-fixvid" title="Super admin: change this video's description and make it again">✎ Fix video</button>
    <button class="c-btn hidden" id="btn-redo" title="Super admin: write this whole lesson again">↺ Redo lesson</button>
    <button class="c-btn" id="btn-new">New chapter</button>
  </div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div id="loading-msg">Getting the class ready…</div>
  <div id="loading-sub"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Science Mystery Class  (separate page — science-concept-ncert.html
   is NOT touched by this file)

   Lesson order, built by AI from the NCERT chapter, saved once and
   shared by every school:
     hook     a surprising real-life clip
     vote     class raises hands for A / B / C
     proof    clip that shows the truth, then the answer is revealed
     explain  small ideas, one at a time
     reallife photos of where we see it around us
     activity a 5-minute classroom activity for the facilitator
     return   back to the mystery — now the class explains it

   Videos come from Kling through /api/concept-video, which saves each
   clip in Supabase so it is paid for only once. While a clip is being
   made the class sees a real-life photo instead, and the clip swaps in
   by itself when ready.
   ════════════════════════════════════════════════════════════════ */

var LESSON_VER  = 'player-mystery-v1';   // "player-" = shared lesson, never overwritten by accident
var MAX_VIDEOS  = 6;                     // cost cap per chapter
var MAX_JOBS    = 3;                     // Kling clips made at the same time

var CLS = '', LANG = 'english';
var CHAPTER = null, CHAPTERS = [];
var STEPS = [], IDX = 0, PLAYING = false, VOICE_ON = true, SEQ = 0;
var VIDS = {};      // prompt -> { status, url, error }
var PHOTOS = {};    // query  -> { url } or { error }
var LESSON_ID = 0;  // bumps on every new lesson so old video checks stop

var TYPES = {
  hook:     { tag:'Mystery',       icon:'🔍' },
  vote:     { tag:'Your guess',    icon:'✋' },
  proof:    { tag:'Let us see',    icon:'🎬' },
  explain:  { tag:'Why it happens',icon:'📖' },
  reallife: { tag:'Around us',     icon:'📷' },
  activity: { tag:'Class activity',icon:'🧪' },
  'return': { tag:'Solve the mystery', icon:'🔁' }
};

var ENGINES = {
  particles: 'models/particles.html',
  circuit:   'models/circuit.html',
  magnetism: 'models/magnetism.html',
  light:     'models/light.html'
};

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function classNum(cls){ var m = String(cls||'').match(/(\d+)/); return m ? m[1] : ''; }
function subjectFor(cls){ var n = parseInt(classNum(cls),10); return (n >= 3 && n <= 5) ? 'EVS' : 'Science'; }

function modelUrlFor(model){
  if(!model || !model.engine) return null;
  var base = ENGINES[String(model.engine).toLowerCase()];
  if(!base) return null;
  var q = [];
  ['substance','start','mode','cells'].forEach(function(k){ if(model[k]) q.push(k + '=' + encodeURIComponent(model[k])); });
  if(model.closed === false) q.push('closed=0');
  q.push('lang=' + encodeURIComponent(LANG === 'both' ? 'english' : LANG));
  return base + '?' + q.join('&');
}

/* ════════ SYLLABUS ════════ */
async function loadChapters(cls){
  var box = $('chap-box');
  box.innerHTML = '<div class="muted">Loading chapters…</div>';
  CHAPTER = null; CHAPTERS = []; $('btn-start').disabled = true;
  var d = null, why = '';
  try {
    var r = await fetch('/api/syllabus', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'chapters', board:'NCERT', cls: cls, subject: subjectFor(cls) })
    });
    d = await r.json();
  } catch(e){ why = e.message; }
  if(!d || !d.ok || !d.chapters || !d.chapters.length){
    box.innerHTML = '<div class="muted">No chapters found for this class. ' + esc(why || (d && d.error) || '') + '</div>';
    return;
  }
  CHAPTERS = d.chapters;
  var html = '', lastGroup = null;
  CHAPTERS.forEach(function(c, i){
    var g = c.part || c.theme_or_group || null;
    if(g && g !== lastGroup){ html += '<div class="theme-hd">' + esc(g) + '</div>'; lastGroup = g; }
    html += '<div class="chap" tabindex="0" data-i="' + i + '"><div class="chap-num">' + esc(c.chapter_number || '·') + '</div>'
          + '<div><div class="chap-t">' + esc(c.chapter_title) + '</div>'
          + (c.book_name ? '<div class="chap-sub">' + esc(c.book_name) + '</div>' : '') + '</div></div>';
  });
  box.innerHTML = html;
}

var CH_TEXT = '', CH_MATCH = '';
async function loadChapterText(){
  CH_TEXT = ''; CH_MATCH = '';
  try {
    var r = await fetch('/api/syllabus', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'chapter_text', board:'NCERT', cls: CLS, subject: subjectFor(CLS),
        chapter_number: CHAPTER.chapter_number || '', chapter_title: CHAPTER.chapter_title || '' })
    });
    var d = await r.json();
    if(d && d.found && d.text){ CH_TEXT = String(d.text); CH_MATCH = String(d.matched_title || ''); }
  } catch(e){}
}

/* ════════ SAVED LESSONS ════════ */
function topicKey(){
  return 'ch' + String(CHAPTER.chapter_number || '') + '__'
       + String(CHAPTER.chapter_title || '').toLowerCase().replace(/\s+/g,'-');
}
function lessonVer(){
  if(!CH_TEXT) return LESSON_VER;
  return LESSON_VER + '-b-' + CH_MATCH.toLowerCase().replace(/[^a-z0-9]+/g,'').substring(0,14);
}
function cacheBody(extra){
  // Always 'english': one lesson (and one set of paid videos) per chapter.
  // Tamil is a translation saved beside it — see TAMIL below.
  var b = { board:'NCERT', cls: CLS, subject: subjectFor(CLS) + '-Mystery',
            topic: topicKey(), lang: 'english', ver: lessonVer() };
  for(var k in extra) b[k] = extra[k];
  return JSON.stringify(b);
}
async function getSavedLesson(){
  try {
    var r = await fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'},
      body: cacheBody({ action:'get' }) });
    var d = await r.json();
    if(d && d.found && d.map && d.map.steps && d.map.steps.length) return d.map.steps;
  } catch(e){}
  return null;
}
/* Super admin only: lessons and videos are shared by every school, so only
   the super admin may replace them. The server checks this again. */
var IS_ADMIN = false, SESSION = '';
try { SESSION = localStorage.getItem('dss_session') || '';
      IS_ADMIN = localStorage.getItem('dss_role') === 'super_admin' && !!SESSION; } catch(e){}

async function replaceLesson(steps){
  try {
    var r = await fetch('/api/concept-cache', { method:'POST',
      headers:{'Content-Type':'application/json', 'x-dss-session': SESSION},
      body: cacheBody({ action:'save', replace:true, narration:{ steps: steps } }) });
    var d = await r.json();
    if(d && d.saved) return '';
    return (d && (d.reason || d.error)) || 'not saved';
  } catch(e){ return 'network: ' + e.message; }
}

function saveLesson(steps){
  fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'},
    body: cacheBody({ action:'save', narration:{ steps: steps } }) }).catch(function(){});
}

/* ════════ BUILD THE LESSON ════════ */
function langInstruction(){
  if(LANG === 'tamil'){
    return 'Write say_ta in Tamil script, but keep every science term in English letters exactly as '
         + 'printed in the book (evaporation, magnet, force, cell and so on). Also fill say_en in English.';
  }
  if(LANG === 'both'){
    return 'Fill BOTH say_en (simple Indian classroom English) and say_ta (Tamil script, science terms kept in English letters).';
  }
  return 'Write say_en in simple Indian classroom English. Leave say_ta as an empty string.';
}

async function buildLesson(){
  var book = CHAPTER.book_name || '';
  var subj = subjectFor(CLS) === 'EVS' ? 'EVS' : 'science';
  var prompt =
      'You are planning a MYSTERY-STYLE ' + subj + ' class for ' + CLS + ' children in a Tamil Nadu school. '
    + 'Board: NCERT / CBSE. Book: "' + book + '". Chapter ' + (CHAPTER.chapter_number || '') + ': "' + CHAPTER.chapter_title + '".\n\n'
    + (CH_TEXT
        ? 'Here is the actual NCERT chapter text. Follow the book\'s ideas, examples, activities and order, in your own words. Do not read the book aloud.\n\nCHAPTER TEXT:\n' + CH_TEXT + '\n\n'
        : 'You have not seen the book. Teach what a ' + CLS + ' child needs to understand this chapter.\n\n')
    + 'The children are shy and do not answer open questions. So every question must be a show-of-hands choice, never "what do you think".\n\n'
    + 'Build the lesson as steps, in EXACTLY this order:\n'
    + '1. ONE "hook" step: a surprising everyday thing from Tamil Nadu life that the chapter\'s main idea explains, '
    + 'chosen because many children hold a wrong belief about it. It MUST have a video.\n'
    + '2. ONE "vote" step: a question about the hook with exactly 3 options. One option is the common wrong belief. '
    + 'say_en asks the question, reads the 3 options, and asks children to raise hands. Do not give the answer.\n'
    + '3. ONE "proof" step: a video that shows what really happens. say_en tells which option was right and why, in 2 sentences.\n'
    + '4. THREE to SIX "explain" steps: one small idea each, the everyday name first and the science word second. '
    + 'About half of them should have a video or a photo of the real thing happening.\n'
    + '5. TWO or THREE "reallife" steps: where we see this around us in Tamil Nadu (kitchen, farm, temple, bus, rain, market). Each MUST have a photo.\n'
    + '6. ONE or TWO "activity" steps: something the teacher can do in class in 3 to 8 minutes with things found in any Indian school or home. '
    + 'Anything with heat, flame, sharp objects or chemicals is done by the teacher only — say so in "safety".\n'
    + '7. ONE "return" step: go back to the mystery. say_en asks the class to explain it now, then gives the full answer in one simple sentence.\n\n'
    + 'VIDEO RULES (videos cost money): at most ' + MAX_VIDEOS + ' steps in the whole lesson may have a video. '
    + 'A video prompt is ONE short realistic scene, under 60 words, in English, for an AI video maker: '
    + 'start with "Realistic video,", name a Tamil Nadu or Indian setting, show ONE clear action that proves the idea, '
    + 'mid-distance camera, natural light, no text, no signboards, no close-up faces. It must be scientifically true to what really happens.\n'
    + 'The clip must SHOW THE CHANGE HAPPENING, not just the objects. For anything slow (drying, melting, rusting, growing, '
    + 'dissolving, settling), write "Time-lapse video," instead of "Realistic video," and describe the START state and the END state in the prompt, '
    + 'for example: "Time-lapse video, a steel plate filled with water on a sunny Indian window sill. Over the clip the water level drops '
    + 'steadily until the plate is completely dry." Never ask for something invisible (like vapour or air) to be seen; show its visible effect instead.\n'
    + 'PHOTO RULES: a photo is a short description (under 25 words) of a real photograph in India, one clear subject, no text.\n\n'
    + 'Each step is a JSON object with:\n'
    + '  type     — "hook", "vote", "proof", "explain", "reallife", "activity" or "return"\n'
    + '  title    — a few words, shown large\n'
    + '  board    — array of 1 to 3 short lines, each under 50 characters (for vote: [] )\n'
    + '  say_en, say_ta — what the teacher says aloud, 2 to 4 sentences\n'
    + '  video    — video prompt or ""\n'
    + '  photo    — photo description or "" (give a photo on every step that has a video too, it is shown while the video is being made)\n'
    + '  options  — vote only: exactly 3 short strings; otherwise []\n'
    + '  answer   — vote only: 0, 1 or 2 (index of the right option); otherwise -1\n'
    + '  materials — activity only: array of things needed; otherwise []\n'
    + '  doing    — activity only: array of 3 to 6 short steps; otherwise []\n'
    + '  minutes  — activity only: number; otherwise 0\n'
    + '  safety   — activity only: one line, or ""\n'
    + '  model    — OPTIONAL, explain steps only, and only if it truly fits: '
    + '{"engine":"particles","substance":"water","start":"solid"} for states of matter / evaporation; '
    + '{"engine":"circuit","mode":"simple","cells":1} for circuits (modes simple, series, parallel, material); '
    + '{"engine":"magnetism","mode":"bar"} for magnets (modes bar, field, electromagnet); '
    + '{"engine":"light","mode":"mirror"} for light (modes shadow, mirror, refraction, lens). Otherwise omit.\n\n'
    + 'Be scientifically correct. The RIGHT option in the vote and every explanation must use the exact correct idea '
    + '(for example water turns into water vapour, never "into air"; mass is not weight; plants make food, they do not take it from soil). '
    + 'Only the wrong options may hold wrong beliefs. Age-appropriate for ' + CLS + '. '
    + 'Write say_en in simple Indian classroom English. Leave say_ta as an empty string (Tamil is added separately).\n'
    + 'No markdown, no asterisks. Return ONLY a JSON array. Start with [ and end with ].';

  var r = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: 'You return ONLY a valid JSON array. No markdown fences, no preamble, no text after the array.',
      messages: [{ role:'user', content: prompt }],
      max_tokens: 6000
    })
  });
  var d = await r.json();
  if(d && (d.type === 'error' || d.error)){
    throw new Error(typeof d.error === 'string' ? d.error : ((d.error && d.error.message) || d.message || 'AI error'));
  }
  var txt = Array.isArray(d.content) ? d.content.map(function(x){ return x.text || ''; }).join('')
          : (d.completion || d.text || d.content || '');
  txt = String(txt).replace(/```json|```/g,'').trim();
  var a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if(a < 0 || b < 0) throw new Error('Unexpected reply: ' + txt.substring(0,120));
  return cleanSteps(JSON.parse(txt.slice(a, b + 1)));
}

function arr(v){ return Array.isArray(v) ? v.map(String).filter(function(x){ return x.trim(); }) : []; }

function cleanSteps(list){
  var steps = [], videos = 0;
  (list || []).forEach(function(o){
    if(!o || !TYPES[o.type]) return;
    var s = {
      type: o.type, title: String(o.title || ''), board: arr(o.board).slice(0,3),
      say_en: String(o.say_en || ''), say_ta: String(o.say_ta || ''),
      video: String(o.video || '').trim(), photo: String(o.photo || '').trim(),
      options: arr(o.options).slice(0,3), answer: parseInt(o.answer, 10),
      materials: arr(o.materials), doing: arr(o.doing),
      minutes: Math.max(0, Math.min(15, parseInt(o.minutes, 10) || 0)),
      safety: String(o.safety || ''),
      model: (o.model && o.model.engine && o.type === 'explain') ? {
        engine: String(o.model.engine), substance: String(o.model.substance || ''),
        start: String(o.model.start || ''), mode: String(o.model.mode || ''),
        cells: o.model.cells ? String(o.model.cells) : '', closed: o.model.closed === false ? false : true
      } : null
    };
    if(isNaN(s.answer)) s.answer = -1;
    // cost cap: past the limit, a video becomes a photo of the same scene
    if(s.video){
      if(videos >= MAX_VIDEOS){ if(!s.photo) s.photo = s.video.replace(/^realistic video,?\s*/i,''); s.video = ''; }
      else videos++;
    }
    steps.push(s);
  });
  if(!steps.length) throw new Error('empty lesson');
  return steps.slice(0, 22);
}

/* ════════ TAMIL ════════
   Written once per chapter from the English lesson and saved beside it, so
   every school gets it free after the first time. It is tied to the exact
   lesson words: if the super admin redoes the lesson, a fresh Tamil version
   is written the next time Tamil is chosen. Science words stay in English
   letters, the way teachers actually speak in Tamil Nadu classrooms. */
var TA = null;          // array matching STEPS, or null
var TA_LOADING = null;  // promise while loading/writing

function lessonPrint(steps){
  var t = JSON.stringify((steps || []).map(function(s){
    return [s.type, s.title, s.board, s.say_en, s.options, s.materials, s.doing, s.safety];
  }));
  var h = 5381;
  for(var i = 0; i < t.length; i++){ h = ((h << 5) + h + t.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(36);
}
function tamilBody(extra){
  var b = { board:'NCERT', cls: CLS, subject: subjectFor(CLS) + '-Mystery', topic: topicKey(),
            lang: 'tamil', ver: lessonVer() + '-ta-' + lessonPrint(STEPS) };
  for(var k in extra) b[k] = extra[k];
  return JSON.stringify(b);
}

async function writeTamilPart(part){
  var prompt =
      'Translate this ' + CLS + ' science lesson into simple SPOKEN Tamil, the way a warm Tamil Nadu school teacher '
    + 'talks to children in class. Keep every science and textbook term in English letters exactly as printed '
    + '(evaporation, water vapour, magnet, force, cell and so on) — never write those in Tamil script. '
    + 'Keep names of places and things natural. Keep board lines short (under 50 characters).\n\n'
    + 'Return ONLY a JSON array with one object per input item, in the same order, each with: '
    + 'title, board (array), options (array), materials (array), doing (array), safety, say. '
    + 'Keep arrays the same length as the input. Use "" or [] where the input is empty.\n\n'
    + 'INPUT:\n' + JSON.stringify(part);
  var r = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system:'You return ONLY a valid JSON array. No markdown fences, no preamble.',
      messages:[{ role:'user', content: prompt }], max_tokens: 6000 }) });
  var d = await r.json();
  if(d && (d.type === 'error' || d.error)) throw new Error(typeof d.error === 'string' ? d.error : ((d.error && d.error.message) || 'AI error'));
  var txt = Array.isArray(d.content) ? d.content.map(function(x){ return x.text || ''; }).join('') : String(d.completion || d.text || '');
  txt = txt.replace(/```json|```/g,'').trim();
  var a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if(a < 0 || b < 0) throw new Error('Tamil reply not understood: ' + txt.substring(0, 100));
  var out = JSON.parse(txt.slice(a, b + 1));
  if(!Array.isArray(out) || out.length !== part.length) throw new Error('Tamil reply had the wrong number of steps');
  return out;
}

async function buildTamil(){
  var items = STEPS.map(function(s){
    return { title: s.title, board: s.board, options: s.options, materials: s.materials,
             doing: s.doing, safety: s.safety, say: s.say_en };
  });
  // written in small parts side by side: Tamil is long, and one big reply could be cut off
  var parts = [];
  for(var i = 0; i < items.length; i += 5) parts.push(items.slice(i, i + 5));
  var done = await Promise.all(parts.map(writeTamilPart));
  var all = [].concat.apply([], done);
  return all.map(function(o){
    o = o || {};
    return { title: String(o.title || ''), board: arr(o.board), options: arr(o.options),
             materials: arr(o.materials), doing: arr(o.doing), safety: String(o.safety || ''), say: String(o.say || '') };
  });
}

// Makes sure the Tamil version is ready. Returns '' when ready, or the real reason it is not.
function ensureTamil(){
  if(TA) return Promise.resolve('');
  if(TA_LOADING) return TA_LOADING;
  var forSteps = STEPS;
  TA_LOADING = (async function(){
    try {
      var r = await fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'},
        body: tamilBody({ action:'get' }) });
      var d = await r.json();
      if(d && d.found && d.map && d.map.steps && d.map.steps.length === forSteps.length){
        if(forSteps === STEPS) TA = d.map.steps;
        return '';
      }
      var fresh = await buildTamil();
      if(forSteps !== STEPS) return 'lesson changed';
      TA = fresh;
      fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'},
        body: tamilBody({ action:'save', narration:{ steps: fresh } }) }).catch(function(){});
      return '';
    } catch(e){ return String(e.message || e); }
    finally { TA_LOADING = null; }
  })();
  return TA_LOADING;
}

// Picks the words to show for a step in the chosen language.
function T(i, field){
  var s = STEPS[i];
  if(LANG === 'tamil' && TA && TA[i]){
    var v = TA[i][field === 'say_en' ? 'say' : field];
    if(Array.isArray(v) ? v.length : (v && String(v).trim())) return v;
  }
  return s[field];
}
var UI_TA = { raise:'A, B அல்லது C — உங்கள் கையை உயர்த்துங்கள். எல்லோரும் சொன்ன பிறகு Next அழுத்தவும்.',
              need:'தேவையானவை', todo:'செய்முறை', right:'சரியான பதில்: ', timer:'Timer தொடங்கு',
              mystery:'மர்மம்', vote:'உங்கள் பதில்', proof:'பார்ப்போம்', explain:'ஏன் நடக்கிறது',
              reallife:'நம்மைச் சுற்றி', activity:'வகுப்புச் செயல்பாடு', 'return':'மர்மத்தைத் தீர்ப்போம்' };
function ta(){ return LANG === 'tamil'; }

/* ════════ VIDEOS (made in the background) ════════ */
function lessonPrompts(){
  var seen = {}, out = [];
  STEPS.forEach(function(s){ if(s.video && !seen[s.video]){ seen[s.video] = 1; out.push(s.video); } });
  return out;
}

var TICK_TIMER = null, TICK_BUSY = false, TICK_AGAIN = false;
function kickVideos(){
  clearTimeout(TICK_TIMER);
  if(TICK_BUSY){ TICK_AGAIN = true; return; }
  videoTick(LESSON_ID);
}

async function videoTick(myLesson){
  if(myLesson !== LESSON_ID) return;
  TICK_BUSY = true;
  try { await videoTickInner(myLesson); } finally { TICK_BUSY = false; }
  if(TICK_AGAIN){ TICK_AGAIN = false; kickVideos(); }
}

async function videoTickInner(myLesson){
  var prompts = lessonPrompts();
  var busy = prompts.filter(function(p){ return VIDS[p] && VIDS[p].status === 'processing'; }).length;
  for(var i = 0; i < prompts.length; i++){
    if(myLesson !== LESSON_ID) return;
    var p = prompts[i], v = VIDS[p] || {};
    if(v.status === 'done' || v.status === 'failed') continue;
    var mayStart = (v.status !== 'processing') && busy < MAX_JOBS;
    try {
      var r = await fetch('/api/concept-video', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ prompt: p, create: mayStart }) });
      var d = await r.json();
      if(d.status === 'processing' && v.status !== 'processing') busy++;
      VIDS[p] = { status: d.status, url: d.url || '', error: d.error || '' };
    } catch(e){
      VIDS[p] = { status: v.status || 'none', error: 'network: ' + e.message };
    }
    if(VIDS[p].status === 'done' && v.status !== 'done') refreshMediaIfShowing(p);
  }
  showVideoStatus();
  var left = prompts.some(function(p){ return !VIDS[p] || (VIDS[p].status !== 'done' && VIDS[p].status !== 'failed'); });
  if(left) TICK_TIMER = setTimeout(function(){ videoTick(myLesson); }, 20000);
}

function showVideoStatus(){
  var ps = lessonPrompts(); if(!ps.length){ $('vid-status').textContent = ''; return; }
  var done = ps.filter(function(p){ return VIDS[p] && VIDS[p].status === 'done'; }).length;
  var failed = ps.filter(function(p){ return VIDS[p] && VIDS[p].status === 'failed'; }).length;
  $('vid-status').textContent = 'Videos ' + done + '/' + ps.length + ' ready' + (failed ? (' · ' + failed + ' failed') : '');
}

function refreshMediaIfShowing(prompt){
  var s = STEPS[IDX]; if(!s) return;
  var showing = s.video === prompt || (s.type === 'return' && hookStep() && hookStep().video === prompt);
  if(showing){ var m = document.querySelector('#st-body .media'); if(m) fillMedia(m, s); }
}

/* ════════ PHOTOS ════════ */
async function getPhoto(q){
  if(PHOTOS[q]) return PHOTOS[q];
  try {
    var r = await fetch('/api/gen-image', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, mode:'concept-photo', context: CHAPTER ? CHAPTER.chapter_title : '' }) });
    var d = await r.json();
    if(d && d.images && d.images[0] && d.images[0].url) PHOTOS[q] = { url: d.images[0].url };
    else return { error: (d && (d.note || d.error)) || 'no picture came back' };
  } catch(e){ return { error: 'network: ' + e.message }; }
  return PHOTOS[q];
}

/* ════════ VOICE ════════ */
var mcAudio = null, mcSeq = 0;
function stopAudio(){ if(mcAudio){ try{ mcAudio.pause(); }catch(e){} mcAudio = null; } try{ window.speechSynthesis.cancel(); }catch(e){} }
function speakBrowser(text, lang){
  return new Promise(function(res){
    if(!VOICE_ON || !('speechSynthesis' in window)) return res();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'tamil' ? 'ta-IN' : 'en-IN'; u.rate = .92;
    u.onend = res; u.onerror = res;
    window.speechSynthesis.speak(u);
    setTimeout(res, Math.min(22000, 1600 + text.length * 62));
  });
}
function speakAsync(text, lang){
  if(!VOICE_ON || !text || !String(text).trim()) return Promise.resolve();
  var my = ++mcSeq; stopAudio();
  return fetch('/api/voice-class', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: String(text), cls: CLS }) })
  .then(function(r){ return r.json(); }).then(function(d){
    if(my !== mcSeq || !VOICE_ON) return;
    if(d && d.audio_b64){
      return new Promise(function(res){
        mcAudio = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
        mcAudio.onended = function(){ mcAudio = null; res(); };
        mcAudio.onerror = res;
        mcAudio.play().catch(function(){ speakBrowser(text, lang).then(res); });
      });
    }
    return speakBrowser(text, lang);
  }).catch(function(){ return speakBrowser(text, lang); });
}
async function speakStep(s){
  var i = STEPS.indexOf(s);
  var taSay = (TA && TA[i] && TA[i].say) ? TA[i].say : (s.say_ta || '');
  if(LANG === 'both'){ if(s.say_en) await speakAsync(s.say_en,'english'); if(taSay) await speakAsync(taSay,'tamil'); }
  else if(LANG === 'tamil') await speakAsync(taSay || s.say_en, 'tamil');
  else await speakAsync(s.say_en, 'english');
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ════════ DRAWING A STEP ════════ */
function hookStep(){ for(var i = 0; i < STEPS.length; i++) if(STEPS[i].type === 'hook') return STEPS[i]; return null; }
function voteBefore(i){ for(var k = i; k >= 0; k--) if(STEPS[k].type === 'vote') return STEPS[k]; return null; }

function linesHtml(lines, keyFirst){
  return (lines || []).map(function(l, n){
    return '<div class="line' + (keyFirst && n === 0 ? ' key' : '') + '" style="animation-delay:' + (n * .15) + 's">' + esc(l) + '</div>';
  }).join('');
}

// Fills a media box: video if ready, otherwise the photo with a small note.
async function fillMedia(box, s){
  var src = (s.type === 'return' && !s.video && hookStep()) ? hookStep() : s;
  var mUrl = modelUrlFor(s.model);
  if(mUrl){ box.innerHTML = '<iframe title="Working model" src="' + esc(mUrl) + '"></iframe>'; return; }

  var v = src.video ? VIDS[src.video] : null;
  if(v && v.status === 'done' && v.url){
    box.innerHTML = '<video src="' + esc(v.url) + '" autoplay muted loop playsinline></video>';
    return;
  }
  var note = '';
  if(src.video){
    if(v && v.status === 'failed') note = '<div class="badge err">Video could not be made: ' + esc(v.error) + '</div>';
    else if(v && v.error) note = '<div class="badge err">Video problem: ' + esc(v.error) + '</div>';
    else note = '<div class="badge">Video is being made — it will appear here by itself</div>';
  }
  var q = src.photo || (src.video ? src.video.replace(/^realistic video,?\s*/i,'') : '');
  if(!q){ box.innerHTML = '<div class="wait">No picture for this step.</div>'; return; }
  var mine = SEQ;
  box.innerHTML = '<div class="wait">Getting the picture…</div>' + note;
  var ph = await getPhoto(q);
  if(mine !== SEQ || !box.isConnected) return;
  var again = src.video ? VIDS[src.video] : null;
  if(again && again.status === 'done' && again.url){ box.innerHTML = '<video src="' + esc(again.url) + '" autoplay muted loop playsinline></video>'; return; }
  box.innerHTML = ph.url ? ('<img alt="' + esc(q) + '" src="' + esc(ph.url) + '">' + note)
                         : ('<div class="wait">Picture could not be made: ' + esc(ph.error) + '</div>' + note);
}

function hasMedia(s){ return !!(s.video || s.photo || modelUrlFor(s.model) || (s.type === 'return' && hookStep())); }

function render(i){
  var s = STEPS[i], body = $('st-body');

        + (taOpts[n] ? '<span class="ta">' + esc(taOpts[n]) + '</span>' : '') + '</span></div>';
    }).join('') + '<div class="hands">' + (ta() ? UI_TA.raise : 'Raise your hand for A, B or C. Press Next when everyone has voted.') + '</div></div>';
  }
  else if(s.type === 'activity'){
    body.innerHTML = '<div class="act">'
      + '<div><h4>' + (ta() ? UI_TA.need : 'We need') + '</h4><ul>' + T(i, 'materials').map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>'
      + '<div><h4>' + (ta() ? UI_TA.todo : 'What to do') + '</h4><ol>' + T(i, 'doing').map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ol>'
      + (s.safety ? '<div class="safety">⚠ ' + esc(T(i, 'safety')) + '</div>' : '') + '</div>'
      + (s.minutes ? '<div class="timer"><div class="t" id="tmr">' + s.minutes + ':00</div><button id="tmr-go">' + (ta() ? UI_TA.timer : 'Start timer') + '</button></div>' : '')
      + '</div>';

  }
  else {
    body.className = 'st-body full';
    body.innerHTML = '<div class="words">' + linesHtml(T(i, 'board'), true) + '</div>';
  }

  if(IS_ADMIN){
    $('btn-fixvid').classList.toggle('hidden', !videoOwner(i));
    $('btn-redo').classList.remove('hidden');
  }

  markTrail(i);
}

function revealAnswer(i){
  var vs = voteBefore(i);
  if(!vs || vs.answer < 0 || !vs.options[vs.answer]) return;
  var w = document.querySelector('#st-body .words');
  if(!w) return;
  var d = document.createElement('div');
  d.className = 'reveal';
  var vi = STEPS.indexOf(vs), opts = T(vi, 'options');
  d.textContent = (ta() ? UI_TA.right : 'Right answer: ') + 'ABC'.charAt(vs.answer) + ') ' + (opts[vs.answer] || vs.options[vs.answer]);
  w.appendChild(d);
}

var TMR = null;
function startTimer(sec){
  clearInterval(TMR);
  var el = $('tmr'); if(!el) return;
  TMR = setInterval(function(){
    sec--; var t = $('tmr'); if(!t){ clearInterval(TMR); return; }
    if(sec <= 0){ clearInterval(TMR); t.textContent = 'Time!'; return; }
    t.textContent = Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
  }, 1000);
}

/* ════════ PLAYBACK ════════ */
function setPlaying(on){ PLAYING = on; $('btn-play').textContent = on ? '❚❚ Pause' : '▶ Continue'; }

async function runStep(i){
  if(i < 0 || i >= STEPS.length) return;
  IDX = i; var my = ++SEQ; QUIZ = null; liveStop();
  clearInterval(TMR);
  var s = STEPS[i];
  render(i);
  var t0 = Date.now();
  await speakStep(s);
  if(my !== SEQ) return;
  if(s.type === 'proof' || s.type === 'return'){ revealAnswer(i); await wait(1800); if(my !== SEQ) return; }
  // let a clip play at least once before moving on
  if(hasMedia(s)){ var left = 6000 - (Date.now() - t0); if(left > 0){ await wait(left); if(my !== SEQ) return; } }
  // votes and activities wait for the teacher
  if(s.type === 'vote' || s.type === 'activity'){ setPlaying(false); return; }
  if(PLAYING && IDX < STEPS.length - 1){ await wait(700); if(my === SEQ && PLAYING) runStep(IDX + 1); }
  else if(IDX >= STEPS.length - 1){
    // the lesson played through to the end by itself: go straight to the check
    var wasPlaying = PLAYING;
    setPlaying(false);
    if(wasPlaying && STEPS.length > 1){ await wait(1500); if(my === SEQ) startCheck(); }
  }
}

function goNext(){
  if(QUIZ) return;                                   // the check has its own buttons
  if(IDX < STEPS.length - 1){ stopAudio(); setPlaying(true); runStep(IDX + 1); }
  else if(STEPS.length > 1) startCheck();
}
function goPrev(){
  if(QUIZ || (!QUIZ && $('st-tag').textContent.indexOf('✅') === 0)){ QUIZ = null; stopAudio(); runStep(STEPS.length - 1); return; }
  if(IDX > 0){ stopAudio(); runStep(IDX - 1); }
}
function replay(){
  if(QUIZ){ stopAudio(); if(QUIZ.i < CHECK.questions.length && QUIZ.results.length === QUIZ.i) showQuestion(); return; }
  stopAudio(); runStep(IDX);
}
function playPause(){
  if(QUIZ) return;
  if(PLAYING){ setPlaying(false); SEQ++; stopAudio(); }
  else { setPlaying(true); runStep(STEPS[IDX].type === 'vote' || STEPS[IDX].type === 'activity' ? IDX + 1 : IDX); }
}

function buildTrail(){
  $('trail').innerHTML = STEPS.map(function(s, i){
    return '<button class="dot" data-i="' + i + '" title="' + esc(TYPES[s.type].tag + ': ' + s.title) + '">' + TYPES[s.type].icon + '</button>';
  }).join('') + (STEPS.length > 1 ? '<button class="dot" data-i="check" title="Quick check and homework">✅</button>' : '');
}

/* ════════ QUICK CHECK (end of class) ════════
   5 show-of-hands questions. After each answer the facilitator taps how many
   children got it (most / about half / only a few). No student names — the
   same class-level record the other class pages save to Class Insights.
   Then homework, which the facilitator can edit and send to the Student Diary.
   Written once per chapter, tied to the exact lesson words, saved for every school. */
var CHECK = null, CHECK_LOADING = null;
var QUIZ = null;   // { i, shown, results:[] } while the check is on screen

function checkBody(extra){
  var b = { board:'NCERT', cls: CLS, subject: subjectFor(CLS) + '-Mystery', topic: topicKey(),
            lang: 'english', ver: lessonVer() + '-check-' + lessonPrint(STEPS) };
  for(var k in extra) b[k] = extra[k];
  return JSON.stringify(b);
}

async function buildCheck(){
  var taught = STEPS.map(function(s){ return s.title + ': ' + s.board.join(' / ') + ' — ' + s.say_en; }).join('\n');
  var prompt =
      'Write an end-of-class check for ' + CLS + ' children in a Tamil Nadu school, chapter "' + CHAPTER.chapter_title + '".\n'
    + 'Use ONLY ideas taught in this lesson:\n' + taught + '\n\n'
    + 'Exactly 5 questions the teacher reads aloud; children answer by raising hands for A, B or C. '
    + 'Mix: 2 about the main ideas, 2 applying them to daily life in Tamil Nadu, 1 about the mystery. '
    + 'Each question under 15 words. Exactly 3 short options; the wrong options are common wrong beliefs. '
    + 'The right answer must be scientifically exact.\n'
    + 'Then HOMEWORK for the diary: one small safe home activity with household things (no fire, no sharp objects) '
    + 'and 2 short written questions. Plain lines, no markdown.\n'
    + 'Also give Tamil versions in simple spoken Tamil, keeping science terms in English letters.\n\n'
    + 'Return ONLY a JSON object: {"questions":[{"q":"","options":["","",""],"answer":0,"why":"one sentence",'
    + '"q_ta":"","options_ta":["","",""],"why_ta":""}],"homework":"","homework_ta":""}';
  var r = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system:'You return ONLY a valid JSON object. No markdown fences, no preamble.',
      messages:[{ role:'user', content: prompt }], max_tokens: 4000 }) });
  var d = await r.json();
  if(d && (d.type === 'error' || d.error)) throw new Error(typeof d.error === 'string' ? d.error : ((d.error && d.error.message) || 'AI error'));
  var txt = Array.isArray(d.content) ? d.content.map(function(x){ return x.text || ''; }).join('') : String(d.completion || d.text || '');
  txt = txt.replace(/```json|```/g,'').trim();
  var a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a < 0 || b < 0) throw new Error('Check reply not understood: ' + txt.substring(0, 100));
  var o = JSON.parse(txt.slice(a, b + 1));
  var qs = (o.questions || []).filter(function(q){ return q && q.q && Array.isArray(q.options) && q.options.length >= 2; })
    .slice(0, 5).map(function(q){
      var ans = parseInt(q.answer, 10);
      return { q: String(q.q), options: arr(q.options).slice(0,3), answer: (ans >= 0 && ans < 3) ? ans : 0,
               why: String(q.why || ''), q_ta: String(q.q_ta || ''), options_ta: arr(q.options_ta).slice(0,3), why_ta: String(q.why_ta || '') };
    });
  if(!qs.length) throw new Error('no questions came back');
  return { questions: qs, homework: String(o.homework || ''), homework_ta: String(o.homework_ta || '') };
}

function ensureCheck(){
  if(CHECK) return Promise.resolve('');
  if(CHECK_LOADING) return CHECK_LOADING;
  var forSteps = STEPS;
  CHECK_LOADING = (async function(){
    try {
      var r = await fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'}, body: checkBody({ action:'get' }) });
      var d = await r.json();
      if(d && d.found && d.map && d.map.check && d.map.check.questions){ if(forSteps === STEPS) CHECK = d.map.check; return ''; }
      var fresh = await buildCheck();
      if(forSteps !== STEPS) return 'lesson changed';
      CHECK = fresh;
      fetch('/api/concept-cache', { method:'POST', headers:{'Content-Type':'application/json'},
        body: checkBody({ action:'save', narration:{ check: fresh } }) }).catch(function(){});
      return '';
    } catch(e){ return String(e.message || e); }
    finally { CHECK_LOADING = null; }
  })();
  return CHECK_LOADING;
}

/* ── Answer cards, live from the facilitator's phone (card-scanner.html) ──
   A 4-digit class code is shown during the check. The phone joins with it,
   follows the question on screen, and its answers appear here. Everything
   still works without a phone: the facilitator just taps Most / About half. */
var LIVE = { code:'', timer:null, answers:{} };

function liveCall(body){
  return fetch('/api/live-answers', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}
async function liveOpen(){
  if(LIVE.code) return;
  try { var d = await liveCall({ action:'create' }); if(d && d.code) LIVE.code = d.code; } catch(e){}
}
function liveState(q, phase){
  if(!LIVE.code) return;
  liveCall({ action:'state_set', code: LIVE.code,
    state:{ q: q, phase: phase, total: CHECK ? CHECK.questions.length : 0, title: CHAPTER ? CHAPTER.chapter_title : '' } }).catch(function(){});
}
function liveStop(){ clearTimeout(LIVE.timer); LIVE.timer = null; }
function livePoll(q){
  liveStop();
  if(!LIVE.code) return;
  var tick = function(){
    liveCall({ action:'answers_get', code: LIVE.code, q: q }).then(function(d){
      if(!QUIZ || QUIZ.i !== q) return;
      LIVE.answers = (d && d.answers) || {};
      var n = Object.keys(LIVE.answers).length, el = $('q-live-n');
      if(el) el.textContent = n ? (n + (ta() ? ' அட்டைகள் பதில் சொன்னன' : (n === 1 ? ' card answered' : ' cards answered'))) : '';
    }).catch(function(){}).then(function(){ if(QUIZ && QUIZ.i === q && !QUIZ.shown) LIVE.timer = setTimeout(tick, 2000); });
  };
  tick();
}
function liveLine(){
  if(!LIVE.code) return '';
  return '<div class="live">📷 ' + (ta() ? 'பதில் அட்டைகள்: phone-ல் ' : 'Answer cards: on the phone open ')
    + location.host + '/card-scanner.html — ' + (ta() ? 'code ' : 'code ') + '<b>' + LIVE.code + '</b>'
    + ' <span id="q-live-n"></span></div>';
}

function qText(q, f){ return (ta() && q[f + '_ta'] && (Array.isArray(q[f + '_ta']) ? q[f + '_ta'].length : true)) ? q[f + '_ta'] : q[f]; }

async function startCheck(){
  SEQ++; stopAudio(); setPlaying(false); clearInterval(TMR);
  markTrail(STEPS.length);
  $('st-tag').textContent = '✅ ' + (ta() ? 'சிறு சோதனை' : 'Quick check');
  $('st-title').textContent = ta() ? 'நாம் என்ன கற்றோம்?' : 'What did we learn?';
  $('step-count').textContent = '';
  var body = $('st-body'); body.className = 'st-body full';
  body.innerHTML = '<div class="words"><div class="line">' + (ta() ? 'கேள்விகள் தயாராகின்றன…' : 'Getting the questions ready…') + '</div></div>';
  var why = await ensureCheck();
  if(why){ body.innerHTML = '<div class="words"><div class="line">Questions could not be prepared: ' + esc(why) + '</div>'
                        + '<div class="qbar"><button class="qbtn main" id="q-retry">Try again</button></div></div>';
           $('q-retry').onclick = startCheck; return; }
  await liveOpen();
  QUIZ = { i: 0, shown: false, results: [] };
  if(window.dssRoster) dssRoster(CLS);        // get the student list ready for the summary (card = roll number)
  showQuestion();
}

function showQuestion(){
  var my = ++SEQ;
  var q = CHECK.questions[QUIZ.i], opts = qText(q, 'options');
  $('st-title').textContent = qText(q, 'q');
  var body = $('st-body'); body.className = 'st-body';
  body.innerHTML = '<div class="vote q">'
    + '<div class="qnum">' + (ta() ? 'கேள்வி ' : 'Question ') + (QUIZ.i + 1) + ' / ' + CHECK.questions.length + '</div>'
    + opts.map(function(o, n){ return '<div class="opt pick" data-n="' + n + '"><span class="l">' + 'ABC'.charAt(n) + '</span><span>' + esc(o) + '</span></div>'; }).join('')
    + '<div id="q-after"></div>'
    + '<div class="qbar" id="q-bar"><button class="qbtn main" id="q-show">' + (ta() ? 'பதிலைக் காட்டு' : 'Show answer') + '</button></div>'
    + liveLine() + '</div>';
  $('q-show').onclick = revealQuestion;
  QUIZ.shown = false; LIVE.answers = {};
  liveState(QUIZ.i, 'ask');
  livePoll(QUIZ.i);
  var say = qText(q, 'q') + ' ' + opts.map(function(o, n){ return 'ABC'.charAt(n) + ': ' + o + '.'; }).join(' ');
  speakAsync(say, ta() ? 'tamil' : 'english');
}

async function revealQuestion(){
  var q = CHECK.questions[QUIZ.i];
  if(QUIZ.shown) return;                    // pressed twice
  QUIZ.shown = true; liveStop();
  var sb0 = $('q-show'); if(sb0) sb0.disabled = true;
  if(LIVE.code){
    liveState(QUIZ.i, 'reveal');
    try { var d = await liveCall({ action:'answers_get', code: LIVE.code, q: QUIZ.i }); LIVE.answers = (d && d.answers) || LIVE.answers; } catch(e){}
  }
  document.querySelectorAll('#st-body .opt').forEach(function(el){
    var n = parseInt(el.getAttribute('data-n'), 10);
    el.classList.add(n === q.answer ? 'right' : 'dim');
  });
  var w = qText(q, 'why');
  $('q-after').innerHTML = w ? '<div class="why">' + esc(w) + '</div>' : '';
  $('q-bar').innerHTML = '<span class="qnum" style="width:100%">' + (ta() ? 'எத்தனை பேர் சரியாகச் சொன்னார்கள்?' : 'How many children got it right?') + '</span>'
    + '<button class="qbtn r3" data-r="3">' + (ta() ? 'பெரும்பாலோர்' : 'Most') + '</button>'
    + '<button class="qbtn r2" data-r="2">' + (ta() ? 'பாதி பேர்' : 'About half') + '</button>'
    + '<button class="qbtn r1" data-r="1">' + (ta() ? 'சிலர் மட்டும்' : 'Only a few') + '</button>';
  $('q-bar').querySelectorAll('button').forEach(function(bt){
    bt.onclick = function(){ rateQuestion(parseInt(bt.getAttribute('data-r'), 10)); };
  });
  // answer cards: show how many chose each letter and suggest the rating from the real numbers
  var cards = LIVE.answers || {}, nums = Object.keys(cards);
  if(nums.length){
    var per = { A:0, B:0, C:0, D:0 };
    nums.forEach(function(k){ per[cards[k]] = (per[cards[k]] || 0) + 1; });
    document.querySelectorAll('#st-body .opt').forEach(function(el){
      var L = 'ABC'.charAt(parseInt(el.getAttribute('data-n'), 10));
      var c = document.createElement('span'); c.className = 'cnt'; c.textContent = per[L]; el.appendChild(c);
    });
    var right = per['ABC'.charAt(q.answer)], pct = Math.round(100 * right / nums.length);
    var sug = pct >= 70 ? 3 : (pct >= 40 ? 2 : 1);
    var sb = $('q-bar').querySelector('[data-r="' + sug + '"]'); if(sb) sb.classList.add('sug');
    var info = document.createElement('div'); info.className = 'live';
    info.textContent = (ta() ? 'அட்டைகள்: ' : 'Cards: ') + right + (ta() ? ' / ' : ' of ') + nums.length
                     + (ta() ? ' சரி (' : ' right (') + pct + '%)';
    $('q-bar').appendChild(info);
  }
  speakAsync(w, ta() ? 'tamil' : 'english');
}

function rateQuestion(r){
  var q = CHECK.questions[QUIZ.i];
  var rec = { q: q.q, a: q.options[q.answer], rating: r };
  if(Object.keys(LIVE.answers || {}).length){ rec.correct = 'ABC'.charAt(q.answer); rec.cards = LIVE.answers; }
  QUIZ.results.push(rec);
  LIVE.answers = {};
  stopAudio();
  if(QUIZ.i < CHECK.questions.length - 1){ QUIZ.i++; showQuestion(); }
  else showSummary();
}

function mySchoolId(){
  try {

    return role === 'teacher' ? (u.school_id || (u.schools && u.schools.id) || '') : (u.school_id || u.id || '');

}

async function showSummary(){

    + '<div id="card-scores">' + cardScoresHtml(res) + '</div>'

  try {

                             planKey: 'mystery-' + topicKey(), school_id: mySchoolId(), results: res }) });
    var d = await r.json();
    $('q-saved').textContent = (d && d.saved) ? '✅ Saved to Class Insights' : ('⚠ Not saved: ' + ((d && d.error) || 'server problem'));
  } catch(e){ $('q-saved').textContent = '⚠ Not saved: ' + e.message; }
}

// Each card's score across the check, e.g. "7: 4/5". Low scores are marked so
// the facilitator knows which children to sit with tomorrow.
function cardScoresHtml(res, names, why){
  names = names || {};
  var sc = {};
  res.forEach(function(x){
    if(!x.cards) return;
    for(var k in x.cards){ sc[k] = sc[k] || { r:0, n:0 }; sc[k].n++; if(x.cards[k] === x.correct) sc[k].r++; }
  });
  var ks = Object.keys(sc).map(Number).sort(function(a, b){ return a - b; });
  if(!ks.length) return '';
  var named = Object.keys(names).length > 0;
  var low = ks.filter(function(k){ return sc[k].r / sc[k].n < 0.5; });
  return '<h4 style="margin-top:1rem">' + (named ? (ta() ? 'மாணவர் மதிப்பெண்கள்' : 'Each child') : (ta() ? 'அட்டை மதிப்பெண்கள்' : 'Card scores')) + '</h4><div class="cardgrid">'
    + ks.map(function(k){ var v = sc[k], who = names[String(k)];
        var label = named ? ('<small>' + k + '</small>' + esc(who || ((ta() ? 'அட்டை ' : 'Card ') + k))) : String(k);
        return '<span class="' + (v.r / v.n < 0.5 ? 'low' : '') + '">' + label + ': ' + v.r + '/' + v.n + '</span>'; }).join('')
    + '</div>'
    + (named && low.length ? '<div class="note">' + (ta() ? 'நாளை உடன் அமர வேண்டியவர்கள்: ' : 'Sit with tomorrow: ')
        + low.map(function(k){ return esc(names[String(k)] || ((ta() ? 'அட்டை ' : 'Card ') + k)); }).join(', ') + '</div>' : '')
    + (!named && why ? '<div class="note">' + esc(why) + '</div>' : '');
}

async function sendHomework(){
  var btn = $('hw-send'), note = $('hw-note');
  var text = $('hw-text').value.trim();
  if(!text){ note.textContent = 'Write the homework first.'; return; }
  var school = mySchoolId();
  if(!school){ note.textContent = '⚠ No school found for this login, so the diary cannot be updated. Log in as a teacher or school admin.'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    var r = await fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'save_diary_entry', school_id: school, class_name: CLS, subject: subjectFor(CLS),
        lesson_title: CHAPTER.chapter_title, lesson_date: new Date().toISOString().split('T')[0], homework: text }) });
    var d = await r.json();
    if(d && d.error) throw new Error(d.error);
    btn.textContent = '✅ Sent to Student Diary';
    note.textContent = 'Parents and students can see it in the diary.';
  } catch(e){
    btn.disabled = false; btn.textContent = 'Send to Student Diary';
    note.textContent = '⚠ Could not send: ' + (e.message || e);
  }
}

function markTrail(k){
  var dots = $('trail').children;
  for(var n = 0; n < dots.length; n++) dots[n].className = 'dot' + (n === k ? ' now' : (n < k ? ' done' : ''));
}

/* ════════ SUPER ADMIN FIXES ════════ */
// The step whose video this step shows (the return step reuses the hook's clip).
function videoOwner(i){
  var s = STEPS[i]; if(!s) return null;
  if(s.video) return s;
  if(s.type === 'return' && hookStep() && hookStep().video) return hookStep();
  return null;
}

async function fixVideo(){
  var owner = videoOwner(IDX); if(!owner) return;
  var txt = window.prompt('Change the video description, then press OK. '
    + 'A new clip is made (about 3 Kling units) and saved for every school.', owner.video);
  if(txt === null) return;
  txt = txt.trim();
  if(txt.length < 20 || txt === owner.video){ alert('Nothing changed, so no new video was made.'); return; }
  owner.video = txt;
  var why = await replaceLesson(STEPS);
  if(why){ alert('The new description could not be saved: ' + why); return; }
  VIDS[txt] = null;
  showVideoStatus();
  var m = document.querySelector('#st-body .media'); if(m) fillMedia(m, STEPS[IDX]);
  kickVideos();
}

async function redoLesson(){
  if(!confirm('Write this whole lesson again? Every school will get the new version. '
    + 'Its videos are made again too (about 3 Kling units each).')) return;
  SEQ++; setPlaying(false); stopAudio();
  $('loading').classList.add('show');
  $('loading-msg').textContent = 'Writing the lesson again…';
  $('loading-sub').textContent = '';
  var fresh = null;
  try { fresh = await buildLesson(); }
  catch(e){ $('loading').classList.remove('show'); alert('Could not write the lesson: ' + (e.message || e)); return; }
  var why = await replaceLesson(fresh);
  $('loading').classList.remove('show');
  if(why){ alert('The new lesson could not be saved: ' + why); return; }
  LESSON_ID++; VIDS = {}; TA = null; CHECK = null; QUIZ = null; STEPS = fresh;
  buildTrail(); kickVideos();
  IDX = 0; setPlaying(true); runStep(0);
}

/* ════════ START ════════ */
async function startClass(){
  LESSON_ID++; VIDS = {}; TA = null; CHECK = null; QUIZ = null; liveStop(); LIVE.code = '';
  $('setup').classList.add('hidden');
  $('room').classList.add('show');
  $('hdr-meta').textContent = CLS + ', chapter ' + (CHAPTER.chapter_number || '') + ': ' + CHAPTER.chapter_title;
  $('btn-lang').textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');
  $('loading').classList.add('show');
  $('loading-msg').textContent = 'Getting the class ready…';
  $('loading-sub').textContent = '';

  await loadChapterText();
  STEPS = await getSavedLesson();
  if(!STEPS){
    $('loading-sub').textContent = 'Preparing this chapter for the first time. It is saved for every class and every school, '
      + 'so this wait happens only once. Videos are made in the background and appear during the class.';
    try { STEPS = await buildLesson(); saveLesson(STEPS); }
    catch(e){
      STEPS = [{ type:'explain', title:'Could not prepare this lesson', board:['Reason: ' + String(e.message || e).substring(0,140), 'Press Replay to try again.'],
        say_en:'Sorry, I could not prepare this lesson just now.', say_ta:'', video:'', photo:'', options:[], answer:-1,
        materials:[], doing:[], minutes:0, safety:'', model:null }];
    }
  }
  if(LANG !== 'english' && STEPS.length > 1){
    $('loading-msg').textContent = 'Getting the Tamil lesson ready…';
    $('loading-sub').textContent = 'The first time only, the Tamil version is written and saved for every school.';
    var why = await ensureTamil();
    if(why) alert('Tamil could not be prepared, so this class will run in English. Reason: ' + why);
  }
  $('loading').classList.remove('show');
  buildTrail();
  kickVideos();
  if(STEPS.length > 1) ensureCheck();
  IDX = 0; setPlaying(true); runStep(0);
}

/* ════════ WIRING ════════ */
document.addEventListener('DOMContentLoaded', function(){
  $('sel-class').addEventListener('change', function(){
    CLS = this.value;
    if(CLS) loadChapters(CLS);
    else { $('chap-box').innerHTML = '<div class="muted">Select a class to see its chapters.</div>'; $('btn-start').disabled = true; }
  });
  function pick(el){
    $('chap-box').querySelectorAll('.chap').forEach(function(x){ x.classList.remove('on'); });
    el.classList.add('on');
    CHAPTER = CHAPTERS[parseInt(el.getAttribute('data-i'), 10)] || null;
    $('btn-start').disabled = !CHAPTER;
  }
  $('chap-box').addEventListener('click', function(e){ var el = e.target.closest('.chap'); if(el) pick(el); });
  $('chap-box').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ var el = e.target.closest('.chap'); if(el) pick(el); } });
  $('lang-row').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); LANG = c.getAttribute('data-lang');
  });
  $('btn-start').onclick = function(){ if(CLS && CHAPTER) startClass(); };
  $('btn-play').onclick = playPause;
  $('btn-next').onclick = goNext;
  $('btn-prev').onclick = goPrev;
  $('btn-replay').onclick = replay;
  $('btn-fixvid').onclick = fixVideo;
  $('btn-redo').onclick = redoLesson;
  $('trail').addEventListener('click', function(e){
    var d = e.target.closest('.dot'); if(!d) return;
    stopAudio();
    if(d.getAttribute('data-i') === 'check'){ startCheck(); return; }
    QUIZ = null; runStep(parseInt(d.getAttribute('data-i'), 10));
  });
  $('btn-voice').onclick = function(){
    VOICE_ON = !VOICE_ON; this.textContent = VOICE_ON ? '🔊 Voice' : '🔇 Muted';
    if(!VOICE_ON) stopAudio();
  };
  $('btn-lang').onclick = async function(){
    var btn = this;
    LANG = LANG === 'english' ? 'tamil' : (LANG === 'tamil' ? 'both' : 'english');
    btn.textContent = LANG === 'tamil' ? 'TA' : (LANG === 'both' ? 'EN+TA' : 'EN');
    if(!$('room').classList.contains('show')) return;
    SEQ++; stopAudio();
    if(LANG !== 'english' && !TA){
      $('loading').classList.add('show');
      $('loading-msg').textContent = 'Getting the Tamil lesson ready…';
      $('loading-sub').textContent = 'The first time only, the Tamil version is written and saved for every school.';
      var why = await ensureTamil();
      $('loading').classList.remove('show');
      if(why) alert('Tamil could not be prepared: ' + why);
    }
    runStep(IDX);
  };
  $('btn-new').onclick = function(){
    SEQ++; LESSON_ID++; setPlaying(false); stopAudio(); clearInterval(TMR);
    $('room').classList.remove('show'); $('setup').classList.remove('hidden');
  };
  $('btn-back').onclick = function(){
    var url = null; try { url = sessionStorage.getItem('smy_returnUrl'); } catch(e){}
    if(url){ window.location.href = url; return; }
    if(window.history.length > 1) window.history.back(); else window.location.href = '/learnbot.html';
  };
  // projector clicker / keyboard
  document.addEventListener('keydown', function(e){
    if(!$('room').classList.contains('show')) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); goNext(); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); goPrev(); }
    else if(e.key === ' '){ e.preventDefault(); playPause(); }
  });
  autostart();
});

/* Opened from LearnBot later: pre-select class and language */
function autostart(){
  var raw = null; try { raw = sessionStorage.getItem('smy_autostart'); sessionStorage.removeItem('smy_autostart'); } catch(e){ return; }
  if(!raw) return;
  var d; try { d = JSON.parse(raw); } catch(e){ return; }
  if(d.lang === 'tamil' || d.lang === 'both'){
    LANG = d.lang;
    $('lang-row').querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-lang') === LANG); });
  }
  if(d.cls){
    var sel = $('sel-class');
    for(var i = 0; i < sel.options.length; i++){
      if(sel.options[i].value === d.cls || sel.options[i].text === d.cls){ sel.selectedIndex = i; CLS = d.cls; loadChapters(CLS); break; }
    }
  }
}
</script>
