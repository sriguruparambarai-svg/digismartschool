/* -- CAUSES STEP (second pass) --
   The main plan prompt has to balance twenty rules at once, and the causes step
   consistently lost that competition. Asked on its own, with nothing else
   competing for attention, it comes back reliably. Runs only when the main plan
   arrived without a causes step, so most lessons cost nothing extra. */
async function scCausesStep(){
  var sys = 'You read one school lesson and work out WHY the main event or change happened.\n' +
    'Return ONLY a JSON object. No prose, no markdown, no code fences.\n' +
    '{"type":"causes","title":"short heading","speech":"2 to 3 sentences a teacher would say aloud",' +
    '"longTerm":["short cause","short cause"],' +
    '"trigger":{"name":"the single event that finally set it off","detail":"one short line"},' +
    '"result":"what followed, one short line"}\n' +
    'RULES:\n' +
    '- "longTerm" is 2 to 5 pressures that built up over years. Each under 12 words.\n' +
    '- "trigger" is the ONE event that set it off, not a slow cause.\n' +
    '- Take everything ONLY from the lesson text below. Never add causes from your own knowledge.\n' +
    '- If the lesson explains no cause at all, return exactly {"none":true}';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 700,
      messages:[{ role:'user', content:'LESSON TEXT:\n\n' + LESSON.text.substring(0, 45000) }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return null;
  var t = String(raw).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s === -1 || e <= s) return null;
  var obj;
  try{ obj = JSON.parse(t.substring(s, e + 1)); }catch(err){ return null; }
  if (!obj || obj.none) return null;
  obj.type = 'causes';
  var step = scNormaliseStep(obj);
  return (step && step.type === 'causes') ? step : null;
}

/* Causes belong before the consequences, not after them. */
function scCausesIndex(){
  var after = /outcome|aftermath|result|consequence|treaty|effect|end of the|after the war|peace/i;
  for (var i = 1; i < STEPS.length; i++){
    if (after.test(STEPS[i].title || '')) return i;
  }
  return Math.min(Math.max(2, Math.round(STEPS.length * 0.45)), STEPS.length);
}


/* -- MID-LESSON RECALL (second pass) --
   Pulling a fact back out of memory fixes it far better than seeing it again,
   and it works best spread through the lesson rather than saved for the end.
   Built after the plan exists so each question can be tied to a step the class
   has already been taught, never to one still ahead of them. */
async function scRecallSteps(){
  var material = STEPS.map(function(s, i){
    return (i + 1) + '. ' + (s.title || '') + ' \u2014 ' + (s.speech || '').substring(0, 240);
  }).join('\n').substring(0, 7000);
  var sys = 'You add short recall checks to a lesson that has already been planned.\n' +
    'Return ONLY a JSON array. No prose, no markdown, no code fences.\n' +
    '[{"afterTitle":"exact title of the step this follows","question":"...","answer":"..."}]\n' +
    'RULES:\n' +
    '- Exactly 2 or 3 items, spread across the lesson, never two in a row.\n' +
    '- "afterTitle" must be copied EXACTLY from one of the numbered step titles below.\n' +
    '- Never use the first step, and never the last two steps.\n' +
    '- The question must be answerable from a step at or BEFORE that title. Never ask about something later.\n' +
    '- Answers must be short enough to call out in chorus: a name, a year, a word, a short phrase.\n' +
    '- Question under 110 characters. Answer under 60 characters.';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 600,
      messages:[{ role:'user', content:'LESSON STEPS:\n' + material }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return [];
  var t = String(raw).trim().replace(/```json|```/g,'').trim();
  var s = t.indexOf('['), e = t.lastIndexOf(']');
  if (s === -1 || e <= s) return [];
  var arr;
  try{ arr = JSON.parse(t.substring(s, e + 1)); }catch(err){ return []; }
  return Array.isArray(arr) ? arr.slice(0, 3) : [];
}

/* Insert from the back so earlier positions stay valid as the list grows. */
function scInsertRecall(items){
  var placed = [];
  items.forEach(function(it){
    if (!it || !it.afterTitle || !it.question || !it.answer) return;
    var want = String(it.afterTitle).trim().toLowerCase();
    for (var i = 0; i < STEPS.length; i++){
      if ((STEPS[i].title || '').trim().toLowerCase() === want){
        // Never at the very start, and never so late it becomes the end quiz.
        if (i >= 1 && i <= STEPS.length - 2) placed.push({ at: i + 1, item: it });
        break;
      }
    }
  });
  placed.sort(function(a, b){ return b.at - a.at; });
  var last = -99;
  placed = placed.filter(function(p){
    if (Math.abs(p.at - last) < 2) return false;   // never two checks back to back
    last = p.at; return true;
  });
  placed.forEach(function(p){
    var step = scNormaliseStep({ type:'recall', title:'Quick check',
      speech: p.item.question, question: p.item.question, answer: p.item.answer });
    if (step && step.type === 'recall') STEPS.splice(p.at, 0, step);
  });
  return placed.length;
}


/* -- MAP STEP (second pass) --
   Asked for inside the main plan prompt the map lost out to photo steps every
   time, the same way the causes step did. Asked on its own it comes back.
   Uses the finished step list rather than the whole lesson, so it costs far
   less than a full re-read. Runs only when the plan has no map already. */
async function scMapStep(){
  var material = STEPS.map(function(s, i){
    return (i + 1) + '. ' + (s.title || '') + ' \u2014 ' + (s.speech || '').substring(0, 200);
  }).join('\n').substring(0, 6000);
  var sys = 'You add ONE map step to a lesson that has already been planned.\n' +
    'Return ONLY a JSON object. No prose, no markdown, no code fences.\n' +
    '{"afterTitle":"exact title of the step this follows","title":"short heading",' +
    '"speech":"2 to 3 sentences a teacher would say","regions":["key"],' +
    '"markers":[{"name":"Berlin","lat":52.52,"lng":13.40,"group":"optional side name"}]}\n' +
    'RULES:\n' +
    '- "afterTitle" must be copied EXACTLY from one of the numbered titles below.\n' +
    '- "regions" may ONLY use these keys, 0 to 3 of them: ' + Object.keys(SC_REGIONS).join(', ') + '.\n' +
    '  triple_alliance, triple_entente, balkans_1914 and ottoman_empire_1914 are Europe in 1914.\n' +
    '  Use triple_alliance together with triple_entente to show the two sides of the First World War.\n' +
    '- "markers" are 0 to 6 real places with TRUE latitude and longitude, anywhere on Earth.\n' +
    '  Give markers a "group" when the lesson splits them into sides.\n' +
    '- Place the map where the lesson first deals with those places, never as the last step.\n' +
    '- If this lesson has nothing to put on a map, return exactly {"none":true}';
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: sys, max_tokens: 700,
      messages:[{ role:'user', content:'LESSON STEPS:\n' + material }] })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw) return null;
  var t = String(raw).trim().replace(/```json|```/g,'').trim();
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s === -1 || e <= s) return null;
  var obj;
  try{ obj = JSON.parse(t.substring(s, e + 1)); }catch(err){ return null; }
  if (!obj || obj.none) return null;
  obj.type = 'map';
  var step = scNormaliseStep(obj);
  // scNormaliseStep drops it to a concept card when no region or marker
  // survived, and a concept card is not worth an extra call.
  if (!step || step.type !== 'map') return null;
  step._afterTitle = String(obj.afterTitle || '');
  return step;
}

function scInsertMap(step){
  if (!step) return false;
  var want = String(step._afterTitle || '').trim().toLowerCase();
  delete step._afterTitle;
  var at = -1;
  for (var i = 0; i < STEPS.length; i++){
    if ((STEPS[i].title || '').trim().toLowerCase() === want){ at = i + 1; break; }
  }
  if (at < 1 || at > STEPS.length - 1) at = Math.min(Math.max(2, Math.round(STEPS.length * 0.3)), STEPS.length - 1);
  // Never right beside a recall step - a pause then a map then a pause reads as
  // stop-start. Step forward until both neighbours are ordinary steps.
  var guard = 0;
  while (guard++ < 4 &&
         ((STEPS[at] && STEPS[at].type === 'recall') ||
          (STEPS[at - 1] && STEPS[at - 1].type === 'recall'))){
    at = at + 1;
  }
  if (at > STEPS.length - 1) at = STEPS.length - 1;
  if (at < 1) at = 1;
  STEPS.splice(at, 0, step);
  return true;
}

      if (d && Array.isArray(d.steps) && d.steps.length){

  var steps = await scGeneratePlanFresh();

          meta: { subject: LESSON.subject, cls: LESSON.cls, topic: LESSON.topic } })
      });
    }catch(e){}
  }
  return steps;
}

        '(a name, a year, a word, a short phrase \u2014 never long sentences). Cover different parts of the lesson. ' +
        'Reply ONLY with JSON: [{"q":"question","a":"short answer"}] \u2014 exactly 5 items, nothing else.',
      messages:[{ role:'user', content:'LESSON CONTENT:\n' + material }],
      max_tokens: 800
    })
  });
  var d2 = await res.json();
  var raw = '';
  if (d2 && Array.isArray(d2.content)) raw = d2.content.map(function(b){ return b.type === 'text' ? b.text : ''; }).join('');
  raw = raw.replace(/```json|```/g, '').trim();
  var s = raw.indexOf('['), e = raw.lastIndexOf(']');
  if (s === -1 || e <= s) throw new Error('quiz could not be generated \u2014 try again');
  var arr = JSON.parse(raw.substring(s, e + 1));
  QUIZ_QS = arr.slice(0, 5).map(function(x){
    return { q: String((x && x.q) || '').substring(0, 220), a: String((x && x.a) || '').substring(0, 220) };
  }).filter(function(x){ return x.q && x.a; });
  if (QUIZ_QS.length === 0) throw new Error('quiz empty \u2014 try again');
  if (key){
    try{
      fetch('/api/lesson-plan', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key: key, steps: QUIZ_QS, meta:{ kind:'class-quiz', topic: LESSON.topic } }) });
    }catch(e2){}
  }
  return QUIZ_QS;
}

async function scStartQuiz(){
  scQuizStyles();
  scStopAudio(); clearTimeout(scAdvanceTimer);
  var inner = document.getElementById('stage-inner');
  inner.innerHTML = '<div class="qz-wrap"><div class="sc-spin" style="margin:0 auto 14px;"></div>' +
                    '<div style="color:var(--sandal);">Preparing today\u2019s class quiz\u2026</div></div>';
  try{
    await scGetQuiz();
  }catch(e){
    inner.innerHTML = '<div class="qz-wrap"><div style="color:#ffb0a5;">' + e.message + '</div>' +
      '<button class="sc-done-btn ghost" style="margin-top:16px;" onclick="scShowComplete()">\u2190 Back</button></div>';
    return;
  }
  QUIZ_IDX = 0; QUIZ_RESULTS = [];
  scShowQuizQ();
}

function scShowQuizQ(){
  var inner = document.getElementById('stage-inner');
  var item = QUIZ_QS[QUIZ_IDX];
  document.getElementById('narr-text').textContent = '\uD83C\uDFAF Class quiz \u2014 read the question aloud, class answers together.';
  inner.innerHTML =
    '<div class="qz-wrap">' +
      '<div class="qz-prog">CLASS QUIZ \u00B7 QUESTION ' + (QUIZ_IDX + 1) + ' OF ' + QUIZ_QS.length + '</div>' +
      '<div class="qz-q"></div>' +
      '<div class="qz-chorus">\uD83D\uDDE3 Everyone answer together!</div>' +
      '<button class="qz-show" onclick="scQuizReveal()">\uD83D\uDC41 Show Answer</button>' +
      '<div class="qz-ans" id="qz-ans"></div>' +
      '<div class="qz-rate" id="qz-rate">' +
        '<button class="qz-r3" onclick="scQuizRate(3)">\uD83D\uDE03 Most got it</button>' +
        '<button class="qz-r2" onclick="scQuizRate(2)">\uD83D\uDE10 About half</button>' +
        '<button class="qz-r1" onclick="scQuizRate(1)">\uD83D\uDE1F Only a few</button>' +
      '</div>' +
    '</div>';
  inner.querySelector('.qz-q').textContent = item.q;
  document.getElementById('qz-ans').textContent = '\u2705 ' + item.a;
  scSpeak(item.q);
}

function scQuizReveal(){
  clearTimeout(scAdvanceTimer);
  document.getElementById('qz-ans').classList.add('on');
  document.getElementById('qz-rate').classList.add('on');
}

function scQuizRate(r){
  var item = QUIZ_QS[QUIZ_IDX];
  QUIZ_RESULTS.push({ q: item.q, a: item.a, rating: r });
  QUIZ_IDX++;
  if (QUIZ_IDX < QUIZ_QS.length) scShowQuizQ();
  else scQuizFinish();
}

async function scQuizFinish(){
  scStopAudio(); clearTimeout(scAdvanceTimer);
  var inner = document.getElementById('stage-inner');
  var rows = QUIZ_RESULTS.map(function(r){
    var cls = r.rating === 3 ? 'g' : r.rating === 2 ? 'a' : 'm';
    var ico = r.rating === 3 ? '\uD83D\uDE03' : r.rating === 2 ? '\uD83D\uDE10' : '\uD83D\uDE1F';
    return '<div class="qz-row ' + cls + '"><span>' + ico + '</span><span></span></div>';
  }).join('');
  inner.innerHTML =
    '<div class="qz-wrap"><div class="qz-prog">CLASS QUIZ \u00B7 RESULT</div>' +
    '<div class="qz-sum">' + rows + '</div>' +
    '<div id="qz-save" style="margin:14px 0;color:var(--sandal);font-size:0.82rem;">\u23F3 Saving to Class Insights\u2026</div>' +
    '<button class="sc-done-btn ghost" onclick="scShowComplete()">\u2190 Done</button></div>';
  var spans = inner.querySelectorAll('.qz-row span:last-child');
  for (var i = 0; i < spans.length; i++) spans[i].textContent = QUIZ_RESULTS[i].q;
  document.getElementById('narr-text').textContent = '\uD83C\uDFAF Quiz complete \u2014 well done, class!';
  try{
    var key = await scQuizKey();
    var r = await fetch('/api/class-quiz', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ cls: LESSON.cls, subject: LESSON.subject, topic: LESSON.topic,
                             planKey: key, results: QUIZ_RESULTS })
    });
    var d = await r.json();
    document.getElementById('qz-save').textContent = (d && d.saved)
      ? '\u2705 Saved to Class Insights.'
      : '\u26A0 Could not save (' + ((d && d.error) || 'server') + ') \u2014 the class still benefited!';
  }catch(e){
    var el = document.getElementById('qz-save');
    if (el) el.textContent = '\u26A0 Could not save \u2014 ' + e.message;
  }
}

document.addEventListener('DOMContentLoaded', scInit);
</script>
</body>
