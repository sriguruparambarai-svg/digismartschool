<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Science Class — DigiSmartSchool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#6B1A1A; --maroon-dark:#4a1010; --gold:#C9A84C; --gold-light:#FFD86A;
  --sandal:#E8C99A; --stage-bg:#0d0f14; --text-light:#f5efe2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#120a08,#1a0d0a 60%,#120a08);color:var(--text-light);font-family:'Nunito',sans-serif;overflow:hidden;height:100vh;}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;height:58px;background:linear-gradient(180deg,rgba(20,8,6,0.97),rgba(20,8,6,0.9));border-bottom:1.5px solid rgba(201,168,76,0.35);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:100;}
#topbar .back-btn{background:rgba(201,168,76,0.12);border:1.5px solid rgba(201,168,76,0.4);color:var(--sandal);padding:7px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.8rem;}
#topbar .cls-pill{background:var(--maroon);color:var(--gold-light);border:1.5px solid var(--gold);padding:5px 12px;border-radius:999px;font-weight:800;font-size:0.78rem;}
#topbar .topic{font-family:'Caveat',cursive;font-size:1.25rem;color:var(--sandal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.ctrl-btn{background:rgba(201,168,76,0.12);border:1.5px solid rgba(201,168,76,0.4);color:var(--sandal);padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;font-size:0.8rem;white-space:nowrap;}
.ctrl-btn.active{background:var(--gold);color:#2a1505;}
.ctrl-btn:disabled{opacity:0.5;cursor:wait;}
#speed-sel{background:#241410;color:var(--sandal);border:1.5px solid rgba(201,168,76,0.4);border-radius:9px;padding:7px 8px;font-family:inherit;font-weight:700;font-size:0.8rem;}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:58px;left:0;bottom:52px;width:238px;background:rgba(15,7,5,0.92);border-right:1.5px solid rgba(201,168,76,0.25);overflow-y:auto;padding:14px 10px;z-index:90;}
#sidebar h3{font-size:0.68rem;letter-spacing:2px;color:var(--gold);margin:0 6px 10px;font-weight:800;}
.step-item{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:0.78rem;line-height:1.35;color:rgba(232,201,154,0.75);border:1.5px solid transparent;}
.step-item:hover{background:rgba(201,168,76,0.08);}
.step-item.current{background:rgba(107,26,26,0.55);border-color:var(--gold);color:var(--gold-light);font-weight:700;}
.step-item .ico{flex:0 0 auto;}
#sidebar::-webkit-scrollbar{width:5px;}
#sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.35);border-radius:3px;}

/* ── STAGE ── */
#stage{position:fixed;top:58px;left:238px;right:0;bottom:52px;background:var(--stage-bg);overflow:hidden;}
#stage-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 220px 26px 40px;}

/* Title step */
.sc-title-wrap{text-align:center;max-width:900px;animation:scFadeUp 1s ease both;}
.sc-title-wrap h1{font-family:'Cinzel',serif;font-size:clamp(1.7rem,3.6vw,3rem);color:var(--gold-light);line-height:1.25;margin-bottom:18px;text-shadow:0 3px 18px rgba(0,0,0,0.6);}
.sc-title-line{width:60%;max-width:420px;height:3px;margin:0 auto 20px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px;animation:scLineGrow 1.2s ease both 0.3s;}
.sc-title-wrap p{font-size:clamp(0.95rem,1.6vw,1.15rem);color:var(--sandal);line-height:1.7;opacity:0.9;}

/* Photo step — documentary frame with Ken Burns */
.sc-photo-frame{position:relative;width:100%;height:100%;max-width:1080px;max-height:100%;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,0.65);border:1.5px solid rgba(201,168,76,0.35);background:#000;animation:scFadeUp 0.8s ease both;}
.sc-photo-frame img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;}
.kb1{animation:kbA 22s ease-in-out both;} .kb2{animation:kbB 22s ease-in-out both;}
.kb3{animation:kbC 22s ease-in-out both;} .kb4{animation:kbD 22s ease-in-out both;}
@keyframes kbA{from{transform:scale(1) translate(0,0);}to{transform:scale(1.14) translate(-2.5%,-2%);}}
@keyframes kbB{from{transform:scale(1.14) translate(2%,1.5%);}to{transform:scale(1) translate(0,0);}}
@keyframes kbC{from{transform:scale(1) translate(0,0);}to{transform:scale(1.14) translate(2.5%,-2%);}}
@keyframes kbD{from{transform:scale(1.12) translate(-2%,2%);}to{transform:scale(1.02) translate(1%,-1%);}}
.sc-photo-cap{position:absolute;left:0;right:0;bottom:0;padding:34px 22px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.85));}
.sc-photo-cap .cap-title{font-family:'Cinzel',serif;font-size:clamp(1rem,1.9vw,1.45rem);color:var(--gold-light);margin-bottom:4px;}
.sc-photo-cap .cap-text{font-size:0.85rem;color:rgba(245,239,226,0.9);line-height:1.5;}
.sc-photo-cap .cap-src{font-size:0.62rem;color:rgba(232,201,154,0.55);margin-top:5px;letter-spacing:0.5px;}
.sc-photo-loading{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--sandal);}
.sc-spin{width:38px;height:38px;border:3px solid rgba(201,168,76,0.25);border-top-color:var(--gold);border-radius:50%;animation:scSpin 0.9s linear infinite;}

/* ── 3D MODEL STEP (Phase 5) — real Sketchfab models children can turn ── */
.sc-mdl-frame{position:relative;width:100%;height:100%;max-width:1080px;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,0.65);border:1.5px solid rgba(201,168,76,0.35);background:radial-gradient(ellipse at 50% 40%,#141824,#07090f 70%);animation:scFadeUp 0.8s ease both;}
.sc-mdl-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.sc-mdl-cap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:26px 20px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.85));pointer-events:none;}
.sc-mdl-cap .t{font-family:'Cinzel',serif;font-size:clamp(1rem,1.9vw,1.4rem);color:var(--gold-light);}
.sc-mdl-cap .s{font-size:0.62rem;color:rgba(232,201,154,0.55);margin-top:4px;letter-spacing:0.5px;}
.sc-mdl-hint{position:absolute;right:14px;top:12px;z-index:5;font-size:0.66rem;color:rgba(232,201,154,0.6);pointer-events:none;background:rgba(0,0,0,0.45);padding:4px 10px;border-radius:8px;}
@keyframes scSpin{to{transform:rotate(360deg);}}

/* Timeline step */
.sc-tl-wrap{width:100%;max-width:1040px;animation:scFadeUp 0.8s ease both;}
.sc-tl-wrap h2{font-family:'Cinzel',serif;font-size:clamp(1.2rem,2.4vw,1.9rem);color:var(--gold-light);text-align:center;margin-bottom:34px;}
.sc-tl-track{position:relative;padding:0 10px;}
.sc-tl-line{position:absolute;left:2%;right:2%;top:50%;height:3px;background:linear-gradient(90deg,rgba(201,168,76,0.2),var(--gold),rgba(201,168,76,0.2));border-radius:2px;transform:scaleX(0);transform-origin:left;animation:scLineX 1.4s ease forwards 0.2s;}
.sc-tl-items{position:relative;display:flex;justify-content:space-between;gap:8px;}
.sc-tl-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;animation:scFadeUp 0.6s ease forwards;}
.sc-tl-item:nth-child(odd){flex-direction:column;} 
.sc-tl-item .dot{width:15px;height:15px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 14px rgba(255,216,106,0.8);margin:12px 0;}
.sc-tl-item .yr{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(0.85rem,1.5vw,1.15rem);color:var(--gold-light);}
.sc-tl-item .lbl{font-size:clamp(0.68rem,1.1vw,0.85rem);color:var(--sandal);line-height:1.4;max-width:150px;}
@keyframes scLineX{to{transform:scaleX(1);}}

/* Concept step — modern flat cards */
.sc-con-wrap{width:100%;max-width:960px;animation:scFadeUp 0.8s ease both;}
.sc-con-wrap h2{font-family:'Cinzel',serif;font-size:clamp(1.2rem,2.4vw,1.9rem);color:var(--gold-light);text-align:center;margin-bottom:28px;}
.sc-con-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.sc-con-card{background:linear-gradient(160deg,rgba(107,26,26,0.35),rgba(30,12,8,0.6));border:1.5px solid rgba(201,168,76,0.4);border-radius:14px;padding:20px 18px;font-size:clamp(0.85rem,1.3vw,1rem);line-height:1.6;color:var(--text-light);opacity:0;animation:scFadeUp 0.55s ease forwards;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
.sc-con-card .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2a1505;font-weight:800;align-items:center;justify-content:center;font-size:0.8rem;margin-bottom:10px;}
@keyframes scFadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@keyframes scLineGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}

/* Diagram step - labelled science model shown in real 3D motion (kid-friendly) */
.sc-dia-wrap{width:100%;max-width:900px;text-align:center;animation:scFadeUp 0.7s ease both;}
.sc-dia-wrap h2{font-family:'Cinzel',serif;font-size:clamp(1.2rem,2.4vw,1.9rem);color:var(--gold-light);margin-bottom:14px;}
.sc-dia-stage{perspective:1100px;display:flex;justify-content:center;align-items:center;padding:8px 0 6px;}
.sc-dia-card{position:relative;transform-style:preserve-3d;border-radius:22px;padding:26px 30px;background:radial-gradient(ellipse at 50% 30%,rgba(107,26,26,0.45),rgba(20,10,8,0.72));border:2px solid rgba(201,168,76,0.55);box-shadow:0 26px 70px rgba(0,0,0,0.6),0 0 42px rgba(201,168,76,0.16);opacity:0;animation:scDiaIn 0.6s ease forwards,scDiaFloat 6.5s ease-in-out infinite;}
.sc-dia-card::before{content:'';position:absolute;inset:-32% -22%;z-index:-1;border-radius:50%;background:conic-gradient(from 0deg,rgba(201,168,76,0),rgba(255,216,106,0.22),rgba(107,26,26,0),rgba(232,201,154,0.20),rgba(201,168,76,0));filter:blur(24px);animation:scDiaHalo 16s linear infinite;}
.sc-dia-img{display:block;width:min(56vh,520px);max-width:100%;height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,0.55));}
.sc-dia-cap{margin:16px auto 0;max-width:700px;font-size:clamp(0.9rem,1.5vw,1.12rem);color:var(--sandal);line-height:1.6;}
@keyframes scDiaIn{to{opacity:1;}}
@keyframes scDiaFloat{0%,100%{transform:translateY(0) rotateY(-13deg) rotateX(4deg);}50%{transform:translateY(-10px) rotateY(13deg) rotateX(-3deg);}}
@keyframes scDiaHalo{to{transform:rotate(360deg);}}

/* ── TEACHER ── */
#sc-teacher{position:fixed;right:14px;bottom:110px;width:172px;height:auto;z-index:95;cursor:pointer;filter:drop-shadow(0 5px 14px rgba(0,0,0,0.55));animation:scBob 4.5s ease-in-out infinite;transition:opacity 0.4s;}
#sc-teacher.hidden{opacity:0;pointer-events:none;}
@keyframes scBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

/* ── NARRATION BAR ── */
#narrbar{position:fixed;left:0;right:0;bottom:0;height:52px;background:linear-gradient(0deg,rgba(15,6,4,0.98),rgba(15,6,4,0.9));border-top:1.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:100;}
#narr-text{flex:1;font-family:'Caveat',cursive;font-size:1.15rem;color:var(--sandal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#narr-prog{font-size:0.75rem;font-weight:800;color:var(--gold);white-space:nowrap;}
#nav-btns{display:flex;gap:8px;}
.nav-btn{background:linear-gradient(135deg,var(--gold),#a8863a);color:#2a1505;border:none;padding:8px 18px;border-radius:10px;font-family:'Caveat',cursive;font-size:1.05rem;font-weight:600;cursor:pointer;}
.nav-btn.ghost{background:rgba(201,168,76,0.14);color:var(--sandal);border:1.5px solid rgba(201,168,76,0.4);}
.nav-btn:disabled{opacity:0.4;cursor:default;}

/* ── TAMIL BOX ── */
#sc-tamil-box{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;max-width:820px;width:92%;background:linear-gradient(135deg,#FFF8E7,#FFEFD0);border:3px solid var(--gold);border-radius:14px;padding:16px 22px;color:#3a1010;font-size:1.08rem;line-height:1.8;display:none;z-index:110;box-shadow:0 10px 36px rgba(0,0,0,0.5);font-family:'Noto Sans Tamil','Nunito',sans-serif;}
#sc-tamil-box.on{display:block;}
#sc-tamil-box .close-x{position:absolute;top:6px;right:12px;cursor:pointer;font-size:1.1rem;font-weight:900;color:var(--maroon);}

/* ── MAP STEP (Phase 2) ── */
.sc-map-frame{position:relative;width:100%;height:100%;max-width:1080px;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,0.65);border:1.5px solid rgba(201,168,76,0.35);background:#0a0c10;animation:scFadeUp 0.8s ease both;}
#sc-map{position:absolute;inset:0;}
.sc-map-title{position:absolute;top:0;left:0;right:0;z-index:500;padding:12px 18px 26px;background:linear-gradient(180deg,rgba(0,0,0,0.8),transparent);pointer-events:none;}
.sc-map-title .t{font-family:'Cinzel',serif;font-size:clamp(1rem,1.9vw,1.5rem);color:var(--gold-light);text-shadow:0 2px 8px rgba(0,0,0,0.8);}
.sc-region-label{background:rgba(10,10,14,0.82)!important;border:1.5px solid rgba(201,168,76,0.7)!important;border-radius:8px!important;color:#FFD86A!important;font-family:'Cinzel',serif!important;font-weight:700!important;font-size:0.85rem!important;padding:4px 10px!important;box-shadow:0 4px 14px rgba(0,0,0,0.6)!important;white-space:nowrap;}
.sc-region-label::before{display:none!important;}
.sc-marker-label{background:rgba(107,26,26,0.92)!important;border:1px solid var(--gold)!important;border-radius:6px!important;color:#fff!important;font-family:'Nunito',sans-serif!important;font-weight:700!important;font-size:0.72rem!important;padding:2px 8px!important;}
.sc-marker-label::before{display:none!important;}
.sc-region-glow{filter:drop-shadow(0 0 8px rgba(255,216,106,0.55));}
.leaflet-container{background:#0a0c10!important;font-family:'Nunito',sans-serif;}
.leaflet-control-attribution{background:rgba(0,0,0,0.55)!important;color:rgba(232,201,154,0.55)!important;font-size:0.58rem!important;}
.leaflet-control-attribution a{color:rgba(232,201,154,0.75)!important;}

/* ── INFOGRAPHIC STEPS (Phase 4 — Civics & Economics) ── */
.sc-info-wrap{width:100%;max-width:1000px;animation:scFadeUp 0.8s ease both;}
.sc-info-wrap h2{font-family:'Cinzel',serif;font-size:clamp(1.2rem,2.4vw,1.9rem);color:var(--gold-light);text-align:center;margin-bottom:26px;}

/* structure — organisation tree */
.sc-str-root{margin:0 auto 0;max-width:420px;background:linear-gradient(135deg,var(--maroon),#8a2525);border:2px solid var(--gold);border-radius:14px;padding:14px 20px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:clamp(0.95rem,1.7vw,1.25rem);color:var(--gold-light);box-shadow:0 10px 28px rgba(0,0,0,0.4);opacity:0;animation:scFadeUp 0.5s ease forwards;}
.sc-str-stem{width:3px;height:26px;background:var(--gold);margin:0 auto;opacity:0;animation:scFadeUp 0.4s ease forwards 0.35s;}
.sc-str-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:2px;}
.sc-str-child{background:linear-gradient(160deg,rgba(107,26,26,0.35),rgba(30,12,8,0.65));border:1.5px solid rgba(201,168,76,0.5);border-radius:13px;padding:14px 14px;text-align:center;opacity:0;animation:scFadeUp 0.5s ease forwards;box-shadow:0 8px 22px rgba(0,0,0,0.35);}
.sc-str-child .nm{font-weight:800;font-size:clamp(0.85rem,1.4vw,1.05rem);color:var(--gold-light);margin-bottom:8px;}
.sc-str-child .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.sc-str-child .chip{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.45);border-radius:999px;padding:3px 11px;font-size:0.72rem;color:var(--sandal);font-weight:700;}

/* cycle — circular process */
.sc-cyc-stage{position:relative;width:min(64vh,480px);height:min(64vh,480px);margin:0 auto;}
.sc-cyc-ring{position:absolute;inset:12%;border:3px dashed rgba(201,168,76,0.5);border-radius:50%;animation:scRingSpin 40s linear infinite;}
@keyframes scRingSpin{to{transform:rotate(360deg);}}
.sc-cyc-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.2rem;color:var(--gold);animation:scRingSpin 14s linear infinite;}
.sc-cyc-node{position:absolute;transform:translate(-50%,-50%);background:linear-gradient(160deg,rgba(107,26,26,0.55),rgba(30,12,8,0.8));border:1.5px solid var(--gold);border-radius:12px;padding:9px 13px;max-width:170px;text-align:center;font-size:clamp(0.68rem,1.1vw,0.82rem);font-weight:700;color:var(--text-light);line-height:1.35;box-shadow:0 8px 22px rgba(0,0,0,0.45);opacity:0;animation:scFadeUp 0.5s ease forwards;}
.sc-cyc-node .num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2a1505;font-size:0.68rem;font-weight:800;align-items:center;justify-content:center;margin-bottom:4px;}

/* compare — two-panel contrast */
.sc-cmp-grid{display:grid;grid-template-columns:1fr 54px 1fr;gap:0;align-items:stretch;}
.sc-cmp-panel{border-radius:14px;padding:16px 16px;border:1.5px solid rgba(201,168,76,0.5);box-shadow:0 10px 26px rgba(0,0,0,0.4);}
.sc-cmp-panel.left{background:linear-gradient(160deg,rgba(201,168,76,0.16),rgba(30,20,8,0.6));}
.sc-cmp-panel.right{background:linear-gradient(160deg,rgba(107,26,26,0.4),rgba(30,10,8,0.65));}
.sc-cmp-panel .hd{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(0.9rem,1.6vw,1.15rem);color:var(--gold-light);text-align:center;margin-bottom:12px;padding-bottom:9px;border-bottom:1.5px solid rgba(201,168,76,0.4);}
.sc-cmp-panel .rw{font-size:clamp(0.78rem,1.2vw,0.92rem);color:var(--text-light);line-height:1.5;padding:7px 4px 7px 20px;position:relative;opacity:0;animation:scFadeUp 0.45s ease forwards;}
.sc-cmp-panel .rw::before{content:'\2726';position:absolute;left:2px;color:var(--gold);}
.sc-cmp-vs{display:flex;align-items:center;justify-content:center;}
.sc-cmp-vs span{background:var(--gold);color:#2a1505;font-family:'Cinzel',serif;font-weight:800;font-size:0.85rem;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(201,168,76,0.55);}

/* causes — what built up, and what set it off */
.sc-cause-grid{display:grid;grid-template-columns:1fr 54px 0.9fr;gap:0;align-items:stretch;}
.sc-cause-panel{border-radius:14px;padding:16px;border:1.5px solid rgba(201,168,76,0.5);box-shadow:0 10px 26px rgba(0,0,0,0.4);}
.sc-cause-panel.keg{background:linear-gradient(160deg,rgba(201,168,76,0.16),rgba(30,20,8,0.6));}
.sc-cause-panel.spark{background:linear-gradient(160deg,rgba(107,26,26,0.45),rgba(40,10,8,0.7));display:flex;flex-direction:column;justify-content:center;}
.sc-cause-panel .hd{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(0.82rem,1.4vw,1.02rem);color:var(--gold-light);text-align:center;margin-bottom:12px;padding-bottom:9px;border-bottom:1.5px solid rgba(201,168,76,0.4);}
.sc-cause-panel .rw{font-size:clamp(0.78rem,1.2vw,0.92rem);color:var(--text-light);line-height:1.5;padding:7px 4px 7px 22px;position:relative;opacity:0;animation:scFadeUp 0.45s ease forwards;}
.sc-cause-panel .rw::before{content:'\25B0';position:absolute;left:2px;color:var(--gold);font-size:0.8em;}

/* recall - a pause to answer, mid lesson */

.sc-globe-legend{position:absolute;left:14px;bottom:14px;z-index:5;background:rgba(10,10,16,0.78);border:1.5px solid rgba(201,168,76,0.45);border-radius:12px;padding:10px 14px;font-size:0.74rem;color:var(--sandal);line-height:1.7;pointer-events:none;max-width:280px;}

/* ── LESSON COMPLETE (Phase 2 bridge) ── */

<script>
/* ══════════════════════════════════════════════════════════════
   SOCIAL SCIENCE CLASS — Phase 1 (Documentary Teaching)
   Aids in this phase: title, photo (Wikimedia + Ken Burns),
   timeline, concept cards.
   Voice: /api/voice-class (Monika for Class 8+) with browser fallback.
   Tamil: /api/ai text + /api/explain-tamil audio (Fullscreen engine).
   Photos: /api/social-images (Wikimedia + AI gatekeeper + cache).
   ══════════════════════════════════════════════════════════════ */

var LESSON = { cls:'', subject:'Social Science', topic:'', text:'' };
var STEPS = [];
var CUR = -1;
var voiceOn = true;
var isPaused = false;
var teacherVisible = true;
var scAudio = null;
var scSpeakSeq = 0;
var scUtter = null;
var SC_IMG_CACHE = {};        // search phrase -> {images:[...]} 
var SC_IMG_INFLIGHT = {};     // search phrase -> Promise
var SC_TAMIL_CACHE = {};      // key -> {text, audioUrl}
var SC_TAMIL_AUDIO = null;
var scAdvanceTimer = null;
var kbToggle = 0;

/* ── READ ACTIVATED LESSON ── */
function scReadLesson(){
  var a = null;
  try{ a = JSON.parse(sessionStorage.getItem('sc_activated') || 'null'); }catch(e){}
  if (!a){
    try{ a = JSON.parse(sessionStorage.getItem('tm_activated') || 'null'); }catch(e){}
  }
  if (a){
    LESSON.cls = a.cls || '';
    LESSON.subject = a.subject || 'Social Science';
    LESSON.topic = a.topic || a.chapter || 'Social Science';
    LESSON.text = a.lessonText || '';
  }
  if (!LESSON.text){
    try{ LESSON.text = sessionStorage.getItem('tm_lesson') || ''; }catch(e){}
  }
  document.getElementById('tb-cls').textContent = LESSON.cls || 'Class';
  document.getElementById('tb-topic').textContent = LESSON.topic;
  return !!(LESSON.text && LESSON.text.trim().length > 40);
}

/* ── LESSON PLAN GENERATION ── */
function scPlanPrompt(){
  return 'You are planning a projector-based Social Science class for ' + LESSON.cls +
    ' students in a Tamil Nadu CBSE school. Convert the lesson text into a documentary-style ' +
    'teaching plan.\n\n' +
    'Return ONLY valid JSON — no markdown, no backticks, no commentary — in exactly this shape:\n' +
    '{"steps":[\n' +
    ' {"type":"title","title":"...","speech":"..."},\n' +
    ' {"type":"photo","title":"...","speech":"...","search":"2-5 word Wikimedia Commons search using a concrete proper noun from the lesson (monument, place, person, artefact)","caption":"one short factual line about what the photo shows"},\n' +
    ' {"type":"timeline","title":"...","speech":"...","items":[{"year":"1206","label":"very short event"}]},\n' +
    ' {"type":"concept","title":"...","speech":"...","points":["short point","short point"]},\n {"type":"diagram","title":"...","speech":"...","diagram":"human_eye","caption":"one short factual line naming what is shown"},\n {"type":"map","title":"...","speech":"...","regions":["vijayanagara"],"markers":[{"name":"Hampi","lat":15.34,"lng":76.47,"group":"optional side name"}]},\n {"type":"globe","title":"...","speech":"...","mode":"latlong","markers":[{"name":"Chennai","lat":13.08,"lng":80.27}]},\n {"type":"structure","title":"...","speech":"...","root":"Government of India","children":[{"name":"Legislature","sub":["Lok Sabha","Rajya Sabha"]},{"name":"Executive","sub":[]},{"name":"Judiciary","sub":["Supreme Court"]}]},\n {"type":"cycle","title":"...","speech":"...","items":["step one","step two","step three"]},\n {"type":"compare","title":"...","speech":"...","left":{"name":"Lok Sabha","points":["...","..."]},"right":{"name":"Rajya Sabha","points":["...","..."]}},\n {"type":"model3d","title":"...","speech":"...","model":"taj_mahal","caption":"one short factual line about what is shown"},\\n  {"type":"stat","title":"...","speech":"...","stats":[{"value":"545","label":"members in the Lok Sabha"}]}\n' +
    ' {\"type\":\"causes\",\"title\":\"...\",\"speech\":\"...\",\"longTerm\":[\"short cause\",\"short cause\"],\"trigger\":{\"name\":\"the one event that started it\",\"detail\":\"one short line\"},\"result\":\"what followed, one short line\"},\n' +
    ']}\n\n' +
    'Rules:\n' +
    '- 10 to 15 steps total, covering the WHOLE lesson in order.\n' +
    '- First step is always type "title" introducing the chapter.\n' +
    '- MANDATORY: if the lesson explains WHY an event or change happened, the plan MUST contain EXACTLY ONE step of type \"causes\", placed BEFORE the steps describing what happened afterwards. Decide this first, before planning any other step. Wars, revolts, revolutions, migrations, shortages, reforms, pollution and social change all qualify. Build it ONLY from causes stated in the lesson text. If the lesson genuinely explains no cause, omit it - but never omit it just to fit in more concept steps.\n' +
    '- Use "photo" whenever the lesson mentions a real monument, city, ruler, artefact or place ' +
    'that has famous photographs (e.g. Qutub Minar, Hampi, Brihadeeswarar Temple). ' +
    'The "search" must be specific — "Hampi stone chariot", never vague words like "history" or "empire". For EVS, nature and everyday-life lessons (body, senses, plants, animals, food, family, community helpers), ALSO use "photo" with a concrete everyday search such as "human ear", "green plant leaf", "children playing", "fresh vegetables", "Indian farmer" — clear real pictures, not monuments.\n' +
    '- Use "timeline" for dynasties, sequences of events or dated periods (3 to 6 items, years as short strings). REQUIRED: if the lesson mentions THREE or more dated events, the plan MUST include a timeline step. Children cannot hold the order of events in their heads from speech alone.\n' +
    '- The \"causes\" step: put the slow build-up (2 to 5 short causes that grew over years) in \"longTerm\", the single event that finally set it off in \"trigger\", and one short line naming what followed in \"result\". A causes step REPLACES a concept step - it does not add to the concept count.\n' +
    '- Use "concept" for explanations, causes, effects, administration, society (2 to 4 short points).\n' +
    '- Use "diagram" to SHOW a labelled science model when the lesson is about a body organ, a body system, a plant, or a science topic that matches one of these available diagrams (use the EXACT key): ' + SC_DIAGRAMS.join(', ') + '. Young children love these moving models — prefer a "diagram" step over a plain "concept" step whenever the topic matches a key. Never invent a key that is not in the list.\n' +
    '- Use "map" whenever the lesson deals with the EXTENT of an empire/kingdom, invasions, capitals, ' +
    'battles or geography of places. "regions" may ONLY use these keys (0 to 2 of them, in the order they should appear): ' +
    'delhi_sultanate, vijayanagara, mughal_empire, maurya_empire, gupta_empire, chola_empire, bahmani_sultanate, ' +
    'maratha_empire, british_india, pandya_kingdom, pallava_kingdom, tamil_nadu, ' +
    'triple_alliance, triple_entente, balkans_1914, ottoman_empire_1914 (these last four are Europe in 1914 - use them for First World War lessons, and you may combine triple_alliance with triple_entente in one step to show the two sides). ' +
    '"markers" are 1 to 4 real cities/sites with true latitude and longitude (e.g. Delhi 28.61,77.21; Hampi 15.34,76.47; ' +
    'Madurai 9.93,78.12; Thanjavur 10.79,79.14). Prefer a map step for at least one empire-extent moment in history lessons.\n' +
    '- WORLD HISTORY: a map step is NOT only for India. For world lessons (world wars, colonies, revolutions, world organisations) leave "regions" empty and use "markers" alone, anywhere on Earth, with true coordinates - London 51.51,-0.13; Berlin 52.52,13.40; Paris 48.86,2.35; Rome 41.90,12.50; Athens 37.98,23.73; Vienna 48.21,16.37; Sarajevo 43.86,18.41; Moscow 55.75,37.62. Give each marker a "group" when the lesson divides them into sides, for example "Triple Alliance" and "Triple Entente"; each group is drawn in its own colour with a legend. 2 to 6 markers. A world lesson that names countries SHOULD have one map step.\n' +
    '- Use "globe" ONLY for Geography concepts about the Earth itself. "mode" must be one of these EIGHT: ' +
    '"latlong" (the grid of latitudes and longitudes, equator, tropics, prime meridian), ' +
    '"daynight" (rotation of the Earth, day and night), ' +
    '"seasons" (revolution around the Sun, tilt of the axis, seasons), ' +
    '"rotation" (plain spinning Earth to locate places), ' +
    '"hemispheres" (Northern and Southern, or Eastern and Western halves shown in two colours), ' +
    '"timezones" (24 coloured time-zone wedges, Prime Meridian and Indian Standard Time marked), ' +
    '"dateline" (the International Date Line at 180 degrees, and how the date changes across it), ' +
    '"heatzones" (Torrid, Temperate and Frigid heat zones as coloured bands). ' +
    'IMPORTANT: if a lesson needs more than one globe step, every globe step MUST use a DIFFERENT mode. ' +
    'Never show the same mode twice in one lesson - choose the mode that matches what that step is about. ' +
    '"markers" optional, 0 to 3 real places with true worldwide latitude and longitude.\n' +
    '- For CIVICS and ECONOMICS lessons prefer these modern infographic steps over plain concept steps: ' +
    '"structure" for how a body/organisation is arranged (organs of government, Panchayati Raj levels, courts \u2014 one root, 2 to 4 children, each with 0 to 3 sub items); ' +
    '"cycle" for processes that repeat or flow in order (an election process, how a law is made, a production chain \u2014 3 to 6 short items); ' +
    '"compare" for contrasting exactly two things (Lok Sabha vs Rajya Sabha, rights vs duties \u2014 2 to 4 short points each side); ' +
    '"stat" for important figures, but ONLY numbers that actually appear in the lesson text \u2014 never invent numbers (2 to 4 stats, value short like "545" or "29 states").\n' +
    '- Use "model3d" to show a REAL 3D model the children can turn with their finger. This is the most exciting ' +
    'step type, so use it whenever the lesson mentions a monument, a temple, a landform or a historical object. ' +
    'The "model" value must be EXACTLY one of these keys: ' + Object.keys(SOC_MODELS).join(', ') + '. ' +
    'Never invent a key. If the lesson mentions something not in this list, use a "photo" step instead. ' +
    'Aim for ONE to THREE "model3d" steps per lesson, each using a DIFFERENT key.\n' +
    '== VARIETY (very important - children lose interest when screens repeat) ==\n' +
    '- NEVER use the same "type" twice in a row. Alternate: a visual step, then an explaining step, then a different visual step.\n' +
    '- Use AT LEAST FOUR different step types in every lesson. A lesson that is mostly "concept" steps is a failure.\n' +
    '- Use AT MOST THREE "concept" steps in the whole lesson. If you are about to write a fourth, turn it into a ' +
    '"photo", "model3d", "diagram", "globe" (a different mode), "map", "cycle", "compare", "structure" or "stat" step instead.\n' +
    '- If the same type is used more than once, it MUST look different each time: a different globe "mode", ' +
    'a different "diagram" key, a different photo "search", or different map "regions".\n' +
    '- Whenever a step mentions a real place, monument, person, animal, plant or object that can be photographed, ' +
    'prefer a "photo" step over a "concept" step. Real pictures hold a child\u2019s attention.\n' +
    '- Aim for about two-thirds visual steps (photo, model3d, diagram, globe, map, timeline, cycle, compare, structure, stat) ' +
    'and one-third talking steps (title, concept).\n' +
    '- "speech" is what the teacher SAYS aloud: 2 to 4 warm, clear sentences in simple Indian classroom English, ' +
    'documentary-narrator style, occasionally connecting to Tamil Nadu students\u2019 daily life. No emojis.\n' +
    '- Every string must be plain text. Keep JSON strictly valid.';
}

async function scGeneratePlanFresh(){
  var res = await fetch('/api/ai', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: scPlanPrompt(),
      messages:[{role:'user', content:'LESSON TEXT:\n\n' + LESSON.text.substring(0, 45000)}],
      max_tokens: 7000
    })
  });
  var d = await res.json();
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type==='text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw){
    var why = (d && (d.message || (d.error && (d.error.message || d.error)))) || 'empty AI response';
    if (typeof why !== 'string') why = JSON.stringify(why);
    throw new Error(why.substring(0, 200));
  }
  var plan = scParseJSON(raw);
  if (!plan || !Array.isArray(plan.steps) || plan.steps.length === 0) throw new Error('the AI reply was incomplete \u2014 please press Try Again');
  return plan.steps.map(scNormaliseStep).filter(Boolean);
}

/* JSON repair — strip fences, cut to outermost braces */
function scParseJSON(raw){
  var t = String(raw).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  var s = t.indexOf('{'); var e = t.lastIndexOf('}');
  if (s === -1 || e === -1 || e <= s) return null;
  t = t.substring(s, e + 1);
  try{ return JSON.parse(t); }catch(err){}
  try{ return JSON.parse(t.replace(/,\s*([}\]])/g,'$1')); }catch(err){}
  /* SALVAGE: if the reply was cut off mid-step, keep all COMPLETE steps.
     Walk back through closing braces and try closing the JSON there. */
  var cut = t.length;
  for (var tries = 0; tries < 12; tries++){
    cut = t.lastIndexOf('}', cut - 1);
    if (cut <= 0) break;
    var candidate = t.substring(0, cut + 1).replace(/,\s*$/, '') + ']}';
    try{
      var fixed = JSON.parse(candidate);
      if (fixed && Array.isArray(fixed.steps) && fixed.steps.length >= 3) return fixed;
    }catch(err){}
  }
  return null;
}

var SC_DIAGRAMS = ['heart','plant','plant_anatomy','photosynthesis','food_chain','water_cycle','cell_division','dna_structure','human_digestive','human_respiratory','human_circulatory','human_nervous','human_skeletal','human_eye','solar_system','atom_structure','magnet_field','electric_circuit','states_of_matter','layers_earth','fraction_visual','pythagoras'];

function scNormaliseStep(s){
  if (!s || !s.type) return null;
  var type = String(s.type).toLowerCase();
  if (['title','photo','timeline','concept','map','globe','structure','cycle','compare','causes','recall','stat','diagram','model3d'].indexOf(type) === -1) type = 'concept';
  var out = {
    type: type,
    title: String(s.title || '').substring(0, 140),
    speech: String(s.speech || '').substring(0, 700)
  };
  if (type === 'photo'){
    out.search = String(s.search || out.title).substring(0, 80);
    out.caption = String(s.caption || '').substring(0, 200);
  }
  if (type === 'diagram'){
    out.diagram = String(s.diagram || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
    out.caption = String(s.caption || '').substring(0, 200);
    if (SC_DIAGRAMS.indexOf(out.diagram) === -1) out.type = 'concept';
  }
  if (type === 'map'){
    out.regions = (Array.isArray(s.regions) ? s.regions : []).slice(0, 3)
      .map(function(r){ return String(r).toLowerCase().trim(); })
      .filter(function(r){ return !!SC_REGIONS[r]; });
    out.markers = (Array.isArray(s.markers) ? s.markers : []).slice(0, 6).map(function(m){
      return { name: String((m && m.name) || '').substring(0, 40), lat: parseFloat(m && m.lat), lng: parseFloat(m && m.lng),
               group: String((m && m.group) || '').substring(0, 40) };
    }).filter(function(m){ return m.name && isFinite(m.lat) && isFinite(m.lng) && m.lat >= -85 && m.lat <= 85 && m.lng >= -180 && m.lng <= 180; });
    if (out.regions.length === 0 && out.markers.length === 0) out.type = 'concept';
  }
  if (type === 'model3d'){
    out.model = String(s.model || '').toLowerCase().trim();
    out.caption = String(s.caption || '').substring(0, 160);
    if (!SOC_MODELS[out.model]) out.type = 'concept';
  }
  if (type === 'globe'){
    var gm = String(s.mode || 'rotation').toLowerCase();
    out.mode = ['latlong','daynight','seasons','rotation','hemispheres','timezones','dateline','heatzones'].indexOf(gm) !== -1 ? gm : 'rotation';
    out.markers = (Array.isArray(s.markers) ? s.markers : []).slice(0, 3).map(function(m){
      return { name: String((m && m.name) || '').substring(0, 40), lat: parseFloat(m && m.lat), lng: parseFloat(m && m.lng) };
    }).filter(function(m){ return m.name && isFinite(m.lat) && isFinite(m.lng) && m.lat >= -90 && m.lat <= 90 && m.lng >= -180 && m.lng <= 180; });
  }
  if (type === 'structure'){
    out.root = String(s.root || out.title).substring(0, 60);
    out.children = (Array.isArray(s.children) ? s.children : []).slice(0, 4).map(function(ch){
      return {
        name: String((ch && ch.name) || '').substring(0, 40),
        sub: (Array.isArray(ch && ch.sub) ? ch.sub : []).slice(0, 3).map(function(x){ return String(x).substring(0, 34); })
      };
    }).filter(function(ch){ return !!ch.name; });
    if (out.children.length === 0) out.type = 'concept';
  }
  if (type === 'cycle'){
    out.items = (Array.isArray(s.items) ? s.items : []).slice(0, 6).map(function(x){ return String(x).substring(0, 70); }).filter(Boolean);
    if (out.items.length < 3) out.type = 'concept';
  }
  if (type === 'compare'){
    function side(o){
      return {
        name: String((o && o.name) || '').substring(0, 40),
        points: (Array.isArray(o && o.points) ? o.points : []).slice(0, 4).map(function(p){ return String(p).substring(0, 110); }).filter(Boolean)
      };
    }
    out.left = side(s.left); out.right = side(s.right);
    if (!out.left.name || !out.right.name || out.left.points.length === 0 || out.right.points.length === 0) out.type = 'concept';
  }
  if (type === 'stat'){
    out.stats = (Array.isArray(s.stats) ? s.stats : []).slice(0, 4).map(function(st){
      return { value: String((st && st.value) || '').substring(0, 16), label: String((st && st.label) || '').substring(0, 90) };
    }).filter(function(st){ return st.value && st.label; });
    if (out.stats.length === 0) out.type = 'concept';
  }
  if (type === 'timeline'){
    out.items = (Array.isArray(s.items) ? s.items : []).slice(0, 6).map(function(it){
      return { year: String((it && it.year) || '').substring(0, 14), label: String((it && it.label) || '').substring(0, 60) };
    });
    if (out.items.length === 0) out.type = 'concept';
  }
  if (type === 'causes'){
    out.longTerm = (Array.isArray(s.longTerm) ? s.longTerm : []).slice(0, 5)
      .map(function(p){ return String(p).substring(0, 120); })
      .filter(function(p){ return p.trim().length > 0; });
    var tg = (s.trigger && typeof s.trigger === 'object') ? s.trigger : {};
    out.trigger = { name: String(tg.name || '').substring(0, 90),
                    detail: String(tg.detail || '').substring(0, 180) };
    out.result = String(s.result || '').substring(0, 220);
    // Needs both halves to make its point; otherwise it is just a list.
    if (out.longTerm.length < 2 || !out.trigger.name) out.type = 'concept';
  }
  if (type === 'recall'){
    out.question = String(s.question || s.speech || '').substring(0, 180);
    out.answer   = String(s.answer || '').substring(0, 140);
    if (!out.question || !out.answer) out.type = 'concept';
  }
  if (out.type === 'concept'){
    out.points = (Array.isArray(s.points) ? s.points : []).slice(0, 4).map(function(p){ return String(p).substring(0, 400); });
    if (out.points.length === 0) out.points = [out.speech.substring(0, 400)];
  }
  if (!out.title && !out.speech) return null;
  return out;
}

/* ── IMAGE FETCH (with prefetch) ── */
var SC_ILLUSTRATE_MAX = 5;   // classes at/below this get bright AI illustrations; older classes keep real photos
function scClassNum(){
  var s = String(LESSON.cls || '').toLowerCase();
  if (/pre.?kg|lkg|ukg|nursery|\bkg\b/.test(s)) return 0;
  var m = s.match(/\d+/);
  return m ? parseInt(m[0], 10) : 99;   // unknown class -> treat as senior (real photos)
}
function scImageEndpoint(){
  return (scClassNum() <= SC_ILLUSTRATE_MAX) ? '/api/gen-image' : '/api/social-images';
}

function scFetchImages(query, context){
  var key = query.toLowerCase().trim();
  if (SC_IMG_CACHE[key]) return Promise.resolve(SC_IMG_CACHE[key]);
  if (SC_IMG_INFLIGHT[key]) return SC_IMG_INFLIGHT[key];
  SC_IMG_INFLIGHT[key] = fetch(scImageEndpoint(), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ query: query, context: context || '' })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      var out = { images: (d && Array.isArray(d.images)) ? d.images : [] };
      SC_IMG_CACHE[key] = out;
      delete SC_IMG_INFLIGHT[key];
      // Preload the ACTUAL picture into browser cache so the step shows instantly
      out.images.forEach(function(im){ if (im && im.url){ var p = new Image(); p.src = im.url; } });
      return out;
    })
    .catch(function(){
      delete SC_IMG_INFLIGHT[key];
      return { images: [] };
    });
  return SC_IMG_INFLIGHT[key];
}

function scPrefetchNextPhoto(fromIdx){
  var warmed = 0;
  for (var i = fromIdx + 1; i < STEPS.length && warmed < 3; i++){
    if (STEPS[i].type === 'photo'){
      scFetchImages(STEPS[i].search, STEPS[i].title + '. ' + STEPS[i].speech);
      warmed++;
    }
  }
  var m = 0;
  for (var j = fromIdx + 1; j < STEPS.length && m < 2; j++){
    if (STEPS[j].type === 'model3d'){ socFetchModel(STEPS[j].model); m++; }
  }
}

/* ── RENDERERS ── */
function scRender(idx){
  if (idx < 0 || idx >= STEPS.length) return;
  clearTimeout(scAdvanceTimer);
  scDestroyGlobe();
  CUR = idx;
  var step = STEPS[idx];
  var inner = document.getElementById('stage-inner');
  document.getElementById('narr-prog').textContent = 'Step ' + (idx + 1) + ' / ' + STEPS.length;
  document.getElementById('narr-text').textContent = step.speech || step.title;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').textContent = (idx === STEPS.length - 1) ? 'Finish \u2192' : 'Next \u2192';
  var items = document.querySelectorAll('.step-item');
  for (var i = 0; i < items.length; i++) items[i].classList.toggle('current', i === idx);
  var cu = document.querySelector('.step-item.current');
  if (cu && cu.scrollIntoView) cu.scrollIntoView({ block:'nearest', behavior:'smooth' });

  if (step.type === 'title') renderTitle(inner, step);
  else if (step.type === 'photo') renderPhoto(inner, step);
  else if (step.type === 'timeline') renderTimeline(inner, step);
  else if (step.type === 'map') renderMap(inner, step);
  else if (step.type === 'globe') renderGlobe(inner, step);
  else if (step.type === 'structure') renderStructure(inner, step);
  else if (step.type === 'cycle') renderCycle(inner, step);
  else if (step.type === 'compare') renderCompare(inner, step);
  else if (step.type === 'stat') renderStat(inner, step);
  else if (step.type === 'diagram') renderDiagram(inner, step);
  else if (step.type === 'model3d') renderModel3d(inner, step);
  else if (step.type === 'causes') renderCauses(inner, step);
  else if (step.type === 'recall') renderRecall(inner, step);
  else renderConcept(inner, step);

  scSpeak(step.speech || step.title);
  scPrefetchNextPhoto(idx);
}

function renderTitle(inner, step){
  inner.innerHTML =
    '<div class="sc-title-wrap">' +
      '<h1></h1><div class="sc-title-line"></div><p></p>' +
    '</div>';
  inner.querySelector('h1').textContent = step.title;
  inner.querySelector('p').textContent = step.speech;
}

function renderPhoto(inner, step){
  inner.innerHTML =
    '<div class="sc-photo-frame"><div class="sc-photo-loading" style="position:absolute;inset:0;justify-content:center;">' +
    '<div class="sc-spin"></div><div>Bringing the photograph&hellip;</div></div></div>';
  var frame = inner.querySelector('.sc-photo-frame');
  var myIdx = CUR;
  scFetchImages(step.search, step.title + '. ' + step.speech).then(function(res){
    if (CUR !== myIdx) return;                    // moved on already
    var img = res.images && res.images[0];
    if (!img || !img.url){ renderConcept(inner, step); return; }   // graceful fallback
    kbToggle = (kbToggle + 1) % 4;
    var kbClass = 'kb' + (kbToggle + 1);
    var el = new Image();
    el.className = kbClass;
    el.alt = step.title;
    // Show ONLY when fully downloaded — the spinner stays till then, so the
    // teacher never sees a half-painted picture. Preloaded photos appear instantly.
    el.onload = function(){
      if (CUR !== myIdx) return;
      frame.innerHTML = '';
      frame.appendChild(el);
      var cap = document.createElement('div');
      cap.className = 'sc-photo-cap';
      var t = document.createElement('div'); t.className = 'cap-title'; t.textContent = step.title;
      var c = document.createElement('div'); c.className = 'cap-text'; c.textContent = step.caption || '';
      var s = document.createElement('div'); s.className = 'cap-src'; s.textContent = (img.source || 'Photo: Wikimedia Commons');
      cap.appendChild(t); cap.appendChild(c); cap.appendChild(s);
      frame.appendChild(cap);
    };
    el.onerror = function(){ if (CUR === myIdx) renderConcept(inner, step); };
    el.src = img.url;
    // if it was already preloaded, onload may have fired before we attached —
    // .complete catches that so the photo still appears
    if (el.complete && el.naturalWidth) el.onload();
  });
}

function renderTimeline(inner, step){
  var html = '<div class="sc-tl-wrap"><h2></h2><div class="sc-tl-track"><div class="sc-tl-line"></div><div class="sc-tl-items">';
  for (var i = 0; i < step.items.length; i++){
    html += '<div class="sc-tl-item" style="animation-delay:' + (0.35 + i * 0.4).toFixed(2) + 's">' +
              '<div class="yr"></div><div class="dot"></div><div class="lbl"></div></div>';
  }
  html += '</div></div></div>';
  inner.innerHTML = html;
  inner.querySelector('h2').textContent = step.title;
  var els = inner.querySelectorAll('.sc-tl-item');
  for (var j = 0; j < els.length; j++){
    els[j].querySelector('.yr').textContent = step.items[j].year;
    els[j].querySelector('.lbl').textContent = step.items[j].label;
  }
}

function renderCauses(inner, step){
  var keg = '<div class="sc-cause-panel keg"><div class="hd"></div>';
  for (var i = 0; i < step.longTerm.length; i++){
    keg += '<div class="rw" style="animation-delay:' + (0.3 + i * 0.32).toFixed(2) + 's"></div>';
  }
  keg += '</div>';
  inner.innerHTML = '<div class="sc-info-wrap"><h2></h2><div class="sc-cause-grid">' +
    keg +
    '<div class="sc-cause-arrow"><span>\u2192</span></div>' +
    '<div class="sc-cause-panel spark"><div class="hd"></div>' +
      '<div class="spk-name"></div><div class="spk-detail"></div></div>' +
    '</div><div class="sc-cause-result"></div></div>';
  inner.querySelector('h2').textContent = step.title;
  inner.querySelector('.keg .hd').textContent = 'What built up over time';
  var rows = inner.querySelectorAll('.keg .rw');
  for (var j = 0; j < rows.length; j++) rows[j].textContent = step.longTerm[j];
  inner.querySelector('.spark .hd').textContent = 'What set it off';
  inner.querySelector('.spk-name').textContent = step.trigger.name;
  inner.querySelector('.spk-detail').textContent = step.trigger.detail || '';
  var res = inner.querySelector('.sc-cause-result');
  if (step.result) res.textContent = step.result; else res.style.display = 'none';
}

function renderRecall(inner, step){
  inner.innerHTML =
    '<div class="sc-info-wrap">' +
      '<div class="sc-recall-tag"></div>' +
      '<div class="sc-recall-q"></div>' +
      '<button class="sc-recall-btn" type="button"></button>' +
      '<div class="sc-recall-a" style="display:none;"></div>' +
    '</div>';
  inner.querySelector('.sc-recall-tag').textContent = 'Quick check \u2014 answer together';
  inner.querySelector('.sc-recall-q').textContent = step.question;
  var btn = inner.querySelector('.sc-recall-btn');
  var ans = inner.querySelector('.sc-recall-a');
  btn.textContent = 'Show answer';
  ans.textContent = step.answer;
  btn.onclick = function(){ ans.style.display = 'block'; btn.style.display = 'none'; };
}

function renderConcept(inner, step){
  var pts = step.points || [step.caption || step.speech.substring(0, 400)];
  var html = '<div class="sc-con-wrap"><h2></h2><div class="sc-con-grid">';
  for (var i = 0; i < pts.length; i++){
    html += '<div class="sc-con-card" style="animation-delay:' + (0.2 + i * 0.3).toFixed(2) + 's"><span class="n">' + (i + 1) + '</span><div class="pt"></div></div>';
  }
  html += '</div></div>';
  inner.innerHTML = html;
  inner.querySelector('h2').textContent = step.title;
  var cards = inner.querySelectorAll('.sc-con-card .pt');
  for (var j = 0; j < cards.length; j++) cards[j].textContent = pts[j];
}

function renderDiagram(inner, step){
  if (SC_DIAGRAMS.indexOf(step.diagram) === -1){ renderConcept(inner, step); return; }
  inner.innerHTML =
    '<div class="sc-dia-wrap">' +
      '<h2></h2>' +
      '<div class="sc-dia-stage"><div class="sc-dia-card">' +
        '<img class="sc-dia-img" alt=""/>' +
      '</div></div>' +
      '<div class="sc-dia-cap"></div>' +
    '</div>';
  inner.querySelector('h2').textContent = step.title;
  var cap = inner.querySelector('.sc-dia-cap');
  if (step.caption){ cap.textContent = step.caption; } else { cap.style.display = 'none'; }
  var img = inner.querySelector('.sc-dia-img');
  var scDiaBand = (scClassNum() <= SC_ILLUSTRATE_MAX) ? 'junior' : 'senior';
  function scDiaGenerate(){                                   // no hand-made override -> generate (or reuse cache)
    img.onerror = function(){ renderConcept(inner, step); };  // generated image fails -> clean text slide
    fetch('/api/gen-diagram', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: step.diagram, band: scDiaBand })
    }).then(function(r){ return r.json(); })
      .then(function(d){
        var u = d && d.images && d.images[0] && d.images[0].url;
        if (u){ img.src = u; } else { renderConcept(inner, step); }
      })
      .catch(function(){ renderConcept(inner, step); });
  }
  img.onerror = scDiaGenerate;                                // 1) try your hand-made image; if none, generate
  img.src = '/assets/diagram/' + step.diagram + '.webp';      //    hand-made override lives in assets/diagram/
}

var scMap = null;

function renderMap(inner, step){
  if (typeof L === 'undefined'){ renderConcept(inner, step); return; }   // Leaflet failed to load
  if (scMap){ try{ scMap.remove(); }catch(e){} scMap = null; }
  inner.innerHTML =
    '<div class="sc-map-frame"><div id="sc-map"></div>' +
    '<div class="sc-map-title"><div class="t"></div></div></div>';
  inner.querySelector('.sc-map-title .t').textContent = step.title;

  /* Hand-drawn outlines are approximations. Say so on screen rather than let a
     class read them as exact borders. */
  var anySimplified = (step.regions || []).some(function(k){
    return SC_REGIONS[k] && SC_REGIONS[k].simplified;
  });
  if (anySimplified){
    var note = document.createElement('div');
    note.className = 'sc-map-note';
    note.textContent = 'Outlines simplified for teaching';
    inner.querySelector('.sc-map-frame').appendChild(note);
  }

  var myIdx = CUR;
  scMap = L.map('sc-map', { zoomControl:false, attributionControl:true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 10, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(scMap);

  /* A region is one shape ("ring") or several ("rings" - a bloc of countries). */
  var scRings = function(r){ return r.rings ? r.rings : [r.ring]; };
  var bounds = [];
  (step.regions || []).forEach(function(k){
    var r = SC_REGIONS[k];
    if (r) scRings(r).forEach(function(ring){ ring.forEach(function(p){ bounds.push(p); }); });
  });
  (step.markers || []).forEach(function(m){ bounds.push([m.lat, m.lng]); });
  if (bounds.length === 0) bounds = [[8,68],[34,92]];
  scMap.fitBounds(bounds, { padding:[46,46] });

  /* Regions appear one after another — like the teacher tracing the wall map */
  (step.regions || []).forEach(function(k, i){
    var r = SC_REGIONS[k];
    if (!r) return;
    setTimeout(function(){
      if (CUR !== myIdx || !scMap) return;
      var poly = L.polygon(r.rings ? r.rings : r.ring, {
        color: r.color, weight: 3, fillColor: r.color, fillOpacity: 0.06,
        className: 'sc-region-glow'
      }).addTo(scMap);
      /* boundary glow-in: fill fades up */
      var op = 0.06;
      var fade = setInterval(function(){
        op += 0.03;
        if (op >= 0.24 || CUR !== myIdx){ clearInterval(fade); return; }
        try{ poly.setStyle({ fillOpacity: op }); }catch(e){ clearInterval(fade); }
      }, 90);
      try{
        poly.bindTooltip(r.name, { permanent:true, direction:'center', className:'sc-region-label' }).openTooltip();
      }catch(e){}
    }, 900 + i * 2600);
  });

  /* Markers drop in after the regions. When they carry a "group" - the two
     sides of an alliance, say - each side gets its own colour and a legend, so
     the class reads the split without the teacher naming every pin. */
  var groups = [];
  (step.markers || []).forEach(function(m){
    if (m.group && groups.indexOf(m.group) === -1) groups.push(m.group);
  });
  var groupColour = function(g){
    var gi = groups.indexOf(g);
    if (gi === -1) return '#6B1A1A';
    return ['#B3312C', '#2E5E8E', '#3F7A46', '#7A4B8C'][gi % 4];
  };
  if (groups.length > 1){
    var lg = document.createElement('div');
    lg.className = 'sc-map-legend';
    groups.forEach(function(g){
      var row = document.createElement('div');
      row.className = 'sc-map-legend-row';
      var sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = groupColour(g);
      row.appendChild(sw);
      var tx = document.createElement('span');
      tx.textContent = g;
      row.appendChild(tx);
      lg.appendChild(row);
    });
    var frame = inner.querySelector('.sc-map-frame');
    if (frame) frame.appendChild(lg);
  }
  var mDelay = 900 + (step.regions ? step.regions.length : 0) * 2600 + 600;
  (step.markers || []).forEach(function(m, i){
    setTimeout(function(){
      if (CUR !== myIdx || !scMap) return;
      try{
        L.circleMarker([m.lat, m.lng], { radius:7, color:'#FFD86A', weight:2.5,
            fillColor: groupColour(m.group), fillOpacity:1 })
          .addTo(scMap)
          .bindTooltip(m.name, { permanent:true, direction:'top', offset:[0,-8], className:'sc-marker-label' })
          .openTooltip();
      }catch(e){}
    }, mDelay + i * 900);
  });
}

function renderStat(inner, step){
  var html = '<div class="sc-info-wrap"><h2></h2><div class="sc-stat-grid">';
  for (var i = 0; i < step.stats.length; i++){
    html += '<div class="sc-stat-card" style="animation-delay:' + (0.25 + i * 0.3).toFixed(2) + 's">' +
              '<div class="val"></div><div class="lbl"></div></div>';
  }
  html += '</div></div>';
  inner.innerHTML = html;
  inner.querySelector('h2').textContent = step.title;
  var cards = inner.querySelectorAll('.sc-stat-card');
  var myIdx = CUR;
  for (var j = 0; j < cards.length; j++){
    (function(card, st, delay){
      var valEl = card.querySelector('.val');
      card.querySelector('.lbl').textContent = st.label;
      /* count-up when the value starts with a plain number, else show as-is */
      var m = st.value.match(/^([\d,\.]+)(.*)$/);
      var target = m ? parseFloat(m[1].replace(/,/g, '')) : NaN;
      if (!m || !isFinite(target) || target <= 0 || target > 10000000){
        valEl.textContent = st.value;
        return;
      }
      var suffix = m[2] || '';
      var isInt = m[1].indexOf('.') === -1;
      valEl.textContent = (isInt ? '0' : '0.0') + suffix;
      setTimeout(function(){
        var t0 = null;
        function tick(ts){
          if (CUR !== myIdx) return;
          if (t0 === null) t0 = ts;
          var p = Math.min(1, (ts - t0) / 1300);
          var eased = 1 - Math.pow(1 - p, 3);
          var cur = target * eased;
          valEl.textContent = (isInt ? Math.round(cur).toLocaleString('en-IN') : cur.toFixed(1)) + suffix;
          if (p < 1) requestAnimationFrame(tick);
          else valEl.textContent = st.value;
        }
        requestAnimationFrame(tick);
      }, delay * 1000);
    })(cards[j], step.stats[j], 0.25 + j * 0.3);
  }
}

var SOC_MODEL_CACHE = {};
var SOC_MODEL_INFLIGHT = {};

function socFetchModel(key){
  if (SOC_MODEL_CACHE[key]) return Promise.resolve(SOC_MODEL_CACHE[key]);
  if (SOC_MODEL_INFLIGHT[key]) return SOC_MODEL_INFLIGHT[key];
  var lib = SOC_MODELS[key];
  if (!lib) return Promise.resolve({ uid: null });
  SOC_MODEL_INFLIGHT[key] = fetch('/api/science-models', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ organ: 'soc_' + key, query: lib.q, label: lib.name })
  }).then(function(r){ return r.json(); })
    .then(function(d){
      var out = (d && d.uid) ? { uid: d.uid, name: d.name || lib.name } : { uid: null };
      SOC_MODEL_CACHE[key] = out;
      return out;
    })
    .catch(function(){ return { uid: null }; });
  return SOC_MODEL_INFLIGHT[key];
}

/* ══ 3D GLOBE ENGINE (Phase 3) ══
   Modes: rotation (spin + place markers), latlong (graticule with equator,
   tropics, prime meridian), daynight (sunlit side vs dark side),
   seasons (tilted Earth orbiting the Sun, live season caption).
   Drag to rotate. Texture from CDN with a clean gradient fallback. */
var scGlobe = null;   // { renderer, raf, canvasWrap }

function scDestroyGlobe(){
  if (!scGlobe) return;
  try{ cancelAnimationFrame(scGlobe.raf); }catch(e){}
  try{ scGlobe.renderer.dispose(); }catch(e){}
  scGlobe = null;
}

function scLatLngToVec(lat, lng, r){
  var phi = (90 - lat) * Math.PI / 180;
  var theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function scMakeSprite(text, color){
  var cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  var ctx = cv.getContext('2d');
  ctx.font = 'bold 52px Nunito, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10;
  ctx.fillStyle = color || '#FFD86A';
  ctx.fillText(text, 256, 64);
  var tex = new THREE.CanvasTexture(cv);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(1.7, 0.42, 1);
  return sp;
}

function scLatCircle(lat, r, color, dashed){
  var pts = [];
  var y = r * Math.sin(lat * Math.PI / 180);
  var cr = r * Math.cos(lat * Math.PI / 180);
  for (var i = 0; i <= 96; i++){
    var a = i / 96 * Math.PI * 2;
    pts.push(new THREE.Vector3(cr * Math.cos(a), y, cr * Math.sin(a)));
  }
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  var mat = dashed
    ? new THREE.LineDashedMaterial({ color: color, dashSize: 0.07, gapSize: 0.05 })
    : new THREE.LineBasicMaterial({ color: color });
  var line = new THREE.Line(geo, mat);
  if (dashed) line.computeLineDistances();
  return line;
}

function scLngCircle(lng, r, color){
  var pts = [];
  for (var i = 0; i <= 96; i++){
    var lat = -90 + i / 96 * 180;
    pts.push(scLatLngToVec(lat, lng, r));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: color })
  );
}

function renderGlobe(inner, step){
  if (typeof THREE === 'undefined'){ renderConcept(inner, step); return; }
  scDestroyGlobe();
  var mode = step.mode || 'rotation';

  inner.innerHTML =
    '<div class="sc-globe-frame">' +
      '<div id="sc-globe-canvas"></div>' +
      '<div class="sc-globe-title"><div class="t"></div></div>' +
      '<div class="sc-globe-hint">\u270B drag to turn the Earth</div>' +
      '<div class="sc-globe-legend" id="sc-globe-legend" style="display:none;"></div>' +
      '<div class="sc-globe-season" id="sc-globe-season" style="display:none;"></div>' +
    '</div>';
  inner.querySelector('.sc-globe-title .t').textContent = step.title;

  var wrap = document.getElementById('sc-globe-canvas');
  var W = wrap.clientWidth || 800, H = wrap.clientHeight || 500;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  wrap.appendChild(renderer.domElement);

  /* starfield */
  var starGeo = new THREE.BufferGeometry();
  var starPos = [];
  for (var i = 0; i < 350; i++){
    var a1 = Math.random() * Math.PI * 2, a2 = Math.acos(2 * Math.random() - 1);
    var rr = 30;
    starPos.push(rr * Math.sin(a2) * Math.cos(a1), rr * Math.cos(a2), rr * Math.sin(a2) * Math.sin(a1));
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.7 })));

  /* Earth (inside a tilt group so the axis can lean 23.5\u00B0) */
  var R = 2;
  var earthGroup = new THREE.Group();
  var earthMat = new THREE.MeshPhongMaterial({ color: 0x2a6fd6, shininess: 12 });
  var earth = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 48), earthMat);
  earthGroup.add(earth);

  /* real Earth texture — graceful fallback keeps the blue globe */
  new THREE.TextureLoader().load(
    'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    function(tex){ earthMat.map = tex; earthMat.color.set(0xffffff); earthMat.needsUpdate = true; },
    undefined,
    function(){ /* keep fallback colour */ }
  );

  /* markers ride on the earth so they rotate with it */
  (step.markers || []).forEach(function(m){
    var p = scLatLngToVec(m.lat, m.lng, R + 0.02);
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), new THREE.MeshBasicMaterial({ color: 0xFFD86A }));
    dot.position.copy(p);
    earth.add(dot);
    var lbl = scMakeSprite(m.name, '#FFD86A');
    lbl.position.copy(scLatLngToVec(m.lat, m.lng, R + 0.45));
    earth.add(lbl);
  });

  var legend = document.getElementById('sc-globe-legend');
  var seasonBox = document.getElementById('sc-globe-season');

  if (mode === 'latlong'){
    earth.add(scLatCircle(0, R + 0.01, 0xFFD86A));                 /* Equator */
    earth.add(scLatCircle(23.5, R + 0.01, 0xfb923c, true));        /* Tropic of Cancer */
    earth.add(scLatCircle(-23.5, R + 0.01, 0xfb923c, true));       /* Tropic of Capricorn */
    [30,60,-30,-60].forEach(function(lt){ earth.add(scLatCircle(lt, R + 0.005, 0x6a86b8)); });
    earth.add(scLngCircle(0, R + 0.01, 0x4ade80));                 /* Prime Meridian */
    for (var lg = -150; lg <= 180; lg += 30){ if (lg !== 0) earth.add(scLngCircle(lg, R + 0.005, 0x3a527a)); }
    legend.style.display = 'block';
    legend.innerHTML =
      '<div><span class="sw" style="background:#FFD86A;"></span>Equator (0\u00B0)</div>' +
      '<div><span class="sw" style="background:#fb923c;"></span>Tropics (23.5\u00B0 N &amp; S)</div>' +
      '<div><span class="sw" style="background:#4ade80;"></span>Prime Meridian (0\u00B0)</div>' +
      '<div><span class="sw" style="background:#6a86b8;"></span>Other latitudes &amp; longitudes</div>';
  }

  /* ── HEMISPHERES: the two halves shown in different colours ── */
  if (mode === 'hemispheres'){
    var eastWest = /east|west|prime meridian|longitude/i.test(String(step.title || '') + ' ' + String(step.speech || ''));
    var capA = new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.012, 48, 48, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.34, side: THREE.DoubleSide })
    );
    var capB = new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.012, 48, 48, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.34, side: THREE.DoubleSide })
    );
    if (eastWest){ capA.rotation.z = Math.PI / 2; capB.rotation.z = Math.PI / 2; }
    earth.add(capA); earth.add(capB);
    earth.add(scLatCircle(0, R + 0.02, 0xFFD86A));
    earth.add(scLngCircle(0, R + 0.02, 0xFFD86A));
    var nA = scMakeSprite(eastWest ? 'Eastern' : 'Northern', '#4ade80');
    nA.position.copy(scLatLngToVec(eastWest ? 0 : 55, eastWest ? 80 : 0, R + 0.75));
    earth.add(nA);
    var nB = scMakeSprite(eastWest ? 'Western' : 'Southern', '#fb923c');
    nB.position.copy(scLatLngToVec(eastWest ? 0 : -55, eastWest ? -80 : 0, R + 0.75));
    earth.add(nB);
    legend.style.display = 'block';
    legend.innerHTML = eastWest
      ? '<div><span class="sw" style="background:#4ade80;"></span>Eastern Hemisphere</div>' +
        '<div><span class="sw" style="background:#fb923c;"></span>Western Hemisphere</div>' +
        '<div><span class="sw" style="background:#FFD86A;"></span>Prime Meridian (0\u00B0) divides them</div>'
      : '<div><span class="sw" style="background:#4ade80;"></span>Northern Hemisphere</div>' +
        '<div><span class="sw" style="background:#fb923c;"></span>Southern Hemisphere</div>' +
        '<div><span class="sw" style="background:#FFD86A;"></span>Equator (0\u00B0) divides them</div>';
  }

  /* ── HEAT ZONES: Torrid, Temperate, Frigid as coloured bands ── */
  if (mode === 'heatzones'){
    var bands = [
      { a: -23.5, b:  23.5, c: 0xef4444 },
      { a:  23.5, b:  66.5, c: 0x4ade80 },
      { a: -66.5, b: -23.5, c: 0x4ade80 },
      { a:  66.5, b:  90,   c: 0x93c5fd },
      { a: -90,   b: -66.5, c: 0x93c5fd }
    ];
    bands.forEach(function(bd){
      var p0 = (90 - bd.b) * Math.PI / 180;
      var p1 = (90 - bd.a) * Math.PI / 180;
      earth.add(new THREE.Mesh(
        new THREE.SphereGeometry(R + 0.012, 48, 32, 0, Math.PI * 2, p0, Math.max(0.001, p1 - p0)),
        new THREE.MeshBasicMaterial({ color: bd.c, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
      ));
    });
    [23.5, -23.5, 66.5, -66.5].forEach(function(lt){ earth.add(scLatCircle(lt, R + 0.022, 0xffffff, true)); });
    earth.add(scLatCircle(0, R + 0.024, 0xFFD86A));
    var tzl = scMakeSprite('Torrid Zone', '#ef4444');
    tzl.position.copy(scLatLngToVec(0, 40, R + 0.6));
    earth.add(tzl);
    legend.style.display = 'block';
    legend.innerHTML =
      '<div><span class="sw" style="background:#ef4444;"></span>Torrid \u2014 hottest, near the Equator</div>' +
      '<div><span class="sw" style="background:#4ade80;"></span>Temperate \u2014 moderate</div>' +
      '<div><span class="sw" style="background:#93c5fd;"></span>Frigid \u2014 coldest, near the poles</div>';
  }

  /* ── TIME ZONES: 24 wedges of 15 degrees each ── */
  if (mode === 'timezones'){
    for (var tz = 0; tz < 24; tz++){
      var lngStart = -180 + tz * 15;
      earth.add(new THREE.Mesh(
        new THREE.SphereGeometry(R + 0.012, 12, 40,
          (lngStart + 180) * Math.PI / 180, 15 * Math.PI / 180, 0, Math.PI),
        new THREE.MeshBasicMaterial({
          color: (tz % 2 === 0) ? 0x60a5fa : 0xfbbf24,
          transparent: true, opacity: 0.3, side: THREE.DoubleSide
        })
      ));
    }
    earth.add(scLngCircle(0, R + 0.024, 0x4ade80));
    earth.add(scLngCircle(82.5, R + 0.024, 0xFFD86A));
    var istLbl = scMakeSprite('IST 82.5\u00B0E', '#FFD86A');
    istLbl.position.copy(scLatLngToVec(24, 82.5, R + 0.6));
    earth.add(istLbl);
    legend.style.display = 'block';
    legend.innerHTML =
      '<div>The Earth is divided into <b>24 time zones</b>.</div>' +
      '<div>Each wedge is <b>15\u00B0</b> wide = <b>1 hour</b>.</div>' +
      '<div><span class="sw" style="background:#4ade80;"></span>Prime Meridian (0\u00B0)</div>' +
      '<div><span class="sw" style="background:#FFD86A;"></span>Indian Standard Time (82.5\u00B0E)</div>';
  }

  /* ── DATE LINE: the 180 degree meridian, and the date change ── */
  if (mode === 'dateline'){
    earth.add(new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.012, 40, 40, 0, Math.PI, 0, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
    ));
    earth.add(new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.012, 40, 40, Math.PI, Math.PI, 0, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
    ));
    earth.add(scLngCircle(180, R + 0.03, 0xffffff));
    earth.add(scLngCircle(0, R + 0.024, 0x4ade80));
    var dlLbl = scMakeSprite('Date Line 180\u00B0', '#ffffff');
    dlLbl.position.copy(scLatLngToVec(12, 180, R + 0.7));
    earth.add(dlLbl);
    var todayLbl = scMakeSprite('Today', '#f472b6');
    todayLbl.position.copy(scLatLngToVec(-30, 150, R + 0.55));
    earth.add(todayLbl);
    var yestLbl = scMakeSprite('Yesterday', '#60a5fa');
    yestLbl.position.copy(scLatLngToVec(-30, -150, R + 0.55));
    earth.add(yestLbl);
    legend.style.display = 'block';
    legend.innerHTML =
      '<div>The <b>International Date Line</b> runs near 180\u00B0.</div>' +
      '<div><span class="sw" style="background:#f472b6;"></span>Cross it going west \u2014 you lose a day</div>' +
      '<div><span class="sw" style="background:#93c5fd;"></span>Cross it going east \u2014 you gain a day</div>';
  }

  var sunMesh = null, orbitAngle = 0;
  if (mode === 'daynight'){
    scene.add(new THREE.AmbientLight(0xffffff, 0.12));
    var sun = new THREE.DirectionalLight(0xfff3d0, 1.35);
    sun.position.set(8, 1.2, 2);
    scene.add(sun);
    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 24), new THREE.MeshBasicMaterial({ color: 0xFFE484 }));
    sunMesh.position.set(8, 1.2, 2);
    scene.add(sunMesh);
    var sunLbl = scMakeSprite('\u2600 Sun', '#FFE484');
    sunLbl.position.set(8, 2.2, 2);
    scene.add(sunLbl);
    legend.style.display = 'block';
    legend.innerHTML = 'The lit half faces the Sun \u2014 <b>day</b>.<br/>The dark half faces away \u2014 <b>night</b>.<br/>One full spin = 24 hours.';
    earthGroup.rotation.z = 23.5 * Math.PI / 180;
  } else if (mode === 'seasons'){
    scene.add(new THREE.AmbientLight(0xffffff, 0.14));
    var pl = new THREE.PointLight(0xfff3d0, 1.5, 0);
    pl.position.set(0, 0, 0);
    scene.add(pl);
    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 28, 28), new THREE.MeshBasicMaterial({ color: 0xFFE484 }));
    scene.add(sunMesh);
    var sl = scMakeSprite('\u2600 Sun', '#FFE484');
    sl.position.set(0, 1.6, 0);
    scene.add(sl);
    earthGroup.rotation.z = 23.5 * Math.PI / 180;   /* axis stays leaning the SAME way all year */
    /* axis rod through the poles */
    var axis = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, R * 2.8, 8), new THREE.MeshBasicMaterial({ color: 0xFFD86A }));
    earthGroup.add(axis);
    seasonBox.style.display = 'block';
  } else {
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    var dl = new THREE.DirectionalLight(0xffffff, 0.9);
    dl.position.set(5, 3, 4);
    scene.add(dl);
    earthGroup.rotation.z = 23.5 * Math.PI / 180;
  }

  scene.add(earthGroup);
  camera.position.set(0, 0.6, mode === 'seasons' ? 11 : 6);
  camera.lookAt(0, 0, 0);

  /* drag to rotate */
  var dragging = false, px = 0, py = 0, userY = 0, userX = 0;
  wrap.addEventListener('pointerdown', function(e){ dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointermove', function(e){
    if (!dragging) return;
    userY += (e.clientX - px) * 0.005;
    userX += (e.clientY - py) * 0.003;
    userX = Math.max(-0.9, Math.min(0.9, userX));
    px = e.clientX; py = e.clientY;
  });

  var myIdx = CUR;
  var seasonNames = ['June \u2014 \u2600 Summer in the North \u00B7 Winter in the South',
                     'September \u2014 \uD83C\uDF42 Autumn in the North \u00B7 Spring in the South',
                     'December \u2014 \u2744 Winter in the North \u00B7 Summer in the South',
                     'March \u2014 \uD83C\uDF38 Spring in the North \u00B7 Autumn in the South'];

  function frame(){
    if (CUR !== myIdx || !scGlobe){ return; }
    earth.rotation.y += 0.004;
    if (mode === 'seasons'){
      orbitAngle += 0.0035;
      earthGroup.position.set(6.5 * Math.cos(orbitAngle), 0, 6.5 * Math.sin(orbitAngle));
      var q = Math.floor(((orbitAngle % (Math.PI * 2)) / (Math.PI * 2)) * 4) % 4;
      seasonBox.textContent = seasonNames[q];
    }
    earthGroup.rotation.y = userY;
    earthGroup.rotation.x = userX;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    scGlobe.raf = requestAnimationFrame(frame);
  }
  scGlobe = { renderer: renderer, raf: 0, canvasWrap: wrap };
  scGlobe.raf = requestAnimationFrame(frame);
}

/* ── VOICE (Monika via voice-class, browser fallback) ── */
function scStopAudio(){
  if (scAudio){ try{ scAudio.pause(); }catch(e){} scAudio = null; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  scUtter = null;
}

function scSpeak(text){
  scStopAudio();
  clearTimeout(scAdvanceTimer);
  if (!text || !String(text).trim()){ scScheduleAdvance(3); return; }
  var seq = ++scSpeakSeq;
  if (!voiceOn){
    scScheduleAdvance(Math.max(4, String(text).split(/\s+/).length * 0.42));
    return;
  }
  fetch('/api/voice-class', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: String(text), cls: LESSON.cls })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (seq !== scSpeakSeq || !voiceOn) return;
    if (d && d.audio_b64){
      scAudio = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
      scAudio.playbackRate = scRate();
      scAudio.onended = function(){ scAudio = null; if (seq === scSpeakSeq) scScheduleAdvance(1.2); };
      scAudio.play().catch(function(){ scSpeakBrowser(text, seq); });
    } else {
      scSpeakBrowser(text, seq);
    }
  }).catch(function(){ if (seq === scSpeakSeq && voiceOn) scSpeakBrowser(text, seq); });
}

function scSpeakBrowser(text, seq){
  if (!('speechSynthesis' in window)){ scScheduleAdvance(Math.max(4, text.split(/\s+/).length * 0.42)); return; }
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-IN'; u.rate = scRate(); u.pitch = 1.05;
  u.onend = function(){ if (seq === scSpeakSeq) scScheduleAdvance(1.2); };
  scUtter = u;
  window.speechSynthesis.speak(u);
}

function scRate(){ return parseFloat(document.getElementById('speed-sel').value) || 0.95; }

function scScheduleAdvance(sec){
  clearTimeout(scAdvanceTimer);
  // A recall step waits for the class to answer out loud. Only the teacher
  // moves it on - auto-advancing here would defeat the whole point.
  if (STEPS[CUR] && STEPS[CUR].type === 'recall') return;
  scAdvanceTimer = setTimeout(function(){
    if (isPaused) return;
    if (CUR < STEPS.length - 1) scRender(CUR + 1);
    else scShowComplete();
  }, sec * 1000);
}

/* ── CONTROLS ── */
function scNext(){
  if (CUR >= STEPS.length - 1){ scShowComplete(); return; }
  scRender(CUR + 1);
}

/* --- TAMIL v2 helpers: conversational teacher, book words kept as printed (31-07-2026) --- */
function scTmClassNum(){
  var s = String((typeof LESSON !== 'undefined' && LESSON.cls) || '').toLowerCase();
  if (/pre.?kg|lkg|ukg|nursery|\bkg\b/.test(s)) return 0;
  var m = s.match(/\d+/);
  return m ? parseInt(m[0], 10) : 8;
}
var SC_TM_STOP = ' the and for are but not you all any can her was one our out day get has him his how man new now old see two way who did its let put say she too use with this that from they have been will your what when them then than were said each which their time about would there could other into more some only over also back after most such very just because being does off per via upon many much both same next last make made take then here where while these those been very much what will your ';
function scTmKeyTerms(material){
  var seen = {}, out = [];
  var words = String(material).match(/[A-Za-z][A-Za-z\-']{3,}/g) || [];
  for (var i = 0; i < words.length; i++){
    var w = words[i], lw = w.toLowerCase();
    if (SC_TM_STOP.indexOf(' ' + lw + ' ') !== -1) continue;
    if (seen[lw]) continue;
    seen[lw] = 1; out.push(w);
    if (out.length >= 18) break;
  }
  return out.join(', ');
}

function scTamilKey(material){
  var h = 0;
  for (var i = 0; i < material.length; i++){ h = ((h << 5) - h + material.charCodeAt(i)) | 0; }
  return 'sc2_' + Math.abs(h).toString(36);
}

      if (!tamil){
        var why = (d && (d.message || (d.error && (d.error.message || d.error)))) || 'no text returned';
        if (typeof why !== 'string') why = JSON.stringify(why);
        throw new Error('text step \u2014 ' + why.substring(0, 180));
      }
      var audRes = await fetch('/api/explain-tamil', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: tamil, cache_key: key })
      });
      var a = await audRes.json();
      var audioUrl = null;
      if (a && a.audio_url) audioUrl = a.audio_url;
      else if (a && a.audio_b64) audioUrl = 'data:audio/mpeg;base64,' + a.audio_b64;
      if (!audioUrl){
        var vErr = (a && a.error) ? String(a.error) : 'no audio returned';
        throw new Error('voice step \u2014 ' + vErr.substring(0, 180));
      }
      entry = { text: tamil, audioUrl: audioUrl };
      SC_TAMIL_CACHE[key] = entry;
    }

    txtEl.textContent = entry.text;
    /* voice-only mode: Tamil popup box intentionally not shown (23-07-2026) */

    SC_TAMIL_AUDIO.playbackRate = scRate();
    SC_TAMIL_AUDIO.onended = function(){ SC_TAMIL_AUDIO = null; };
    SC_TAMIL_AUDIO.play().catch(function(e){ alert('Tamil audio could not play \u2014 ' + e.message); });
  }catch(e){
    alert('Tamil explanation failed \u2014 ' + e.message);
  }finally{
    btn.disabled = false; btn.innerHTML = '\uD83C\uDDEE\uD83C\uDDF3 \u0BA4\u0BAE\u0BBF\u0BB4\u0BCD';
  }
}

async function scPlanKey(){
  var data = 'v4|' + LESSON.subject + '|' + LESSON.cls + '|' + LESSON.topic + '|' + LESSON.text.substring(0, 8000);
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
  return Array.from(new Uint8Array(buf)).slice(0, 20)
    .map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}
