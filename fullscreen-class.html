<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Classroom — DigiSmartSchool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;700;800&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6B1A1A; --maroon-dark:#3F0D0D; --maroon-mid:#8B2424;
    --gold:#C9A84C; --gold-light:#E5C66F; --gold-dark:#A88636;
    --sandal:#E8C99A; --cream:#F5EEDC;
    --bg-warm:#FFF8E7;        /* warm cream background */
    --bg-soft:#FFFBF0;        /* even softer cream */
    --text-dark:#3D2817;       /* warm dark brown for text */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg-warm);font-family:'Nunito',sans-serif;color:var(--text-dark);}

  /* ── TOP BAR ── */
  .top-bar{position:fixed;top:0;left:0;right:0;height:60px;background:linear-gradient(180deg,var(--maroon),var(--maroon-mid));display:flex;align-items:center;padding:0 20px;z-index:100;border-bottom:3px solid var(--gold);box-shadow:0 2px 12px rgba(107,26,26,0.2);}
  .top-bar .logo{display:flex;align-items:center;gap:10px;}
  .top-bar h1{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold-light);font-weight:700;letter-spacing:1px;}
  .top-bar .info{font-size:0.82rem;color:var(--cream);margin-left:14px;opacity:0.95;}
  .top-bar .exit-btn{margin-left:auto;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.4);color:white;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.85rem;}
  .top-bar .exit-btn:hover{background:rgba(255,255,255,0.25);}

  /* ── MAIN STAGE: PDF Page ── */
  .stage{position:fixed;top:60px;bottom:90px;left:0;right:0;background:linear-gradient(135deg,#FFF8E7,#FFE9C2);display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;}
  .stage canvas{max-width:100%;max-height:100%;box-shadow:0 8px 30px rgba(107,26,26,0.18),0 0 0 4px white,0 0 0 5px var(--gold-dark);background:white;border-radius:4px;}

  /* ── LOADING ── */
  .loading{position:fixed;inset:0;background:linear-gradient(135deg,#FFF8E7,#FFE9C2,#FFDAA0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;}
  .loading .spinner{width:60px;height:60px;border:5px solid rgba(107,26,26,0.15);border-top-color:var(--maroon);border-radius:50%;animation:spin 1s linear infinite;}
  .loading h2{font-family:'Cinzel',serif;color:var(--maroon);margin-top:24px;font-size:1.3rem;letter-spacing:2px;}
  .loading p{color:var(--maroon-mid);margin-top:8px;font-size:0.85rem;opacity:0.85;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── NO LESSON ── */
  .no-lesson{position:fixed;inset:0;background:linear-gradient(135deg,#FFF8E7,#FFE9C2);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:400;padding:30px;text-align:center;}
  .no-lesson.on{display:flex;}
  .no-lesson h2{font-family:'Cinzel',serif;color:var(--maroon);font-size:1.4rem;margin-bottom:12px;}
  .no-lesson p{color:var(--maroon-mid);font-size:0.95rem;max-width:500px;line-height:1.6;margin-bottom:24px;}
  .no-lesson .back-btn{padding:12px 28px;background:linear-gradient(135deg,var(--maroon),var(--maroon-mid));color:var(--gold-light);border:1.5px solid var(--gold-dark);border-radius:10px;cursor:pointer;font-weight:800;font-size:0.95rem;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(107,26,26,0.25);}

  /* ── CURRENT PARA OVERLAY ── */
  .current-para{position:fixed;left:20px;right:20px;bottom:100px;max-width:900px;margin:0 auto;background:rgba(255,251,240,0.97);backdrop-filter:blur(8px);border:2px solid var(--gold);border-radius:14px;padding:14px 20px;color:var(--text-dark);font-size:0.95rem;line-height:1.55;display:none;z-index:50;box-shadow:0 8px 30px rgba(107,26,26,0.2);}
  .current-para.on{display:block;}
  .current-para .lbl{font-size:0.7rem;color:var(--maroon);font-weight:800;letter-spacing:1.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .current-para .lbl .dot{width:8px;height:8px;background:#1a5c2a;border-radius:50%;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .current-para.tamil{font-family:'Noto Sans Tamil',sans-serif;border-color:#2d8043;background:rgba(240,255,240,0.97);}
  .current-para.tamil .lbl{color:#1a5c2a;}

  /* ── BOTTOM TOOLBAR ── */
  .toolbar{position:fixed;bottom:0;left:0;right:0;height:90px;background:linear-gradient(0deg,var(--maroon),var(--maroon-mid));border-top:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;box-shadow:0 -4px 18px rgba(107,26,26,0.2);}
  .tb-left,.tb-center,.tb-right{display:flex;align-items:center;gap:10px;}
  .tb-center{flex:1;justify-content:center;}
  .tb-btn{padding:10px 18px;background:linear-gradient(135deg,#FFF8E7,#FFE9C2);color:var(--maroon);border:1.5px solid var(--gold-dark);border-radius:10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;display:flex;align-items:center;gap:6px;transition:all 0.15s;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
  .tb-btn:hover:not(:disabled){background:linear-gradient(135deg,white,#FFF8E7);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,0.15);}
  .tb-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .tb-btn.tamil{background:linear-gradient(135deg,#d4edda,#b8e0c2);color:#0d3320;border-color:#3b8d4c;}
  .tb-btn.tamil:hover:not(:disabled){background:linear-gradient(135deg,#e9f7ec,#d4edda);}
  .tb-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--maroon-dark);border-color:var(--gold-dark);font-weight:900;}
  .tb-btn.primary.glow{animation:glow 1.5s infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(229,198,111,0.4);}50%{box-shadow:0 0 20px rgba(229,198,111,0.9);}}
  .tb-btn.icon{padding:10px 14px;min-width:46px;justify-content:center;}
  .page-info{color:var(--cream);font-size:0.85rem;font-weight:700;padding:0 14px;}
  .page-info .current{color:var(--gold-light);font-size:1.1rem;}

  /* Para indicator dots */
  .para-dots{display:flex;gap:5px;padding:0 14px;}
  .para-dots .pd{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.25);transition:all 0.2s;}
  .para-dots .pd.done{background:var(--gold);}
  .para-dots .pd.active{background:var(--gold-light);transform:scale(1.4);box-shadow:0 0 8px var(--gold-light);}

  /* Helper: status pill */
  .status-pill{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:white;border:2px solid var(--gold);color:var(--maroon);padding:8px 18px;border-radius:20px;font-size:0.82rem;font-weight:800;z-index:60;display:none;box-shadow:0 4px 14px rgba(0,0,0,0.15);}
  .status-pill.on{display:block;}

  @media (max-width:768px){
    .top-bar h1{font-size:0.95rem;}
    .top-bar .info{display:none;}
    .tb-btn{padding:9px 12px;font-size:0.75rem;}
    .tb-btn.icon{padding:9px 11px;min-width:40px;}
    .page-info{font-size:0.75rem;padding:0 8px;}
    .para-dots{display:none;}
    .current-para{font-size:0.85rem;bottom:95px;}
  }
</style>
</head>
<body>

<!-- ── LOADING ── -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <h2>PREPARING CLASS</h2>
  <p id="loading-status">Loading textbook…</p>
</div>

<!-- ── NO LESSON ── -->
<div class="no-lesson" id="no-lesson">
  <h2>📚 No Lesson Activated</h2>
  <p>Please go to <b>Teacher Panel → My Books</b>, select a book, choose subject and pages, then click <b>Go to Teach Tab</b>.</p>
  <button class="back-btn" onclick="goBack()">← Back to Teacher Panel</button>
</div>

<!-- ── TOP BAR ── -->
<div class="top-bar" id="top-bar" style="display:none;">
  <div class="logo">
    <h1 id="bar-subject">Classroom</h1>
  </div>
  <div class="info" id="bar-info"></div>
  <button class="exit-btn" onclick="goBack()">✕ Exit Class</button>
</div>

<!-- ── STATUS PILL (small notification) ── -->
<div class="status-pill" id="status-pill"></div>

<!-- ── MAIN STAGE: PDF Page ── -->
<div class="stage" id="stage" style="display:none;">
  <canvas id="pdf-canvas"></canvas>
</div>

<!-- ── CURRENT PARAGRAPH OVERLAY ── -->
<div class="current-para" id="current-para">
  <div class="lbl"><span class="dot"></span><span id="para-lbl">📖 Now reading</span></div>
  <div id="para-text"></div>
</div>

<!-- ── BOTTOM TOOLBAR ── -->
<div class="toolbar" id="toolbar" style="display:none;">
  <div class="tb-left">
    <button class="tb-btn icon" id="btn-prev" onclick="prevPage()" title="Previous Page">◀</button>
    <div class="page-info"><span class="current" id="pg-current">1</span> <span style="opacity:0.5;">/</span> <span id="pg-total">1</span></div>
  </div>
  <div class="tb-center">
    <button class="tb-btn" id="btn-replay" onclick="replayPara()">↩ Replay</button>
    <button class="tb-btn" id="btn-pause" onclick="togglePause()">⏸ Pause</button>
    <button class="tb-btn tamil" id="btn-tamil" onclick="explainTamil()">🇮🇳 தமிழ் Explanation</button>
    <div class="para-dots" id="para-dots"></div>
  </div>
  <div class="tb-right">
    <button class="tb-btn primary" id="btn-next" onclick="nextPage()">Next Page ▶</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── STATE ──
var LESSON={ subject:'', cls:'', topic:'', lessonText:'', pdfKey:'', pageFrom:0, pageTo:0 };
var PDF_DOC=null;
var CURRENT_PAGE=1;
var TOTAL_PAGES=1;

// Paragraphs grouped by page: { 99: ["para1","para2"], 100: [...] }
var PARAS_BY_PAGE={};
var CURRENT_PARA_IDX=0;
var IS_PAUSED=false;
var IS_PLAYING_TAMIL=false;
var CURRENT_AUDIO=null;

// ── HELPERS ──
function $(id){ return document.getElementById(id); }
function showStatus(msg, duration){
  var p=$('status-pill'); p.textContent=msg; p.classList.add('on');
  setTimeout(function(){ p.classList.remove('on'); }, duration||2500);
}
function setLoadingStatus(msg){ var el=$('loading-status'); if(el)el.textContent=msg; }

function goBack(){
  if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();}catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}
  var ret='learnbot.html';
  try{ var r=sessionStorage.getItem('fc_returnUrl'); if(r)ret=r; }catch(e){}
  window.location.href=ret;
}

// ── PARSE TEXT INTO PARAGRAPHS BY PAGE ──
function parseLessonText(text){
  var pageRegex=/\[Page\s+(\d+)\]/gi;
  var matches=[];
  var m;
  while((m=pageRegex.exec(text))!==null){
    matches.push({ page:parseInt(m[1]), index:m.index, end:m.index+m[0].length });
  }
  if(!matches.length){
    PARAS_BY_PAGE[1]=splitParas(text);
    return;
  }
  for(var i=0;i<matches.length;i++){
    var startIdx=matches[i].end;
    var endIdx=(i+1<matches.length)?matches[i+1].index:text.length;
    var pageContent=text.substring(startIdx, endIdx).trim();
    var pageNum=matches[i].page;
    var paras=splitParas(pageContent);
    if(paras.length){
      PARAS_BY_PAGE[pageNum]=(PARAS_BY_PAGE[pageNum]||[]).concat(paras);
    }
  }
}

function splitParas(text){
  // Split into paragraphs - merge short fragments
  var raw=text.split(/\n\s*\n|\n(?=[A-Z])/);
  var paras=[];
  var buffer='';
  raw.forEach(function(p){
    p=p.trim();
    if(!p)return;
    if(buffer.length>0 && buffer.length<60){
      buffer+=' '+p;
    } else {
      if(buffer)paras.push(buffer);
      buffer=p;
    }
  });
  if(buffer)paras.push(buffer);
  return paras.filter(function(p){ return p.length>15; });
}

// ── INDEXEDDB ──
var IDB=null;
function openIDB(){
  return new Promise(function(resolve){
    var req=indexedDB.open('dss_textbooks',1);
    req.onupgradeneeded=function(e){ try{ e.target.result.createObjectStore('pdfs',{keyPath:'key'}); }catch(err){} };
    req.onsuccess=function(e){ IDB=e.target.result; resolve(true); };
    req.onerror=function(){ resolve(false); };
  });
}
function loadPdfFromIDB(key){
  return new Promise(function(resolve){
    if(!IDB){ resolve(null); return; }
    try{
      var tx=IDB.transaction('pdfs','readonly');
      var req=tx.objectStore('pdfs').get(key);
      req.onsuccess=function(e){ resolve(e.target.result||null); };
      req.onerror=function(){ resolve(null); };
    }catch(e){ resolve(null); }
  });
}

// ── RENDER PDF PAGE ──
async function renderPage(pageNum){
  if(!PDF_DOC)return;
  if(pageNum<1)pageNum=1;
  if(pageNum>TOTAL_PAGES)pageNum=TOTAL_PAGES;
  CURRENT_PAGE=pageNum;
  try{
    var page=await PDF_DOC.getPage(pageNum);
    var canvas=$('pdf-canvas');
    var ctx=canvas.getContext('2d');
    var stageH=$('stage').clientHeight;
    var stageW=$('stage').clientWidth;
    var rawVp=page.getViewport({scale:1});
    var scale=Math.min(stageH/rawVp.height, stageW/rawVp.width)*0.96;
    if(scale<0.5)scale=0.5;
    var vp=page.getViewport({scale:scale});
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    $('pg-current').textContent=pageNum;
    updateButtons();
    updateParaDots();
  }catch(e){ console.log('Render err:',e); }
}

function updateButtons(){
  $('btn-prev').disabled=(CURRENT_PAGE<=LESSON.pageFrom);
  // Next page button — keep enabled, even at last page user can exit
  $('btn-next').disabled=false;
}

function updateParaDots(){
  var dots=$('para-dots');
  dots.innerHTML='';
  var paras=PARAS_BY_PAGE[CURRENT_PAGE]||[];
  for(var i=0;i<paras.length;i++){
    var d=document.createElement('div');
    d.className='pd';
    if(i<CURRENT_PARA_IDX)d.classList.add('done');
    if(i===CURRENT_PARA_IDX)d.classList.add('active');
    dots.appendChild(d);
  }
}

// ── VOICE: ELEVENLABS via /api/voice-class ──
async function speakEnglish(text){
  if(IS_PAUSED || IS_PLAYING_TAMIL)return;
  try{
    var res=await fetch('/api/voice-class',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ text:text, cls:LESSON.cls })
    });
    var data=await res.json();
    if(data && data.audio_b64){
      await playAudio('data:audio/mpeg;base64,'+data.audio_b64);
    } else {
      // Fallback to browser TTS
      console.log('ElevenLabs unavailable, using browser voice');
      await speakBrowser(text, 'en');
    }
  }catch(e){
    console.log('ElevenLabs failed, using browser voice:',e);
    await speakBrowser(text, 'en');
  }
}

function playAudio(url){
  return new Promise(function(resolve){
    try{
      if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();}catch(e){} }
      CURRENT_AUDIO=new Audio(url);
      CURRENT_AUDIO.onended=function(){ CURRENT_AUDIO=null; resolve(); };
      CURRENT_AUDIO.onerror=function(){ CURRENT_AUDIO=null; resolve(); };
      CURRENT_AUDIO.play().catch(function(){ resolve(); });
    }catch(e){ resolve(); }
  });
}

function speakBrowser(text, lang){
  return new Promise(function(resolve){
    try{
      var u=new SpeechSynthesisUtterance(text);
      u.lang=lang==='ta'?'ta-IN':'en-IN';
      u.rate=0.95; u.pitch=1.0; u.volume=1;
      // Try to pick a clear voice
      var voices=speechSynthesis.getVoices();
      var pref=voices.find(function(v){
        if(lang==='ta')return /tamil|ta-/i.test(v.lang+v.name);
        return /heera|samantha|google.*english|microsoft.*en/i.test(v.name);
      });
      if(pref)u.voice=pref;
      u.onend=function(){ resolve(); };
      u.onerror=function(){ resolve(); };
      speechSynthesis.speak(u);
    }catch(e){ resolve(); }
  });
}

// ── READ CURRENT PARAGRAPH ──
async function readCurrentPara(){
  var paras=PARAS_BY_PAGE[CURRENT_PAGE]||[];
  if(CURRENT_PARA_IDX>=paras.length){
    // All paragraphs on this page done — glow Next button
    $('current-para').classList.remove('on');
    $('btn-next').classList.add('glow');
    showStatus('✅ Page '+CURRENT_PAGE+' complete. Click "Next Page" to continue.', 4000);
    return;
  }
  var text=paras[CURRENT_PARA_IDX];
  // Show paragraph overlay
  $('current-para').classList.remove('tamil');
  $('current-para').classList.add('on');
  $('para-lbl').textContent='📖 Now reading';
  $('para-text').textContent=text;
  updateParaDots();
  // Speak
  await speakEnglish(text);
  // Auto move to next para after a pause
  if(IS_PAUSED || IS_PLAYING_TAMIL)return;
  setTimeout(function(){
    if(IS_PAUSED || IS_PLAYING_TAMIL)return;
    CURRENT_PARA_IDX++;
    readCurrentPara();
  }, 1200);
}

// ── TAMIL EXPLANATION ──
async function explainTamil(){
  var paras=PARAS_BY_PAGE[CURRENT_PAGE]||[];
  var paraIdx=Math.min(CURRENT_PARA_IDX, paras.length-1);
  if(paraIdx<0 || !paras[paraIdx]){ showStatus('No paragraph to explain'); return; }
  var paraText=paras[paraIdx];

  IS_PLAYING_TAMIL=true;
  // Pause English audio
  if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();}catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}

  $('btn-tamil').disabled=true;
  $('btn-tamil').textContent='⏳ தயாராகிறது…';
  $('current-para').classList.add('tamil');
  $('current-para').classList.add('on');
  $('para-lbl').innerHTML='<span class="dot"></span>🇮🇳 தமிழ் விளக்கம்';
  $('para-text').textContent='Generating Tamil explanation…';

  try{
    // Step 1: Ask AI to explain paragraph in Tamil with Tamil Nadu examples
    var aiRes=await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:'You are an experienced Tamil Nadu school teacher explaining concepts to students in TAMIL. The student is in '+LESSON.cls+' studying '+LESSON.subject+'. Explain the given paragraph in clear simple Tamil (தமிழ்). Add ONE relatable real-world example from Tamil Nadu context (mango tree, paddy field, Chennai, Madurai, local foods, etc.) only if needed for understanding. Keep it to 3-4 sentences. Output ONLY Tamil text — no English, no transliteration.',
        messages:[{role:'user',content:'Explain in Tamil:\n"'+paraText+'"'}],
        max_tokens:400
      })
    });
    var aiData=await aiRes.json();
    var tamilText='';
    if(aiData && aiData.content && aiData.content[0] && aiData.content[0].text){
      tamilText=aiData.content[0].text.trim();
    } else if(aiData && aiData.text){
      tamilText=aiData.text.trim();
    } else {
      throw new Error('No Tamil text generated');
    }
    $('para-text').textContent=tamilText;

    // Step 2: Get Tamil audio from /api/explain-tamil
    var audRes=await fetch('/api/explain-tamil',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        text:tamilText,
        cache_key:'fc_'+LESSON.pdfKey+'_p'+CURRENT_PAGE+'_para'+paraIdx
      })
    });
    var audData=await audRes.json();
    if(audData && audData.audio_url){
      await playAudio(audData.audio_url);
    } else if(audData && audData.audio_b64){
      await playAudio('data:audio/mpeg;base64,'+audData.audio_b64);
    } else {
      await speakBrowser(tamilText, 'ta');
    }
  } catch(e){
    $('para-text').textContent='Tamil explanation failed. Please try again.';
    console.log('Tamil err:',e);
  } finally {
    IS_PLAYING_TAMIL=false;
    $('btn-tamil').disabled=false;
    $('btn-tamil').innerHTML='🇮🇳 தமிழ் Explanation';
    $('current-para').classList.remove('tamil');
    // Show English paragraph back
    if(paras[paraIdx]){
      $('para-lbl').textContent='📖 Now reading';
      $('para-text').textContent=paras[paraIdx];
    }
  }
}

// ── CONTROLS ──
function togglePause(){
  IS_PAUSED=!IS_PAUSED;
  if(IS_PAUSED){
    $('btn-pause').innerHTML='▶ Resume';
    if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();}catch(e){} }
    try{ speechSynthesis.cancel(); }catch(e){}
  } else {
    $('btn-pause').innerHTML='⏸ Pause';
    if(CURRENT_AUDIO){ try{CURRENT_AUDIO.play();}catch(e){ readCurrentPara(); } }
    else { readCurrentPara(); }
  }
}

function replayPara(){
  if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();CURRENT_AUDIO=null;}catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}
  IS_PAUSED=false;
  $('btn-pause').innerHTML='⏸ Pause';
  readCurrentPara();
}

async function nextPage(){
  $('btn-next').classList.remove('glow');
  if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();CURRENT_AUDIO=null;}catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}
  var nextPg=CURRENT_PAGE+1;
  if(nextPg>LESSON.pageTo){
    showStatus('🎓 Lesson complete! Great job.', 4000);
    return;
  }
  await renderPage(nextPg);
  CURRENT_PARA_IDX=0;
  IS_PAUSED=false;
  $('btn-pause').innerHTML='⏸ Pause';
  setTimeout(readCurrentPara, 600);
}

async function prevPage(){
  if(CURRENT_AUDIO){ try{CURRENT_AUDIO.pause();CURRENT_AUDIO=null;}catch(e){} }
  try{ speechSynthesis.cancel(); }catch(e){}
  var prevPg=CURRENT_PAGE-1;
  if(prevPg<LESSON.pageFrom) return;
  await renderPage(prevPg);
  CURRENT_PARA_IDX=0;
  IS_PAUSED=false;
  $('btn-pause').innerHTML='⏸ Pause';
  setTimeout(readCurrentPara, 600);
}

// ── INIT ──
window.addEventListener('load', async function(){
  // Read lesson data from sessionStorage
  try{
    var raw=sessionStorage.getItem('tm_activated');
    if(raw){
      var d=JSON.parse(raw);
      LESSON.subject=d.subject||'';
      LESSON.cls=d.cls||'';
      LESSON.topic=d.topic||'';
      LESSON.lessonText=d.lessonText||'';
      LESSON.pdfKey=d.pdfKey||'';
      LESSON.pageFrom=d.pageFrom||0;
      LESSON.pageTo=d.pageTo||0;
    }
  }catch(e){}

  // Save return URL
  try{
    if(document.referrer && document.referrer.indexOf(window.location.host)>=0){
      sessionStorage.setItem('fc_returnUrl', document.referrer);
    }
  }catch(e){}

  if(!LESSON.subject || !LESSON.lessonText || !LESSON.pdfKey){
    $('loading').style.display='none';
    $('no-lesson').classList.add('on');
    return;
  }

  // Parse paragraphs by page
  parseLessonText(LESSON.lessonText);

  // Set UI
  $('bar-subject').textContent=LESSON.subject+' Class';
  $('bar-info').textContent=LESSON.cls+' · '+LESSON.topic+' · Pages '+LESSON.pageFrom+'–'+LESSON.pageTo;

  // Load PDF from IndexedDB
  setLoadingStatus('Opening textbook cache…');
  await openIDB();
  var saved=await loadPdfFromIDB(LESSON.pdfKey);
  if(!saved || !saved.data){
    $('loading').style.display='none';
    $('no-lesson').classList.add('on');
    $('no-lesson').querySelector('p').textContent='Textbook PDF not found in cache. Please go to Teacher Panel → My Books → re-select the book.';
    return;
  }

  setLoadingStatus('Loading textbook pages…');
  PDF_DOC=await pdfjsLib.getDocument({data:saved.data.slice(0)}).promise;
  TOTAL_PAGES=PDF_DOC.numPages;
  $('pg-total').textContent=LESSON.pageTo;

  // Render first page of selected range
  await renderPage(LESSON.pageFrom);

  // Hide loading, show class
  $('loading').style.display='none';
  $('top-bar').style.display='flex';
  $('stage').style.display='flex';
  $('toolbar').style.display='flex';

  // Wait briefly so PDF appears smoothly, then start reading
  setTimeout(function(){
    CURRENT_PARA_IDX=0;
    readCurrentPara();
  }, 800);
});

// Re-render PDF on window resize
window.addEventListener('resize', function(){
  if(PDF_DOC) renderPage(CURRENT_PAGE);
});
</script>

</html>
