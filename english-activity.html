<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity English — DigiSmartSchool</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   ACTIVITY ENGLISH — LKG to Class 2 (new page, Oct 2026)
   The chapter is run as short activities instead of a talk:
   read & repeat, "What do you say?", sing & act, Robo Says,
   letter sounds, odd one out, play time, notebook work.
   english-class.html is untouched; this page is opened from the
   English Class launcher only for LKG, UKG, Class 1 and Class 2.
   ══════════════════════════════════════════════════════════════ */
:root{
  --maroon:#6B1A1A; --maroon-dark:#4a1010; --gold:#C9A84C; --gold-deep:#a8862f;
  --sandal:#E8C99A; --paper:#FFF8EC; --ink:#3a1410; --leaf:#2F7D4F; --sky:#2f6fa8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--sandal);color:var(--ink);font-family:'Andika',sans-serif;overflow:hidden;}
.ta{font-family:'Noto Sans Tamil',sans-serif;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px;}

/* top bar */
#top{height:60px;background:var(--maroon);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--paper);}
#top .back{background:transparent;border:2px solid var(--gold);color:var(--paper);border-radius:10px;padding:7px 14px;font-size:0.95rem;font-weight:700;}
#top .cls{background:var(--gold);color:var(--maroon-dark);border-radius:999px;padding:4px 14px;font-weight:700;font-size:0.95rem;}
#top .chap{flex:1;min-width:0;font-size:1.35rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tog{background:transparent;border:2px solid rgba(232,201,154,0.5);color:var(--sandal);border-radius:10px;padding:7px 12px;font-size:0.9rem;font-weight:700;}
.tog.on{background:var(--sandal);color:var(--maroon-dark);border-color:var(--sandal);}

/* activity strip — the real order of today's class */
#acts{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;}
.act{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:rgba(255,248,236,0.55);border:2px solid transparent;border-radius:999px;padding:6px 14px 6px 8px;font-size:0.95rem;font-weight:700;color:var(--maroon);}
.act .ic{font-size:1.25rem;}
.act.done{opacity:0.55;}
.act.now{background:var(--paper);border-color:var(--maroon);}

/* stage */
#stage{position:absolute;top:118px;left:16px;right:16px;bottom:96px;background:var(--paper);border-radius:22px;box-shadow:0 6px 0 rgba(107,26,26,0.18);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px;text-align:center;}
.pic{width:min(62vw,820px);height:min(46vh,480px);border-radius:18px;background:#f3e6cf;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 1 auto;}
.pic img{width:100%;height:100%;object-fit:contain;animation:pop .5s ease both;}
.pic .wait{font-size:1rem;color:#9a7b52;}
.pic.err{background:#fbe9e4;}
.pic.err .wait{color:#8b2a1a;font-size:0.85rem;padding:12px;}
@keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}

.line{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:700;line-height:1.25;margin-top:16px;max-width:1100px;color:var(--ink);}
.bubble{display:inline-block;margin-top:12px;background:var(--maroon);color:var(--paper);border-radius:24px;padding:10px 26px;font-size:clamp(1.6rem,3.4vw,2.8rem);font-weight:700;}
.hint{margin-top:10px;font-size:clamp(1rem,1.7vw,1.35rem);color:#7a4a2a;}
.big-word{font-size:clamp(3rem,8vw,6.5rem);font-weight:700;line-height:1;margin-top:14px;letter-spacing:1px;}
.big-word b{color:var(--gold-deep);}
.letter{font-size:clamp(8rem,22vw,16rem);font-weight:700;line-height:1;color:var(--maroon);}
.letter small{font-size:0.45em;color:var(--gold-deep);margin-left:18px;}
.action-tag{display:inline-block;margin-top:10px;background:var(--leaf);color:#fff;border-radius:999px;padding:6px 22px;font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;}
.round-tag{position:absolute;top:16px;right:20px;background:var(--gold);color:var(--maroon-dark);border-radius:999px;padding:4px 16px;font-weight:700;}

/* "What do you say?" answer stays hidden until the reveal */
.answer{visibility:hidden;}
.revealed .answer{visibility:visible;animation:pop .45s ease both;}

/* odd one out */
.trio{display:flex;gap:18px;justify-content:center;align-items:stretch;flex-wrap:wrap;}
.trio .cell{width:min(26vw,300px);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;}
.trio .pic{width:100%;height:min(30vh,280px);}
.trio .w{font-size:clamp(1.4rem,2.8vw,2.3rem);font-weight:700;}
.trio .w b{color:var(--gold-deep);}
.revealed .trio .cell.odd::after{content:'\2715';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(22vw,240px);color:#c0392b;opacity:0.85;animation:pop .4s ease both;}

/* activity opener */
.opener .ic{font-size:clamp(5rem,12vw,9rem);line-height:1;}
.opener h2{font-size:clamp(2.2rem,5vw,4rem);color:var(--maroon);margin-top:10px;}
.opener .en{font-size:clamp(1.4rem,2.8vw,2.2rem);margin-top:10px;}
.opener .tl{font-size:clamp(1.1rem,2vw,1.6rem);margin-top:8px;color:#7a4a2a;}

/* play time & notebook — teacher runs it */
.steps{list-style:none;text-align:left;max-width:1000px;}
.steps li{font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:700;padding:10px 0 10px 54px;position:relative;line-height:1.3;}
.steps li::before{content:'\2605';position:absolute;left:8px;top:8px;color:var(--gold-deep);}
.steps.book li::before{content:'\270E';}
.teacher-note{margin-top:16px;background:#f3e6cf;border-radius:12px;padding:10px 18px;font-size:1.05rem;color:#6a3b1d;}

/* your-turn bar */
#turn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,80%);height:54px;border-radius:999px;background:#dfeee4;overflow:hidden;display:none;}
#turn.on{display:block;}
#turn .fill{position:absolute;inset:0;background:var(--leaf);transform-origin:left;}
#turn .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:700;mix-blend-mode:normal;text-shadow:0 1px 2px rgba(0,0,0,0.35);}

/* teacher buttons */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:center;gap:16px;}
.cb{background:var(--paper);color:var(--maroon);border:3px solid var(--maroon);border-radius:16px;padding:12px 26px;font-size:1.3rem;font-weight:700;min-width:130px;}
.cb.main{background:var(--maroon);color:var(--paper);}
.cb.pulse{animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(107,26,26,0.45);}50%{box-shadow:0 0 0 12px rgba(107,26,26,0);}}
.cb:disabled{opacity:0.4;cursor:default;}

/* start / loading card */
#cover{position:fixed;inset:0;background:var(--sandal);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
#cover .card{background:var(--paper);border-radius:24px;padding:34px 40px;max-width:640px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(107,26,26,0.18);}
#cover h1{color:var(--maroon);font-size:2.3rem;line-height:1.2;}
#cover p{font-size:1.15rem;margin-top:12px;line-height:1.5;color:#5a2a1a;}
#cover .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
#cover .err{margin-top:16px;background:#fbe9e4;color:#8b2a1a;border-radius:12px;padding:12px 16px;font-size:1rem;display:none;text-align:left;}
#cover .err.on{display:block;}
.link-btn{background:none;border:none;color:var(--sky);text-decoration:underline;font-size:1rem;margin-top:16px;}
.spin{width:46px;height:46px;border:5px solid rgba(107,26,26,0.15);border-top-color:var(--maroon);border-radius:50%;margin:20px auto 0;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.cheer .ic{font-size:clamp(5rem,14vw,10rem);}
.cheer h2{font-size:clamp(2.4rem,6vw,4.6rem);color:var(--maroon);}

@media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
@media (max-width:760px){
  #stage{top:112px;bottom:84px;left:8px;right:8px;padding:12px;}
  .cb{min-width:0;padding:10px 14px;font-size:1rem;}
  #ctrl{height:84px;gap:8px;}
  #top .chap{font-size:1.05rem;}
}
</style>
</head>
<body>

<div id="top">
  <button class="back" onclick="goBack()">&#8592; Back</button>
  <span class="cls" id="t-cls">Class</span>
  <span class="chap" id="t-chap">English</span>
  <button class="tog on" id="tog-voice" onclick="toggleVoice()">&#128264; Voice</button>
  <button class="tog on ta" id="tog-ta" onclick="toggleTamil()">தமிழ் help</button>
</div>

<div id="acts"></div>

<div id="stage"></div>
<div id="turn"><div class="fill" id="turn-fill"></div><div class="lbl" id="turn-lbl">Your turn!</div></div>

<div id="ctrl">
  <button class="cb" id="b-back" onclick="goPrev()">&#9664; Back</button>
  <button class="cb" id="b-again" onclick="again()">&#8635; Again</button>
  <button class="cb" id="b-pause" onclick="togglePause()">&#10074;&#10074; Pause</button>
  <button class="cb main" id="b-next" onclick="goNext()">Next &#9654;</button>
</div>

<div id="cover"><div class="card" id="cover-card">
  <h1>Getting today's class ready</h1>
  <p id="cover-msg">Reading the chapter&hellip;</p>
  <div class="spin" id="cover-spin"></div>
  <div class="err" id="cover-err"></div>
</div></div>

<script>
/* ── state ── */
var LESSON = { cls:'', topic:'', text:'' };
var PLAN = null;            // the saved activity plan
var BEATS = [];             // the class, flattened into small moments
var CUR = -1;
var RUN = 0;                // bumps every time we move, so old timers/voices stop
var PAUSED = false;
var VOICE_ON = true;
var TAMIL_ON = true;
var RATE = 0.92;            // a little slow for little children
var LIB = {};               // Picture Library: word -> picture link
var PICS = {};              // picture promises, so each picture is asked for once
var AUD = {};               // voice promises, same idea
var curAudio = null, curAudioDone = null;
var PLAN_VERSION = 'kidact1';

var KINDS = {
  read:     { ic:'\uD83D\uDCD6', name:'Read' },
  whatsay:  { ic:'\uD83D\uDCAC', name:'What do you say?' },
  words:    { ic:'\uD83D\uDDBC\uFE0F', name:'New words' },
  song:     { ic:'\uD83C\uDFB5', name:'Sing' },
  robo:     { ic:'\uD83E\uDD16', name:'Robo says' },
  sounds:   { ic:'\uD83D\uDD24', name:'Letter sounds' },
  oddone:   { ic:'\uD83E\uDD14', name:'Odd one out' },
  play:     { ic:'\u2B50', name:'Play time' },
  notebook: { ic:'\u270F\uFE0F', name:'Notebook' }
};

/* ── read the activated chapter (longest copy wins — some copies are cut short) ── */
function readLesson(){
  var cands = [];
  ['eng_activated','tm_activated'].forEach(function(k){
    try{ var a = JSON.parse(sessionStorage.getItem(k) || 'null'); if (a) cands.push(a); }catch(e){}
  });
  var base = cands[0] || {};
  LESSON.cls = base.cls || '';
  LESSON.topic = base.topic || base.chapter || 'English';
  var texts = cands.map(function(a){ return a.lessonText || ''; });
  try{ texts.push(sessionStorage.getItem('tm_lesson') || ''); }catch(e){}
  texts.sort(function(a,b){ return b.length - a.length; });
  LESSON.text = texts[0] || '';
  document.getElementById('t-cls').textContent = LESSON.cls || 'Class';
  document.getElementById('t-chap').textContent = LESSON.topic;
  return LESSON.text.trim().length > 40;
}

function goBack(){
  stopVoice(); RUN++;
  var url = 'learnbot.html';
  try{ url = sessionStorage.getItem('eng_returnUrl') || url; }catch(e){}
  window.location.href = url;
}
function openOldClass(){ stopVoice(); RUN++; window.location.href = 'english-class.html'; }

/* ── the plan ── */
function planPrompt(){
  return 'You turn an English textbook chapter into an ACTIVITY class for ' + (LESSON.cls || 'Class 1') +
  ' children (age 4 to 7) in a Tamil Nadu school. They are Tamil-speaking and know very little English. ' +
  'The class runs on a projector with an AI voice; a teacher stands with the children. ' +
  'Little children do not listen to explanations. Every moment must be LOOK, SAY ALOUD, or DO WITH THE BODY.\n\n' +
  'Go through the chapter in its own order. Turn each part into one activity by what it is:\n' +
  '- story or reading passage -> "read": one item per short line, each with a picture. If the line has something to say aloud (a greeting, a dialogue), put that in "say".\n' +
  '- speaking situations ("What will you say?") -> "whatsay": situation + the answer the child should say.\n' +
  '- new words / vocabulary box (not already used in a song or action list) -> "words".\n' +
  '- song, rhyme, poem -> "song": each line with the action word children act out (hop, clap...) or "" if none.\n' +
  '- action words list ("Let us do", "do the action") -> "robo": a Robo Says game.\n' +
  '- letter sounds / phonics -> "sounds": each letter with its example words from the chapter.\n' +
  '- odd one out / which begins with -> "oddone".\n' +
  '- games, play time, hopscotch, "Can you do this?" -> "play": short steps the teacher reads out.\n' +
  '- writing, matching, fill in the blanks, tick, exercises -> ONE "notebook" activity at the very end listing them (titles only). Do not teach these on screen.\n\n' +
  'Return ONLY valid JSON, no markdown, in exactly this shape (include only the activities the chapter really has):\n' +
  '{"title":"chapter title","welcome":{"en":"short warm welcome","ta":"same in simple spoken Tamil"},"activities":[\n' +
  ' {"kind":"read","name":"Let us read","intro":{"en":"Look and listen. Then say it with me.","ta":"..."},"items":[{"line":"In the morning, I meet Kavin.","say":"Good morning, Kavin!","pic":"scene to draw","lib":""}]},\n' +
  ' {"kind":"whatsay","name":"...","intro":{"en":"...","ta":"..."},"items":[{"situation":"You meet your teacher in the morning.","answer":"Good morning, Miss!","pic":"scene to draw","lib":""}]},\n' +
  ' {"kind":"words","name":"...","intro":{"en":"...","ta":"..."},"items":[{"word":"lotus","pic":"scene to draw","lib":"lotus"}]},\n' +
  ' {"kind":"song","name":"Hop Like a Frog","intro":{"en":"Everybody stand up! Sing and do the actions.","ta":"..."},"items":[{"line":"Hop, hop, hop like a frog","action":"hop","pic":"scene to draw","lib":"frog"}]},\n' +
  ' {"kind":"robo","name":"Robo says","intro":{"en":"...","ta":"..."},"items":[{"word":"clap","pic":"scene to draw","lib":""}]},\n' +
  ' {"kind":"sounds","name":"Letter sounds","intro":{"en":"...","ta":"..."},"items":[{"letter":"f","words":[{"word":"fox","pic":"scene to draw","lib":"fox"}]}]},\n' +
  ' {"kind":"oddone","name":"Odd one out","intro":{"en":"...","ta":"..."},"items":[{"words":[{"word":"monkey","lib":"monkey","pic":"a monkey"},{"word":"moon","lib":"moon","pic":"the moon"},{"word":"kite","lib":"kite","pic":"a kite"}],"odd":"kite","why":"Monkey and moon begin with m. Kite begins with k."}]},\n' +
  ' {"kind":"play","name":"Play time","intro":{"en":"...","ta":"..."},"items":[{"step":"Stand on one foot and count from one to ten."}]},\n' +
  ' {"kind":"notebook","name":"Notebook work","intro":{"en":"Now open your notebooks.","ta":"..."},"items":[{"task":"Match the pictures with the sentences."}]}\n' +
  ']}\n\n' +
  'Rules:\n' +
  '- Use the chapter\'s own words, names and sentences. Keep every English line very short (max 10 words); split long sentences.\n' +
  '- "pic": a short picture description (max 14 words) for a bright cartoon: Indian children, Tamil Nadu setting, showing exactly the meaning. For actions show a child doing the action.\n' +
  '- "lib": ONE lowercase English noun if the picture is just one simple thing or animal (fox, kite, jam); otherwise "".\n' +
  '- "intro.en": one short instruction a child understands (max 10 words). "intro.ta": the same in simple spoken Tamil, Tamil script only, max 10 words, the way a Tamil Nadu teacher talks to little children.\n' +
  '- "name": the chapter\'s own heading where there is one.\n' +
  '- Limits: read 8 items, whatsay 6, words 8, song 12 lines, robo 10, sounds 6 letters with up to 3 words each, oddone 5, play 6 steps, notebook 8.\n' +
  '- Plain text only, no emojis. Keep the JSON strictly valid.';
}

async function planKey(){
  var data = PLAN_VERSION + '|' + LESSON.cls + '|' + LESSON.topic + '|' + LESSON.text.substring(0, 9000);
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
  return Array.from(new Uint8Array(buf)).slice(0, 20).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function parseJSON(raw){
  var t = String(raw).trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s === -1 || e <= s) return null;
  t = t.substring(s, e + 1);
  try{ return JSON.parse(t); }catch(err){}
  try{ return JSON.parse(t.replace(/,\s*([}\]])/g,'$1')); }catch(err){}
  return null;
}

function str(v, n){ return String(v == null ? '' : v).trim().substring(0, n || 200); }
function cleanPic(o){ return { pic: str(o && o.pic, 160), lib: str(o && o.lib, 30).toLowerCase() }; }

var LIMITS = { read:8, whatsay:6, words:8, song:12, robo:10, sounds:6, oddone:5, play:6, notebook:8 };

function cleanPlan(p){
  if (!p || !Array.isArray(p.activities)) return null;
  var acts = [];
  p.activities.forEach(function(a){
    if (!a || !KINDS[a.kind]) return;
    var items = Array.isArray(a.items) ? a.items.slice(0, LIMITS[a.kind]) : [];
    var out = [];
    items.forEach(function(it){
      if (!it) return;
      var c = cleanPic(it);
      if (a.kind === 'read' && it.line) out.push(Object.assign(c, { line:str(it.line,160), say:str(it.say,80) }));
      if (a.kind === 'whatsay' && it.situation && it.answer) out.push(Object.assign(c, { situation:str(it.situation,160), answer:str(it.answer,80) }));
      if (a.kind === 'words' && it.word) out.push(Object.assign(c, { word:str(it.word,40) }));
      if (a.kind === 'song' && it.line) out.push(Object.assign(c, { line:str(it.line,120), action:str(it.action,30) }));
      if (a.kind === 'robo' && it.word) out.push(Object.assign(c, { word:str(it.word,30) }));
      if (a.kind === 'sounds' && it.letter && Array.isArray(it.words)){
        out.push({ letter:str(it.letter,3), words: it.words.slice(0,3).filter(Boolean).map(function(w){ return Object.assign(cleanPic(w), { word:str(w.word,30) }); }).filter(function(w){ return w.word; }) });
      }
      if (a.kind === 'oddone' && Array.isArray(it.words) && it.words.length >= 3 && it.odd){
        out.push({ words: it.words.slice(0,3).map(function(w){ return Object.assign(cleanPic(w), { word:str(w.word,30) }); }), odd:str(it.odd,30), why:str(it.why,160) });
      }
      if (a.kind === 'play' && it.step) out.push({ step:str(it.step,160) });
      if (a.kind === 'notebook' && it.task) out.push({ task:str(it.task,160) });
    });
    if (!out.length) return;
    acts.push({ kind:a.kind, name:str(a.name,60) || KINDS[a.kind].name,
      intro:{ en:str(a.intro && a.intro.en,120), ta:str(a.intro && a.intro.ta,120) }, items:out });
  });
  if (!acts.length) return null;
  /* notebook always last */
  acts.sort(function(x,y){ return (x.kind === 'notebook') - (y.kind === 'notebook'); });
  return { title:str(p.title,80) || LESSON.topic,
    welcome:{ en:str(p.welcome && p.welcome.en,160), ta:str(p.welcome && p.welcome.ta,160) }, activities:acts };
}

async function getPlan(fresh){
  var key = null;
  try{ key = await planKey(); }catch(e){}
  if (key && !fresh){
    try{
      var r = await fetch('/api/lesson-plan?key=' + key);
      if (r.ok){
        var c = await r.json();
        if (c && Array.isArray(c.steps) && c.steps[0] && c.steps[0].activities){
          var saved = cleanPlan(c.steps[0]);
          if (saved) return saved;
        }
      }
    }catch(e){}
  }
  setCover('Reading the chapter and turning it into activities. This takes about a minute, only the first time.');
  var res = await fetch('/api/ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: planPrompt(),
      messages:[{ role:'user', content:'CHAPTER TEXT:\n\n' + LESSON.text.substring(0, 11000) }],
      max_tokens: 8000
    })
  });
  var d = null;
  try{ d = await res.json(); }catch(e){ throw new Error('the AI server replied ' + res.status); }
  var raw = '';
  if (d && Array.isArray(d.content)) raw = d.content.map(function(b){ return b.type === 'text' ? b.text : ''; }).join('');
  else if (d && d.text) raw = String(d.text);
  if (!raw){
    var why = (d && (d.message || (d.error && (d.error.message || d.error)))) || ('empty AI reply, status ' + res.status);
    if (typeof why !== 'string') why = JSON.stringify(why);
    throw new Error(why.substring(0, 220));
  }
  var plan = cleanPlan(parseJSON(raw));
  if (!plan) throw new Error('the AI reply could not be read as a lesson. Press Try again.');
  if (key){
    try{
      fetch('/api/lesson-plan', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ key:key, steps:[plan], meta:{ kind:'kid-activity', cls:LESSON.cls, topic:LESSON.topic } }) });
    }catch(e){}
  }
  return plan;
}

/* ── turn the plan into small moments ("beats") ──
   A beat is one screen plus a list of things to do:
   ['say', text]   speak English
   ['ta', text]    speak Tamil help (skipped when Tamil help is off)
   ['wait', sec, label]  the class's turn — green bar
   ['reveal']      show the hidden answer
   hold:true       wait for the teacher's Next (games, notebook) */
function buildBeats(plan){
  var B = [];
  B.push({ act:-1, view:'welcome', ops:[['say', plan.welcome.en || 'Hello, children! Let us learn and play.'], ['ta', plan.welcome.ta]] });
  plan.activities.forEach(function(a, ai){
    var tamilIntro = a.intro.ta;
    B.push({ act:ai, view:'opener', a:a, ops:[['say', a.intro.en || a.name], ['ta', tamilIntro]] });
    var k = a.kind;
    if (k === 'read') a.items.forEach(function(it){
      var ops = [['say', it.line]];
      if (it.say){ ops.push(['reveal'], ['say', it.say], ['wait', 4.5, 'Say it!']); }
      else ops.push(['wait', 4, 'Say it with me!']);
      B.push({ act:ai, view:'read', it:it, pics:[it], ops:ops });
    });
    if (k === 'whatsay') a.items.forEach(function(it){
      B.push({ act:ai, view:'whatsay', it:it, pics:[it],
        ops:[['say', it.situation + ' What do you say?'], ['wait', 6, 'Think\u2026 then say it!'], ['reveal'], ['say', it.answer], ['wait', 4, 'Say it again!']] });
    });
    if (k === 'words') a.items.forEach(function(it){
      B.push({ act:ai, view:'word', it:it, pics:[it], ops:[['say', it.word + '.'], ['wait', 0.8, ''], ['say', it.word + '.'], ['wait', 3.5, 'Your turn!']] });
    });
    if (k === 'song'){
      a.items.forEach(function(it){
        B.push({ act:ai, view:'song', it:it, pics:[it], ops:[['say', it.line], ['wait', it.action ? 4.5 : 3, it.action ? 'Do it!' : 'Sing it!']] });
      });
      B.push({ act:ai, view:'cue', icon:'\uD83C\uDFB6', text:'Once more \u2014 faster!', ops:[['say', 'Very good! Now once more, a little faster!'], ['ta', 'இன்னொரு தடவை, கொஞ்சம் வேகமா!']] });
      a.items.forEach(function(it){
        B.push({ act:ai, view:'song', it:it, pics:[it], round:2, fast:true, ops:[['say', it.line], ['wait', it.action ? 3 : 2, it.action ? 'Do it!' : 'Sing!']] });
      });
    }
    if (k === 'robo'){
      a.items.forEach(function(it){
        B.push({ act:ai, view:'robo', it:it, pics:[it], ops:[['say', 'Robo says, ' + it.word + '!'], ['wait', 4.5, 'Do it!']] });
      });
      B.push({ act:ai, view:'cue', icon:'\uD83E\uDDCA', text:'Freeze!', ops:[['say', 'Robo says, freeze! Do not move!'], ['wait', 4, 'Freeze!'], ['say', 'Well done! Now sit down.']] });
    }
    if (k === 'sounds') a.items.forEach(function(it){
      var list = it.words.map(function(w){ return w.word; }).join(', ');
      B.push({ act:ai, view:'letter', it:it, ops:[['say', 'This is the letter ' + it.letter + '. Listen: ' + list + '.'], ['wait', 1, '']] });
      it.words.forEach(function(w){
        B.push({ act:ai, view:'word', it:w, pics:[w], letter:it.letter, ops:[['say', w.word + '.'], ['wait', 0.8, ''], ['say', w.word + '.'], ['wait', 3.5, 'Your turn!']] });
      });
    });
    if (k === 'oddone') a.items.forEach(function(it){
      var names = it.words.map(function(w){ return w.word; }).join(', ');
      B.push({ act:ai, view:'oddone', it:it, pics:it.words,
        ops:[['say', names + '. Which one is different?'], ['wait', 6, 'Which one?'], ['reveal'], ['say', it.why || ('It is ' + it.odd + '.')]] });
    });
    if (k === 'play')
      B.push({ act:ai, view:'play', a:a, hold:true, ops: a.items.map(function(it){ return ['say', it.step]; }) });
    if (k === 'notebook')
      B.push({ act:ai, view:'notebook', a:a, hold:true, ops:[['say', 'Now open your notebooks. Your teacher will help you.'], ['ta', 'இப்போ உங்க நோட்டைத் திறங்க. டீச்சர் உதவி செய்வாங்க.']] });
  });
  B.push({ act:-2, view:'cheer', ops:[['say', 'Well done, children! You did very well today. Give yourselves a big clap!'], ['ta', 'சூப்பர்! எல்லாரும் கை தட்டுங்க!']] });
  return B;
}

/* ── pictures: Picture Library first, then a cached drawing ── */
function loadLibrary(){
  return fetch('/api/auth', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'tbl_get', table:'kg_pictures', params:'select=word,colour_url,outline_url&order=word' }) })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){ if (Array.isArray(rows)) rows.forEach(function(r){ if (r && r.word) LIB[String(r.word).toLowerCase()] = r.colour_url || r.outline_url || ''; }); })
    .catch(function(){});
}

function getPic(p){
  if (!p) return Promise.resolve({ none:true });
  if (p.lib && LIB[p.lib]) return Promise.resolve({ url:LIB[p.lib] });
  var q = p.pic || p.lib || p.word || '';
  if (q.length < 3) return Promise.resolve({ none:true });
  if (!PICS[q]){
    PICS[q] = fetch('/api/gen-image', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query:q, context:'For an English class for small children in Tamil Nadu, India.' }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.images && d.images[0] && d.images[0].url) return { url:d.images[0].url };
        delete PICS[q];
        return { err:'Picture not made: ' + ((d && (d.note || d.error)) || 'no reply') };
      })
      .catch(function(e){ delete PICS[q]; return { err:'Picture not made: ' + (e.message || e) }; });
  }
  return PICS[q];
}

function fillPics(beat, run){
  var boxes = document.querySelectorAll('#stage .pic[data-i]');
  boxes.forEach(function(box){
    var spec = beat.pics && beat.pics[+box.getAttribute('data-i')];
    getPic(spec).then(function(r){
      if (run !== RUN) return;
      if (r.none){ box.remove(); return; }
      if (r.url){ box.innerHTML = '<img alt="" src="' + esc(r.url) + '">'; }
      else { box.classList.add('err'); box.innerHTML = '<div class="wait">' + esc(r.err) + '</div>'; }
    });
  });
}

/* ── voice: Tripti for little classes; Tamil text switches voice by itself ── */
function getAudio(text){
  if (!AUD[text]){
    AUD[text] = fetch('/api/voice-class', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text:text, cls: LESSON.cls || 'Class 1' }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.audio_b64) return 'data:audio/mpeg;base64,' + d.audio_b64; delete AUD[text]; return null; })
      .catch(function(){ delete AUD[text]; return null; });
  }
  return AUD[text];
}

function stopVoice(){
  if (curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if (curAudioDone){ var f = curAudioDone; curAudioDone = null; f(); }
}

async function speak(text, run, isTamil, fast){
  if (!text) return;
  if (!VOICE_ON){ await waitSec(Math.min(5, text.split(/\s+/).length * 0.45), run, null); return; }
  var src = await getAudio(text);
  if (run !== RUN) return;
  if (!src){
    if (isTamil) return;   /* no reliable Tamil browser voice — the Tamil line stays on screen */
    return browserSay(text, run, fast);
  }
  await new Promise(function(resolve){
    var a = new Audio(src);
    a.playbackRate = fast ? Math.min(1.15, RATE + 0.18) : RATE;
    curAudio = a; curAudioDone = resolve;
    a.onended = a.onerror = function(){ if (curAudio === a){ curAudio = null; curAudioDone = null; } resolve(); };
    a.play().catch(function(){ curAudio = null; curAudioDone = null; browserSay(text, run, fast).then(resolve); });
  });
  await waitWhilePaused(run);
}

function browserSay(text, run, fast){
  return new Promise(function(resolve){
    if (!('speechSynthesis' in window)) return resolve();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN'; u.rate = fast ? 1.0 : 0.85; u.pitch = 1.1;
    u.onend = u.onerror = function(){ resolve(); };
    curAudioDone = resolve;
    window.speechSynthesis.speak(u);
  });
}

function waitWhilePaused(run){
  return new Promise(function(resolve){
    (function tick(){ if (run !== RUN || !PAUSED) return resolve(); setTimeout(tick, 150); })();
  });
}

/* the class's turn: green bar shrinks, pauses with the Pause button */
function waitSec(sec, run, label){
  var bar = document.getElementById('turn'), fill = document.getElementById('turn-fill');
  if (label){ document.getElementById('turn-lbl').textContent = label; bar.classList.add('on'); }
  var left = sec * 1000;
  return new Promise(function(resolve){
    var last = Date.now();
    (function tick(){
      if (run !== RUN){ return resolve(); }
      var now = Date.now();
      if (!PAUSED) left -= (now - last);
      last = now;
      if (label) fill.style.transform = 'scaleX(' + Math.max(0, left / (sec * 1000)) + ')';
      if (left <= 0){ bar.classList.remove('on'); return resolve(); }
      setTimeout(tick, 60);
    })();
  });
}

/* ── screens ── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function goldFirst(w){ w = String(w || ''); return w ? '<b>' + esc(w.charAt(0)) + '</b>' + esc(w.substring(1)) : ''; }
function picBox(i){ return '<div class="pic" data-i="' + i + '"><div class="wait">Getting the picture\u2026</div></div>'; }
function taLine(t){ return (TAMIL_ON && t) ? '<div class="tl ta">' + esc(t) + '</div>' : ''; }

function render(b){
  var h = '';
  if (b.view === 'welcome'){
    h = '<div class="opener"><div class="ic">\uD83D\uDC4B</div><h2>' + esc(PLAN.title) + '</h2>' +
        '<div class="en">' + esc(PLAN.welcome.en) + '</div></div>';
  } else if (b.view === 'opener'){
    h = '<div class="opener"><div class="ic">' + KINDS[b.a.kind].ic + '</div><h2>' + esc(b.a.name) + '</h2>' +
        '<div class="en">' + esc(b.a.intro.en) + '</div></div>';
  } else if (b.view === 'read'){
    h = picBox(0) + '<div class="line">' + esc(b.it.line) + '</div>' +
        (b.it.say ? '<div class="answer"><span class="bubble">' + esc(b.it.say) + '</span></div>' : '');
  } else if (b.view === 'whatsay'){
    h = picBox(0) + '<div class="line">' + esc(b.it.situation) + '</div>' +
        '<div class="hint">What do you say?</div>' +
        '<div class="answer"><span class="bubble">' + esc(b.it.answer) + '</span></div>';
  } else if (b.view === 'word'){
    h = picBox(0) + '<div class="big-word">' + goldFirst(b.it.word) + '</div>';
  } else if (b.view === 'song'){
    h = (b.round === 2 ? '<span class="round-tag">Faster!</span>' : '') + picBox(0) +
        '<div class="line">' + esc(b.it.line) + '</div>' +
        (b.it.action ? '<span class="action-tag">' + esc(b.it.action) + '!</span>' : '');
  } else if (b.view === 'robo'){
    h = picBox(0) + '<div class="hint">\uD83E\uDD16 Robo says\u2026</div><div class="big-word">' + esc(b.it.word) + '!</div>';
  } else if (b.view === 'cue'){
    h = '<div class="opener"><div class="ic">' + b.icon + '</div><h2>' + esc(b.text) + '</h2></div>';
  } else if (b.view === 'letter'){
    var L = b.it.letter;
    h = '<div class="letter">' + esc(L.toUpperCase()) + '<small>' + esc(L.toLowerCase()) + '</small></div>';
  } else if (b.view === 'oddone'){
    h = '<div class="trio">' + b.it.words.map(function(w, i){
      var odd = w.word.toLowerCase() === b.it.odd.toLowerCase();
      return '<div class="cell' + (odd ? ' odd' : '') + '">' + picBox(i) + '<div class="w">' + goldFirst(w.word) + '</div></div>';
    }).join('') + '</div><div class="hint">Which one is different?</div>';
  } else if (b.view === 'play'){
    h = '<div class="opener"><h2>' + esc(b.a.name) + '</h2></div><ul class="steps">' +
        b.a.items.map(function(it){ return '<li>' + esc(it.step) + '</li>'; }).join('') + '</ul>' +
        '<div class="teacher-note">Teacher: play the game with the children, then press Next.</div>';
  } else if (b.view === 'notebook'){
    h = '<div class="opener"><div class="ic">\u270F\uFE0F</div><h2>' + esc(b.a.name) + '</h2></div><ul class="steps book">' +
        b.a.items.map(function(it){ return '<li>' + esc(it.task) + '</li>'; }).join('') + '</ul>' +
        '<div class="teacher-note">Teacher: these are done in the notebook or workbook, not on the screen.</div>';
  } else if (b.view === 'cheer'){
    h = '<div class="cheer"><div class="ic">\uD83C\uDF1F\uD83D\uDC4F\uD83C\uDF1F</div><h2>Well done, children!</h2></div>';
  }
  var st = document.getElementById('stage');
  st.className = '';
  st.innerHTML = h;
}

function renderActs(){
  var el = document.getElementById('acts');
  var curAct = BEATS[CUR] ? BEATS[CUR].act : -1;
  el.innerHTML = PLAN.activities.map(function(a, i){
    var cls = 'act' + (i === curAct ? ' now' : '') + ((curAct === -2 || i < curAct) ? ' done' : '');
    return '<button class="' + cls + '" onclick="jumpAct(' + i + ')"><span class="ic">' + KINDS[a.kind].ic + '</span>' + esc(a.name) + '</button>';
  }).join('');
  var now = el.querySelector('.now');
  if (now && now.scrollIntoView) now.scrollIntoView({ block:'nearest', inline:'center' });
}

/* ── the runner ── */
async function play(i){
  if (i < 0 || i >= BEATS.length) return;
  stopVoice();
  var run = ++RUN;
  CUR = i;
  PAUSED = false; setPauseBtn();
  document.getElementById('turn').classList.remove('on');
  var b = BEATS[i];
  render(b);
  renderActs();
  fillPics(b, run);
  prefetch(i + 1); prefetch(i + 2);
  document.getElementById('b-back').disabled = (i === 0);
  var nx = document.getElementById('b-next');
  nx.classList.remove('pulse');
  nx.textContent = (i === BEATS.length - 1) ? 'Finish' : 'Next \u25B6';

  for (var k = 0; k < b.ops.length; k++){
    if (run !== RUN) return;
    var op = b.ops[k];
    if (op[0] === 'say') await speak(op[1], run, false, b.fast);
    else if (op[0] === 'ta'){ if (TAMIL_ON && op[1]) await speak(op[1], run, true); }
    else if (op[0] === 'wait') await waitSec(op[1], run, op[2]);
    else if (op[0] === 'reveal') document.getElementById('stage').classList.add('revealed');
    if (run !== RUN) return;
    await waitWhilePaused(run);
  }
  if (run !== RUN) return;
  if (b.hold || i === BEATS.length - 1){ nx.classList.add('pulse'); return; }
  await waitSec(0.9, run, null);
  if (run === RUN) play(i + 1);
}

function prefetch(i){
  var b = BEATS[i]; if (!b) return;
  (b.pics || []).forEach(function(p){ getPic(p); });
  if (VOICE_ON) b.ops.forEach(function(op){
    if (op[0] === 'say' || (op[0] === 'ta' && TAMIL_ON)) if (op[1]) getAudio(op[1]);
  });
}

function goNext(){ if (CUR >= BEATS.length - 1){ goBack(); return; } play(CUR + 1); }
function goPrev(){ if (CUR > 0) play(CUR - 1); }
function again(){ if (CUR >= 0) play(CUR); }
function jumpAct(ai){ for (var i = 0; i < BEATS.length; i++) if (BEATS[i].act === ai){ play(i); return; } }

function togglePause(){
  PAUSED = !PAUSED;
  if (curAudio){ try{ PAUSED ? curAudio.pause() : curAudio.play(); }catch(e){} }
  try{ PAUSED ? window.speechSynthesis.pause() : window.speechSynthesis.resume(); }catch(e){}
  setPauseBtn();
}
function setPauseBtn(){
  var b = document.getElementById('b-pause');
  b.innerHTML = PAUSED ? '\u25B6 Play' : '&#10074;&#10074; Pause';
  b.classList.toggle('main', PAUSED);
}
function toggleVoice(){
  VOICE_ON = !VOICE_ON;
  document.getElementById('tog-voice').classList.toggle('on', VOICE_ON);
  if (!VOICE_ON) stopVoice();
}
function toggleTamil(){
  TAMIL_ON = !TAMIL_ON;
  document.getElementById('tog-ta').classList.toggle('on', TAMIL_ON);
}

/* ── cover card ── */
function setCover(msg){ document.getElementById('cover-msg').textContent = msg; }
function coverError(msg){
  document.getElementById('cover-spin').style.display = 'none';
  var e = document.getElementById('cover-err');
  e.innerHTML = esc(msg) + '<div class="row" style="justify-content:flex-start;margin-top:12px">' +
    '<button class="cb main" onclick="location.reload()">Try again</button>' +
    '<button class="cb" onclick="openOldClass()">Open the old English Class</button></div>';
  e.classList.add('on');
}

function showStart(){
  var n = PLAN.activities.length;
  document.getElementById('cover-card').innerHTML =
    '<h1>' + esc(PLAN.title) + '</h1>' +
    '<p>' + n + ' activities: ' + PLAN.activities.map(function(a){ return KINDS[a.kind].ic + ' ' + esc(a.name); }).join(', ') + '</p>' +
    '<div class="row"><button class="cb main" onclick="startClass()">Start class</button>' +
    '<button class="cb" id="ready-btn" onclick="getReady()">Get pictures ready</button></div>' +
    '<p id="ready-msg" style="font-size:1rem"></p>' +
    '<button class="link-btn" onclick="rebuild()">Make this lesson again</button> ' +
    '<button class="link-btn" onclick="openOldClass()">Open the old English Class</button>';
}

function startClass(){
  document.getElementById('cover').style.display = 'none';
  play(0);
}

/* Teacher can run this at home the night before, so no child waits for a drawing. */
async function getReady(){
  var btn = document.getElementById('ready-btn'), msg = document.getElementById('ready-msg');
  btn.disabled = true;
  var specs = [];
  BEATS.forEach(function(b){ (b.pics || []).forEach(function(p){ specs.push(p); }); });
  var done = 0, failed = 0, firstErr = '';
  msg.textContent = 'Preparing pictures: 0 of ' + specs.length;
  for (var i = 0; i < specs.length; i += 3){
    var part = specs.slice(i, i + 3).map(function(p){
      return getPic(p).then(function(r){ done++; if (r.err && !r.none){ failed++; firstErr = firstErr || r.err; } msg.textContent = 'Preparing pictures: ' + done + ' of ' + specs.length; });
    });
    await Promise.all(part);
  }
  msg.textContent = failed ? ('Done, but ' + failed + ' pictures could not be made. ' + firstErr) : 'All ' + specs.length + ' pictures are ready.';
  btn.disabled = false;
}

async function rebuild(){
  if (!confirm('Make this lesson again from the chapter?\n\nThe saved lesson is replaced. It takes about a minute.')) return;
  document.getElementById('cover-card').innerHTML =
    '<h1>Making the lesson again</h1><p id="cover-msg">Reading the chapter\u2026</p><div class="spin" id="cover-spin"></div><div class="err" id="cover-err"></div>';
  try{
    PLAN = await getPlan(true);
    BEATS = buildBeats(PLAN);
    showStart();
  }catch(e){ coverError('Could not make the lesson: ' + (e.message || e)); }
}

/* keyboard for the teacher: → next, ← back, space pause, R again */
document.addEventListener('keydown', function(e){
  if (document.getElementById('cover').style.display !== 'none') return;
  if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === ' '){ e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') again();
});

(async function init(){
  if (!readLesson()){
    coverError('No chapter is open. In the Teacher Panel, pick the English book, enter the pages, press Go to Teach Tab, then open English Class.');
    return;
  }
  try{
    var lib = loadLibrary();
    PLAN = await getPlan(false);
    await Promise.race([lib, new Promise(function(r){ setTimeout(r, 4000); })]);
    BEATS = buildBeats(PLAN);
    showStart();
  }catch(e){
    coverError('Could not prepare the class: ' + (e.message || e));
  }
})();
</script>
