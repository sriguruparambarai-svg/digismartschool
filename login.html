<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DigiSmartSchool — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Nunito",sans-serif;background:linear-gradient(135deg,#4A0A12 0%,#6B0F1A 50%,#8B1A2A 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.logo-area{text-align:center;margin-bottom:32px;}
.logo-area img{width:90px;height:90px;border-radius:50%;border:4px solid #C9A84C;box-shadow:0 0 30px rgba(201,168,76,0.4);margin-bottom:14px;}
.logo-area h1{font-family:"Cinzel",serif;font-size:2rem;color:#E8C96A;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,0.5);}
.logo-area p{color:#F5E6C8;font-size:1rem;margin-top:4px;opacity:0.85;}
.login-box{background:linear-gradient(145deg,#F5E6C8,#FFFDF5);border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.4);border:2px solid #C9A84C;}
.login-title{font-family:"Cinzel",serif;font-size:1.3rem;color:#6B0F1A;text-align:center;margin-bottom:24px;}
label{display:block;font-size:0.95rem;font-weight:700;color:#6B0F1A;margin-bottom:5px;margin-top:16px;}
input{width:100%;padding:13px 16px;font-size:1.05rem;border:2px solid #A07830;border-radius:10px;background:white;color:#2A0A0F;font-family:"Nunito",sans-serif;font-weight:600;outline:none;transition:border 0.2s;}
input:focus{border-color:#6B0F1A;}
.btn-login{width:100%;padding:15px;background:linear-gradient(135deg,#6B0F1A,#8B1A2A);color:#E8C96A;font-size:1.1rem;font-weight:800;font-family:"Nunito",sans-serif;border:none;border-radius:12px;cursor:pointer;margin-top:24px;transition:all 0.2s;letter-spacing:1px;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,15,26,0.4);}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.error{background:#f8d7da;color:#721c24;border:1px solid #dc3545;border-radius:8px;padding:10px 14px;font-size:0.95rem;margin-top:14px;display:none;}
.spinner{display:none;text-align:center;margin-top:14px;color:#6B0F1A;font-weight:700;}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #EDD9A3;border-top:3px solid #6B0F1A;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{text-align:center;color:#A07830;font-size:0.85rem;margin:20px 0 10px;font-weight:600;}
.features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:30px;max-width:420px;width:100%;}
.feat{background:rgba(255,255,255,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:14px 10px;text-align:center;color:#F5E6C8;}
.feat-icon{font-size:1.8rem;margin-bottom:6px;}
.feat-text{font-size:0.8rem;font-weight:700;}
.footer{color:rgba(245,230,200,0.6);font-size:0.8rem;margin-top:24px;text-align:center;}
</style>
</head>
<body>

<div class="logo-area">
  <img src="logo.png" onerror="this.style.display='none'" alt=""/>
  <h1>DigiSmartSchool</h1>
  <p>AI Powered Smart School Platform</p>
</div>

<div class="login-box">
  <div class="login-title">🔐 School Login</div>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="school@gmail.com" onkeydown="if(event.key==='Enter')doLogin()"/>

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()"/>

  <div class="error" id="err"></div>
  <div class="spinner" id="spn"><span class="spin"></span>Signing in...</div>

  <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In →</button>

  <div class="divider">Powered by AI</div>
</div>

<div class="features">
  <div class="feat"><div class="feat-icon">🎓</div><div class="feat-text">AI Teaching</div></div>
  <div class="feat"><div class="feat-icon">📊</div><div class="feat-text">Report Cards</div></div>
  <div class="feat"><div class="feat-icon">💬</div><div class="feat-text">LearnBot</div></div>
</div>

<div class="footer">© 2025 DigiSmartSchool · Mayiladuthurai · Tamil Nadu</div>

<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  const spn = document.getElementById('spn');
  const btn = document.getElementById('login-btn');

  err.style.display = 'none';
  if (!email || !password) { showErr('Please enter email and password.'); return; }

  btn.disabled = true;
  spn.style.display = 'block';

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email, password })
    });
    const data = await res.json();

    // Subscription expired or suspended
    if (data.error === 'SUBSCRIPTION_EXPIRED' || data.error === 'SUBSCRIPTION_SUSPENDED') {
      showExpiredScreen(data.message, data.expiry_date);
      return;
    }

    if (data.error) { showErr(data.error); return; }

    // Save session
    localStorage.setItem('dss_token', data.token);
    localStorage.setItem('dss_role', data.role);
    localStorage.setItem('dss_user', JSON.stringify(data.user));

    // Show renewal warning if expiring soon
    if (data.warning) {
      sessionStorage.setItem('dss_warning', data.warning);
    }

    // Redirect based on role
    if (data.role === 'super_admin') window.location.href = '/admin.html';
    else if (data.role === 'school_admin') window.location.href = '/dashboard.html';
    else if (data.role === 'teacher') window.location.href = '/dashboard.html';

  } catch(e) {
    showErr('Connection error. Please try again.');
  } finally {
    btn.disabled = false;
    spn.style.display = 'none';
  }
}

function showErr(msg) {
  const err = document.getElementById('err');
  err.textContent = '⚠️ ' + msg;
  err.style.display = 'block';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('spn').style.display = 'none';
}

function showExpiredScreen(message, expiryDate) {
  document.getElementById('login-btn').disabled = false;
  document.getElementById('spn').style.display = 'none';
  // Hide login box, show expiry screen
  document.querySelector('.login-box').style.display = 'none';
  document.querySelector('.features').style.display = 'none';
  const box = document.createElement('div');
  box.style.cssText = 'background:white;border-radius:20px;padding:36px 32px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.4);border:3px solid #c0392b;text-align:center;';
  box.innerHTML = `
    <div style="font-size:3.5rem;margin-bottom:12px;">🔒</div>
    <div style="font-family:Cinzel,serif;font-size:1.3rem;color:#c0392b;font-weight:700;margin-bottom:12px;">Subscription Expired</div>
    <div style="color:#555;font-size:0.95rem;line-height:1.7;margin-bottom:20px;">${message}</div>
    ${expiryDate ? `<div style="background:#f8d7da;border-radius:8px;padding:8px 14px;font-size:0.85rem;color:#721c24;margin-bottom:20px;">Expired on: <strong>${new Date(expiryDate).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</strong></div>` : ''}
    <a href="https://wa.me/916380907931?text=Hi%2C%20our%20school%20subscription%20for%20DigiSmartSchool%20has%20expired.%20Please%20help%20us%20renew." 
       target="_blank"
       style="display:block;background:linear-gradient(135deg,#25d366,#128c7e);color:white;padding:14px;border-radius:12px;text-decoration:none;font-weight:800;font-size:1rem;margin-bottom:12px;">
      📲 Renew via WhatsApp
    </a>
    <button onclick="document.querySelector('.login-box').style.display='block';document.querySelector('.features').style.display='grid';this.parentElement.remove();" 
      style="background:transparent;border:2px solid #6B0F1A;color:#6B0F1A;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:Nunito,sans-serif;font-weight:700;font-size:0.9rem;">
      ← Back to Login
    </button>
  `;
  document.querySelector('.logo-area').after(box);
}
</script>
</body>
</html>
